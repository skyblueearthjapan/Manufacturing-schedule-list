<script>
/**
 * jobModal.js - 工番作成/編集モーダル
 */

const JobModal = {
  // 現在の編集対象
  currentJob: null,
  isEditMode: false,

  // PDF一時データ（アップロード待ち）
  pendingPdfs: {
    order: null,     // { file, fileName }
    instruction: null
  },

  /**
   * 初期化
   */
  init() {
    this.setupEventListeners();
  },

  /**
   * イベントリスナーを設定
   */
  setupEventListeners() {
    // 閉じるボタン
    document.getElementById('job-modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-job-modal-cancel')?.addEventListener('click', () => this.close());

    // 背景クリックで閉じる
    document.querySelector('#modal-job .modal-backdrop')?.addEventListener('click', () => this.close());

    // 保存ボタン
    document.getElementById('btn-job-modal-save')?.addEventListener('click', () => this.save());

    // ESCキーで閉じる
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('modal-job').classList.contains('hidden')) {
        this.close();
      }
    });
  },

  /**
   * 新規モードで開く
   */
  openNew() {
    this.isEditMode = false;
    this.currentJob = null;

    // フォームをリセット
    this.resetForm();

    // UI調整
    document.getElementById('job-modal-title').textContent = '工番登録';

    this.open();
  },

  /**
   * 編集モードで開く（将来用）
   * @param {Object} job
   */
  openEdit(job) {
    this.isEditMode = true;
    this.currentJob = job;

    // フォームをリセット
    this.resetForm();

    // 値を設定
    document.getElementById('job-jobno').value = job['工番'] || '';
    document.getElementById('job-customer').value = job['顧客名'] || '';
    document.getElementById('job-product').value = job['設備/製品名'] || '';
    document.getElementById('job-qty').value = job['台数'] || '';
    document.getElementById('job-destination').value = job['納入先'] || '';
    document.getElementById('job-ship-date').value = job['出荷予定日'] || '';
    document.getElementById('job-draw-date').value = job['出図予定日'] || '';
    document.getElementById('job-status-text').value = job['重要メモ'] || '';
    document.getElementById('job-job-id').value = job.jobId || '';

    // UI調整
    document.getElementById('job-modal-title').textContent = '工番編集';

    // PDF セクションを表示
    document.getElementById('job-pdf-section').classList.remove('hidden');
    this.loadPdfStatus(job['工番']);

    this.open();
  },

  /**
   * モーダルを開く
   */
  open() {
    document.getElementById('modal-job').classList.remove('hidden');
    // 最初の入力欄にフォーカス
    setTimeout(() => {
      document.getElementById('job-jobno')?.focus();
    }, 100);
  },

  /**
   * モーダルを閉じる
   */
  close() {
    document.getElementById('modal-job').classList.add('hidden');
    this.currentJob = null;
    this.isEditMode = false;
  },

  /**
   * フォームをリセット
   */
  resetForm() {
    document.getElementById('job-form').reset();
    document.getElementById('job-job-id').value = '';

    // PDF関連をリセット
    this.pendingPdfs = { order: null, instruction: null };
    document.getElementById('job-pdf-section').classList.add('hidden');
    this.resetPdfStatus('order');
    this.resetPdfStatus('instruction');
  },

  /**
   * バリデーション
   * @returns {Object|null}
   */
  validate() {
    const jobno = document.getElementById('job-jobno').value.trim();
    const customer = document.getElementById('job-customer').value.trim();
    const product = document.getElementById('job-product').value.trim();
    const qty = document.getElementById('job-qty').value.trim();
    const destination = document.getElementById('job-destination').value.trim();
    const shipDate = document.getElementById('job-ship-date').value;
    const drawDate = document.getElementById('job-draw-date').value;
    const statusText = document.getElementById('job-status-text').value.trim();

    // 必須チェック
    if (!jobno) {
      Utils.showToast('工番を入力してください', 'error');
      document.getElementById('job-jobno').focus();
      return null;
    }

    if (!customer) {
      Utils.showToast('顧客名を入力してください', 'error');
      document.getElementById('job-customer').focus();
      return null;
    }

    if (!product) {
      Utils.showToast('設備/製品名を入力してください', 'error');
      document.getElementById('job-product').focus();
      return null;
    }

    if (!qty) {
      Utils.showToast('台数を入力してください', 'error');
      document.getElementById('job-qty').focus();
      return null;
    }

    return {
      '工番': jobno,
      '顧客名': customer,
      '設備/製品名': product,
      '台数': qty,
      '納入先': destination,
      '出荷予定日': shipDate,
      '出図予定日': drawDate,
      '重要メモ': statusText,
      '状態': '未着手'
    };
  },

  /**
   * 保存
   */
  async save() {
    const payload = this.validate();
    if (!payload) return;

    try {
      Utils.setLoading(true);

      if (this.isEditMode) {
        // 更新（将来用）
        const jobId = document.getElementById('job-job-id').value;
        // TODO: API.updateJob(jobId, payload)
        Utils.showToast('更新機能は今後実装予定です', 'info');
      } else {
        // 新規作成
        const result = await API.createJob(payload);
        // Storeにジョブを追加
        Store.addJob(result);
        Utils.showToast('工番を登録しました', 'success');
      }

      Utils.setLoading(false);
      this.close();
    } catch (error) {
      Utils.setLoading(false);
      console.error('Save job failed:', error);
      Utils.showToast('保存に失敗しました: ' + error.message, 'error');
    }
  },

  // ========== PDF関連 ==========

  /**
   * PDF情報を読み込んで表示
   * @param {string} jobNo
   */
  async loadPdfStatus(jobNo) {
    try {
      const pdfInfo = await Store.loadJobPdfInfo(jobNo);
      this.updatePdfStatusUI('order', pdfInfo?.order);
      this.updatePdfStatusUI('instruction', pdfInfo?.instruction);
    } catch (error) {
      console.error('Failed to load PDF status:', error);
    }
  },

  /**
   * PDF状態UIを更新
   * @param {string} pdfType - 'order' | 'instruction'
   * @param {Object|null} pdfData - { fileId, fileName, url } or null
   */
  updatePdfStatusUI(pdfType, pdfData) {
    const statusEl = document.getElementById(`job-${pdfType}-pdf-status`);
    const deleteBtn = document.getElementById(`btn-${pdfType}-pdf-delete`);

    if (pdfData && pdfData.fileId) {
      statusEl.textContent = pdfData.fileName || '登録済み';
      statusEl.className = 'pdf-status has-file';
      deleteBtn.classList.remove('hidden');
    } else {
      statusEl.textContent = '未登録';
      statusEl.className = 'pdf-status no-file';
      deleteBtn.classList.add('hidden');
    }
  },

  /**
   * PDF状態をリセット
   * @param {string} pdfType
   */
  resetPdfStatus(pdfType) {
    const statusEl = document.getElementById(`job-${pdfType}-pdf-status`);
    const deleteBtn = document.getElementById(`btn-${pdfType}-pdf-delete`);
    const inputEl = document.getElementById(`job-${pdfType}-pdf-input`);

    if (statusEl) {
      statusEl.textContent = '未登録';
      statusEl.className = 'pdf-status no-file';
    }
    if (deleteBtn) {
      deleteBtn.classList.add('hidden');
    }
    if (inputEl) {
      inputEl.value = '';
    }
  },

  /**
   * PDFファイル選択時
   * @param {string} pdfType
   * @param {HTMLInputElement} input
   */
  async onPdfSelected(pdfType, input) {
    const file = input.files?.[0];
    if (!file) return;

    // ファイルサイズチェック (10MB制限)
    const maxSize = 10 * 1024 * 1024;
    if (file.size > maxSize) {
      Utils.showToast('ファイルサイズが大きすぎます（10MB以下）', 'error');
      input.value = '';
      return;
    }

    // PDFかチェック
    if (!file.type.includes('pdf')) {
      Utils.showToast('PDFファイルを選択してください', 'error');
      input.value = '';
      return;
    }

    const jobNo = document.getElementById('job-jobno').value;
    if (!jobNo) {
      Utils.showToast('工番が設定されていません', 'error');
      input.value = '';
      return;
    }

    // UIを更新（アップロード中）
    const statusEl = document.getElementById(`job-${pdfType}-pdf-status`);
    statusEl.textContent = 'アップロード中...';
    statusEl.className = 'pdf-status uploading';

    try {
      // ファイルをBase64に変換
      const base64Data = await this.fileToBase64(file);

      // アップロード実行
      const result = await API.uploadJobPdf(jobNo, pdfType, file.name, base64Data);

      // Store更新
      const currentInfo = Store.getJobPdfInfo(jobNo) || { order: null, instruction: null };
      currentInfo[pdfType] = result;
      Store.setJobPdfInfo(jobNo, currentInfo);

      // UI更新
      this.updatePdfStatusUI(pdfType, result);
      Utils.showToast('PDFをアップロードしました', 'success');

      // ガントビューを再描画（PDFボタン更新のため）
      if (typeof Gantt !== 'undefined') {
        Gantt.render();
      }
    } catch (error) {
      console.error('PDF upload failed:', error);
      Utils.showToast('アップロードに失敗しました: ' + error.message, 'error');
      this.resetPdfStatus(pdfType);
    }

    input.value = '';
  },

  /**
   * PDFを削除
   * @param {string} pdfType
   */
  async deletePdf(pdfType) {
    const jobNo = document.getElementById('job-jobno').value;
    if (!jobNo) return;

    const typeName = pdfType === 'order' ? '受注表' : '工番別指示書';
    if (!confirm(`${typeName}を削除しますか？`)) return;

    try {
      Utils.setLoading(true);
      await API.deleteJobPdf(jobNo, pdfType);

      // Store更新
      const currentInfo = Store.getJobPdfInfo(jobNo) || { order: null, instruction: null };
      currentInfo[pdfType] = null;
      Store.setJobPdfInfo(jobNo, currentInfo);

      // UI更新
      this.resetPdfStatus(pdfType);
      Utils.showToast('PDFを削除しました', 'success');
      Utils.setLoading(false);

      // ガントビューを再描画
      if (typeof Gantt !== 'undefined') {
        Gantt.render();
      }
    } catch (error) {
      Utils.setLoading(false);
      console.error('PDF delete failed:', error);
      Utils.showToast('削除に失敗しました: ' + error.message, 'error');
    }
  },

  /**
   * ファイルをBase64に変換
   * @param {File} file
   * @returns {Promise<string>}
   */
  fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // data:application/pdf;base64,XXXX から XXXX 部分を抽出
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
};
</script>
