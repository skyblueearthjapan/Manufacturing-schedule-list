<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生産工程表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    }
    .countdown-bar {
      height: 4px;
      background: #2563eb;
      transition: width 0.1s linear;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">生産工程表</h1>
      <p class="mt-1 text-sm text-gray-500">Manufacturing Schedule System</p>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg space-y-6 fade-in">

      <!-- 自動判定メッセージ -->
      <div id="auto-detect-msg" class="bg-white rounded-xl shadow-sm p-4 text-center" style="display:none;">
        <p class="text-sm text-gray-600">
          <span id="detect-device-type" class="font-medium text-gray-800"></span> を検出しました
        </p>
        <p class="text-sm text-gray-500 mt-1">
          <span id="detect-countdown">2</span>秒後に自動で <span id="detect-target" class="font-medium"></span> に移動します...
        </p>
        <div class="mt-2 bg-gray-200 rounded-full overflow-hidden">
          <div id="countdown-bar" class="countdown-bar" style="width:100%"></div>
        </div>
        <button onclick="cancelAutoRedirect()" class="mt-2 text-xs text-blue-600 underline">自動遷移をキャンセル</button>
      </div>

      <!-- PC版ボタン -->
      <button id="btn-pc" onclick="navigateTo('pc')"
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800
               text-white font-semibold text-lg sm:text-xl
               rounded-xl shadow-md hover:shadow-lg
               transition-all duration-200
               px-6 py-6 min-h-[100px]
               flex flex-col items-center justify-center gap-2
               focus:outline-none focus:ring-4 focus:ring-blue-300">
        <span class="text-2xl sm:text-3xl">&#128187;</span>
        <span>生産工程表に進む</span>
        <span class="text-sm font-normal text-blue-200">PC向け - フル機能</span>
      </button>

      <!-- タブレット用ビュアーボタン -->
      <button id="btn-viewer" onclick="navigateTo('viewer')"
        class="w-full bg-sky-500 hover:bg-sky-600 active:bg-sky-700
               text-white font-semibold text-lg sm:text-xl
               rounded-xl shadow-md hover:shadow-lg
               transition-all duration-200
               px-6 py-6 min-h-[100px]
               flex flex-col items-center justify-center gap-2
               focus:outline-none focus:ring-4 focus:ring-sky-300">
        <span class="text-2xl sm:text-3xl">&#128196;</span>
        <span>タブレット用ビュアーを開く</span>
        <span class="text-sm font-normal text-sky-200">タブレット・スマホ向け - 閲覧専用</span>
      </button>

    </div>
  </main>

  <!-- フッター -->
  <footer class="text-center text-xs text-gray-400 py-4">
    &copy; 2025 生産工程表
  </footer>

  <script>
    // ==========================================
    // 端末自動判定（UA + 画面幅 + タッチ判定）
    // ==========================================
    var autoRedirectTimer = null;
    var countdownInterval = null;
    var autoRedirectCancelled = false;

    function detectDevice() {
      var ua = navigator.userAgent || '';
      var screenWidth = window.screen.width;
      var screenHeight = window.screen.height;
      var minDimension = Math.min(screenWidth, screenHeight);
      var hasTouch = ('ontouchstart' in window) ||
                     (navigator.maxTouchPoints > 0) ||
                     (navigator.msMaxTouchPoints > 0);

      // --- UA判定 ---
      // スマートフォン判定（iPhone, Android Phone）
      var isPhone = /iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua);
      // タブレット判定（iPad, Android Tablet）
      // 注意: 最新iPadはMacintoshを含むUAを送信する
      var isTabletUA = /iPad|Android(?!.*Mobile)/i.test(ua);
      // iPadOS判定（Macintosh UA + タッチ対応 = iPad）
      var isIPadOS = /Macintosh/i.test(ua) && hasTouch && minDimension >= 700;

      // --- 複合判定 ---
      if (isPhone) {
        return { type: 'mobile', label: 'スマートフォン', target: 'viewer' };
      }
      if (isTabletUA || isIPadOS) {
        return { type: 'tablet', label: 'タブレット', target: 'viewer' };
      }
      // タッチ対応 + 小画面 = モバイルデバイスの可能性
      if (hasTouch && minDimension < 900) {
        return { type: 'mobile', label: 'モバイルデバイス', target: 'viewer' };
      }
      // PC（タッチ対応PCを含む）
      return { type: 'pc', label: 'PC', target: 'pc' };
    }

    function startAutoRedirect() {
      var result = detectDevice();
      var msgEl = document.getElementById('auto-detect-msg');
      var deviceEl = document.getElementById('detect-device-type');
      var targetEl = document.getElementById('detect-target');
      var countdownEl = document.getElementById('detect-countdown');
      var barEl = document.getElementById('countdown-bar');

      deviceEl.textContent = result.label;
      targetEl.textContent = result.target === 'viewer' ? '簡易ビュアー' : '生産工程表（PC版）';
      msgEl.style.display = 'block';

      // 推奨ボタンをハイライト
      if (result.target === 'viewer') {
        document.getElementById('btn-viewer').classList.add('ring-4', 'ring-sky-300');
      } else {
        document.getElementById('btn-pc').classList.add('ring-4', 'ring-blue-300');
      }

      // カウントダウン（2秒）
      var remaining = 2000;
      var total = 2000;
      var step = 50; // 50ms間隔で更新

      countdownInterval = setInterval(function() {
        remaining -= step;
        if (remaining <= 0) remaining = 0;

        // カウントダウンテキスト更新
        countdownEl.textContent = Math.ceil(remaining / 1000);
        // プログレスバー更新
        barEl.style.width = ((remaining / total) * 100) + '%';

        if (remaining <= 0) {
          clearInterval(countdownInterval);
          if (!autoRedirectCancelled) {
            navigateTo(result.target);
          }
        }
      }, step);
    }

    function cancelAutoRedirect() {
      autoRedirectCancelled = true;
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      var msgEl = document.getElementById('auto-detect-msg');
      msgEl.innerHTML = '<p class="text-sm text-gray-500">自動遷移をキャンセルしました。下のボタンから選択してください。</p>';
    }

    function navigateTo(mode) {
      // 遷移中の二重クリック防止
      autoRedirectCancelled = true;
      if (countdownInterval) clearInterval(countdownInterval);

      // GAS WebAppはiframe内で動作するため、window.locationではなく
      // サーバーから注入された正しいURLを使用する
      var baseUrl = '<?= BASE_URL ?>';
      window.top.location.href = baseUrl + '?mode=' + mode;
    }

    // ページ読み込み後に自動判定開始
    window.addEventListener('load', function() {
      startAutoRedirect();
    });
  </script>

</body>
</html>
