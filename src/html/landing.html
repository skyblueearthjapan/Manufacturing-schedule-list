<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生産工程表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .pulse-recommend {
      animation: pulse-ring 1.5s ease-out infinite;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">生産工程表</h1>
      <p class="mt-1 text-sm text-gray-500">Manufacturing Schedule System</p>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg space-y-5 fade-in">

      <!-- 端末判定メッセージ -->
      <div id="detect-msg" class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-center" style="display:none;">
        <p class="text-sm text-blue-800">
          <span id="detect-device-type" class="font-bold"></span> を検出しました。
          下の<span id="detect-recommend" class="font-bold"></span>ボタンをタップしてください。
        </p>
      </div>

      <!-- PC版ボタン -->
      <button id="btn-pc" onclick="navigateTo('pc')"
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800
               text-white font-semibold text-lg sm:text-xl
               rounded-xl shadow-md hover:shadow-lg
               transition-all duration-200
               px-6 py-6 min-h-[100px]
               flex flex-col items-center justify-center gap-2
               focus:outline-none focus:ring-4 focus:ring-blue-300">
        <span class="text-2xl sm:text-3xl">&#128187;</span>
        <span>生産工程表に進む</span>
        <span class="text-sm font-normal text-blue-200">PC向け - フル機能</span>
      </button>

      <!-- タブレット用ビュアーボタン -->
      <button id="btn-viewer" onclick="navigateTo('viewer')"
        class="w-full bg-sky-500 hover:bg-sky-600 active:bg-sky-700
               text-white font-semibold text-lg sm:text-xl
               rounded-xl shadow-md hover:shadow-lg
               transition-all duration-200
               px-6 py-6 min-h-[100px]
               flex flex-col items-center justify-center gap-2
               focus:outline-none focus:ring-4 focus:ring-sky-300">
        <span class="text-2xl sm:text-3xl">&#128196;</span>
        <span>タブレット用ビュアーを開く</span>
        <span class="text-sm font-normal text-sky-200">タブレット・スマホ向け - 閲覧専用</span>
      </button>

    </div>
  </main>

  <!-- フッター -->
  <footer class="text-center text-xs text-gray-400 py-4">
    &copy; 2025 生産工程表
  </footer>

  <script>
    // ==========================================
    // 端末自動判定（UA + 画面幅 + タッチ判定）
    // ※ GAS iframeのセキュリティ制約により自動遷移不可
    // → 推奨ボタンをハイライト表示、ユーザータップで遷移
    // ==========================================

    function detectDevice() {
      var ua = navigator.userAgent || '';
      var screenWidth = window.screen.width;
      var screenHeight = window.screen.height;
      var minDimension = Math.min(screenWidth, screenHeight);
      var hasTouch = ('ontouchstart' in window) ||
                     (navigator.maxTouchPoints > 0) ||
                     (navigator.msMaxTouchPoints > 0);

      var isPhone = /iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua);
      var isTabletUA = /iPad|Android(?!.*Mobile)/i.test(ua);
      var isIPadOS = /Macintosh/i.test(ua) && hasTouch && minDimension >= 700;

      if (isPhone) {
        return { type: 'mobile', label: 'スマートフォン', target: 'viewer' };
      }
      if (isTabletUA || isIPadOS) {
        return { type: 'tablet', label: 'タブレット', target: 'viewer' };
      }
      if (hasTouch && minDimension < 900) {
        return { type: 'mobile', label: 'モバイルデバイス', target: 'viewer' };
      }
      return { type: 'pc', label: 'PC', target: 'pc' };
    }

    function highlightRecommended() {
      var result = detectDevice();

      // 判定メッセージ表示
      var msgEl = document.getElementById('detect-msg');
      var deviceEl = document.getElementById('detect-device-type');
      var recommendEl = document.getElementById('detect-recommend');

      deviceEl.textContent = result.label;

      if (result.target === 'viewer') {
        recommendEl.textContent = '「タブレット用ビュアーを開く」';
        document.getElementById('btn-viewer').classList.add('ring-4', 'ring-sky-300', 'pulse-recommend');
      } else {
        recommendEl.textContent = '「生産工程表に進む」';
        document.getElementById('btn-pc').classList.add('ring-4', 'ring-blue-300', 'pulse-recommend');
      }

      msgEl.style.display = 'block';
    }

    function navigateTo(mode) {
      // GAS WebAppはiframe内で動作するため、サーバーから注入されたURLを使用
      // window.top.location.href はユーザー操作（onclick）から呼ばれるので許可される
      var baseUrl = '<?= BASE_URL ?>';
      window.top.location.href = baseUrl + '?mode=' + mode;
    }

    // DOM構築完了後に判定実行
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', highlightRecommended);
    } else {
      highlightRecommended();
    }
  </script>

</body>
</html>
