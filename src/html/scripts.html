// ========================================
// Utils - ユーティリティ関数
// ========================================

const Utils = {
  /**
   * YYYY-MM-DD文字列をローカル日付として安全にパース
   * new Date("2026-01-13") はUTC解釈されるが、
   * new Date(2026, 0, 13) はローカル解釈される
   * @param {string} dateStr - YYYY-MM-DD形式の日付文字列
   * @returns {Date} ローカルタイムゾーンの日付
   */
  parseLocalDate(dateStr) {
    if (!dateStr) return new Date();
    if (dateStr instanceof Date) return dateStr;
    const match = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
    }
    // フォールバック（非推奨だがエラー回避）
    return new Date(dateStr);
  },

  formatDate(date) {
    if (!date) return '';
    const d = date instanceof Date ? date : this.parseLocalDate(date);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  },

  getToday() {
    return this.formatDate(new Date());
  },

  addDays(dateStr, days) {
    const d = this.parseLocalDate(dateStr);
    d.setDate(d.getDate() + days);
    return this.formatDate(d);
  },

  getDaysBetween(startDate, endDate) {
    const start = this.parseLocalDate(startDate);
    const end = this.parseLocalDate(endDate);
    return Math.ceil((end - start) / (1000 * 60 * 60 * 24));
  },

  getDayOfWeek(dateStr) {
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const d = this.parseLocalDate(dateStr);
    return days[d.getDay()];
  },

  isWeekend(dateStr) {
    const d = this.parseLocalDate(dateStr);
    const day = d.getDay();
    return day === 0 || day === 6;
  },

  isHoliday(dateStr) {
    return false;
  },

  getMonth(dateStr) {
    return this.parseLocalDate(dateStr).getMonth() + 1;
  },

  getDay(dateStr) {
    return this.parseLocalDate(dateStr).getDate();
  },

  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return `${parseInt(match[2])}/${parseInt(match[3])}`;
    }
    const match2 = dateStr.match(/(\d{1,2})\/(\d{1,2})/);
    if (match2) {
      return `${match2[1]}/${match2[2]}`;
    }
    return dateStr;
  },

  generateDateRange(startDate, days) {
    const dates = [];
    for (let i = 0; i < days; i++) {
      dates.push(this.addDays(startDate, i));
    }
    return dates;
  },

  lightenColor(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;
    return '#' + (
      0x1000000 +
      (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
      (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
      (B < 255 ? B < 1 ? 0 : B : 255)
    ).toString(16).slice(1);
  },

  debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  },

  showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  },

  setLoading(show) {
    const loading = document.getElementById('loading');
    if (show) {
      loading.classList.remove('hidden');
    } else {
      loading.classList.add('hidden');
    }
  },

  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    str = String(str);
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  },

  /**
   * ユニークIDを生成
   * @returns {string} - ランダムな文字列ID
   */
  generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
  },

  /**
   * 日本語色名やrgb()をHex形式に正規化
   * @param {string} input - 色の入力値
   * @returns {string|null} - #RRGGBB形式、または無効な場合はnull
   */
  normalizeColor(input) {
    if (!input) return null;

    const str = String(input).trim();

    // 既に#RRGGBB形式
    if (/^#[0-9A-Fa-f]{6}$/.test(str)) {
      return str.toUpperCase();
    }

    // #RGB形式 → #RRGGBB
    if (/^#[0-9A-Fa-f]{3}$/.test(str)) {
      const r = str[1], g = str[2], b = str[3];
      return `#${r}${r}${g}${g}${b}${b}`.toUpperCase();
    }

    // rgb(r, g, b)形式
    const rgbMatch = str.match(/^rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
    if (rgbMatch) {
      const r = Math.min(255, parseInt(rgbMatch[1])).toString(16).padStart(2, '0');
      const g = Math.min(255, parseInt(rgbMatch[2])).toString(16).padStart(2, '0');
      const b = Math.min(255, parseInt(rgbMatch[3])).toString(16).padStart(2, '0');
      return `#${r}${g}${b}`.toUpperCase();
    }

    // 日本語色名マッピング
    const colorMap = {
      '青': '#2563EB',
      '赤': '#EF4444',
      '緑': '#22C55E',
      '黄': '#F59E0B',
      '黄色': '#F59E0B',
      '紫': '#A855F7',
      '橙': '#F97316',
      'オレンジ': '#F97316',
      '黒': '#111827',
      '灰': '#6B7280',
      '灰色': '#6B7280',
      'グレー': '#6B7280',
      '白': '#FFFFFF',
      'ピンク': '#EC4899',
      '水色': '#06B6D4',
      '茶': '#92400E',
      '茶色': '#92400E',
      // 英語色名
      'blue': '#2563EB',
      'red': '#EF4444',
      'green': '#22C55E',
      'yellow': '#F59E0B',
      'purple': '#A855F7',
      'orange': '#F97316',
      'black': '#111827',
      'gray': '#6B7280',
      'grey': '#6B7280',
      'white': '#FFFFFF',
      'pink': '#EC4899',
      'cyan': '#06B6D4'
    };

    const mapped = colorMap[str.toLowerCase()] || colorMap[str];
    if (mapped) return mapped;

    // 不明な値はnull
    return null;
  },

  /**
   * Hex色にアルファ値を追加
   * @param {string} hex - #RRGGBB形式
   * @param {string} alphaHex - 00-FF形式のアルファ値
   * @param {string} fallback - hexが無効な場合のフォールバック色
   * @returns {string} - #RRGGBBAA形式
   */
  withAlpha(hex, alphaHex, fallback = '#6B7280') {
    const normalized = this.normalizeColor(hex);
    const color = normalized || fallback;
    return `${color}${alphaHex}`;
  },

  /**
   * 色が有効かどうかをチェック（normalizeColorで変換可能か）
   * @param {string} input
   * @returns {boolean}
   */
  isValidColor(input) {
    return this.normalizeColor(input) !== null;
  },

  /**
   * 厳密な#RRGGBB形式かどうかをチェック
   * @param {string} input
   * @returns {boolean}
   */
  isValidHexColor(input) {
    if (!input || typeof input !== 'string') return false;
    return /^#[0-9A-Fa-f]{6}$/.test(input.trim());
  },

  /**
   * 全角英数字を半角に変換（検索用正規化の内部関数）
   * @param {string} s
   * @returns {string}
   */
  zenkakuToHankakuAscii(s) {
    if (!s) return '';
    // 全角英数字（Ａ-Ｚａ-ｚ０-９）→ 半角
    // コードポイント差分: 0xFEE0
    return s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (char) => {
      return String.fromCharCode(char.charCodeAt(0) - 0xFEE0);
    });
  },

  /**
   * 検索用文字列正規化
   * - 全角英数字→半角
   * - 全角スペース→半角スペース
   * - trim
   * - 連続スペース→1つ
   * - 小文字化
   * @param {string} s
   * @returns {string}
   */
  normalizeText(s) {
    if (!s) return '';
    let result = String(s);
    // 全角英数字→半角
    result = this.zenkakuToHankakuAscii(result);
    // 全角スペース→半角
    result = result.replace(/\u3000/g, ' ');
    // trim
    result = result.trim();
    // 連続スペース→1つ
    result = result.replace(/\s+/g, ' ');
    // 小文字化
    result = result.toLowerCase();
    return result;
  }
};

// ========================================
// API - GAS APIクライアント
// ========================================

const API = {
  TIMEOUT: 30000,

  isGasEnvironment() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  },

  call(functionName, ...args) {
    console.log(`[API.call] Calling ${functionName} with args:`, args);
    return new Promise((resolve, reject) => {
      if (!this.isGasEnvironment()) {
        console.error('[API.call] Not in GAS environment');
        reject(new Error('GAS環境で実行されていません。ウェブアプリとしてデプロイしてください。'));
        return;
      }

      const timeoutId = setTimeout(() => {
        console.error(`[API.call] Timeout for ${functionName}`);
        reject(new Error(`API呼び出しがタイムアウトしました (${functionName})`));
      }, this.TIMEOUT);

      try {
        google.script.run
          .withSuccessHandler((result) => {
            clearTimeout(timeoutId);
            console.log(`[API.call] ${functionName} success, result:`, result);
            resolve(result);
          })
          .withFailureHandler((error) => {
            clearTimeout(timeoutId);
            console.error(`[API.call] ${functionName} failure:`, error);
            const errorMessage = error?.message || error?.toString() || '不明なエラーが発生しました';
            reject(new Error(errorMessage));
          })
          [functionName](...args);
      } catch (e) {
        clearTimeout(timeoutId);
        console.error(`[API.call] ${functionName} exception:`, e);
        reject(new Error(`API呼び出しに失敗しました: ${e.message}`));
      }
    });
  },

  async getBootstrapData(rangeStart, days) {
    return await this.call('api_getBootstrapData', rangeStart, days);

// ========================================
// ChangeBuffer - 変更バッファ（A+C+Bプラン共通基盤）
// ========================================

const ChangeBuffer = {
  // 保留中の変更
  pendingChanges: [],

  // 状態
  isSaving: false,
  lastSaveError: null,

  // 設定
  config: {
    idleAutoSaveMs: 5000,  // アイドル自動保存（5秒）
    enableIdleAutoSave: true,
    storageKey: 'pendingChanges_v1'  // localStorage キー
  },

  // アイドルタイマー
  _idleTimer: null,

  // リスナー（UI更新用）
  _listeners: [],

  // ========================================
  // localStorage 永続化
  // ========================================

  /**
   * pendingChanges を localStorage に保存
   */
  _saveToStorage() {
    try {
      if (this.pendingChanges.length > 0) {
        const data = {
          version: 1,
          savedAt: new Date().toISOString(),
          changes: this.pendingChanges
        };
        localStorage.setItem(this.config.storageKey, JSON.stringify(data));
        console.log(`[ChangeBuffer] Saved ${this.pendingChanges.length} changes to localStorage`);
      } else {
        this._clearStorage();
      }
    } catch (e) {
      console.warn('[ChangeBuffer] Failed to save to localStorage:', e);
    }
  },

  /**
   * localStorage からロード
   * @returns {Array|null} 復元した変更配列、なければnull
   */
  _loadFromStorage() {
    try {
      const raw = localStorage.getItem(this.config.storageKey);
      if (!raw) return null;

      const data = JSON.parse(raw);
      if (data && data.version === 1 && Array.isArray(data.changes) && data.changes.length > 0) {
        console.log(`[ChangeBuffer] Found ${data.changes.length} saved changes from ${data.savedAt}`);
        return data;
      }
    } catch (e) {
      console.warn('[ChangeBuffer] Failed to load from localStorage:', e);
    }
    return null;
  },

  /**
   * localStorage をクリア
   */
  _clearStorage() {
    try {
      localStorage.removeItem(this.config.storageKey);
      console.log('[ChangeBuffer] Cleared localStorage');
    } catch (e) {
      console.warn('[ChangeBuffer] Failed to clear localStorage:', e);
    }
  },

  /**
   * 保存済み変更を復元
   * @param {Array} changes - 復元する変更配列
   */
  restoreFromStorage(changes) {
    if (!Array.isArray(changes)) return;
    this.pendingChanges = changes;
    this._notify();
    console.log(`[ChangeBuffer] Restored ${changes.length} changes from storage`);
  },

  /**
   * 変更を追加
   * @param {string} entityType - 'schedule' | 'trip' | 'job'
   * @param {string} op - 'upsert' | 'delete' | 'lock' | 'unlock'
   * @param {string} id - エンティティID
   * @param {Object} payload - 変更内容
   * @param {string} sourceView - 'master' | 'jobDetail' | 'travel' | 'weekly'
   */
  add(entityType, op, id, payload, sourceView) {
    // 同一IDの既存変更を検索
    const existingIndex = this.pendingChanges.findIndex(
      c => c.entityType === entityType && c.id === id
    );

    const change = {
      entityType,
      op,
      id,
      payload,
      updatedAtClient: new Date().toISOString(),
      sourceView
    };

    if (existingIndex >= 0) {
      // 既存を上書き（最新の変更で置換）
      this.pendingChanges[existingIndex] = change;
      console.log(`[ChangeBuffer] Updated existing change: ${entityType}/${id}`);
    } else {
      // 新規追加
      this.pendingChanges.push(change);
      console.log(`[ChangeBuffer] Added new change: ${entityType}/${id} (${op})`);
    }

    this._notify();
    this._saveToStorage();  // localStorage に保存
    this._resetIdleTimer();
  },

  /**
   * 変更を削除（保存成功後に呼ぶ）
   */
  remove(entityType, id) {
    this.pendingChanges = this.pendingChanges.filter(
      c => !(c.entityType === entityType && c.id === id)
    );
    this._notify();
    this._saveToStorage();  // localStorage を更新
  },

  /**
   * 全変更をクリア
   */
  clear() {
    this.pendingChanges = [];
    this.lastSaveError = null;
    this._notify();
    this._clearStorage();  // localStorage をクリア
  },

  /**
   * 未保存件数
   */
  get count() {
    return this.pendingChanges.length;
  },

  /**
   * 未保存があるか
   */
  get isDirty() {
    return this.pendingChanges.length > 0;
  },

  /**
   * 未保存があるか（メソッド版）
   * @returns {boolean}
   */
  hasPendingChanges() {
    return this.isDirty;
  },

  /**
   * 即座に保存（Promise返却）
   * @returns {Promise}
   */
  async flushNow() {
    return this.flush('export');
  },

  /**
   * 保存実行（バッチ）
   */
  async flush(reason = 'manual') {
    if (!this.isDirty) {
      console.log('[ChangeBuffer] Nothing to save');
      return { ok: true, saved: 0 };
    }

    if (this.isSaving) {
      console.log('[ChangeBuffer] Already saving, skipping');
      return { ok: false, reason: 'already_saving' };
    }

    console.log(`[ChangeBuffer] Flushing ${this.count} changes (reason: ${reason})`);
    this.isSaving = true;
    this.lastSaveError = null;
    this._notify();

    try {
      // 変更をコピー（保存中に新しい変更が来る可能性）
      const changesToSave = [...this.pendingChanges];

      // バッチ保存API呼び出し
      const result = await API.call('api_saveBatch', {
        changes: changesToSave,
        clientRevision: Utils.generateId(),
        user: 'user'
      });

      // 成功判定: result が null/undefined でも成功扱い（GASあるある対策）
      // 明示的に ok:false の場合のみ失敗
      const isSuccess = (result == null) || (result.ok !== false);

      if (isSuccess) {
        // 保存成功：差分反映（resultがある場合のみ）
        if (result && result.results) {
          Store.applySavedResults(result.results);
        }

        // 保存した変更をバッファから削除
        changesToSave.forEach(c => {
          this.remove(c.entityType, c.id);
        });

        this.isSaving = false;
        this._notify();

        Utils.showToast(`保存しました（${changesToSave.length}件）`, 'success');
        console.log('[ChangeBuffer] Flush successful');
        return { ok: true, saved: changesToSave.length };
      } else {
        throw new Error(result?.error || result?.message || '保存に失敗しました');
      }
    } catch (error) {
      console.error('[ChangeBuffer] Flush failed:', error);
      this.isSaving = false;
      this.lastSaveError = error.message;
      this._notify();

      Utils.showToast(`保存に失敗しました: ${error.message}`, 'error');
      return { ok: false, error: error.message };
    }
  },

  /**
   * 未保存があれば保存（タブ切替・離脱時用）
   */
  async flushIfDirty(options = {}) {
    const { reason = 'auto', showConfirmOnFail = true } = options;

    if (!this.isDirty) {
      return { ok: true };
    }

    const result = await this.flush(reason);

    if (!result.ok && showConfirmOnFail) {
      // 失敗時：遷移を止めるかどうかを返す
      return { ok: false, shouldBlock: true, error: result.error };
    }

    return result;
  },

  /**
   * アイドルタイマーをリセット
   */
  _resetIdleTimer() {
    if (this._idleTimer) {
      clearTimeout(this._idleTimer);
    }

    if (this.config.enableIdleAutoSave && this.isDirty) {
      this._idleTimer = setTimeout(() => {
        console.log('[ChangeBuffer] Idle timeout, auto-saving');
        this.flush('idle');
      }, this.config.idleAutoSaveMs);
    }
  },

  /**
   * リスナー登録
   */
  subscribe(callback) {
    this._listeners.push(callback);
    return () => {
      this._listeners = this._listeners.filter(l => l !== callback);
    };
  },

  /**
   * リスナーに通知
   */
  _notify() {
    const state = {
      count: this.count,
      isDirty: this.isDirty,
      isSaving: this.isSaving,
      lastSaveError: this.lastSaveError
    };
    this._listeners.forEach(cb => cb(state));
  },

  /**
   * 初期化（イベントリスナー設定）
   */
  init() {
    // beforeunload: ページ離脱時の警告
    window.addEventListener('beforeunload', (e) => {
      if (this.isDirty) {
        e.preventDefault();
        e.returnValue = '未保存の変更があります。ページを離れますか？';
        return e.returnValue;
      }
    });

    // ユーザー操作でアイドルタイマーリセット
    ['click', 'keydown', 'mousemove'].forEach(event => {
      document.addEventListener(event, () => {
        if (this.isDirty) {
          this._resetIdleTimer();
        }
      }, { passive: true });
    });

    // localStorage から未保存変更をチェック
    this._checkStoredChanges();

    console.log('[ChangeBuffer] Initialized');
  },

  /**
   * 保存済み変更の確認と復元
   */
  _checkStoredChanges() {
    const stored = this._loadFromStorage();
    if (!stored) return;

    const { changes, savedAt } = stored;
    const savedDate = new Date(savedAt);
    const timeAgo = this._formatTimeAgo(savedDate);

    // 復元確認ダイアログを表示
    setTimeout(() => {
      this._showRestoreDialog(changes, timeAgo);
    }, 500);  // 初期化完了後に表示
  },

  /**
   * 復元確認ダイアログを表示
   */
  _showRestoreDialog(changes, timeAgo) {
    // ダイアログ作成
    const overlay = document.createElement('div');
    overlay.className = 'restore-dialog-overlay';
    overlay.innerHTML = `
      <div class="restore-dialog">
        <div class="restore-dialog-header">
          <h3>未保存の変更があります</h3>
        </div>
        <div class="restore-dialog-body">
          <p>${timeAgo}に編集された <strong>${changes.length}件</strong> の未保存変更が見つかりました。</p>
          <p>復元しますか？</p>
        </div>
        <div class="restore-dialog-footer">
          <button class="restore-dialog-btn restore-dialog-btn-discard">破棄する</button>
          <button class="restore-dialog-btn restore-dialog-btn-restore">復元する</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // ボタンイベント
    overlay.querySelector('.restore-dialog-btn-restore').addEventListener('click', () => {
      this.restoreFromStorage(changes);
      overlay.remove();
      Utils.showToast(`${changes.length}件の変更を復元しました`, 'success');
    });

    overlay.querySelector('.restore-dialog-btn-discard').addEventListener('click', () => {
      this._clearStorage();
      overlay.remove();
      Utils.showToast('未保存の変更を破棄しました', 'info');
    });
  },

  /**
   * 時間差を日本語表現
   */
  _formatTimeAgo(date) {
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);

    if (days > 0) return `${days}日前`;
    if (hours > 0) return `${hours}時間前`;
    if (minutes > 0) return `${minutes}分前`;
    return '数秒前';
  }
};

const SaveBar = {
  _container: null,

  /**
   * 初期化（DOMに保存バーを追加）
   */
  init() {
    // 既存のバーがあれば削除
    const existing = document.getElementById('save-bar');
    if (existing) existing.remove();

    // 保存バーを作成
    this._container = document.createElement('div');
    this._container.id = 'save-bar';
    this._container.className = 'save-bar save-bar-idle';  // 初期状態はidle
    this._container.innerHTML = `
      <span class="save-bar-icon">✓</span>
      <span class="save-bar-status">
        <span class="save-bar-count">保存済み</span>
      </span>
      <button class="save-bar-btn hidden" onclick="SaveBar.save()">
        <span class="save-bar-btn-text">保存</span>
        <span class="save-bar-spinner hidden">⏳</span>
      </button>
      <button class="save-bar-retry hidden" onclick="SaveBar.save()">
        再試行
      </button>
    `;

    // 専用コンテナに追加
    const container = document.getElementById('save-bar-container');
    if (container) {
      container.appendChild(this._container);
    } else {
      // フォールバック: ヘッダーに追加
      const header = document.querySelector('header .flex.items-center.space-x-3');
      if (header) {
        header.insertBefore(this._container, header.firstChild);
      } else {
        document.body.appendChild(this._container);
      }
    }

    // ChangeBufferの状態変更を購読
    ChangeBuffer.subscribe((state) => this.update(state));

    console.log('[SaveBar] Initialized');
  },

  /**
   * 状態更新
   */
  update(state) {
    if (!this._container) return;

    const { count, isDirty, isSaving, lastSaveError } = state;

    // 状態クラスをリセット
    this._container.classList.remove('save-bar-idle', 'save-bar-dirty', 'save-bar-saving', 'save-bar-error');

    // 要素取得
    const iconEl = this._container.querySelector('.save-bar-icon');
    const countEl = this._container.querySelector('.save-bar-count');
    const btn = this._container.querySelector('.save-bar-btn');
    const btnText = this._container.querySelector('.save-bar-btn-text');
    const spinner = this._container.querySelector('.save-bar-spinner');
    const retryBtn = this._container.querySelector('.save-bar-retry');

    // 状態別の表示更新
    if (lastSaveError) {
      // エラー状態
      this._container.classList.add('save-bar-error');
      if (iconEl) iconEl.textContent = '⚠';
      if (countEl) countEl.textContent = `保存失敗`;
      btn?.classList.add('hidden');
      retryBtn?.classList.remove('hidden');
    } else if (isSaving) {
      // 保存中
      this._container.classList.add('save-bar-saving');
      if (iconEl) iconEl.textContent = '⏳';
      if (countEl) countEl.textContent = '保存中...';
      btn?.classList.add('hidden');
      btnText?.classList.add('hidden');
      spinner?.classList.remove('hidden');
      retryBtn?.classList.add('hidden');
    } else if (isDirty) {
      // 未保存あり
      this._container.classList.add('save-bar-dirty');
      if (iconEl) iconEl.textContent = '●';
      if (countEl) countEl.textContent = `未保存: ${count}件`;
      btn?.classList.remove('hidden');
      btnText?.classList.remove('hidden');
      spinner?.classList.add('hidden');
      btn?.removeAttribute('disabled');
      retryBtn?.classList.add('hidden');
    } else {
      // アイドル状態（保存済み）
      this._container.classList.add('save-bar-idle');
      if (iconEl) iconEl.textContent = '✓';
      if (countEl) countEl.textContent = '保存済み';
      btn?.classList.add('hidden');
      retryBtn?.classList.add('hidden');
    }
  },

  /**
   * 保存実行
   */
  async save() {
    await ChangeBuffer.flush('manual');
  }
};

const Store = {
  state: {
    jobs: [],
    processes: [],
    people: [],
    schedules: [],
    attachments: [],
    trips: [],
    jobMaster: [], // 外部工番マスター
    workerJobAssign: [], // 作業者別担当工番
    topMemos: [], // 上部メモ
    topMemoExpanded: false, // 上部メモ展開状態（デフォルトOFF）
    showHiddenJobs: false, // 完了（非表示）工番を表示するか
    jobSearchQuery: '', // 工番検索クエリ（大工程表用）
    personSearchQuery: '', // 担当者検索クエリ（大工程表用）
    tripPersonFilter: null, // 出張予定エリア専用の担当者フィルタ（personId）
    pdfInfoCache: {}, // PDF情報キャッシュ (工番 -> { order: {fileId, url}, instruction: {fileId, url} })

    displayStartDate: null,

  listeners: [],

  setState(newState) {

  notify() {

  },

  async loadBootstrapData() {

      }

        trips: data.trips || [],

        workerJobAssign: data.workerJobAssign || [],
        topMemos: topMemos,
        topMemoExpanded: false, // 常に折りたたみで開始
        daySettings: data.daySettings || {},
        lastFetchedAt: data.meta?.fetchedAt || new Date().toISOString(),
        isLoading: false
      });

      Utils.setLoading(false);
      console.log('Bootstrap data loaded:', {
        jobs: data.jobs?.length || 0,
        processes: data.processes?.length || 0,
        people: data.people?.length || 0,
        schedules: data.schedules?.length || 0
      });
    } catch (error) {
      console.error('Failed to load bootstrap data:', error);
      Utils.setLoading(false);
      this.setState({ isLoading: false });

      let errorMessage = 'データの読み込みに失敗しました';
      if (error.message) {

          errorMessage = 'サーバー応答がタイムアウトしました。スプレッドシートの設定を確認してください。';
        } else if (error.message.includes('シート') && error.message.includes('見つかりません')) {
          errorMessage = error.message + ' スプレッドシートにシートを作成してください。';
        } else {
          errorMessage = error.message;
        }
      }
      Utils.showToast(errorMessage, 'error', 8000);

  },

  async changeDisplayRange(startDate, days) {
    this.setState({
      displayStartDate: startDate,
      displayDays: days
    });
    await this.loadBootstrapData();
  },

  addJob(job) {
    const jobs = [...this.state.jobs, job];
    this.setState({ jobs });
  },

  addProcess(process) {
    const processes = [...this.state.processes, process];
    // order順でソート
    processes.sort((a, b) => (a['表示順(order)'] || 0) - (b['表示順(order)'] || 0));
    this.setState({ processes });
  },

  updateJobInStore(jobId, updates) {
    const jobs = this.state.jobs.map(j =>
      j.jobId === jobId ? { ...j, ...updates } : j
    );
    this.setState({ jobs });
  },

  /**
   * Jobを更新（API経由 + ローカル状態更新）
   * 楽観ロック衝突時は最新データを取得して1回だけリトライ
   * @param {string} jobId - 対象のjobId
   * @param {Object} patch - 更新するフィールド
   * @param {string} expectedUpdatedAt - 楽観ロック用のupdatedAt
   */
  async updateJob(jobId, patch, expectedUpdatedAt) {
    if (!jobId) {
      throw new Error('updateJob: jobId is required');
    }

    // 変更がなければスキップ
    if (!patch || Object.keys(patch).length === 0) {
      console.log('[Store.updateJob] No changes detected');
      return { success: true, noChange: true };
    }

    // 成功時のローカル状態更新関数
    const applyResult = (result) => {
      this.updateJobInStore(jobId, {
        ...patch,
        updatedAt: result.updatedAt || new Date().toISOString()
      });
    };

    try {
      // まず通常更新
      console.log('[Store.updateJob] Calling API.updateJob with expectedUpdatedAt:', expectedUpdatedAt);
      const result = await API.updateJob(jobId, patch, expectedUpdatedAt || '');

      // 成功：ローカル状態を更新
      applyResult(result);
      return result;

    } catch (e) {
      // 衝突判定（「他のユーザーが更新しました」を含むか）
      const msg = String(e?.message || e);
      const isConflict = msg.includes('他のユーザーが更新しました');

      if (!isConflict) {
        throw e;
      }

      console.log('[Store.updateJob] Conflict detected, fetching latest data...');

      // 1回だけ最新を取り直してリトライ
      try {
        const latestJob = await API.getJob(jobId);
        if (!latestJob || !latestJob.updatedAt) {
          console.error('[Store.updateJob] Failed to get latest job for retry');
          throw e;
        }

        // ローカルキャッシュも最新に更新
        this.updateJobInStore(jobId, latestJob);

        // ★ 重要：最新のupdatedAtで再試行
        const latestUpdatedAt = latestJob.updatedAt;
        console.log('[Store.updateJob] Retrying with NEW updatedAt:', latestUpdatedAt);
        const result2 = await API.updateJob(jobId, patch, latestUpdatedAt);

        // 成功：ローカル状態を更新
        applyResult(result2);
        return result2;

      } catch (retryError) {
        console.error('[Store.updateJob] Retry also failed:', retryError);
        // リトライ失敗時はユーザーに分かりやすいメッセージ
        Utils.showToast('最新データに更新しました。もう一度操作してください', 'warning');
        throw retryError;
      }
    }
  },

  addSchedule(schedule) {
    const schedules = [...this.state.schedules, schedule];
    this.setState({ schedules });
  },

  updateScheduleInStore(scheduleId, updates) {
    const schedules = this.state.schedules.map(s =>
      s.scheduleId === scheduleId ? { ...s, ...updates } : s
    );
    this.setState({ schedules });
  },

  removeSchedule(scheduleId) {
    const schedules = this.state.schedules.filter(s => s.scheduleId !== scheduleId);
    this.setState({ schedules });
  },

  // Trip関連のStore操作
  addTrip(trip) {
    const trips = [...this.state.trips, trip];
    this.setState({ trips });
  },

  updateTripInStore(tripId, updates) {
    const trips = this.state.trips.map(t =>
      t.tripId === tripId ? { ...t, ...updates } : t
    );
    this.setState({ trips });
  },

  removeTrip(tripId) {
    const trips = this.state.trips.filter(t => t.tripId !== tripId);
    this.setState({ trips });
  },

  // DaySettings関連のStore操作
  getDaySetting(dateISO) {
    return this.state.daySettings[dateISO] || null;
  },

  setDaySettingInStore(dateISO, type) {
    const daySettings = { ...this.state.daySettings };
    if (type) {
      daySettings[dateISO] = type;
    } else {
      delete daySettings[dateISO];
    }
    this.setState({ daySettings });
  },

  // TopMemo関連のStore操作（複数メモ対応・scope=global固定）
  getTopMemos() {
    // 全メモを返す（sortOrder順）
    return [...this.state.topMemos].sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
  },

  getTopMemoById(memoId) {
    return this.state.topMemos.find(m => m.memoId === memoId) || null;
  },

  toggleTopMemoExpanded() {
    this.setState({ topMemoExpanded: !this.state.topMemoExpanded });
  },

  setTopMemoExpanded(expanded) {
    this.setState({ topMemoExpanded: expanded });
  },

  setTopMemos(topMemos) {
    this.setState({ topMemos });
  },

  addOrReplaceTopMemo(memo) {
    // memoIdで既存を探し、あれば置換、なければ追加
    const idx = this.state.topMemos.findIndex(m => m.memoId === memo.memoId);
    let topMemos;
    if (idx >= 0) {
      topMemos = [...this.state.topMemos];
      topMemos[idx] = { ...topMemos[idx], ...memo };
    } else {
      topMemos = [...this.state.topMemos, memo];
    }
    // sortOrder順でソート
    topMemos.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
    this.setState({ topMemos });
  },

  removeTopMemo(memoId) {
    const topMemos = this.state.topMemos.filter(m => m.memoId !== memoId);
    this.setState({ topMemos });
  },

  /**
   * 保存結果を差分反映（Cプラン：loadBootstrapData()を呼ばない）
   * @param {Object} results - { schedule: { upserted, deleted }, trip: { upserted, deleted, locked } }
   */
  applySavedResults(results) {
    if (!results) return;

    console.log('[Store] Applying saved results:', results);

    // Schedule の差分反映
    if (results.schedule) {
      let schedules = [...this.state.schedules];

      // upserted: 更新または追加（tempId → realId マッピング対応）
      if (results.schedule.upserted) {
        results.schedule.upserted.forEach(saved => {
          // _tempIdがある場合は仮IDを本IDに置換
          if (saved._tempId) {
            const tempIdx = schedules.findIndex(s => s.scheduleId === saved._tempId);
            if (tempIdx >= 0) {
              schedules[tempIdx] = { ...saved };
              delete schedules[tempIdx]._tempId;
              console.log(`[Store] Schedule tempId ${saved._tempId} → ${saved.scheduleId}`);
              return;
            }
          }
          const idx = schedules.findIndex(s => s.scheduleId === saved.scheduleId);
          if (idx >= 0) {
            schedules[idx] = { ...schedules[idx], ...saved };
          } else {
            schedules.push(saved);
          }
        });
      }

      // deleted: 削除
      if (results.schedule.deleted) {
        const deletedIds = results.schedule.deleted.map(d => d.scheduleId || d);
        schedules = schedules.filter(s => !deletedIds.includes(s.scheduleId));
      }

      this.setState({ schedules });
    }

    // Trip の差分反映
    if (results.trip) {
      let trips = [...this.state.trips];

      // upserted: 更新または追加（tempId → realId マッピング対応）
      if (results.trip.upserted) {
        results.trip.upserted.forEach(saved => {
          if (saved._tempId) {
            const tempIdx = trips.findIndex(t => t.tripId === saved._tempId);
            if (tempIdx >= 0) {
              trips[tempIdx] = { ...saved };
              delete trips[tempIdx]._tempId;
              console.log(`[Store] Trip tempId ${saved._tempId} → ${saved.tripId}`);
              return;
            }
          }
          const idx = trips.findIndex(t => t.tripId === saved.tripId);
          if (idx >= 0) {
            trips[idx] = { ...trips[idx], ...saved };
          } else {
            trips.push(saved);
          }
        });
      }

      // locked: ロック反映
      if (results.trip.locked) {
        results.trip.locked.forEach(locked => {
          const idx = trips.findIndex(t => t.tripId === locked.tripId);
          if (idx >= 0) {
            trips[idx] = { ...trips[idx], ...locked, isLocked: true };
          }
        });
      }

      // unlocked: アンロック反映
      if (results.trip.unlocked) {
        results.trip.unlocked.forEach(unlocked => {
          const idx = trips.findIndex(t => t.tripId === unlocked.tripId);
          if (idx >= 0) {
            trips[idx] = { ...trips[idx], ...unlocked, isLocked: false };
          }
        });
      }

      // deleted: 削除
      if (results.trip.deleted) {
        const deletedIds = results.trip.deleted.map(d => d.tripId || d);
        trips = trips.filter(t => !deletedIds.includes(t.tripId));
      }

      this.setState({ trips });
    }

    // Job の差分反映
    if (results.job) {
      let jobs = [...this.state.jobs];
      let schedules = [...this.state.schedules];
      let trips = [...this.state.trips];

      if (results.job.upserted) {
        results.job.upserted.forEach(saved => {
          if (saved._tempId) {
            const tempIdx = jobs.findIndex(j => j.jobId === saved._tempId);
            if (tempIdx >= 0) {
              jobs[tempIdx] = { ...saved };
              delete jobs[tempIdx]._tempId;
              console.log(`[Store] Job tempId ${saved._tempId} → ${saved.jobId}`);
              return;
            }
          }
          const idx = jobs.findIndex(j => j.jobId === saved.jobId);
          if (idx >= 0) {
            jobs[idx] = { ...jobs[idx], ...saved };
          } else {
            jobs.push(saved);
          }
        });
      }

      // closed: 完了（非表示）
      if (results.job.closed) {
        results.job.closed.forEach(closed => {
          const idx = jobs.findIndex(j => j.jobId === closed.jobId);
          if (idx >= 0) {
            jobs[idx] = { ...jobs[idx], ...closed };
            console.log(`[Store] Job closed: ${closed.jobId}`);
          }
        });
      }

      // reopened: 再開
      if (results.job.reopened) {
        results.job.reopened.forEach(reopened => {
          const idx = jobs.findIndex(j => j.jobId === reopened.jobId);
          if (idx >= 0) {
            jobs[idx] = { ...jobs[idx], ...reopened };
            console.log(`[Store] Job reopened: ${reopened.jobId}`);
          }
        });
      }

      // deleted: 削除（カスケード）
      if (results.job.deleted) {
        results.job.deleted.forEach(deleted => {
          const jobId = deleted.jobId || deleted;
          jobs = jobs.filter(j => j.jobId !== jobId);
          schedules = schedules.filter(s => s.jobId !== jobId);
          trips = trips.filter(t => t['jobId(任意)'] !== jobId && t.jobId !== jobId);
          console.log(`[Store] Job deleted: ${jobId}`, deleted.deletedCounts);
        });
      }

      this.setState({ jobs, schedules, trips });
    }

    // TopMemo の差分反映
    if (results.topMemo) {
      let topMemos = [...this.state.topMemos];

      // upserted: 更新または追加（tempId → realId マッピング対応）
      if (results.topMemo.upserted) {
        results.topMemo.upserted.forEach(saved => {
          if (saved._tempId) {
            const tempIdx = topMemos.findIndex(m => m.memoId === saved._tempId);
            if (tempIdx >= 0) {
              topMemos[tempIdx] = { ...saved };
              delete topMemos[tempIdx]._tempId;
              console.log(`[Store] TopMemo tempId ${saved._tempId} → ${saved.memoId}`);
              return;
            }
          }
          const idx = topMemos.findIndex(m => m.memoId === saved.memoId);
          if (idx >= 0) {
            topMemos[idx] = { ...topMemos[idx], ...saved };
          } else {
            topMemos.push(saved);
          }
        });
      }

      // deleted: 削除
      if (results.topMemo.deleted) {
        const deletedIds = results.topMemo.deleted.map(d => d.memoId || d);
        topMemos = topMemos.filter(m => !deletedIds.includes(m.memoId));
      }

      // sortOrder順でソート
      topMemos.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
      this.setState({ topMemos });
    }

    // JobProcessLayout の差分反映
    if (results.jobProcessLayout && results.jobProcessLayout.reordered) {
      results.jobProcessLayout.reordered.forEach(item => {
        if (item.jobId && item.layouts) {
          // JobDetailのレイアウトキャッシュを更新
          JobDetail.jobProcessLayouts[item.jobId] = item.layouts;
          console.log(`[Store] JobProcessLayout updated for job ${item.jobId}`);
        }
      });
    }

    console.log('[Store] Diff update complete');
  },

  addPerson(person) {
    const people = [...this.state.people, person];
    this.setState({ people });
  },

  updatePersonInStore(personId, updates) {
    const people = this.state.people.map(p =>
      p.personId === personId ? { ...p, ...updates } : p
    );
    this.setState({ people });
  },

  getJobById(jobId) {
    return this.state.jobs.find(j => j.jobId === jobId) || null;
  },

  // 表示対象の工番を取得（非表示フィルタ + 検索フィルタ適用）
  // 担当者検索時は Jobs.mainPersonId / Jobs.subPersonId でフィルタ（主担当→副担当の順でソート）
  getVisibleJobs() {
    let jobs;
    if (this.state.showHiddenJobs) {
      // 全て表示（deletedは除く）
      jobs = this.state.jobs.filter(j => j.status !== 'deleted');
    } else {
      // 非表示工番を除外
      jobs = this.state.jobs.filter(j => {
        if (j.status === 'closed' || j.status === 'deleted') return false;
        if (j.isHidden === true || j.isHidden === 'TRUE') return false;
        return true;
      });
    }

    // 工番検索フィルタ適用
    const query = this.state.jobSearchQuery;
    if (query && query.trim()) {
      const normalizedQuery = Utils.normalizeText(query);
      jobs = jobs.filter(job => {
        // 工番・顧客名・製品名を連結して正規化
        const searchKey = Utils.normalizeText(
          String(job['工番'] || '') + ' ' +
          String(job['顧客名'] || '') + ' ' +
          String(job['設備/製品名'] || '')
        );
        return searchKey.includes(normalizedQuery);
      });
    }

    // 担当者検索フィルタ適用（Jobs.mainPersonId / Jobs.subPersonId でフィルタ）
    const personQuery = this.state.personSearchQuery;
    if (personQuery && personQuery.trim()) {
      const matchedPersonIds = this.findPersonIdsByName(personQuery);
      if (matchedPersonIds.length > 0) {
        // 工番の主担当/副担当でフィルタ（Schedule側は参照しない）
        const { mainJobs, subJobs } = this.getJobsByPersonRole(jobs, matchedPersonIds);
        // 主担当→副担当の順でソート（同一工番が両方に該当する場合は主担当として1回だけ表示）
        const mainJobIds = new Set(mainJobs.map(j => j.jobId));
        const uniqueSubJobs = subJobs.filter(j => !mainJobIds.has(j.jobId));
        jobs = [...mainJobs, ...uniqueSubJobs];
      } else {
        // 担当者が見つからない場合は空配列
        jobs = [];
      }
    }

    return jobs;
  },

  /**
   * 工番を主担当/副担当で分類
   * @param {Array} jobs - フィルタ対象の工番配列
   * @param {string[]} personIds - 検索対象のpersonId配列
   * @returns {{ mainJobs: Array, subJobs: Array }}
   */
  getJobsByPersonRole(jobs, personIds) {
    const mainJobs = [];
    const subJobs = [];

    jobs.forEach(job => {
      const isMain = personIds.includes(job.mainPersonId);
      const isSub = personIds.includes(job.subPersonId);

      if (isMain) {
        mainJobs.push(job);
      } else if (isSub) {
        subJobs.push(job);
      }
    });

    return { mainJobs, subJobs };
  },

  /**
   * 担当者検索で工番の役割を取得
   * @returns {Map<string, 'main'|'sub'>} - jobId -> 'main' or 'sub'
   */
  getJobRoleMap() {
    const roleMap = new Map();
    const personQuery = this.state.personSearchQuery;
    if (!personQuery || !personQuery.trim()) return roleMap;

    const matchedPersonIds = this.findPersonIdsByName(personQuery);
    if (matchedPersonIds.length === 0) return roleMap;

    this.state.jobs.forEach(job => {
      const isMain = matchedPersonIds.includes(job.mainPersonId);
      const isSub = matchedPersonIds.includes(job.subPersonId);
      // 主担当を優先
      if (isMain) {
        roleMap.set(job.jobId, 'main');
      } else if (isSub) {
        roleMap.set(job.jobId, 'sub');
      }
    });

    return roleMap;
  },

  // 工番検索クエリを設定
  setJobSearchQuery(query) {
    this.setState({ jobSearchQuery: query });
  },

  // 担当者検索クエリを設定
  setPersonSearchQuery(query) {
    this.setState({ personSearchQuery: query });
  },

  /**
   * 担当者名（部分一致）でpersonIdを検索
   * @param {string} name - 担当者名（部分一致）
   * @returns {string[]} - マッチしたpersonIdの配列
   */
  findPersonIdsByName(name) {
    if (!name || !name.trim()) return [];
    const normalizedName = Utils.normalizeText(name);
    return this.state.people
      .filter(p => {
        const personName = Utils.normalizeText(p['氏名'] || '');
        return personName.includes(normalizedName);
      })
      .map(p => p.personId);
  },

  // 工番のステータスを更新（完了/再開）
  updateJobStatus(jobId, status, isHidden) {
    const jobs = [...this.state.jobs];
    const idx = jobs.findIndex(j => j.jobId === jobId);
    if (idx >= 0) {
      jobs[idx] = {
        ...jobs[idx],
        status,
        isHidden,
        closedAt: status === 'closed' ? new Date().toISOString() : null,
        closedBy: status === 'closed' ? 'user' : null
      };
      this.setState({ jobs });
    }
  },

  // 工番と関連データを削除
  deleteJob(jobId) {
    const jobs = this.state.jobs.filter(j => j.jobId !== jobId);
    const schedules = this.state.schedules.filter(s => s.jobId !== jobId);
    const trips = this.state.trips.filter(t => t['jobId(任意)'] !== jobId && t.jobId !== jobId);
    this.setState({ jobs, schedules, trips });
  },

  // 非表示工番表示トグル
  setShowHiddenJobs(show) {
    this.setState({ showHiddenJobs: show });
  },

  getProcessById(processId) {
    return this.state.processes.find(p => p.processId === processId) || null;
  },

  getPersonById(personId) {
    return this.state.people.find(p => p.personId === personId) || null;
  },

  getScheduleById(scheduleId) {
    return this.state.schedules.find(s => s.scheduleId === scheduleId) || null;
  },

  /**
   * 氏名からpersonIdを解決（完全一致）
   * @param {string} name - 氏名
   * @returns {{ personId: string, count: number } | null}
   */
  resolvePersonIdByName(name) {
    const matches = this.state.people.filter(p => p['氏名'] === name);
    if (matches.length === 0) return null;
    if (matches.length === 1) return { personId: matches[0].personId, count: 1 };
    return { personId: null, count: matches.length };
  },

  /**
   * 出張予定エリア用の担当者フィルタを設定
   * @param {string} input - 入力文字列（personIdまたは氏名）
   * @returns {{ success: boolean, message?: string }}
   */
  setTripPersonFilter(input) {
    const trimmed = (input || '').trim();

    if (!trimmed) {
      this.setState({ tripPersonFilter: null });
      return { success: true };
    }

    // personId形式（P.01 など）の判定
    if (/^P\.\d+$/i.test(trimmed)) {
      const personId = trimmed.toUpperCase();
      const person = this.getPersonById(personId);
      if (person) {
        this.setState({ tripPersonFilter: personId });
        return { success: true };
      } else {
        return { success: false, message: `担当者ID「${personId}」が見つかりません` };
      }
    }

    // 氏名で検索
    const result = this.resolvePersonIdByName(trimmed);
    if (!result) {
      return { success: false, message: `該当する担当者が見つかりません` };
    }
    if (result.count > 1) {
      return { success: false, message: `候補が${result.count}名あります。P.xxで入力してください` };
    }

    this.setState({ tripPersonFilter: result.personId });
    return { success: true };
  },

  /**
   * 出張予定エリア用の担当者フィルタをクリア
   */
  clearTripPersonFilter() {
    this.setState({ tripPersonFilter: null });
  },

  /**
   * フィルタ済みの出張予定を取得
   * @param {string} viewStart - 表示開始日 (YYYY-MM-DD)
   * @param {string} viewEnd - 表示終了日 (YYYY-MM-DD)
   * @returns {Array} フィルタ済みのトリップ配列
   */
  getFilteredTrips(viewStart, viewEnd) {
    const { trips, tripPersonFilter } = this.state;

    return trips.filter(trip => {
      // 期間フィルタ
      if (trip.end < viewStart || trip.start > viewEnd) {
        return false;
      }
      // 担当者フィルタ
      if (tripPersonFilter && trip.personId !== tripPersonFilter) {
        return false;
      }
      return true;
    });
  },

  getSchedulesByJobId(jobId) {
    return this.state.schedules.filter(s => s.jobId === jobId);
  },

  getProcessColor(processId) {
    const process = this.getProcessById(processId);
    const raw = process?.['工程色(colorHex)'];
    // 有効なHex色のみ使用、それ以外はフォールバック
    return Utils.isValidHexColor(raw) ? raw.toUpperCase() : '#6B7280';
  },

  getBarColor(schedule) {
    return this.getProcessColor(schedule.processId);
  },

  isMilestone(processId) {
    const process = this.getProcessById(processId);
    return process?.['種別(type)'] === 'milestone';
  },

  /**
   * 工程が重要工程（isWeekly）かどうかを判定
   */
  isImportantProcess(processId) {
    const process = this.getProcessById(processId);
    return process?.isWeekly === true;
  },

  /**
   * 工程の表示名を取得（isWeekly=true なら ★ を付ける）
   * ★の二重付与を防止
   */
  getProcessDisplayName(processId) {
    const process = this.getProcessById(processId);
    if (!process) return '';
    const name = process['工程名'] || '';
    // isWeekly=true かつ、まだ★が付いていなければ★を付ける
    if (process.isWeekly && !name.startsWith('★')) {
      return `★${name}`;
    }
    return name;
  },

  hasAttachments(jobId) {
    return this.state.attachments.some(a => a.jobId === jobId);
  },

  // ========== PDF情報管理 ==========

  getJobPdfInfo(jobNo) {
    return this.state.pdfInfoCache[jobNo] || null;
  },

  setJobPdfInfo(jobNo, pdfInfo) {
    const pdfInfoCache = { ...this.state.pdfInfoCache, [jobNo]: pdfInfo };
    this.setState({ pdfInfoCache });
  },

  async loadJobPdfInfo(jobNo) {
    try {
      const pdfInfo = await API.getJobPdfInfo(jobNo);
      this.setJobPdfInfo(jobNo, pdfInfo);
      return pdfInfo;
    } catch (error) {
      console.error('Failed to load PDF info:', jobNo, error);
      return null;
    }
  },

  async loadAllJobPdfInfo() {
    const jobs = this.state.jobs;
    for (const job of jobs) {
      const jobNo = job['工番'];
      if (jobNo && !this.state.pdfInfoCache[jobNo]) {
        this.loadJobPdfInfo(jobNo);
      }
    }
  }
};

// ========================================
// Gantt - ガントチャート描画
// ========================================

const Gantt = {
  config: {
    cellWidth: 32,
    baseRowHeight: 64,      // 1レーンの場合の行高さ（基準）
    laneHeight: 28,         // 追加レーンあたりの高さ
    barHeight: 24,          // バーの高さ
    barTopPadding: 6,       // バー上部のパディング
    jobPaneWidth: 360,
    minLaneCount: 3         // 最小レーン数（工番行の最小段数）
  },

  dates: [],

  // 工番ごとのレーン数を保持
  jobLaneCounts: {},

  // 工番ごとのスケジュール（レーン情報付き）を保持
  _jobSchedulesWithLanes: {},

  // ドラッグ範囲選択の状態
  dragState: {
    isDragging: false,
    startJobId: null,
    startDate: null,
    endDate: null
  },

  init() {
    this.setupEventListeners();
    this.attachGridEventListeners(); // イベント委譲は一度だけ設定
    Store.subscribe((state) => {
      if (state.currentView === 'master') {
        this.render();
      }
    });
  },

  // スケジュールにレーンを割り当てる（重なり対応）
  // 最小レーン数は config.minLaneCount（デフォルト3）で確保
  assignLanes(schedules) {
    const minLanes = this.config.minLaneCount;

    if (schedules.length === 0) {
      return { items: [], laneCount: minLanes };
    }

    // 開始日でソート
    const items = [...schedules].sort((a, b) => a.start.localeCompare(b.start));
    const laneEnds = []; // 各レーンの終了日を保持

    for (const s of items) {
      let placed = false;
      for (let i = 0; i < laneEnds.length; i++) {
        // そのレーンが空いている（前のスケジュールの終了日 < 今のスケジュールの開始日）
        if (laneEnds[i] < s.start) {
          s._lane = i;
          laneEnds[i] = s.end;
          placed = true;
          break;
        }
      }
      if (!placed) {
        // 新しいレーンを作成
        s._lane = laneEnds.length;
        laneEnds.push(s.end);
      }
    }

    // 実際に必要なレーン数と最小レーン数の大きい方を使用
    const requiredLanes = laneEnds.length;
    return {
      items,
      laneCount: Math.max(minLanes, requiredLanes)
    };
  },

  // 工番の行の高さを計算
  // 最小3レーン分の高さを確保し、それ以上の場合は追加分を加算
  getRowHeight(laneCount) {
    const minLanes = this.config.minLaneCount;
    const effectiveLanes = Math.max(minLanes, laneCount);
    // 基準高さ + (レーン数-1) × レーン高さ
    return this.config.baseRowHeight + (effectiveLanes - 1) * this.config.laneHeight;
  },

  setupEventListeners() {
    const hScrollBody = document.getElementById('gantt-h-scroll-body');
    const hScrollHeader = document.getElementById('gantt-h-scroll-header');
    const stickyScrollbar = document.getElementById('gantt-sticky-scrollbar');

    // 大工程表のスクロール同期（ヘッダー ↔ 本体 ↔ スクロールバー）
    // ※出張予定とは同期しない（日付セル幅が異なるため）
    if (hScrollBody && hScrollHeader) {
      hScrollBody.addEventListener('scroll', () => {
        hScrollHeader.scrollLeft = hScrollBody.scrollLeft;
        if (stickyScrollbar) {
          stickyScrollbar.scrollLeft = hScrollBody.scrollLeft;
        }
        this.updateTodayLinePosition();
      });
    }

    // スティッキースクロールバーのスクロールイベント
    if (stickyScrollbar && hScrollBody && hScrollHeader) {
      stickyScrollbar.addEventListener('scroll', () => {
        hScrollBody.scrollLeft = stickyScrollbar.scrollLeft;
        hScrollHeader.scrollLeft = stickyScrollbar.scrollLeft;
        this.updateTodayLinePosition();
      });
    }
  },

  render() {
    const { displayStartDate, displayDays } = Store.state;
    const jobs = Store.getVisibleJobs(); // 非表示工番をフィルタ
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);
    const gridWidth = this.dates.length * this.config.cellWidth;
    document.documentElement.style.setProperty('--grid-width', `${gridWidth}px`);

    // 先にレーン数を計算（renderJobPane/renderGrid両方で使用）
    this.calculateLaneCounts(jobs);

    this.renderDateHeader();
    this.renderJobPane(jobs);
    this.renderGrid(jobs);
    this.updateTodayLinePosition();

    // スティッキースクロールバーの幅を更新
    this.updateStickyScrollbarWidth(gridWidth);

    // 埋め込み出張計画を描画
    this.renderTrips();
  },

  /**
   * スティッキースクロールバーの幅を更新
   * グリッド幅に合わせてスクロール可能範囲を設定
   */
  updateStickyScrollbarWidth(gridWidth) {
    const scrollbarContent = document.getElementById('gantt-scrollbar-content');
    if (scrollbarContent) {
      scrollbarContent.style.width = `${gridWidth}px`;
    }
  },

  // 全工番のレーン数を事前計算（行の高さ同期のため）
  // ※担当者検索時も、工番に紐づく全スケジュールを表示（Schedule側の担当者は参照しない）
  calculateLaneCounts(jobs) {
    this.jobLaneCounts = {};
    this._jobSchedulesWithLanes = {};
    // 工番レベルの役割マップ（担当者検索時に使用）
    this._jobRoleMap = Store.getJobRoleMap();

    jobs.forEach(job => {
      // 工番に紐づく全スケジュールを取得（担当者検索時もフィルタしない）
      const schedules = Store.getSchedulesByJobId(job.jobId);
      const { items, laneCount } = this.assignLanes(schedules);
      this.jobLaneCounts[job.jobId] = laneCount;
      this._jobSchedulesWithLanes[job.jobId] = items;
    });
  },

  renderDateHeader() {
    const container = document.getElementById('gantt-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;
    const gridWidth = this.dates.length * this.config.cellWidth;

    this.dates.forEach((date, index) => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;
      const daySetting = Store.getDaySetting(date);

      let classes = 'gantt-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';
      // 日付設定による上書き（週末クラスより優先）
      if (daySetting === 'WORKDAY') classes += ' is-workday';
      if (daySetting === 'HOLIDAY') classes += ' is-holiday';

      const showMonth = month !== currentMonth;
      currentMonth = month;

      html += `
        <div class="${classes}" data-date="${date}">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month">&nbsp;</div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
    container.style.minWidth = `${gridWidth}px`;
  },

  renderJobPane(jobs) {
    const container = document.getElementById('gantt-job-pane');
    if (!container) return;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="empty-job-pane flex flex-col items-center justify-center h-48 text-center text-gray-400 text-sm m-2 border-2 border-dashed border-gray-300 rounded-lg">
          <div>工番データがありません</div>
          <div class="text-xs mt-2">上の「＋工番追加」から追加してください</div>
        </div>
      `;
      return;
    }

    let html = '';
    jobs.forEach((job) => {
      const shipDate = this.formatShortDate(job['出荷予定日']);
      const drawDate = this.formatShortDate(job['出図予定日']);
      const laneCount = this.jobLaneCounts[job.jobId] || this.config.minLaneCount;
      const rowHeight = this.getRowHeight(laneCount);

      // 担当者名を取得
      const mainPerson = job.mainPersonId ? Store.getPersonById(job.mainPersonId) : null;
      const subPerson = job.subPersonId ? Store.getPersonById(job.subPersonId) : null;
      const mainPersonName = mainPerson?.['氏名'] || '';
      const subPersonName = subPerson?.['氏名'] || '';

      // 担当者表示文字列を作成
      let personDisplay = '';
      if (mainPersonName || subPersonName) {
        const parts = [];
        if (mainPersonName) parts.push(`主）${mainPersonName}`);
        if (subPersonName) parts.push(`副）${subPersonName}`);
        personDisplay = `担当：${parts.join(' ')}`;
      }

      // PDF情報を取得
      const jobNo = job['工番'];
      const pdfInfo = Store.getJobPdfInfo(jobNo);
      const hasOrderPdf = pdfInfo?.order?.fileId ? true : false;
      const hasInstructionPdf = pdfInfo?.instruction?.fileId ? true : false;

      // 担当者検索時の役割クラス（工番レベル）
      let jobRoleClass = '';
      let jobRoleBadge = '';
      if (this._jobRoleMap && this._jobRoleMap.has(job.jobId)) {
        const role = this._jobRoleMap.get(job.jobId);
        jobRoleClass = role === 'main' ? ' job-role-main' : ' job-role-sub';
        jobRoleBadge = role === 'main'
          ? '<span class="job-role-badge job-role-badge-main">主担当</span>'
          : '<span class="job-role-badge job-role-badge-sub">副担当</span>';
      }

      // 変更後日付を取得
      const changedShipDate = this.formatShortDate(job['出荷予定日変更後']);
      const changedDrawDate = this.formatShortDate(job['出図予定日変更後']);

      html += `
        <div class="job-info-block${jobRoleClass}" data-job-id="${job.jobId}" style="height: ${rowHeight}px; min-height: ${rowHeight}px;" onclick="Gantt.onJobClick('${job.jobId}')">
          <div class="job-info-content">
            <div class="job-info-row1">
              ${jobRoleBadge}
              <div class="job-info-jobno">
                <span class="label">[工番]</span>

                title="工番を編集">

              </div>

                  value="${job['出図予定日変更後'] || ''}"
                  onclick="event.stopPropagation();"
                  onchange="Gantt.updateJobChangedDate('${job.jobId}', 'draw', this.value)"
                  title="出図予定日の変更">
              </div>
              <div class="job-date-input-group">
                <span class="label">出荷変更:</span>
                <input type="date"
                  class="job-changed-ship-date text-xs"
                  value="${job['出荷予定日変更後'] || ''}"
                  onclick="event.stopPropagation();"
                  onchange="Gantt.updateJobChangedDate('${job.jobId}', 'ship', this.value)"
                  title="出荷予定日の変更">
              </div>
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return `${parseInt(match[2])}/${parseInt(match[3])}`;
    }
    const match2 = dateStr.match(/(\d{1,2})\/(\d{1,2})/);
    if (match2) {
      return `${match2[1]}/${match2[2]}`;
    }
    return dateStr;
  },

  renderGrid(jobs) {
    const container = document.getElementById('gantt-grid');
    if (!container) return;

    const today = Utils.getToday();
    const gridWidth = this.dates.length * this.config.cellWidth;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="flex items-center justify-center h-48 text-gray-400 text-sm" style="min-width: ${gridWidth}px;">
          <div class="text-center">
            <div class="mb-2">← 左のボタンから工番を追加してください</div>
            <div class="text-xs">工番を追加すると、ここに日付グリッドが表示されます</div>
          </div>
        </div>
      `;
      container.style.minWidth = `${gridWidth}px`;
      return;
    }

    // レーン数は calculateLaneCounts() で事前計算済み（this.jobLaneCounts, this._jobSchedulesWithLanes）

    let html = '';
    jobs.forEach(job => {
      const laneCount = this.jobLaneCounts[job.jobId] || this.config.minLaneCount;
      const rowHeight = this.getRowHeight(laneCount);

      html += `<div class="gantt-grid-row" data-job-id="${job.jobId}" style="height: ${rowHeight}px; min-height: ${rowHeight}px;">`;
      this.dates.forEach(date => {
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;
        const daySetting = Store.getDaySetting(date);
        let bgClass = 'bg-white';
        if (isWeekend) bgClass = 'bg-yellow-50';
        if (isToday) bgClass = 'bg-blue-50';
        // 日付設定による上書き
        if (daySetting === 'WORKDAY') bgClass = 'bg-white is-workday';
        if (daySetting === 'HOLIDAY') bgClass = 'bg-pink-50 is-holiday';

        html += `
          <button
            type="button"
            class="gantt-grid-cell ${bgClass}"
            data-job-id="${job.jobId}"
            data-date="${date}"
            title="${job['工番']} - ${date}"
          ></button>
        `;
      });
      // バーは必ず row の内部に配置（row外に出すと全工番に重複表示される）
      html += this.renderBarsForJob(job.jobId, this._jobSchedulesWithLanes[job.jobId] || []);
      html += '</div>';
    });

    container.innerHTML = html;
    container.style.minWidth = `${gridWidth}px`;
    // イベント委譲はinit()で一度だけ設定するため、ここでは呼ばない
  },

  renderBarsForJob(jobId, schedulesWithLanes) {
    if (schedulesWithLanes.length === 0) return '';

    const { displayStartDate } = Store.state;
    let html = '';

    schedulesWithLanes.forEach(schedule => {
      const isMilestone = Store.isMilestone(schedule.processId);
      if (isMilestone) {
        html += this.renderMilestone(schedule, displayStartDate);
      } else {
        html += this.renderBar(schedule, displayStartDate);
      }
    });

    return html;
  },

  renderBar(schedule, displayStartDate) {
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);
    const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - startOffset) * this.config.cellWidth - 4;
    const color = Store.getBarColor(schedule);
    const processName = Store.getProcessDisplayName(schedule.processId);
    const label = schedule.label || '';

    // レーンに応じたtop位置を計算
    const lane = schedule._lane || 0;
    const top = this.config.barTopPadding + (lane * this.config.laneHeight);

    return `
      <div class="gantt-bar"
           data-schedule-id="${schedule.scheduleId}"
           style="left: ${left}px; width: ${width}px; top: ${top}px; background-color: ${color};"
           title="${processName}${label ? ' - ' + label : ''}">
        <span class="bar-text">${Utils.escapeHtml(processName)}</span>
        ${label ? `<span class="gantt-bar-label">${Utils.escapeHtml(label)}</span>` : ''}
      </div>
    `;
  },

  renderMilestone(schedule, displayStartDate) {
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);

    if (startOffset < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 12;
    // マイルストーンは★を自前で付けるため、生の工程名を使用し、既存の★を除去（二重★防止）
    const process = Store.getProcessById(schedule.processId);
    const rawName = process?.['工程名'] || '';
    const processName = rawName.replace(/^★+/, ''); // 先頭の★を除去

    // レーンに応じたtop位置を計算
    const lane = schedule._lane || 0;
    const top = this.config.barTopPadding + (lane * this.config.laneHeight);

    return `
      <div class="gantt-milestone"
           data-schedule-id="${schedule.scheduleId}"
           style="left: ${left}px; top: ${top}px;"
           title="${processName}">
        ★${Utils.escapeHtml(processName)}
      </div>
    `;
  },

  attachGridEventListeners() {
    const grid = document.getElementById('gantt-grid');
    if (!grid) return;

    // イベント委譲：#gantt-gridに1回だけリスナーを設定

    // バー・マイルストーンのクリック
    grid.addEventListener('click', (e) => {
      const bar = e.target.closest('.gantt-bar, .gantt-milestone');
      if (bar) {
        e.stopPropagation();
        const scheduleId = bar.dataset.scheduleId;
        this.onBarClick(scheduleId);
        return;
      }
    });

    // ドラッグ範囲選択：mousedown
    grid.addEventListener('mousedown', (e) => {
      // 左クリック以外は無視
      if (e.button !== 0) return;
      // バー上でのドラッグは無視
      if (e.target.closest('.gantt-bar, .gantt-milestone')) return;

      const cell = e.target.closest('.gantt-grid-cell');
      if (!cell) return;

      e.preventDefault();
      this.dragState.isDragging = true;
      this.dragState.startJobId = cell.dataset.jobId;
      this.dragState.startDate = cell.dataset.date;
      this.dragState.endDate = cell.dataset.date;

      this.highlightRange();
    });

    // ドラッグ範囲選択：mousemove
    grid.addEventListener('mousemove', (e) => {
      if (!this.dragState.isDragging) return;

      const cell = e.target.closest('.gantt-grid-cell');
      if (!cell) return;

      // 同じjobId（同じ行）のみ範囲選択可能
      if (cell.dataset.jobId !== this.dragState.startJobId) return;

      this.dragState.endDate = cell.dataset.date;
      this.highlightRange();
    });

    // ドラッグ範囲選択：mouseup
    grid.addEventListener('mouseup', (e) => {
      if (!this.dragState.isDragging) return;

      const { startJobId, startDate, endDate } = this.dragState;

      // 範囲確定
      const rangeStart = startDate <= endDate ? startDate : endDate;
      const rangeEnd = startDate <= endDate ? endDate : startDate;

      // リセット
      this.clearHighlight();
      this.dragState.isDragging = false;
      this.dragState.startJobId = null;
      this.dragState.startDate = null;
      this.dragState.endDate = null;

      // モーダルを開く
      Modal.openNew(startJobId, rangeStart, rangeEnd);
    });

    // ドラッグキャンセル：マウスがグリッド外に出た場合
    grid.addEventListener('mouseleave', (e) => {
      if (this.dragState.isDragging) {
        this.clearHighlight();
        this.dragState.isDragging = false;
        this.dragState.startJobId = null;
        this.dragState.startDate = null;
        this.dragState.endDate = null;
      }
    });
  },

  // 選択範囲をハイライト
  highlightRange() {
    this.clearHighlight();

    const { startJobId, startDate, endDate } = this.dragState;
    if (!startJobId || !startDate || !endDate) return;

    const rangeStart = startDate <= endDate ? startDate : endDate;
    const rangeEnd = startDate <= endDate ? endDate : startDate;

    const cells = document.querySelectorAll(`#gantt-grid .gantt-grid-cell[data-job-id="${startJobId}"]`);
    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= rangeStart && date <= rangeEnd) {
        cell.classList.add('selected-range');
      }
    });
  },

  // ハイライトをクリア
  clearHighlight() {
    document.querySelectorAll('#gantt-grid .selected-range').forEach(cell => {
      cell.classList.remove('selected-range');
    });
  },

  updateTodayLinePosition() {
    const todayLine = document.getElementById('today-line');
    const hScrollBody = document.getElementById('gantt-h-scroll-body');
    if (!todayLine || !hScrollBody) return;

    const today = Utils.getToday();
    const { displayStartDate } = Store.state;
    const offset = Utils.getDaysBetween(displayStartDate, today);

    if (offset < 0 || offset >= this.dates.length) {
      todayLine.style.display = 'none';
      return;
    }

    const left = this.config.jobPaneWidth + (offset * this.config.cellWidth) + (this.config.cellWidth / 2) - hScrollBody.scrollLeft;
    todayLine.style.display = 'block';
    todayLine.style.left = `${left}px`;
  },

  onJobClick(jobId) {
    console.log('Job clicked:', jobId);
    JobDetail.open(jobId);
  },

  onAttachClick(jobId) {
    console.log('Attachment clicked:', jobId);
    Utils.showToast('添付一覧（Phase 5で実装）', 'info');
  },

  onBarClick(scheduleId) {
    console.log('Bar clicked:', scheduleId);
    const schedule = Store.state.schedules.find(s => s.scheduleId === scheduleId);
    if (schedule) {
      Modal.openEdit(schedule);
    }
  },

  onCellClick(jobId, date) {
    console.log('Cell clicked:', jobId, date);
    const job = Store.state.jobs.find(j => j.jobId === jobId);
    if (job) {
      console.log('Opening modal for:', job['工番'], date);
    }
    Modal.openNew(jobId, date, date);
  },

  /**
   * 工番PDFを開く
   * @param {string} jobNo - 工番
   * @param {string} pdfType - 'order' | 'instruction'
   */
  openJobPdf(jobNo, pdfType) {
    const pdfInfo = Store.getJobPdfInfo(jobNo);
    const pdfData = pdfInfo?.[pdfType];

    if (pdfData?.url) {
      window.open(pdfData.url, '_blank');
    } else if (pdfData?.fileId) {
      // URLがない場合はGoogle DriveのビューURLを構築
      const driveUrl = `https://drive.google.com/file/d/${pdfData.fileId}/view`;
      window.open(driveUrl, '_blank');
    } else {
      const typeName = pdfType === 'order' ? '受注表' : '工番別指示書';
      Utils.showToast(`${typeName}PDFが登録されていません`, 'info');
    }
  },

  /**
   * 工番の変更後日付を更新
   * @param {string} jobId - 対象のjobId
   * @param {string} dateType - 'draw' | 'ship'
   * @param {string} newDate - 新しい日付（YYYY-MM-DD形式）
   */
  async updateJobChangedDate(jobId, dateType, newDate) {
    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    const fieldName = dateType === 'draw' ? '出図予定日変更後' : '出荷予定日変更後';

    try {
      await Store.updateJob(jobId, { [fieldName]: newDate }, job.updatedAt);
      Utils.showToast('日付を更新しました', 'success');
      this.render();
    } catch (error) {
      console.error('Failed to update changed date:', error);
      Utils.showToast('日付の更新に失敗しました', 'error');
    }
  },

  /**
   * 出張計画セクションの折りたたみ切替
   */
  toggleTripSection() {
    const section = document.getElementById('gantt-trip-section');
    if (section) {
      const wasCollapsed = section.classList.contains('collapsed');
      section.classList.toggle('collapsed');
      // 展開時は少し待ってから再描画（CSSトランジション完了後）
      if (wasCollapsed) {
        setTimeout(() => this.renderTrips(), 350);
      }
    }
  },

  /**
   * 出張予定エリアの担当者検索ハンドラー
   */
  handleTripPersonSearch() {
    const input = document.getElementById('gantt-trip-person-input');
    const errorEl = document.getElementById('gantt-trip-filter-error');

    if (!input) return;

    const result = Store.setTripPersonFilter(input.value);

    if (errorEl) {
      if (result.success) {
        errorEl.textContent = '';
        errorEl.classList.remove('visible');
      } else {
        errorEl.textContent = result.message || 'エラー';
        errorEl.classList.add('visible');
      }
    }

    // フィルタ成功時は再描画（setStateでsubscribers経由で呼ばれるが念のため）
    if (result.success) {
      this.renderTrips();
    }
  },

  /**
   * 出張予定エリアの担当者フィルタをクリア
   */
  clearTripPersonFilter() {
    const input = document.getElementById('gantt-trip-person-input');
    const errorEl = document.getElementById('gantt-trip-filter-error');

    if (input) {
      input.value = '';
    }
    if (errorEl) {
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    Store.clearTripPersonFilter();
    this.renderTrips();
  },

  /**
   * 埋め込み出張計画を描画
   * ※出張予定は独自のスクロールを持ち、大工程表とは同期しない（日付セル幅が異なるため）
   */
  renderTrips() {
    const { displayStartDate, displayDays, tripPersonFilter } = Store.state;

    // 表示期間の終了日を計算
    const dates = Utils.generateDateRange(displayStartDate, displayDays);
    const viewStart = dates[0];
    const viewEnd = dates[dates.length - 1];

    // フィルタ済みのトリップを取得
    const filteredTrips = Store.getFilteredTrips(viewStart, viewEnd);

    // トリップ数をカウント（フィルタ後の件数）
    const countEl = document.getElementById('gantt-trip-count');
    if (countEl) {
      countEl.textContent = `${filteredTrips.length}件`;
    }

    // 埋め込み出張計画を描画
    // ※TravelPlan.renderEmbedded内でヘッダー↔本体の同期は設定される
    TravelPlan.renderEmbedded({
      containerId: 'gantt-trip-container',
      personId: tripPersonFilter, // フィルタがあれば適用
      dateFrom: displayStartDate,
      days: displayDays
    });
  }
};

const DaySettingButtons = {
  currentDateISO: null,
  hasChanged: false, // 日付設定が変更されたかどうか

  init() {
    // イベントリスナー登録
    document.getElementById('btn-day-workday')?.addEventListener('click', () => this.toggle('WORKDAY'));
    document.getElementById('btn-day-holiday')?.addEventListener('click', () => this.toggle('HOLIDAY'));

    // 日付変更時にボタン状態を更新
    document.getElementById('entry-start')?.addEventListener('change', (e) => {
      this.updateButtons(e.target.value);
    });
  },

  /**
   * モーダルオープン時にリセット
   */
  reset() {
    this.hasChanged = false;
  },

  /**
   * ボタンの状態を更新
   * @param {string} dateISO - YYYY-MM-DD形式の日付
   */
  updateButtons(dateISO) {
    this.currentDateISO = dateISO;

    const daySetting = Store.getDaySetting(dateISO);
    const btnWorkday = document.getElementById('btn-day-workday');
    const btnHoliday = document.getElementById('btn-day-holiday');

    if (!btnWorkday || !btnHoliday) return;

    // アクティブ状態をリセット
    btnWorkday.classList.remove('active');
    btnHoliday.classList.remove('active');

    // 現在の設定に応じてアクティブ状態を設定
    if (daySetting === 'WORKDAY') {
      btnWorkday.classList.add('active');
    } else if (daySetting === 'HOLIDAY') {
      btnHoliday.classList.add('active');
    }
  },

  /**
   * 日付設定をトグル（楽観的UI更新）
   * @param {string} type - 'WORKDAY' or 'HOLIDAY'
   */
  async toggle(type) {
    const dateISO = this.currentDateISO;
    if (!dateISO) return;

    const currentSetting = Store.getDaySetting(dateISO);

    // 同じボタンを押したら解除、違うボタンなら切り替え
    let newSetting = null;
    if (currentSetting === type) {
      newSetting = null; // 解除
    } else {
      newSetting = type;
    }

    // 変更フラグを立てる
    this.hasChanged = true;

    // 楽観的UI更新
    Store.setDaySettingInStore(dateISO, newSetting);
    this.updateButtons(dateISO);
    Gantt.render(); // 大工程表を再描画

    // バックグラウンドでサーバーに保存
    try {
      const result = await API.call('api_setDaySetting', dateISO, newSetting, '');

      if (result && result.ok) {
        const message = newSetting === 'WORKDAY' ? '出勤日に設定しました' :
                       newSetting === 'HOLIDAY' ? '休日に設定しました' :
                       '設定を解除しました';
        Utils.showToast(message, 'success', 2000);
      } else {
        // 失敗したら元に戻す
        Store.setDaySettingInStore(dateISO, currentSetting);
        this.updateButtons(dateISO);
        Gantt.render();
        Utils.showToast('設定の保存に失敗しました: ' + (result?.error || '不明なエラー'), 'error', 4000);
      }
    } catch (error) {
      // エラー時は元に戻す
      Store.setDaySettingInStore(dateISO, currentSetting);
      this.updateButtons(dateISO);
      Gantt.render();
      Utils.showToast('設定エラー: ' + error.message, 'error', 4000);
    }
  }
};
