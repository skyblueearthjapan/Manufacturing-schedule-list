const JobModal = {
  currentJob: null,
  isEditMode: false,
  searchDebounceTimer: null,

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {
    document.getElementById('job-modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-job-modal-cancel')?.addEventListener('click', () => this.close());
    document.querySelector('#modal-job .modal-backdrop')?.addEventListener('click', () => this.close());
    document.getElementById('btn-job-modal-save')?.addEventListener('click', () => this.save());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('modal-job').classList.contains('hidden')) {
        this.close();
      }
    });

    // 工番マスター検索
    const searchInput = document.getElementById('job-master-search');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => this.onSearchInput(e.target.value));
      searchInput.addEventListener('focus', () => this.showSearchResults());
      // クリック外で閉じる
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#job-master-search-area')) {
          this.hideSearchResults();
        }
      });
    }
  },

  // 担当者セレクトを生成
  populatePersonSelects(mainPersonId = '', subPersonId = '') {
    const people = Store.state.people;
    const mainSelect = document.getElementById('job-main-person');
    const subSelect = document.getElementById('job-sub-person');

    if (!mainSelect || !subSelect) return;

    let optionsHtml = '<option value="">（未設定）</option>';
    people.forEach(person => {
      const color = person['作業者色(colorHex)'] || '#6b7280';
      optionsHtml += `<option value="${person.personId}" style="border-left: 4px solid ${color};">
        ${Utils.escapeHtml(person['氏名'])} (${Utils.escapeHtml(person['部署/区分'] || '')})
      </option>`;
    });

    mainSelect.innerHTML = optionsHtml;
    subSelect.innerHTML = optionsHtml;

    if (mainPersonId) mainSelect.value = mainPersonId;
    if (subPersonId) subSelect.value = subPersonId;
  },

  // 工番マスター検索入力
  onSearchInput(query) {
    clearTimeout(this.searchDebounceTimer);
    this.searchDebounceTimer = setTimeout(() => {
      this.searchJobMaster(query);
    }, 300);
  },

  // 工番マスター検索実行
  searchJobMaster(query) {
    const results = document.getElementById('job-master-results');
    if (!results) return;

    const jobMaster = Store.state.jobMaster;
    if (!jobMaster || jobMaster.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm text-gray-500">工番マスターが未同期です</div>';
      results.classList.remove('hidden');
      return;
    }

    let filtered = jobMaster;
    if (query && query.trim()) {
      const lowerQuery = query.toLowerCase();
      filtered = jobMaster.filter(item => {
        const jobNo = String(item['工番'] || '').toLowerCase();
        const customer = String(item['客先名'] || '').toLowerCase();
        const product = String(item['製品名'] || '').toLowerCase();
        return jobNo.includes(lowerQuery) ||
               customer.includes(lowerQuery) ||
               product.includes(lowerQuery);
      });
    }

    // 上位20件に制限
    filtered = filtered.slice(0, 20);

    if (filtered.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm text-gray-500">該当する工番が見つかりません</div>';
    } else {
      let html = '';
      filtered.forEach(item => {
        html += `
          <div class="job-master-result-item" onclick="JobModal.selectJobMasterItem('${Utils.escapeHtml(item['工番'] || '')}', '${Utils.escapeHtml(item['客先名'] || '')}', '${Utils.escapeHtml(item['製品名'] || '')}')">
            <div class="job-master-result-jobno">${Utils.escapeHtml(item['工番'] || '-')}</div>
            <div class="job-master-result-customer">${Utils.escapeHtml(item['客先名'] || '-')}</div>
            <div class="job-master-result-product">${Utils.escapeHtml(item['製品名'] || '-')}</div>
          </div>
        `;
      });
      results.innerHTML = html;
    }

    results.classList.remove('hidden');
  },

  // 工番マスター選択
  selectJobMasterItem(jobNo, customer, product) {
    document.getElementById('job-jobno').value = jobNo;
    document.getElementById('job-customer').value = customer;
    document.getElementById('job-product').value = product;
    this.hideSearchResults();
    document.getElementById('job-master-search').value = '';
    Utils.showToast('工番マスターから入力しました', 'info');
  },

  showSearchResults() {
    const query = document.getElementById('job-master-search')?.value || '';
    this.searchJobMaster(query);
  },

  hideSearchResults() {
    const results = document.getElementById('job-master-results');
    if (results) results.classList.add('hidden');
  },

  openNew() {
    this.isEditMode = false;
    this.currentJob = null;
    this.resetForm();
    this.populatePersonSelects();
    document.getElementById('job-modal-title').textContent = '工番登録';
    // 新規時はマスター検索エリアを表示
    const searchArea = document.getElementById('job-master-search-area');
    if (searchArea) searchArea.classList.remove('hidden');
    this.open();
  },

  openEdit(job) {
    this.isEditMode = true;
    this.currentJob = job;
    this.resetForm();
    this.populatePersonSelects(job.mainPersonId || '', job.subPersonId || '');

    document.getElementById('job-jobno').value = job['工番'] || '';
    document.getElementById('job-customer').value = job['顧客名'] || '';
    document.getElementById('job-product').value = job['設備/製品名'] || '';
    document.getElementById('job-qty').value = job['台数'] || '';
    document.getElementById('job-destination').value = job['納入先'] || '';
    document.getElementById('job-ship-date').value = job['出荷予定日'] || '';
    document.getElementById('job-draw-date').value = job['出図予定日'] || '';
    document.getElementById('job-status-text').value = job['重要メモ'] || '';
    document.getElementById('job-job-id').value = job.jobId || '';
    document.getElementById('job-updated-at').value = job.updatedAt || '';

    document.getElementById('job-modal-title').textContent = '工番編集';
    // 編集時はマスター検索エリアを非表示
    const searchArea = document.getElementById('job-master-search-area');
    if (searchArea) searchArea.classList.add('hidden');
    this.open();
  },

  open() {
    document.getElementById('modal-job').classList.remove('hidden');
    setTimeout(() => {
      if (!this.isEditMode) {
        document.getElementById('job-master-search')?.focus();
      } else {
        document.getElementById('job-jobno')?.focus();
      }
    }, 100);
  },

  close() {
    document.getElementById('modal-job').classList.add('hidden');
    this.currentJob = null;
    this.isEditMode = false;
    this.hideSearchResults();
  },

  resetForm() {
    document.getElementById('job-form').reset();
    document.getElementById('job-job-id').value = '';
    document.getElementById('job-updated-at').value = '';
    const searchInput = document.getElementById('job-master-search');
    if (searchInput) searchInput.value = '';
    this.hideSearchResults();
  },

  validate() {
    const jobno = document.getElementById('job-jobno').value.trim();
    const customer = document.getElementById('job-customer').value.trim();
    const product = document.getElementById('job-product').value.trim();
    const qty = document.getElementById('job-qty').value.trim();
    const destination = document.getElementById('job-destination').value.trim();
    const shipDate = document.getElementById('job-ship-date').value;
    const drawDate = document.getElementById('job-draw-date').value;
    const statusText = document.getElementById('job-status-text').value.trim();
    const mainPersonId = document.getElementById('job-main-person')?.value || '';
    const subPersonId = document.getElementById('job-sub-person')?.value || '';

    if (!jobno) {
      Utils.showToast('工番を入力してください', 'error');
      document.getElementById('job-jobno').focus();
      return null;
    }

    if (!customer) {
      Utils.showToast('顧客名を入力してください', 'error');
      document.getElementById('job-customer').focus();
      return null;
    }

    if (!product) {
      Utils.showToast('設備/製品名を入力してください', 'error');
      document.getElementById('job-product').focus();
      return null;
    }

    if (!qty) {
      Utils.showToast('台数を入力してください', 'error');
      document.getElementById('job-qty').focus();
      return null;
    }

    return {
      '工番': jobno,
      '顧客名': customer,
      '設備/製品名': product,
      '台数': qty,
      '納入先': destination,
      '出荷予定日': shipDate,
      '出図予定日': drawDate,
      '重要メモ': statusText,
      'mainPersonId': mainPersonId,
      'subPersonId': subPersonId,
      '状態': '未着手'
    };
  },

  save() {
    const payload = this.validate();
    if (!payload) return;

    if (this.isEditMode) {
      const jobId = document.getElementById('job-job-id').value;
      // 編集時は状態を保持
      payload['状態'] = this.currentJob?.['状態'] || '未着手';
      // 楽観的更新
      Store.updateJobInStore(jobId, { ...payload, updatedAt: new Date().toISOString() });
      ChangeBuffer.add('job', 'upsert', jobId, payload, 'master');
      Utils.showToast('工番を更新しました（保存待ち）', 'info');
    } else {
      // 新規作成：仮IDで楽観的更新
      const tempId = 'temp_' + Utils.generateId();
      const newJob = {
        jobId: tempId,
        ...payload,
        updatedAt: new Date().toISOString()
      };
      Store.addJob(newJob);
      ChangeBuffer.add('job', 'upsert', tempId, payload, 'master');
      Utils.showToast('工番を登録しました（保存待ち）', 'info');
    }

    this.close();
  }
};

    document.getElementById('people-edit-view').classList.remove('hidden');

    if (!person) {
      Utils.showToast('担当者が見つかりません', 'error');
      return;
    }
    this.currentPerson = person;
    this.isEditMode = true;
    document.getElementById('people-edit-title').textContent = '担当者を編集';

    document.getElementById('people-edit-view').classList.remove('hidden');

  backToList() {

    document.getElementById('people-edit-view').classList.add('hidden');
    this.renderList();
  },

  clearForm() {
    document.getElementById('person-name').value = '';
    document.getElementById('person-department').value = '';
    document.getElementById('person-color').value = '#2563EB';
    document.getElementById('person-color-text').value = '#2563EB';
    document.getElementById('person-active').checked = true;
    document.getElementById('person-note').value = '';
    document.getElementById('person-id-display').textContent = '（新規）';

  populateForm(person) {
    document.getElementById('person-name').value = person['氏名'] || '';
    document.getElementById('person-department').value = person['部署/区分'] || '';
    const color = Utils.normalizeColor(person['作業者色(colorHex)']) || '#6B7280';
    document.getElementById('person-color').value = color;
    document.getElementById('person-color-text').value = color;
    const isActive = person['有効(isActive)'] === true || person['有効(isActive)'] === 'TRUE';
    document.getElementById('person-active').checked = isActive;
    document.getElementById('person-note').value = person['備考'] || '';
    document.getElementById('person-id-display').textContent = person.personId;
  },

  syncColorInputs(source) {
    if (source === 'picker') {
      const value = document.getElementById('person-color').value;
      document.getElementById('person-color-text').value = value.toUpperCase();
    } else {
      const value = document.getElementById('person-color-text').value;
      const normalized = Utils.normalizeColor(value);
      if (normalized) {
        document.getElementById('person-color').value = normalized;
        document.getElementById('person-color-text').value = normalized;
      }
    }
  },

  async save() {
    const name = document.getElementById('person-name').value.trim();
    if (!name) {
      Utils.showToast('氏名を入力してください', 'error');
      return;
    }

    const colorText = document.getElementById('person-color-text').value;
    const color = Utils.normalizeColor(colorText);
    if (!color) {
      Utils.showToast('有効な色を入力してください（例: #2563EB）', 'error');
      return;
    }

    const payload = {
      '氏名': name,
      '部署/区分': document.getElementById('person-department').value.trim(),
      '作業者色(colorHex)': color,
      '有効(isActive)': document.getElementById('person-active').checked,
      '備考': document.getElementById('person-note').value.trim()
    };

    try {
      Utils.setLoading(true);
      let result;
      if (this.isEditMode && this.currentPerson) {
        result = await API.updatePerson(
          this.currentPerson.personId,
          payload,
          this.currentPerson.updatedAt
        );
        // Store を更新
        Store.updatePersonInStore(result.personId, result);
        Utils.showToast('担当者を更新しました', 'success');
      } else {
        result = await API.createPerson(payload);
        Store.addPerson(result);
        Utils.showToast('担当者を追加しました', 'success');
      }
      this.backToList();
    } catch (error) {
      console.error('Save person error:', error);
      Utils.showToast(error.message || '保存に失敗しました', 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  setupEventListeners() {
    // 色ピッカー同期
    document.getElementById('person-color')?.addEventListener('input', () => {
      this.syncColorInputs('picker');
    });
    document.getElementById('person-color-text')?.addEventListener('change', () => {
      this.syncColorInputs('text');
    });
  }
};

const JobDetail = {
  currentJobId: null,
  currentJob: null,
  config: {
    displayDays: 90,
    displayStartDate: null,
    viewMode: 'daily',
    cellWidth: 24,         // 日次セル幅
    weeklyCellWidth: 40,   // 週次セル幅（1週間 = 1セル）
    rowHeight: 32,
    hideUnusedProcesses: true,  // デフォルトで未使用工程を隠す
    showPrintBoundaries: false, // 印刷境界線表示
    paperSize: 'a4'            // 用紙サイズ: 'a4' or 'a3'
  },

  // 用紙サイズ定義（横向き、マージン考慮）
  // A4横: 297mm x 210mm → 実効幅約250mm, 高さ約180mm
  // A3横: 420mm x 297mm → 実効幅約370mm, 高さ約260mm
  paperSizes: {
    a4: { width: 945, height: 680, label: 'A4横' },   // 96dpi換算、マージン考慮
    a3: { width: 1400, height: 980, label: 'A3横' }
  },

  // ドラッグ範囲選択の状態
  dragState: {
    isDragging: false,
    startProcessId: null,
    startDate: null,
    endDate: null
  },

  init() {
    this.setupEventListeners();
    this.attachGridEventListeners(); // イベント委譲は一度だけ設定
    this.setupScrollSync(); // 横スクロール同期
  },

  // 横スクロール同期：ボディのスクロールにヘッダを追従させる
  setupScrollSync() {
    const bodyScroll = document.getElementById('job-detail-body-scroll');
    const headerScroll = document.getElementById('job-detail-header-scroll');
    if (!bodyScroll || !headerScroll) return;

    bodyScroll.addEventListener('scroll', () => {
      headerScroll.scrollLeft = bodyScroll.scrollLeft;
    });
  },

  setupEventListeners() {
    document.getElementById('job-detail-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-print-job')?.addEventListener('click', () => this.print());
    document.getElementById('btn-export-sheet')?.addEventListener('click', () => this.exportToSpreadsheet());
    document.getElementById('job-detail-mode-daily')?.addEventListener('click', () => this.setViewMode('daily'));
    document.getElementById('job-detail-mode-weekly')?.addEventListener('click', () => this.setViewMode('weekly'));
    document.getElementById('job-detail-start')?.addEventListener('change', () => this.onDisplayRangeChange());
    document.getElementById('job-detail-days')?.addEventListener('change', () => this.onDisplayRangeChange());

      const paperSelect = document.getElementById('job-detail-paper-size');
      if (paperSelect) paperSelect.disabled = !e.target.checked;
      this.updatePrintBoundaries();
    });
    // 用紙サイズ選択
    document.getElementById('job-detail-paper-size')?.addEventListener('change', (e) => {
      this.config.paperSize = e.target.value;
      this.updatePrintBoundaries();
    });
  },

  open(jobId) {
    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.currentJobId = jobId;
    this.currentJob = job;

    const schedules = Store.getSchedulesByJobId(jobId);
    if (schedules.length > 0) {
      const earliestStart = schedules.reduce((min, s) => s.start < min ? s.start : min, schedules[0].start);
      this.config.displayStartDate = Utils.addDays(earliestStart, -7);
    } else {
      this.config.displayStartDate = Utils.getToday();
    }

    document.getElementById('job-detail-start').value = this.config.displayStartDate;
    document.getElementById('job-detail-days').value = this.config.displayDays;
    // 未使用工程を隠すトグルの状態を同期

    if (hideUnusedCheckbox) {
      hideUnusedCheckbox.checked = this.config.hideUnusedProcesses;

    this.render();

  close() {
    document.getElementById('view-job-detail').classList.add('hidden');
    this.currentJobId = null;
    this.currentJob = null;
  },

  renderHeader() {
    const job = this.currentJob;
    if (!job) return;

    document.getElementById('job-detail-customer').textContent = job['顧客名'] || '-';
    document.getElementById('job-detail-product').textContent = job['設備/製品名'] || '-';
    document.getElementById('job-detail-jobno').textContent = job['工番'] || '-';
    document.getElementById('job-detail-ship-date').textContent = job['出荷予定日'] || '-';
    document.getElementById('job-detail-draw-date').textContent = job['出図予定日'] || '-';
    document.getElementById('job-detail-created').textContent = Utils.formatDate(new Date());
  },

  render() {
    const dates = Utils.generateDateRange(this.config.displayStartDate, this.config.displayDays);
    const schedules = Store.getSchedulesByJobId(this.currentJobId);
    let processes = Store.state.processes;

    // 未使用工程を隠す（デフォルトON）
    if (this.config.hideUnusedProcesses) {
      const usedProcessIds = new Set(schedules.map(s => s.processId));
      processes = processes.filter(p => usedProcessIds.has(p.processId));
    }

    // 週次モードでは週単位でグループ化
    const weeks = this.config.viewMode === 'weekly' ? this.groupByWeekMondayStart(dates) : null;

    this.renderDateHeader(dates, weeks);
    this.renderProcessRows(processes, schedules, dates, weeks);

    // 印刷境界線を更新
    requestAnimationFrame(() => this.updatePrintBoundaries());
  },

  renderDateHeader(dates, weeks) {
    const container = document.getElementById('job-detail-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let totalWidth = 0;

    if (this.config.viewMode === 'weekly' && weeks) {
      // 週次モード: 1セル = 1週間（圧縮表示）
      let currentMonth = 0;
      weeks.forEach(week => {
        const isCurrentWeek = week.dates.includes(today);
        const month = Utils.getMonth(week.start);
        const showMonth = month !== currentMonth;
        currentMonth = month;

        html += `
          <div class="job-date-cell weekly ${isCurrentWeek ? 'current' : ''}" style="width: ${this.config.weeklyCellWidth}px">
            ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
            <div class="week">${Utils.getDay(week.start)}〜</div>
          </div>
        `;
        totalWidth += this.config.weeklyCellWidth;
      });
    } else {
      // 日次モード
      let currentMonth = 0;
      dates.forEach(date => {
        const month = Utils.getMonth(date);
        const day = Utils.getDay(date);
        const dow = Utils.getDayOfWeek(date);
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;

        const showMonth = month !== currentMonth;
        currentMonth = month;

        let classes = 'job-date-cell';
        if (isWeekend) classes += ' weekend';
        if (isToday) classes += ' today';

        html += `
          <div class="${classes}" style="width: ${this.config.cellWidth}px">
            ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
            <div class="day">${day}</div>
            <div class="dow">${dow}</div>
          </div>
        `;
        totalWidth += this.config.cellWidth;
      });
    }

    container.innerHTML = html;
    container.style.width = `${totalWidth}px`;
  },

  renderProcessRows(processes, schedules, dates, weeks) {
    const container = document.getElementById('job-detail-body');
    if (!container) return;

    const today = Utils.getToday();
    const isWeeklyMode = this.config.viewMode === 'weekly' && weeks;
    const cellWidth = isWeeklyMode ? this.config.weeklyCellWidth : this.config.cellWidth;
    const cellCount = isWeeklyMode ? weeks.length : dates.length;
    const gridWidth = cellCount * cellWidth;
    const totalWidth = 140 + gridWidth; // 工程名幅 + グリッド幅
    let html = '';

    processes.forEach(process => {
      const processSchedules = schedules.filter(s => s.processId === process.processId);
      const isMilestone = process['種別(type)'] === 'milestone';
      const processColor = Utils.normalizeColor(process['工程色(colorHex)']) || '#6B7280';
      const processDisplayName = Store.getProcessDisplayName(process.processId);

      html += `
        <div class="job-process-row" data-process-id="${process.processId}">
          <div class="job-process-name" style="background-color: ${Utils.withAlpha(processColor, '20')}; border-left: 4px solid ${processColor}">
            ${Utils.escapeHtml(processDisplayName)}
          </div>
          <div class="job-process-grid" data-process-id="${process.processId}" style="width: ${gridWidth}px">
      `;

      if (isWeeklyMode) {
        // 週次モード: 各週に対してセルを生成
        weeks.forEach(week => {
          const isCurrentWeek = week.dates.includes(today);
          let classes = 'job-grid-cell weekly';
          if (isCurrentWeek) classes += ' current';

          html += `<div class="${classes}" data-week-start="${week.start}" data-week-end="${week.end}" style="width: ${cellWidth}px"></div>`;
        });
      } else {
        // 日次モード
        dates.forEach(date => {
          const isWeekend = Utils.isWeekend(date);
          const isToday = date === today;
          let classes = 'job-grid-cell';
          if (isWeekend) classes += ' weekend';
          if (isToday) classes += ' today';

          html += `<div class="${classes}" data-date="${date}" style="width: ${cellWidth}px"></div>`;
        });
      }

      processSchedules.forEach(schedule => {
        if (isMilestone) {
          html += this.renderMilestone(schedule, dates, weeks);
        } else {
          html += this.renderBar(schedule, dates, process, weeks);
        }
      });

      html += `
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

    // ボディとその親コンテナの幅を設定（横スクロール用）
    container.style.minWidth = `${totalWidth}px`;
    const ganttContainer = container.closest('.job-detail-gantt');
    if (ganttContainer) {
      ganttContainer.style.minWidth = `${totalWidth}px`;
    }
  },

  renderBar(schedule, dates, process, weeks) {
    const isWeeklyMode = this.config.viewMode === 'weekly' && weeks;
    const color = process['工程色(colorHex)'] || '#6b7280';
    const mainPerson = Store.getPersonById(schedule.mainPersonId);
    const personName = mainPerson?.['氏名'] || '';

    if (isWeeklyMode) {
      // 週次モード: 週単位でバーを表示
      const startWeekIdx = this.findWeekIndex(weeks, schedule.start);
      const endWeekIdx = this.findWeekIndex(weeks, schedule.end);

      if (startWeekIdx === -1 && endWeekIdx === -1) return '';

      const effectiveStart = Math.max(0, startWeekIdx === -1 ? 0 : startWeekIdx);
      const effectiveEnd = Math.min(weeks.length - 1, endWeekIdx === -1 ? weeks.length - 1 : endWeekIdx);

      const left = effectiveStart * this.config.weeklyCellWidth;
      const width = (effectiveEnd - effectiveStart + 1) * this.config.weeklyCellWidth - 2;

      return `
        <div class="job-bar" style="left: ${left}px; width: ${width}px; background-color: ${color};"
             title="${personName}${schedule.label ? ' - ' + schedule.label : ''}">
          ${schedule.label ? `<span class="job-bar-label">${Utils.escapeHtml(schedule.label)}</span>` : ''}
        </div>
      `;
    } else {
      // 日次モード
      const startOffset = Utils.getDaysBetween(this.config.displayStartDate, schedule.start);
      const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

      if (startOffset + duration < 0 || startOffset >= dates.length) {
        return '';
      }

      const left = Math.max(0, startOffset) * this.config.cellWidth;
      const width = Math.min(duration, dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 2;

      return `
        <div class="job-bar" style="left: ${left}px; width: ${width}px; background-color: ${color};"
             title="${personName}${schedule.label ? ' - ' + schedule.label : ''}">
          ${schedule.label ? `<span class="job-bar-label">${Utils.escapeHtml(schedule.label)}</span>` : ''}
        </div>
      `;
    }
  },

  renderMilestone(schedule, dates, weeks) {
    const process = Store.getProcessById(schedule.processId);
    const rawName = process?.['工程名'] || schedule.label || '';
    const processName = rawName.replace(/^★+/, '');

    if (this.config.viewMode === 'weekly' && weeks) {
      // 週次モード
      const weekIdx = this.findWeekIndex(weeks, schedule.start);
      if (weekIdx === -1) return '';

      const left = weekIdx * this.config.weeklyCellWidth + (this.config.weeklyCellWidth / 2) - 8;

      return `
        <div class="job-milestone" style="left: ${left}px;" title="${processName}">
          ★${Utils.escapeHtml(processName)}
        </div>
      `;
    } else {
      // 日次モード
      const startOffset = Utils.getDaysBetween(this.config.displayStartDate, schedule.start);

      if (startOffset < 0 || startOffset >= dates.length) {
        return '';
      }

      const left = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 8;

      return `
        <div class="job-milestone" style="left: ${left}px;" title="${processName}">
          ★${Utils.escapeHtml(processName)}
        </div>
      `;
    }
  },

  /**
   * 指定日付が属する週のインデックスを取得
   * @param {Array} weeks - 週配列
   * @param {string} date - YYYY-MM-DD形式の日付
   * @returns {number} 週インデックス（-1: 範囲外）
   */
  findWeekIndex(weeks, date) {
    for (let i = 0; i < weeks.length; i++) {
      if (weeks[i].dates.includes(date)) {
        return i;
      }
      // 日付が週の開始日より前で、最初の週の場合
      if (i === 0 && date < weeks[i].start) {
        return -1;
      }
      // 日付が週の終了日より後で、最後の週の場合
      if (i === weeks.length - 1 && date > weeks[i].end) {
        return -1;
      }
    }
    // 範囲外の日付も、最も近い週に含める
    if (date < weeks[0].start) return 0;
    if (date > weeks[weeks.length - 1].end) return weeks.length - 1;
    return -1;
  },

  /**
   * 週次グループ化（月曜始まり）- 圧縮表示用
   * @param {string[]} dates - YYYY-MM-DD形式の日付配列
   * @returns {Array<{start: string, end: string, dates: string[], weekIndex: number}>}
   */
  groupByWeekMondayStart(dates) {
    if (!dates || dates.length === 0) return [];

    const weeks = [];
    let currentWeek = null;
    let weekIndex = 0;

    dates.forEach(date => {
      const d = new Date(date);
      const dayOfWeek = d.getDay(); // 0=日, 1=月, ..., 6=土
      // 月曜日で新しい週を開始
      if (dayOfWeek === 1 || currentWeek === null) {
        if (currentWeek !== null) {
          currentWeek.end = currentWeek.dates[currentWeek.dates.length - 1];
          weeks.push(currentWeek);
          weekIndex++;
        }
        currentWeek = { start: date, end: date, dates: [], weekIndex };
      }
      currentWeek.dates.push(date);
      currentWeek.end = date;
    });

    if (currentWeek !== null && currentWeek.dates.length > 0) {
      weeks.push(currentWeek);
    }

    return weeks;
  },

  // 旧版: 後方互換性のため残す
  groupByWeek(dates) {
    return this.groupByWeekMondayStart(dates);
  },

  setViewMode(mode) {
    this.config.viewMode = mode;
    document.getElementById('job-detail-mode-daily')?.classList.toggle('active', mode === 'daily');
    document.getElementById('job-detail-mode-weekly')?.classList.toggle('active', mode === 'weekly');
    this.render();
  },

  onDisplayRangeChange() {
    this.config.displayStartDate = document.getElementById('job-detail-start').value;
    this.config.displayDays = parseInt(document.getElementById('job-detail-days').value, 10);
    this.render();
  },

  // イベント委譲：#job-detail-bodyに1回だけリスナーを設定
  attachGridEventListeners() {
    const body = document.getElementById('job-detail-body');
    if (!body) return;

    // ドラッグ範囲選択：mousedown
    body.addEventListener('mousedown', (e) => {
      // 左クリック以外は無視
      if (e.button !== 0) return;
      // バー上でのドラッグは無視
      if (e.target.closest('.job-bar, .job-milestone')) return;

      const cell = e.target.closest('.job-grid-cell');
      if (!cell) return;

      // 親の .job-process-grid から processId を取得
      const grid = cell.closest('.job-process-grid');
      if (!grid) return;

      e.preventDefault();
      this.dragState.isDragging = true;
      this.dragState.startProcessId = grid.dataset.processId;
      this.dragState.startDate = cell.dataset.date;
      this.dragState.endDate = cell.dataset.date;

      this.highlightRange();
    });

    // ドラッグ範囲選択：mousemove
    body.addEventListener('mousemove', (e) => {
      if (!this.dragState.isDragging) return;

      const cell = e.target.closest('.job-grid-cell');
      if (!cell) return;

      // 同じ工程行のみ範囲選択可能
      const grid = cell.closest('.job-process-grid');
      if (!grid || grid.dataset.processId !== this.dragState.startProcessId) return;

      this.dragState.endDate = cell.dataset.date;
      this.highlightRange();
    });

    // ドラッグ範囲選択：mouseup
    body.addEventListener('mouseup', (e) => {
      if (!this.dragState.isDragging) return;

      const { startProcessId, startDate, endDate } = this.dragState;
      const jobId = this.currentJobId;

      // 範囲確定
      const rangeStart = startDate <= endDate ? startDate : endDate;
      const rangeEnd = startDate <= endDate ? endDate : startDate;

      // リセット
      this.clearHighlight();
      this.dragState.isDragging = false;
      this.dragState.startProcessId = null;
      this.dragState.startDate = null;
      this.dragState.endDate = null;

      // モーダルを開く（工程を事前選択）
      Modal.openNewWithProcess(jobId, startProcessId, rangeStart, rangeEnd);
    });

    // ドラッグキャンセル：マウスがグリッド外に出た場合
    body.addEventListener('mouseleave', (e) => {
      if (this.dragState.isDragging) {
        this.clearHighlight();
        this.dragState.isDragging = false;
        this.dragState.startProcessId = null;
        this.dragState.startDate = null;
        this.dragState.endDate = null;
      }
    });
  },

  // 選択範囲をハイライト
  highlightRange() {
    this.clearHighlight();

    const { startProcessId, startDate, endDate } = this.dragState;
    if (!startProcessId || !startDate || !endDate) return;

    const rangeStart = startDate <= endDate ? startDate : endDate;
    const rangeEnd = startDate <= endDate ? endDate : startDate;

    const grid = document.querySelector(`#job-detail-body .job-process-grid[data-process-id="${startProcessId}"]`);
    if (!grid) return;

    const cells = grid.querySelectorAll('.job-grid-cell');
    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= rangeStart && date <= rangeEnd) {
        cell.classList.add('selected-range');
      }
    });
  },

  // ハイライトをクリア
  clearHighlight() {
    document.querySelectorAll('#job-detail-body .selected-range').forEach(cell => {
      cell.classList.remove('selected-range');
    });
  },

  /**
   * スプレッドシートにエクスポート
   * - 工程表を新規シートに色付きで出力
   */
  async exportToSpreadsheet() {
    const job = this.currentJob;
    if (!job) {
      Utils.showToast('工番情報がありません', 'error');
      return;
    }

    Utils.showToast('シート出力中...', 'info');

    const dates = Utils.generateDateRange(this.config.displayStartDate, this.config.displayDays);
    const schedules = Store.getSchedulesByJobId(this.currentJobId);
    let processes = Store.state.processes;

    // 未使用工程を隠す設定に従う
    if (this.config.hideUnusedProcesses) {
      const usedProcessIds = new Set(schedules.map(s => s.processId));
      processes = processes.filter(p => usedProcessIds.has(p.processId));
    }

    // エクスポートデータを構築
    const exportData = {
      jobId: this.currentJobId,
      job: {
        jobNo: job['工番'] || '',
        customer: job['顧客名'] || '',
        product: job['設備/製品名'] || '',
        shipDate: job['出荷予定日'] || '',
        drawDate: job['出図予定日'] || ''
      },
      viewMode: this.config.viewMode,
      displayStartDate: this.config.displayStartDate,
      displayDays: this.config.displayDays,
      dates: dates,
      processes: processes.map(p => ({
        processId: p.processId,
        name: p['工程名'],
        color: Utils.normalizeColor(p['工程色(colorHex)']) || '#6B7280',
        isMilestone: p['種別(type)'] === 'milestone'
      })),
      schedules: schedules.map(s => ({
        processId: s.processId,
        start: s.start,
        end: s.end,
        label: s.label || '',
        mainPersonId: s.mainPersonId
      }))
    };

    try {
      const result = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .exportJobDetailToSheet(exportData);
      });

      if (result.success) {
        Utils.showToast(`シート「${result.sheetName}」を作成しました`, 'success');
      } else {
        Utils.showToast('シート出力に失敗しました', 'error');
      }
    } catch (error) {
      console.error('[JobDetail] exportToSpreadsheet error:', error);
      Utils.showToast('シート出力エラー: ' + error.message, 'error');
    }
  },

  /**
   * 印刷境界線の更新
   */
  updatePrintBoundaries() {
    const container = document.getElementById('job-detail-body');
    if (!container) return;

    // 既存の境界線を削除
    container.querySelectorAll('.print-boundary').forEach(el => el.remove());

    if (!this.config.showPrintBoundaries) return;

    const paper = this.paperSizes[this.config.paperSize];
    if (!paper) return;

    const ganttContainer = container.closest('.job-detail-gantt');
    if (!ganttContainer) return;

    const totalWidth = ganttContainer.scrollWidth;
    const totalHeight = ganttContainer.scrollHeight;

    // 横方向の境界線（ページ幅ごと）
    // 工程名カラム幅を考慮（140px）
    const contentWidth = paper.width - 140;
    let x = 140 + contentWidth;
    while (x < totalWidth) {
      const line = document.createElement('div');
      line.className = 'print-boundary print-boundary-vertical';
      line.style.cssText = `
        position: absolute;
        left: ${x}px;
        top: 0;
        width: 2px;
        height: 100%;
        background: repeating-linear-gradient(
          to bottom,
          #ef4444 0,
          #ef4444 4px,
          transparent 4px,
          transparent 8px
        );
        pointer-events: none;
        z-index: 100;
      `;
      line.title = `ページ境界 (${this.config.paperSize.toUpperCase()})`;
      container.appendChild(line);
      x += contentWidth;
    }

    // 横方向の境界線（ページ高さごと）
    // ヘッダー高さを考慮（約80px）
    const contentHeight = paper.height - 80;
    let y = contentHeight;
    while (y < totalHeight) {
      const line = document.createElement('div');
      line.className = 'print-boundary print-boundary-horizontal';
      line.style.cssText = `
        position: absolute;
        left: 0;
        top: ${y}px;
        width: 100%;
        height: 2px;
        background: repeating-linear-gradient(
          to right,
          #ef4444 0,
          #ef4444 4px,
          transparent 4px,
          transparent 8px
        );
        pointer-events: none;
        z-index: 100;
      `;
      line.title = `ページ境界 (${this.config.paperSize.toUpperCase()})`;
      container.appendChild(line);
      y += contentHeight;
    }
  },

  /**
   * 印刷実行
   * - タイトルを工番情報に設定
   * - 印刷後にタイトルを復元
   */
  print() {
    const job = this.currentJob;
    const originalTitle = document.title;

    // 印刷用タイトル設定
    if (job) {
      const jobNo = job['工番'] || '';
      const product = job['設備/製品名'] || '';
      document.title = `工程表_${jobNo}_${product}`;
    }

    // 印刷実行
    window.print();

    // タイトル復元
    setTimeout(() => {
      document.title = originalTitle;
    }, 100);
  }
};

const ResourceView = {
  config: {
    cellWidth: 32,
    rowHeight: 40
  },
  dates: [],

  init() {
    Store.subscribe((state) => {
      if (state.currentView === 'resource') {
        this.render();
      }
    });
  },

  render() {
    const { people, schedules, trips, displayStartDate, displayDays } = Store.state;
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);
    const groupedPeople = this.groupByDepartment(people);

    this.renderDateHeader();
    this.renderBody(groupedPeople, schedules, trips);
  },

  groupByDepartment(people) {
    const groups = {};
    people.forEach(person => {
      const dept = person['部署/区分'] || 'その他';
      if (!groups[dept]) {
        groups[dept] = [];
      }
      groups[dept].push(person);
    });
    return groups;
  },

  renderDateHeader() {
    const container = document.getElementById('resource-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;

    this.dates.forEach(date => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;

      const showMonth = month !== currentMonth;
      currentMonth = month;

      let classes = 'resource-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';

      html += `
        <div class="${classes}">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  renderBody(groupedPeople, schedules, trips) {
    const container = document.getElementById('resource-body');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';

    Object.keys(groupedPeople).forEach(dept => {
      html += `
        <div class="resource-dept-header">
          <div class="resource-dept-name">${Utils.escapeHtml(dept)}</div>
          <div class="resource-dept-grid">
            ${this.dates.map(date => {
              const isWeekend = Utils.isWeekend(date);
              return `<div class="resource-grid-cell ${isWeekend ? 'weekend' : ''}"></div>`;
            }).join('')}
          </div>
        </div>
      `;

      groupedPeople[dept].forEach(person => {
        const personSchedules = this.getPersonSchedules(person.personId, schedules);
        const personTrips = trips.filter(t => t.personId === person.personId);
        const personColor = person['作業者色(colorHex)'] || '#6b7280';

        html += `
          <div class="resource-person-row">
            <div class="resource-person-name" style="border-left: 4px solid ${personColor}">
              <span class="person-name-text">${Utils.escapeHtml(person['氏名'])}</span>
            </div>
            <div class="resource-person-grid">
        `;

        this.dates.forEach(date => {
          const isWeekend = Utils.isWeekend(date);
          const isToday = date === today;
          let classes = 'resource-grid-cell';
          if (isWeekend) classes += ' weekend';
          if (isToday) classes += ' today';
          html += `<div class="${classes}"></div>`;
        });

        personSchedules.forEach(schedule => {
          html += this.renderScheduleBar(schedule, personColor);
        });

        personTrips.forEach(trip => {
          html += this.renderTripBar(trip);
        });

        html += `
            </div>
          </div>
        `;
      });
    });

    container.innerHTML = html;
  },

  getPersonSchedules(personId, schedules) {
    return schedules.filter(s =>
      s.mainPersonId === personId || s.subPersonId === personId
    );
  },

  renderScheduleBar(schedule, personColor) {
    const { displayStartDate } = Store.state;
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);
    const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 4;

    const job = Store.getJobById(schedule.jobId);
    const process = Store.getProcessById(schedule.processId);
    const jobNo = job?.['工番'] || '';
    const isMilestone = process?.['種別(type)'] === 'milestone';
    // マイルストーンは★を自前で付けるため、生の工程名を使用し、既存の★を除去（二重★防止）
    const rawProcessName = (process?.['工程名'] || '').replace(/^★+/, '');
    const processName = isMilestone ? rawProcessName : Store.getProcessDisplayName(schedule.processId);

    if (isMilestone) {
      const milestoneLeft = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 10;
      return `
        <div class="resource-milestone" style="left: ${milestoneLeft}px;" title="${jobNo} - ${rawProcessName}">
          ★${Utils.escapeHtml(rawProcessName)}
        </div>
      `;
    }

    const isSubPerson = schedule.subPersonId && schedule.mainPersonId !== schedule.subPersonId;
    const opacity = isSubPerson ? '0.7' : '1';

    return `
      <div class="resource-bar" style="left: ${left}px; width: ${width}px; background-color: ${personColor}; opacity: ${opacity};"
           title="${jobNo} - ${processName}${isSubPerson ? ' (副)' : ''}">
        <span class="resource-bar-text">${Utils.escapeHtml(jobNo)}</span>
        <span class="resource-bar-process">${Utils.escapeHtml(processName)}</span>
      </div>
    `;
  },

  renderTripBar(trip) {
    const { displayStartDate } = Store.state;
    const startOffset = Utils.getDaysBetween(displayStartDate, trip.start);
    const duration = Utils.getDaysBetween(trip.start, trip.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 4;

    const destination = trip['行先'] || '';
    const purpose = trip['用件'] || '';

    return `
      <div class="resource-trip-bar" style="left: ${left}px; width: ${width}px;"
           title="${destination} - ${purpose}">
        <span class="trip-icon">🚗</span>
        <span class="trip-text">${Utils.escapeHtml(destination || purpose)}</span>
      </div>
    `;
  }
};

// WorkerJobAssignView - 作業者別担当工番カード表示
// ========================================

const WorkerJobAssignView = {
  // フィルター状態
  filters: {
    activeOnly: true,
    mainOnly: false,
    searchQuery: ''
  },

  init() {
    Store.subscribe((state) => {
      if (state.currentView === 'resource') {
        this.render();
      }
    });
  },

  /**
   * Jobs から割り振りデータを生成（Source of Truth = Jobs）
   * @param {Object[]} jobs - Jobs配列
   * @param {Object[]} people - People配列
   * @returns {Object[]} assignment配列
   */
  buildWorkerAssignmentsFromJobs(jobs, people) {
    const assignments = [];
    const peopleMap = {};
    people.forEach(p => {
      // personId を正規化（trim）してマップに格納
      const normalizedId = String(p.personId || '').trim();
      peopleMap[normalizedId] = p;
    });

    console.log('[WorkerJobAssignView] Building assignments from Jobs');
    console.log('[WorkerJobAssignView] People IDs:', Object.keys(peopleMap));
    console.log('[WorkerJobAssignView] Jobs count:', jobs.length);

    jobs.forEach(job => {
      const jobId = job.jobId || '';
      const jobCode = job['工番'] || '';
      const customerName = job['顧客名'] || '';
      const productName = job['設備/製品名'] || '';

      // mainPersonId を正規化
      const mainPersonId = String(job.mainPersonId || '').trim();
      // subPersonId を正規化
      const subPersonId = String(job.subPersonId || '').trim();

      // 主担当者の割り振り
      if (mainPersonId) {
        const person = peopleMap[mainPersonId];
        if (person) {
          assignments.push({
            assignId: `${jobId}:main:${mainPersonId}`,
            personId: mainPersonId,
            personName: person['氏名'] || '',
            jobId,
            jobCode,
            customerName,
            productName,
            mainProcess: '',
            mainProcessName: '',
            role: 'main',
            priority: 10,
            isActive: true,
            memo: ''
          });
        } else {
          console.warn(`[WorkerJobAssignView] mainPersonId "${mainPersonId}" not found in People (Job: ${jobCode})`);
        }
      }

      // 副担当者の割り振り（主担当と異なる場合のみ）
      if (subPersonId && subPersonId !== mainPersonId) {
        const person = peopleMap[subPersonId];
        if (person) {
          assignments.push({
            assignId: `${jobId}:sub:${subPersonId}`,
            personId: subPersonId,
            personName: person['氏名'] || '',
            jobId,
            jobCode,
            customerName,
            productName,
            mainProcess: '',
            mainProcessName: '',
            role: 'sub',
            priority: 20,
            isActive: true,
            memo: ''
          });
        } else {
          console.warn(`[WorkerJobAssignView] subPersonId "${subPersonId}" not found in People (Job: ${jobCode})`);
        }
      }
    });

    console.log('[WorkerJobAssignView] Generated assignments:', assignments.length);

    // priority → jobCode 順でソート
    assignments.sort((a, b) => {
      if (a.priority !== b.priority) return a.priority - b.priority;
      return String(a.jobCode || '').localeCompare(String(b.jobCode || ''));
    });

    return assignments;
  },

  /**
   * メインレンダリング
   */
  render() {
    const container = document.getElementById('view-resource');
    if (!container) return;

    const { jobs, people } = Store.state;

    console.log('[WorkerJobAssignView] render() called');
    console.log('[WorkerJobAssignView] Store.state.jobs count:', jobs?.length || 0);
    console.log('[WorkerJobAssignView] Store.state.people count:', people?.length || 0);

    // Jobs から割り振りを生成（Source of Truth = Jobs）
    const assignments = this.buildWorkerAssignmentsFromJobs(jobs || [], people || []);

    // 作業者情報をマップ化（部署など取得用）
    const peopleMap = {};
    (people || []).forEach(p => {
      const normalizedId = String(p.personId || '').trim();
      peopleMap[normalizedId] = p;
    });

    // フィルタリング
    let filtered = this.applyFilters(assignments);

    // personIdでグルーピング
    const grouped = this.groupByPerson(filtered, peopleMap);

    // HTML生成
    container.innerHTML = this.renderContainer(grouped, peopleMap);

    // イベントハンドラーを設定
    this.setupEventHandlers();
  },

  /**
   * フィルター適用
   */
  applyFilters(assigns) {
    let result = [...assigns];

    // 有効のみフィルタ（isActive=false を除外）
    if (this.filters.activeOnly) {
      result = result.filter(a => a.isActive !== false);
    }

    // 主担当のみフィルタ
    if (this.filters.mainOnly) {
      result = result.filter(a => a.role === 'main');
    }

    // 検索フィルタ
    if (this.filters.searchQuery.trim()) {
      const q = this.filters.searchQuery.toLowerCase();
      result = result.filter(a => {
        const jobCode = String(a.jobCode || '').toLowerCase();
        const customerName = String(a.customerName || '').toLowerCase();
        const productName = String(a.productName || '').toLowerCase();
        return jobCode.includes(q) || customerName.includes(q) || productName.includes(q);
      });
    }

    return result;
  },

  /**
   * personIdでグルーピング
   */
  groupByPerson(assigns, peopleMap) {
    const groups = {};
    assigns.forEach(a => {
      const personId = String(a.personId || '').trim();
      if (!groups[personId]) {
        groups[personId] = {
          personId,
          personName: a.personName || peopleMap[personId]?.['氏名'] || '不明',
          dept: peopleMap[personId]?.['部署/区分'] || '',
          color: peopleMap[personId]?.['作業者色(colorHex)'] || '#6b7280',
          assigns: []
        };
      }
      groups[personId].assigns.push(a);
    });
    return groups;
  },

  /**
   * コンテナHTML生成
   */
  renderContainer(grouped, peopleMap) {
    const personIds = Object.keys(grouped);

    // 部署→氏名順でソート
    personIds.sort((a, b) => {
      const deptA = grouped[a].dept || '';
      const deptB = grouped[b].dept || '';
      if (deptA !== deptB) return deptA.localeCompare(deptB);
      return grouped[a].personName.localeCompare(grouped[b].personName);
    });

    return `
      <div class="wja-container">
        <!-- フィルターバー -->
        <div class="wja-filter-bar">
          <div class="wja-filter-left">
            <label class="wja-toggle">
              <input type="checkbox" id="wja-filter-active" ${this.filters.activeOnly ? 'checked' : ''}>
              <span>有効のみ</span>
            </label>
            <label class="wja-toggle">
              <input type="checkbox" id="wja-filter-main" ${this.filters.mainOnly ? 'checked' : ''}>
              <span>主担当のみ</span>
            </label>
          </div>
          <div class="wja-filter-right">
            <input type="text" id="wja-search" class="wja-search-input"
                   placeholder="工番・顧客・製品で検索..."
                   value="${Utils.escapeHtml(this.filters.searchQuery)}">
          </div>
        </div>

        <!-- カード一覧 -->
        <div class="wja-body">
          ${personIds.length === 0 ? this.renderEmpty() : personIds.map(pid => this.renderPersonSection(grouped[pid])).join('')}
        </div>
      </div>
    `;
  },

  /**
   * 空の場合の表示
   */
  renderEmpty() {
    return `
      <div class="wja-empty">
        <div class="wja-empty-icon">📋</div>
        <div class="wja-empty-text">該当する担当工番がありません</div>
      </div>
    `;
  },

  /**
   * 作業者セクション生成
   */
  renderPersonSection(group) {
    const { personId, personName, dept, color, assigns } = group;

    return `
      <div class="wja-person-section">
        <div class="wja-person-header" style="border-left: 4px solid ${color}">
          <span class="wja-person-dept">${Utils.escapeHtml(dept)}</span>
          <span class="wja-person-name">${Utils.escapeHtml(personName)}</span>
          <span class="wja-person-count">${assigns.length}件</span>
        </div>
        <div class="wja-card-grid">
          ${assigns.map(a => this.renderCard(a)).join('')}
        </div>
      </div>
    `;
  },

  /**
   * 工番カード生成
   */
  renderCard(assign) {
    const jobCode = assign.jobCode || '';
    const customerName = assign.customerName || '';
    const productName = assign.productName || '';
    const mainProcessName = assign.mainProcessName || '';
    const role = assign.role || 'main';
    const memo = assign.memo || '';
    const jobId = assign.jobId || '';

    // roleバッジ
    const roleBadge = role === 'main'
      ? '<span class="wja-role-badge wja-role-main">主</span>'
      : '<span class="wja-role-badge wja-role-sub">副</span>';

    return `
      <div class="wja-card" data-job-id="${Utils.escapeHtml(jobId)}" data-job-code="${Utils.escapeHtml(jobCode)}">
        <div class="wja-card-row1">
          <span class="wja-card-jobcode">${Utils.escapeHtml(jobCode)}</span>
          ${roleBadge}
        </div>
        <div class="wja-card-row2">${Utils.escapeHtml(customerName) || '—'}</div>
        <div class="wja-card-row3">${Utils.escapeHtml(productName) || '—'}</div>
        ${mainProcessName || memo ? `<div class="wja-card-row4">${Utils.escapeHtml(mainProcessName)}${memo ? ' / ' + Utils.escapeHtml(memo) : ''}</div>` : ''}
      </div>
    `;
  },

  /**
   * イベントハンドラー設定
   */
  setupEventHandlers() {
    // 有効のみトグル
    const activeCheckbox = document.getElementById('wja-filter-active');
    if (activeCheckbox) {
      activeCheckbox.addEventListener('change', (e) => {
        this.filters.activeOnly = e.target.checked;
        this.render();
      });
    }

    // 主担当のみトグル
    const mainCheckbox = document.getElementById('wja-filter-main');
    if (mainCheckbox) {
      mainCheckbox.addEventListener('change', (e) => {
        this.filters.mainOnly = e.target.checked;
        this.render();
      });
    }

    // 検索入力
    const searchInput = document.getElementById('wja-search');
    if (searchInput) {
      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          this.filters.searchQuery = e.target.value;
          this.render();
          // 再レンダリング後にフォーカスを維持
          const newInput = document.getElementById('wja-search');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        }, 300);
      });
    }

    // カードクリック → 工番別工程表へ遷移
    document.querySelectorAll('.wja-card').forEach(card => {
      card.addEventListener('click', (e) => {
        const jobId = card.dataset.jobId;
        const jobCode = card.dataset.jobCode;
        if (jobId) {
          this.openJobDetail(jobId, jobCode);
        }
      });
    });
  },

  /**
   * 工番別工程表を開く
   */
  openJobDetail(jobId, jobCode) {
    console.log('[WorkerJobAssignView] Opening job detail:', jobId, jobCode);
    // 既存のJobDetailを開く処理を呼び出す
    if (typeof JobDetail !== 'undefined' && JobDetail.open) {
      JobDetail.open(jobId);
    } else {
      console.warn('JobDetail.open is not available');
      Utils.showToast(`工番 ${jobCode} の詳細を開く機能は準備中です`, 'info');
    }
  }
};

// WeeklyPlan - 今週の予定（週刊重要工程形式）
// ========================================

const WeeklyPlan = {
  weekStart: null,

  init() {
    this.weekStart = this.getWeekStart(new Date());

    Store.subscribe((state) => {
      if (state.currentView === 'weekly') {
        this.render();
      }
    });
  },

  getWeekStart(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    d.setDate(diff);
    return Utils.formatDate(d);
  },

  getWeekEnd(weekStart) {
    return Utils.addDays(weekStart, 6);
  },

  prevWeek() {
    this.weekStart = Utils.addDays(this.weekStart, -7);
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  nextWeek() {
    this.weekStart = Utils.addDays(this.weekStart, 7);
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  goToThisWeek() {
    this.weekStart = this.getWeekStart(new Date());
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  onDateChange() {
    const inputDate = document.getElementById('weekly-start-date').value;
    this.weekStart = this.getWeekStart(new Date(inputDate));
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  /**
   * 重要工程かどうかを判定
   * ProcessMaster の isWeekly フラグで判定
   */
  isImportantProcess(process) {
    if (!process) return false;
    // isWeekly が true の工程のみを重要工程として扱う
    return process.isWeekly === true;
  },

  /**
   * 週間データを構築（重要工程のみ抽出）
   */
  buildImportantWeekRows() {
    const { schedules, jobs, processes } = Store.state;
    const weekEnd = this.getWeekEnd(this.weekStart);
    const dates = Utils.generateDateRange(this.weekStart, 7);

    // 重要工程の processId を収集
    const importantProcessIds = new Set(
      processes.filter(p => this.isImportantProcess(p)).map(p => p.processId)
    );

    // この週にかかるスケジュールを抽出（重要工程のみ）
    const weekSchedules = schedules.filter(s =>
      s.end >= this.weekStart &&
      s.start <= weekEnd &&
      importantProcessIds.has(s.processId)
    );

    // jobId ごとにグループ化
    const jobScheduleMap = new Map();
    weekSchedules.forEach(schedule => {
      if (!jobScheduleMap.has(schedule.jobId)) {
        jobScheduleMap.set(schedule.jobId, []);
      }
      jobScheduleMap.get(schedule.jobId).push(schedule);
    });

    // 重要工程がある工番だけを rows として構築
    const rows = [];
    jobScheduleMap.forEach((jobSchedules, jobId) => {
      const job = Store.getJobById(jobId);
      if (!job) return;

      // 曜日ごとの工程名を収集
      const dayCells = dates.map(date => {
        const dayProcesses = [];
        jobSchedules.forEach(schedule => {
          if (date >= schedule.start && date <= schedule.end) {
            const process = Store.getProcessById(schedule.processId);
            if (process) {
              dayProcesses.push({
                name: Store.getProcessDisplayName(schedule.processId),
                color: Utils.normalizeColor(process['工程色(colorHex)']) || '#6B7280',
                label: schedule.label || ''
              });
            }
          }
        });
        return dayProcesses;
      });

      rows.push({
        jobId,
        job,
        dayCells
      });
    });

    // 工番順でソート（出荷予定日が近い順）
    rows.sort((a, b) => {
      const dateA = a.job['出荷予定日'] || '9999-12-31';
      const dateB = b.job['出荷予定日'] || '9999-12-31';
      return dateA.localeCompare(dateB);
    });

    return { rows, dates };
  },

  /**
   * 工番情報セル（3行固定）を生成
   */
  buildJobInfoCell(job) {
    const jobNo = job['工番'] || '';
    const product = job['設備/製品名'] || '';
    const qty = job['台数'] || '';
    const customer = job['顧客名'] || '';
    const drawDate = job['出図予定日'] ? Utils.formatShortDate(job['出図予定日']) : '';
    const shipDate = job['出荷予定日'] ? Utils.formatShortDate(job['出荷予定日']) : '';

    // 1行目: 工番 製品名（台数）
    const line1 = `${jobNo}　${product}${qty ? '（' + qty + '）' : ''}`;

    // 2行目: 顧客名
    const line2 = customer ? `顧客：${customer}` : '';

    // 3行目: 出図/出荷予定日
    let line3Parts = [];
    if (drawDate) line3Parts.push(`出図：${drawDate}`);
    if (shipDate) line3Parts.push(`出荷：${shipDate}`);
    const line3 = line3Parts.join('　');

    return `
      <div class="job-line1">${Utils.escapeHtml(line1)}</div>
      ${line2 ? `<div class="job-line2">${Utils.escapeHtml(line2)}</div>` : ''}
      ${line3 ? `<div class="job-line3">${Utils.escapeHtml(line3)}</div>` : ''}
    `;
  },

  render() {
    this.updateHeader();
    this.renderDateRow();
    this.renderTable();
  },

  updateHeader() {
    const weekEnd = this.getWeekEnd(this.weekStart);
    const startMonth = Utils.getMonth(this.weekStart);
    const startDay = Utils.getDay(this.weekStart);
    const endMonth = Utils.getMonth(weekEnd);
    const endDay = Utils.getDay(weekEnd);

    document.getElementById('weekly-range-display').textContent =
      `${startMonth}/${startDay}（${Utils.getDayOfWeek(this.weekStart)}）〜 ${endMonth}/${endDay}（${Utils.getDayOfWeek(weekEnd)}）`;

    document.getElementById('weekly-start-date').value = this.weekStart;
  },

  renderDateRow() {
    const dates = Utils.generateDateRange(this.weekStart, 7);
    const today = Utils.getToday();
    const dateRow = document.getElementById('weekly-date-row');
    if (!dateRow) return;

    let html = '<th></th>'; // 工番情報列の空セル
    dates.forEach((date, index) => {
      const isWeekend = index >= 5; // 土日
      const isToday = date === today;
      const weekendClass = isWeekend ? 'weekend' : '';
      const todayClass = isToday ? 'today' : '';

      html += `<th class="${weekendClass} ${todayClass}">${Utils.getMonth(date)}/${Utils.getDay(date)}</th>`;
    });

    dateRow.innerHTML = html;
  },

  renderTable() {
    const tbody = document.getElementById('weekly-tbody');
    if (!tbody) return;

    const { rows, dates } = this.buildImportantWeekRows();
    const today = Utils.getToday();

    if (rows.length === 0) {
      tbody.innerHTML = `
        <tr class="weekly-empty-row">
          <td colspan="8">この週に重要工程（★）がある工番はありません</td>
        </tr>
      `;
      return;
    }

    let html = '';
    rows.forEach(row => {
      html += '<tr>';

      // 工番情報セル（3行固定）
      html += `<td class="weekly-job-cell">${this.buildJobInfoCell(row.job)}</td>`;

      // 曜日セル（月〜日）
      row.dayCells.forEach((dayProcesses, index) => {
        const date = dates[index];
        const isWeekend = index >= 5;
        const isToday = date === today;
        let cellClass = 'weekly-day-cell';
        if (isWeekend) cellClass += ' weekend';
        if (isToday) cellClass += ' today';

        let cellContent = '';
        if (dayProcesses.length > 0) {
          // 同日に複数の重要工程がある場合は "/" で区切る
          if (dayProcesses.length === 1) {
            const p = dayProcesses[0];
            cellContent = `<span class="weekly-process-tag" style="background-color: ${p.color};" title="${p.name}${p.label ? ' - ' + p.label : ''}">${Utils.escapeHtml(p.name)}</span>`;
          } else {
            // 複数の場合：名前を "/" で結合、色は最初の工程の色を使用
            const names = dayProcesses.map(p => p.name).join(' / ');
            const firstColor = dayProcesses[0].color;
            cellContent = `<span class="weekly-process-tag" style="background-color: ${firstColor};" title="${names}">${Utils.escapeHtml(names)}</span>`;
          }
        }

        html += `<td class="${cellClass}">${cellContent}</td>`;
      });

      html += '</tr>';
    });

    tbody.innerHTML = html;
  },

  exportCSV() {
    const { rows, dates } = this.buildImportantWeekRows();

    const headers = ['工番', '製品名', '顧客名', '出荷予定日', '月', '火', '水', '木', '金', '土', '日'];
    const csvRows = rows.map(row => {
      const job = row.job;
      const dayCells = row.dayCells.map(dayProcesses =>
        dayProcesses.map(p => p.name).join(' / ')
      );
      return [
        job['工番'] || '',
        job['設備/製品名'] || '',
        job['顧客名'] || '',
        job['出荷予定日'] || '',
        ...dayCells
      ];
    });

    const csv = [headers, ...csvRows]
      .map(row => row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(','))
      .join('\n');

    const bom = '\uFEFF';
    const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `週刊重要工程_${this.weekStart}.csv`;
    a.click();

    URL.revokeObjectURL(url);
    Utils.showToast('CSVをダウンロードしました', 'success');
  }
};

const TripModal = {
  currentTrip: null,
  isNew: false,
  _presetPersonId: null,  // セル選択からの事前設定

  /**
   * セル選択から新規作成モードで開く
   * @param {string} personId - 作業者ID
   * @param {string} startDate - 開始日
   * @param {string} endDate - 終了日
   */
  openNew(personId, startDate, endDate) {
    this._presetPersonId = personId;
    this.open(null);

    // 事前設定を適用
    document.getElementById('trip-person').value = personId;
    document.getElementById('trip-start').value = startDate;
    document.getElementById('trip-end').value = endDate;

    // 移動ボタンを表示
    document.getElementById('trip-add-move-btn').classList.remove('hidden');
  },

  open(trip) {
    this.currentTrip = trip;
    this.isNew = !trip;

    const modal = document.getElementById('modal-trip');
    const title = document.getElementById('trip-modal-title');
    const personSelect = document.getElementById('trip-person');

    // タイトル設定
    title.textContent = this.isNew ? '出張予定を追加' : '出張予定を編集';

    // 担当者プルダウン生成
    const { people } = Store.state;
    personSelect.innerHTML = '<option value="">選択してください</option>' +
      people.map(p => `<option value="${p.personId}">${Utils.escapeHtml(p['氏名'])} (${Utils.escapeHtml(p['部署/区分'] || '')})</option>`).join('');

    if (trip) {
      // 編集モード
      document.getElementById('trip-id').value = trip.tripId || '';
      document.getElementById('trip-expected-updated-at').value = trip.updatedAt || '';
      document.getElementById('trip-person').value = trip.personId || '';
      document.getElementById('trip-start').value = trip.start || '';
      document.getElementById('trip-end').value = trip.end || '';
      document.getElementById('trip-destination').value = trip['行先'] || '';
      document.getElementById('trip-purpose').value = trip['用件'] || '';
      document.getElementById('trip-note').value = trip['備考'] || '';

      // ステータスバッジ
      const sourceBadge = document.getElementById('trip-source-badge');
      const lockedBadge = document.getElementById('trip-locked-badge');

      if (trip.source === 'auto') {
        sourceBadge.textContent = '自動生成';
        sourceBadge.className = 'px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-700';
      } else {
        sourceBadge.textContent = '手動登録';
        sourceBadge.className = 'px-2 py-0.5 rounded text-xs bg-green-100 text-green-700';
      }

      if (trip.isLocked) {
        lockedBadge.textContent = '🔒 確定済み';
        lockedBadge.className = 'px-2 py-0.5 rounded text-xs bg-amber-100 text-amber-700';
        lockedBadge.classList.remove('hidden');
      } else {
        lockedBadge.classList.add('hidden');
      }

      // ロック済みの場合は編集不可
      this.setReadonly(trip.isLocked === true);

      document.getElementById('trip-delete-btn').classList.remove('hidden');
      document.getElementById('trip-lock-btn').classList.toggle('hidden', trip.isLocked === true);
    } else {
      // 新規モード
      document.getElementById('trip-id').value = '';
      document.getElementById('trip-expected-updated-at').value = '';
      document.getElementById('trip-person').value = '';
      document.getElementById('trip-start').value = Utils.getToday();
      document.getElementById('trip-end').value = Utils.getToday();
      document.getElementById('trip-destination').value = '';
      document.getElementById('trip-purpose').value = '';
      document.getElementById('trip-note').value = '';

      document.getElementById('trip-source-badge').textContent = '';
      document.getElementById('trip-locked-badge').classList.add('hidden');
      document.getElementById('trip-delete-btn').classList.add('hidden');
      document.getElementById('trip-lock-btn').classList.add('hidden');
      document.getElementById('trip-add-move-btn').classList.add('hidden');

      this.setReadonly(false);
    }

    modal.classList.remove('hidden');
  },

  setReadonly(isReadonly) {
    const form = document.getElementById('trip-form');
    const inputs = form.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
      if (input.type !== 'hidden') {
        input.disabled = isReadonly;
      }
    });

    document.getElementById('trip-save-btn').disabled = isReadonly;
    if (isReadonly) {
      document.getElementById('trip-save-btn').classList.add('opacity-50', 'cursor-not-allowed');
    } else {
      document.getElementById('trip-save-btn').classList.remove('opacity-50', 'cursor-not-allowed');
    }
  },

  close() {
    document.getElementById('modal-trip').classList.add('hidden');
    this.currentTrip = null;
    this.isNew = false;
  },

  async save() {
    const personId = document.getElementById('trip-person').value;
    const start = document.getElementById('trip-start').value;
    const end = document.getElementById('trip-end').value;
    const destination = document.getElementById('trip-destination').value;
    const purpose = document.getElementById('trip-purpose').value;
    const note = document.getElementById('trip-note').value;

    if (!personId || !start || !end || !destination) {
      Utils.showToast('必須項目を入力してください', 'error');
      return;
    }

    if (start > end) {
      Utils.showToast('終了日は開始日以降にしてください', 'error');
      return;
    }

    const payload = {
      personId,
      start,
      end,
      '行先': destination,
      '用件': purpose,
      '備考': note,
      source: 'manual'
    };

    if (this.isNew) {
      // 新規作成：仮IDで楽観的更新
      const tempId = 'temp_' + Utils.generateId();
      const newTrip = {
        tripId: tempId,
        ...payload,
        isLocked: false,
        updatedAt: new Date().toISOString()
      };
      Store.addTrip(newTrip);
      ChangeBuffer.add('trip', 'upsert', tempId, payload, 'travel');
      Utils.showToast('出張予定を登録しました（保存待ち）', 'info');
    } else {
      // 更新：楽観的更新
      const tripId = document.getElementById('trip-id').value;
      Store.updateTripInStore(tripId, payload);
      ChangeBuffer.add('trip', 'upsert', tripId, payload, 'travel');
      Utils.showToast('出張予定を更新しました（保存待ち）', 'info');
    }

    this.close();
    TravelPlan.render();
  },

  delete() {
    if (!this.currentTrip) return;

    if (!confirm('この出張予定を削除しますか？')) return;

    const tripId = this.currentTrip.tripId;
    Store.removeTrip(tripId);
    ChangeBuffer.add('trip', 'delete', tripId, {}, 'travel');
    Utils.showToast('出張予定を削除しました（保存待ち）', 'info');

    this.close();
    TravelPlan.render();
  },

  lock() {
    if (!this.currentTrip) return;

    if (!confirm('この予定を確定しますか？確定後は編集できなくなります。')) return;

    const tripId = this.currentTrip.tripId;
    Store.updateTripInStore(tripId, { isLocked: true });
    ChangeBuffer.add('trip', 'lock', tripId, {}, 'travel');
    Utils.showToast('出張予定を確定しました（保存待ち）', 'info');

    this.close();
    TravelPlan.render();
  },

  /**
   * 移動予定をワンクリックで追加
   */
  addMove() {
    const personId = document.getElementById('trip-person').value;
    const start = document.getElementById('trip-start').value;
    const end = document.getElementById('trip-end').value;

    if (!personId || !start || !end) {
      Utils.showToast('担当者と日付を選択してください', 'error');
      return;
    }

    const payload = {
      personId,
      start,
      end,
      '行先': '',
      '用件': '移動',
      '備考': '',
      kind: 'move',
      source: 'manual'
    };

    const tempId = 'temp_' + Utils.generateId();
    const newTrip = {
      tripId: tempId,
      ...payload,
      isLocked: false,
      updatedAt: new Date().toISOString()
    };
    Store.addTrip(newTrip);
    ChangeBuffer.add('trip', 'upsert', tempId, payload, 'travel');
    Utils.showToast('移動予定を追加しました（保存待ち）', 'info');

    this.close();
    TravelPlan.render();
  }
};
