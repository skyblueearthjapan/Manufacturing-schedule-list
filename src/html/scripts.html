// ========================================

const WorkerJobAssignView = {
  // フィルター状態
  filters: {
    activeOnly: true,
    mainOnly: false,
    searchQuery: ''
  },

  init() {
    Store.subscribe((state) => {
      if (state.currentView === 'resource') {
        this.render();
      }
    });
  },

  /**
   * Jobs から割り振りデータを生成（Source of Truth = Jobs）
   * @param {Object[]} jobs - Jobs配列
   * @param {Object[]} people - People配列
   * @returns {Object[]} assignment配列
   */
  buildWorkerAssignmentsFromJobs(jobs, people) {
    const assignments = [];
    const peopleMap = {};
    people.forEach(p => {
      // personId を正規化（trim）してマップに格納
      const normalizedId = String(p.personId || '').trim();
      peopleMap[normalizedId] = p;
    });

    console.log('[WorkerJobAssignView] Building assignments from Jobs');
    console.log('[WorkerJobAssignView] People IDs:', Object.keys(peopleMap));
    console.log('[WorkerJobAssignView] Jobs count:', jobs.length);

    jobs.forEach(job => {
      const jobId = job.jobId || '';
      const jobCode = job['工番'] || '';
      const customerName = job['顧客名'] || '';
      const productName = job['設備/製品名'] || '';

      // mainPersonId を正規化
      const mainPersonId = String(job.mainPersonId || '').trim();
      // subPersonId を正規化
      const subPersonId = String(job.subPersonId || '').trim();

      // 主担当者の割り振り
      if (mainPersonId) {
        const person = peopleMap[mainPersonId];
        if (person) {
          assignments.push({
            assignId: `${jobId}:main:${mainPersonId}`,
            personId: mainPersonId,
            personName: person['氏名'] || '',
            jobId,
            jobCode,
            customerName,
            productName,
            mainProcess: '',
            mainProcessName: '',
            role: 'main',
            priority: 10,
            isActive: true,
            memo: ''
          });
        } else {
          console.warn(`[WorkerJobAssignView] mainPersonId "${mainPersonId}" not found in People (Job: ${jobCode})`);
        }
      }

      // 副担当者の割り振り（主担当と異なる場合のみ）
      if (subPersonId && subPersonId !== mainPersonId) {
        const person = peopleMap[subPersonId];
        if (person) {
          assignments.push({
            assignId: `${jobId}:sub:${subPersonId}`,
            personId: subPersonId,
            personName: person['氏名'] || '',
            jobId,
            jobCode,
            customerName,
            productName,
            mainProcess: '',
            mainProcessName: '',
            role: 'sub',
            priority: 20,
            isActive: true,
            memo: ''
          });
        } else {
          console.warn(`[WorkerJobAssignView] subPersonId "${subPersonId}" not found in People (Job: ${jobCode})`);
        }
      }
    });

    console.log('[WorkerJobAssignView] Generated assignments:', assignments.length);

    // priority → jobCode 順でソート
    assignments.sort((a, b) => {
      if (a.priority !== b.priority) return a.priority - b.priority;
      return String(a.jobCode || '').localeCompare(String(b.jobCode || ''));
    });

    return assignments;
  },

  /**
   * メインレンダリング
   */
  render() {
    const container = document.getElementById('view-resource');
    if (!container) return;

    const { jobs, people } = Store.state;

    console.log('[WorkerJobAssignView] render() called');
    console.log('[WorkerJobAssignView] Store.state.jobs count:', jobs?.length || 0);
    console.log('[WorkerJobAssignView] Store.state.people count:', people?.length || 0);

    // Jobs から割り振りを生成（Source of Truth = Jobs）
    const assignments = this.buildWorkerAssignmentsFromJobs(jobs || [], people || []);

    // 作業者情報をマップ化（部署など取得用）
    const peopleMap = {};
    (people || []).forEach(p => {
      const normalizedId = String(p.personId || '').trim();
      peopleMap[normalizedId] = p;
    });

    // フィルタリング
    let filtered = this.applyFilters(assignments);

    // personIdでグルーピング
    const grouped = this.groupByPerson(filtered, peopleMap);

    // HTML生成
    container.innerHTML = this.renderContainer(grouped, peopleMap);

    // イベントハンドラーを設定
    this.setupEventHandlers();
  },

  /**
   * フィルター適用
   */
  applyFilters(assigns) {
    let result = [...assigns];

    // 有効のみフィルタ（isActive=false を除外）
    if (this.filters.activeOnly) {
      result = result.filter(a => a.isActive !== false);
    }

    // 主担当のみフィルタ
    if (this.filters.mainOnly) {
      result = result.filter(a => a.role === 'main');
    }

    // 検索フィルタ
    if (this.filters.searchQuery.trim()) {
      const q = this.filters.searchQuery.toLowerCase();
      result = result.filter(a => {
        const jobCode = String(a.jobCode || '').toLowerCase();
        const customerName = String(a.customerName || '').toLowerCase();
        const productName = String(a.productName || '').toLowerCase();
        return jobCode.includes(q) || customerName.includes(q) || productName.includes(q);
      });
    }

    return result;
  },

  /**
   * personIdでグルーピング
   */
  groupByPerson(assigns, peopleMap) {
    const groups = {};
    assigns.forEach(a => {
      const personId = String(a.personId || '').trim();
      if (!groups[personId]) {
        groups[personId] = {
          personId,
          personName: a.personName || peopleMap[personId]?.['氏名'] || '不明',
          dept: peopleMap[personId]?.['部署/区分'] || '',
          color: peopleMap[personId]?.['作業者色(colorHex)'] || '#6b7280',
          assigns: []
        };
      }
      groups[personId].assigns.push(a);
    });
    return groups;
  },

  /**
   * コンテナHTML生成
   */
  renderContainer(grouped, peopleMap) {
    const personIds = Object.keys(grouped);

    // 部署→氏名順でソート
    personIds.sort((a, b) => {
      const deptA = grouped[a].dept || '';
      const deptB = grouped[b].dept || '';
      if (deptA !== deptB) return deptA.localeCompare(deptB);
      return grouped[a].personName.localeCompare(grouped[b].personName);
    });

    return `
      <div class="wja-container">
        <!-- フィルターバー -->
        <div class="wja-filter-bar">
          <div class="wja-filter-left">
            <label class="wja-toggle">
              <input type="checkbox" id="wja-filter-active" ${this.filters.activeOnly ? 'checked' : ''}>
              <span>有効のみ</span>
            </label>
            <label class="wja-toggle">
              <input type="checkbox" id="wja-filter-main" ${this.filters.mainOnly ? 'checked' : ''}>
              <span>主担当のみ</span>
            </label>
          </div>
          <div class="wja-filter-right">
            <input type="text" id="wja-search" class="wja-search-input"
                   placeholder="工番・顧客・製品で検索..."
                   value="${Utils.escapeHtml(this.filters.searchQuery)}">
          </div>
        </div>

        <!-- カード一覧 -->
        <div class="wja-body">
          ${personIds.length === 0 ? this.renderEmpty() : personIds.map(pid => this.renderPersonSection(grouped[pid])).join('')}
        </div>
      </div>
    `;
  },

  /**
   * 空の場合の表示
   */
  renderEmpty() {
    return `
      <div class="wja-empty">
        <div class="wja-empty-icon">📋</div>
        <div class="wja-empty-text">該当する担当工番がありません</div>
      </div>
    `;
  },

  /**
   * 作業者セクション生成
   */
  renderPersonSection(group) {
    const { personId, personName, dept, color, assigns } = group;

    return `
      <div class="wja-person-section">
        <div class="wja-person-header" style="border-left: 4px solid ${color}">
          <span class="wja-person-dept">${Utils.escapeHtml(dept)}</span>
          <span class="wja-person-name">${Utils.escapeHtml(personName)}</span>
          <span class="wja-person-count">${assigns.length}件</span>
        </div>
        <div class="wja-card-grid">
          ${assigns.map(a => this.renderCard(a)).join('')}
        </div>
      </div>
    `;
  },

  /**
   * 工番カード生成
   */
  renderCard(assign) {
    const jobCode = assign.jobCode || '';
    const customerName = assign.customerName || '';
    const productName = assign.productName || '';
    const mainProcessName = assign.mainProcessName || '';
    const role = assign.role || 'main';
    const memo = assign.memo || '';
    const jobId = assign.jobId || '';

    // roleバッジ
    const roleBadge = role === 'main'
      ? '<span class="wja-role-badge wja-role-main">主</span>'
      : '<span class="wja-role-badge wja-role-sub">副</span>';

    return `
      <div class="wja-card" data-job-id="${Utils.escapeHtml(jobId)}" data-job-code="${Utils.escapeHtml(jobCode)}">
        <div class="wja-card-row1">
          <span class="wja-card-jobcode">${Utils.escapeHtml(jobCode)}</span>
          ${roleBadge}
        </div>
        <div class="wja-card-row2">${Utils.escapeHtml(customerName) || '—'}</div>
        <div class="wja-card-row3">${Utils.escapeHtml(productName) || '—'}</div>
        ${mainProcessName || memo ? `<div class="wja-card-row4">${Utils.escapeHtml(mainProcessName)}${memo ? ' / ' + Utils.escapeHtml(memo) : ''}</div>` : ''}
      </div>
    `;
  },

  /**
   * イベントハンドラー設定
   */
  setupEventHandlers() {
    // 有効のみトグル
    const activeCheckbox = document.getElementById('wja-filter-active');
    if (activeCheckbox) {
      activeCheckbox.addEventListener('change', (e) => {
        this.filters.activeOnly = e.target.checked;
        this.render();
      });
    }

    // 主担当のみトグル
    const mainCheckbox = document.getElementById('wja-filter-main');
    if (mainCheckbox) {
      mainCheckbox.addEventListener('change', (e) => {
        this.filters.mainOnly = e.target.checked;
        this.render();
      });
    }

    // 検索入力
    const searchInput = document.getElementById('wja-search');
    if (searchInput) {
      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          this.filters.searchQuery = e.target.value;
          this.render();
          // 再レンダリング後にフォーカスを維持
          const newInput = document.getElementById('wja-search');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        }, 300);
      });
    }

    // カードクリック → 工番別工程表へ遷移
    document.querySelectorAll('.wja-card').forEach(card => {
      card.addEventListener('click', (e) => {
        const jobId = card.dataset.jobId;
        const jobCode = card.dataset.jobCode;
        if (jobId) {
          this.openJobDetail(jobId, jobCode);
        }
      });
    });
  },

  /**
   * 工番別工程表を開く
   */
  openJobDetail(jobId, jobCode) {
    console.log('[WorkerJobAssignView] Opening job detail:', jobId, jobCode);
    // 既存のJobDetailを開く処理を呼び出す
    if (typeof JobDetail !== 'undefined' && JobDetail.open) {
      JobDetail.open(jobId);
    } else {
      console.warn('JobDetail.open is not available');
      Utils.showToast(`工番 ${jobCode} の詳細を開く機能は準備中です`, 'info');
    }
  }
};

// WeeklyPlan - 今週の予定（週刊重要工程形式）
// ========================================

const WeeklyPlan = {
  weekStart: null,

  init() {
    this.weekStart = this.getWeekStart(new Date());

    Store.subscribe((state) => {
      if (state.currentView === 'weekly') {
        this.render();
      }
    });
  },

  getWeekStart(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    d.setDate(diff);
    return Utils.formatDate(d);
  },

  getWeekEnd(weekStart) {
    return Utils.addDays(weekStart, 6);
  },

  prevWeek() {
    this.weekStart = Utils.addDays(this.weekStart, -7);
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  nextWeek() {
    this.weekStart = Utils.addDays(this.weekStart, 7);
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  goToThisWeek() {
    this.weekStart = this.getWeekStart(new Date());
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  onDateChange() {
    const inputDate = document.getElementById('weekly-start-date').value;
    this.weekStart = this.getWeekStart(new Date(inputDate));
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  /**
   * 重要工程かどうかを判定
   * ProcessMaster の isWeekly フラグで判定
   */
  isImportantProcess(process) {
    if (!process) return false;
    // isWeekly が true の工程のみを重要工程として扱う
    return process.isWeekly === true;
  },

  /**
   * 週間データを構築（重要工程のみ抽出）
   */
  buildImportantWeekRows() {
    const { schedules, jobs, processes } = Store.state;
    const weekEnd = this.getWeekEnd(this.weekStart);
    const dates = Utils.generateDateRange(this.weekStart, 7);

    // 重要工程の processId を収集
    const importantProcessIds = new Set(
      processes.filter(p => this.isImportantProcess(p)).map(p => p.processId)
    );

    // この週にかかるスケジュールを抽出（重要工程のみ）
    const weekSchedules = schedules.filter(s =>
      s.end >= this.weekStart &&
      s.start <= weekEnd &&
      importantProcessIds.has(s.processId)
    );

    // jobId ごとにグループ化
    const jobScheduleMap = new Map();
    weekSchedules.forEach(schedule => {
      if (!jobScheduleMap.has(schedule.jobId)) {
        jobScheduleMap.set(schedule.jobId, []);
      }
      jobScheduleMap.get(schedule.jobId).push(schedule);
    });

    // 重要工程がある工番だけを rows として構築
    const rows = [];
    jobScheduleMap.forEach((jobSchedules, jobId) => {
      const job = Store.getJobById(jobId);
      if (!job) return;

      // 曜日ごとの工程名を収集
      const dayCells = dates.map(date => {
        const dayProcesses = [];
        jobSchedules.forEach(schedule => {
          if (date >= schedule.start && date <= schedule.end) {
            const process = Store.getProcessById(schedule.processId);
            if (process) {
              dayProcesses.push({
                name: Store.getProcessDisplayName(schedule.processId),
                color: Utils.normalizeColor(process['工程色(colorHex)']) || '#6B7280',
                label: schedule.label || ''
              });
            }
          }
        });
        return dayProcesses;
      });

      rows.push({
        jobId,
        job,
        dayCells
      });
    });

    // 工番順でソート（出荷予定日が近い順）
    rows.sort((a, b) => {
      const dateA = a.job['出荷予定日'] || '9999-12-31';
      const dateB = b.job['出荷予定日'] || '9999-12-31';
      return dateA.localeCompare(dateB);
    });

    return { rows, dates };
  },

  /**
   * 工番情報セル（3行固定）を生成
   */
  buildJobInfoCell(job) {
    const jobNo = job['工番'] || '';
    const product = job['設備/製品名'] || '';
    const qty = job['台数'] || '';
    const customer = job['顧客名'] || '';
    const drawDate = job['出図予定日'] ? Utils.formatShortDate(job['出図予定日']) : '';
    const shipDate = job['出荷予定日'] ? Utils.formatShortDate(job['出荷予定日']) : '';

    // 1行目: 工番 製品名（台数）
    const line1 = `${jobNo}　${product}${qty ? '（' + qty + '）' : ''}`;

    // 2行目: 顧客名
    const line2 = customer ? `顧客：${customer}` : '';

    // 3行目: 出図/出荷予定日
    let line3Parts = [];
    if (drawDate) line3Parts.push(`出図：${drawDate}`);
    if (shipDate) line3Parts.push(`出荷：${shipDate}`);
    const line3 = line3Parts.join('　');

    return `
      <div class="job-line1">${Utils.escapeHtml(line1)}</div>
      ${line2 ? `<div class="job-line2">${Utils.escapeHtml(line2)}</div>` : ''}
      ${line3 ? `<div class="job-line3">${Utils.escapeHtml(line3)}</div>` : ''}
    `;
  },

  render() {
    this.updateHeader();
    this.renderDateRow();
    this.renderTable();
  },

  updateHeader() {
    const weekEnd = this.getWeekEnd(this.weekStart);
    const startMonth = Utils.getMonth(this.weekStart);
    const startDay = Utils.getDay(this.weekStart);
    const endMonth = Utils.getMonth(weekEnd);
    const endDay = Utils.getDay(weekEnd);

    document.getElementById('weekly-range-display').textContent =
      `${startMonth}/${startDay}（${Utils.getDayOfWeek(this.weekStart)}）〜 ${endMonth}/${endDay}（${Utils.getDayOfWeek(weekEnd)}）`;

    document.getElementById('weekly-start-date').value = this.weekStart;
  },

  renderDateRow() {
    const dates = Utils.generateDateRange(this.weekStart, 7);
    const today = Utils.getToday();
    const dateRow = document.getElementById('weekly-date-row');
    if (!dateRow) return;

    let html = '<th></th>'; // 工番情報列の空セル
    dates.forEach((date, index) => {
      const isWeekend = index >= 5; // 土日
      const isToday = date === today;
      const weekendClass = isWeekend ? 'weekend' : '';
      const todayClass = isToday ? 'today' : '';

      html += `<th class="${weekendClass} ${todayClass}">${Utils.getMonth(date)}/${Utils.getDay(date)}</th>`;
    });

    dateRow.innerHTML = html;
  },

  renderTable() {
    const tbody = document.getElementById('weekly-tbody');
    if (!tbody) return;

    const { rows, dates } = this.buildImportantWeekRows();
    const today = Utils.getToday();

    if (rows.length === 0) {
      tbody.innerHTML = `
        <tr class="weekly-empty-row">
          <td colspan="8">この週に重要工程（★）がある工番はありません</td>
        </tr>
      `;
      return;
    }

    let html = '';
    rows.forEach(row => {
      html += '<tr>';

      // 工番情報セル（3行固定）
      html += `<td class="weekly-job-cell">${this.buildJobInfoCell(row.job)}</td>`;

      // 曜日セル（月〜日）
      row.dayCells.forEach((dayProcesses, index) => {
        const date = dates[index];
        const isWeekend = index >= 5;
        const isToday = date === today;
        let cellClass = 'weekly-day-cell';
        if (isWeekend) cellClass += ' weekend';
        if (isToday) cellClass += ' today';

        let cellContent = '';
        if (dayProcesses.length > 0) {
          // 同日に複数の重要工程がある場合は "/" で区切る
          if (dayProcesses.length === 1) {
            const p = dayProcesses[0];
            cellContent = `<span class="weekly-process-tag" style="background-color: ${p.color};" title="${p.name}${p.label ? ' - ' + p.label : ''}">${Utils.escapeHtml(p.name)}</span>`;
          } else {
            // 複数の場合：名前を "/" で結合、色は最初の工程の色を使用
            const names = dayProcesses.map(p => p.name).join(' / ');
            const firstColor = dayProcesses[0].color;
            cellContent = `<span class="weekly-process-tag" style="background-color: ${firstColor};" title="${names}">${Utils.escapeHtml(names)}</span>`;
          }
        }

        html += `<td class="${cellClass}">${cellContent}</td>`;
      });

      html += '</tr>';
    });

    tbody.innerHTML = html;
  },

  exportCSV() {
    const { rows, dates } = this.buildImportantWeekRows();

    const headers = ['工番', '製品名', '顧客名', '出荷予定日', '月', '火', '水', '木', '金', '土', '日'];
    const csvRows = rows.map(row => {
      const job = row.job;
      const dayCells = row.dayCells.map(dayProcesses =>
        dayProcesses.map(p => p.name).join(' / ')
      );
      return [
        job['工番'] || '',
        job['設備/製品名'] || '',
        job['顧客名'] || '',
        job['出荷予定日'] || '',
        ...dayCells
      ];
    });

    const csv = [headers, ...csvRows]
      .map(row => row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(','))
      .join('\n');

    const bom = '\uFEFF';
    const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `週刊重要工程_${this.weekStart}.csv`;
    a.click();

    URL.revokeObjectURL(url);
    Utils.showToast('CSVをダウンロードしました', 'success');
  }
};

const TripModal = {
  currentTrip: null,
  isNew: false,
  _presetPersonId: null,  // セル選択からの事前設定

  /**
   * セル選択から新規作成モードで開く
   * @param {string} personId - 作業者ID
   * @param {string} startDate - 開始日
   * @param {string} endDate - 終了日
   */
  openNew(personId, startDate, endDate) {
    this._presetPersonId = personId;
    this.open(null);

    // 事前設定を適用
    document.getElementById('trip-person').value = personId;
    document.getElementById('trip-start').value = startDate;
    document.getElementById('trip-end').value = endDate;

    // 移動ボタンを表示
    document.getElementById('trip-add-move-btn').classList.remove('hidden');
  },

  open(trip) {
    this.currentTrip = trip;
    this.isNew = !trip;

    const modal = document.getElementById('modal-trip');
    const title = document.getElementById('trip-modal-title');
    const personSelect = document.getElementById('trip-person');

    // タイトル設定
    title.textContent = this.isNew ? '出張予定を追加' : '出張予定を編集';

    // 担当者プルダウン生成
    const { people } = Store.state;
    personSelect.innerHTML = '<option value="">選択してください</option>' +
      people.map(p => `<option value="${p.personId}">${Utils.escapeHtml(p['氏名'])} (${Utils.escapeHtml(p['部署/区分'] || '')})</option>`).join('');

    if (trip) {
      // 編集モード
      document.getElementById('trip-id').value = trip.tripId || '';
      document.getElementById('trip-expected-updated-at').value = trip.updatedAt || '';
      document.getElementById('trip-person').value = trip.personId || '';
      document.getElementById('trip-start').value = trip.start || '';
      document.getElementById('trip-end').value = trip.end || '';
      document.getElementById('trip-destination').value = trip['行先'] || '';
      document.getElementById('trip-purpose').value = trip['用件'] || '';
      document.getElementById('trip-note').value = trip['備考'] || '';

      // ステータスバッジ
      const sourceBadge = document.getElementById('trip-source-badge');
      const lockedBadge = document.getElementById('trip-locked-badge');

      if (trip.source === 'auto') {
        sourceBadge.textContent = '自動生成';
        sourceBadge.className = 'px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-700';
      } else {
        sourceBadge.textContent = '手動登録';
        sourceBadge.className = 'px-2 py-0.5 rounded text-xs bg-green-100 text-green-700';
      }

      if (trip.isLocked) {
        lockedBadge.textContent = '🔒 確定済み';
        lockedBadge.className = 'px-2 py-0.5 rounded text-xs bg-amber-100 text-amber-700';
        lockedBadge.classList.remove('hidden');
      } else {
        lockedBadge.classList.add('hidden');
      }

      // ロック済みの場合は編集不可
      this.setReadonly(trip.isLocked === true);

      document.getElementById('trip-delete-btn').classList.remove('hidden');
      document.getElementById('trip-lock-btn').classList.toggle('hidden', trip.isLocked === true);
    } else {
      // 新規モード
      document.getElementById('trip-id').value = '';
      document.getElementById('trip-expected-updated-at').value = '';
      document.getElementById('trip-person').value = '';
      document.getElementById('trip-start').value = Utils.getToday();
      document.getElementById('trip-end').value = Utils.getToday();
      document.getElementById('trip-destination').value = '';
      document.getElementById('trip-purpose').value = '';
      document.getElementById('trip-note').value = '';

      document.getElementById('trip-source-badge').textContent = '';
      document.getElementById('trip-locked-badge').classList.add('hidden');
      document.getElementById('trip-delete-btn').classList.add('hidden');
      document.getElementById('trip-lock-btn').classList.add('hidden');
      document.getElementById('trip-add-move-btn').classList.add('hidden');

      this.setReadonly(false);
    }

    modal.classList.remove('hidden');
  },

  setReadonly(isReadonly) {
    const form = document.getElementById('trip-form');
    const inputs = form.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
      if (input.type !== 'hidden') {
        input.disabled = isReadonly;
      }
    });

    document.getElementById('trip-save-btn').disabled = isReadonly;
    if (isReadonly) {
      document.getElementById('trip-save-btn').classList.add('opacity-50', 'cursor-not-allowed');
    } else {
      document.getElementById('trip-save-btn').classList.remove('opacity-50', 'cursor-not-allowed');
    }
  },

  close() {
    document.getElementById('modal-trip').classList.add('hidden');
    this.currentTrip = null;
    this.isNew = false;
  },

  async save() {
    const personId = document.getElementById('trip-person').value;
    const start = document.getElementById('trip-start').value;
    const end = document.getElementById('trip-end').value;
    const destination = document.getElementById('trip-destination').value;
    const purpose = document.getElementById('trip-purpose').value;
    const note = document.getElementById('trip-note').value;

    if (!personId || !start || !end || !destination) {
      Utils.showToast('必須項目を入力してください', 'error');
      return;
    }

    if (start > end) {
      Utils.showToast('終了日は開始日以降にしてください', 'error');
      return;
    }

    try {
      Utils.setLoading(true);

      const payload = {
        personId,
        start,
        end,
        '行先': destination,
        '用件': purpose,
        '備考': note,
        source: 'manual'
      };

      if (this.isNew) {
        // 新規作成
        await API.call('api_createTrip', payload);
        Utils.showToast('出張予定を登録しました', 'success');
      } else {
        // 更新
        const tripId = document.getElementById('trip-id').value;
        const expectedUpdatedAt = document.getElementById('trip-expected-updated-at').value;
        await API.call('api_updateTrip', tripId, payload, expectedUpdatedAt);
        Utils.showToast('出張予定を更新しました', 'success');
      }

      this.close();
      await Store.loadBootstrapData();
    } catch (error) {
      console.error('Trip save failed:', error);
      Utils.showToast('保存に失敗しました: ' + error.message, 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  async delete() {
    if (!this.currentTrip) return;

    if (!confirm('この出張予定を削除しますか？')) return;

    try {
      Utils.setLoading(true);
      await API.call('api_deleteTrip', this.currentTrip.tripId);
      Utils.showToast('出張予定を削除しました', 'success');
      this.close();
      await Store.loadBootstrapData();
    } catch (error) {
      console.error('Trip delete failed:', error);
      Utils.showToast('削除に失敗しました: ' + error.message, 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  async lock() {
    if (!this.currentTrip) return;

    if (!confirm('この予定を確定しますか？確定後は編集できなくなります。')) return;

    try {
      Utils.setLoading(true);
      await API.call('api_lockTrip', this.currentTrip.tripId, true);
      Utils.showToast('出張予定を確定しました', 'success');
      this.close();
      await Store.loadBootstrapData();
    } catch (error) {
      console.error('Trip lock failed:', error);
      Utils.showToast('確定に失敗しました: ' + error.message, 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  /**
   * 移動予定をワンクリックで追加
   */
  async addMove() {
    const personId = document.getElementById('trip-person').value;
    const start = document.getElementById('trip-start').value;
    const end = document.getElementById('trip-end').value;

    if (!personId || !start || !end) {
      Utils.showToast('担当者と日付を選択してください', 'error');
      return;
    }

    try {
      Utils.setLoading(true);

      const payload = {
        personId,
        start,
        end,
        '行先': '',
        '用件': '移動',
        '備考': '',
        kind: 'move',
        source: 'manual'
      };

      await API.call('api_createTrip', payload);
      Utils.showToast('移動予定を追加しました', 'success');

      this.close();
      await Store.loadBootstrapData();
    } catch (error) {
      console.error('Add move failed:', error);
      Utils.showToast('移動追加に失敗しました: ' + error.message, 'error');
    } finally {
      Utils.setLoading(false);
    }
  }
};

const TravelPlan = {
  config: {
    cellWidth: 70,  // 日付列幅
    rowHeight: 72,
    maxExpandDays: 4,  // 現場カード自動拡大の最大日数（追加分）
    cardPadding: 24,   // カード内パディング
    cardGap: 4         // カード間の隙間
  },
  dates: [],
  displayStartDate: null,
  displayDays: 90,
  _measureCanvas: null,
  // 日付ごとの追加幅マップ（押し広げ用）
  _dateExtraWidths: {},  // { 'YYYY-MM-DD': extraPx }
  // セル選択状態
  _selecting: false,
  _selectPersonId: null,
  _selectStartDate: null,
  _selectEndDate: null,

  init() {
    this.displayStartDate = Utils.getToday();

    // UI初期化
    document.getElementById('travel-start-date').value = this.displayStartDate;
    document.getElementById('travel-days').value = this.displayDays;

    // イベントリスナー
    document.getElementById('travel-start-date')?.addEventListener('change', () => {
      this.onDisplayRangeChange();
    });
    document.getElementById('travel-days')?.addEventListener('change', () => {
      this.onDisplayRangeChange();
    });

    // スクロール同期
    const scrollArea = document.getElementById('travel-scroll-area');
    const scrollHeader = document.querySelector('.travel-scroll-header');
    if (scrollArea && scrollHeader) {
      scrollArea.addEventListener('scroll', () => {
        scrollHeader.scrollLeft = scrollArea.scrollLeft;
      });
    }

    Store.subscribe((state) => {
      if (state.currentView === 'travel') {
        this.render();
      }
    });
  },

  onDisplayRangeChange() {
    this.displayStartDate = document.getElementById('travel-start-date').value;
    this.displayDays = parseInt(document.getElementById('travel-days').value, 10);
    this.render();
  },

  async generateTrips() {
    try {
      Utils.setLoading(true);
      const rangeEnd = Utils.addDays(this.displayStartDate, this.displayDays);
      const result = await API.call('api_generateTravelPlan', this.displayStartDate, rangeEnd);

      Utils.showToast(`自動生成完了: 作成${result.created}件, 更新${result.updated}件, スキップ${result.skipped}件`, 'success');

      // データ再読み込み
      await Store.loadBootstrapData();
    } catch (error) {
      console.error('Travel plan generation failed:', error);
      Utils.showToast('自動生成に失敗しました: ' + error.message, 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  addNewTrip() {
    TripModal.open(null);
  },

  /**
   * テキスト幅を計測（Canvas使用）
   * @param {string} text - 計測するテキスト
   * @param {string} font - フォント指定（例: '11px sans-serif'）
   * @returns {number} ピクセル幅
   */
  measureTextWidth(text, font = '11px sans-serif') {
    if (!this._measureCanvas) {
      this._measureCanvas = document.createElement('canvas');
    }
    const ctx = this._measureCanvas.getContext('2d');
    ctx.font = font;
    return ctx.measureText(text).width;
  },

  /**
   * 現場カードの必要幅を計算
   * @param {string} line1 - 1行目（工番+顧客名）
   * @param {string} line2 - 2行目（製品名）
   * @param {string} line3 - 3行目（場所）
   * @returns {number} 必要なピクセル幅
   */
  calculateSiteCardWidth(line1, line2, line3) {
    const width1 = this.measureTextWidth(line1, '600 11px sans-serif');
    const width2 = this.measureTextWidth(line2, '10px sans-serif');
    const width3 = this.measureTextWidth(line3, '10px sans-serif');
    const maxTextWidth = Math.max(width1, width2, width3);
    return maxTextWidth + this.config.cardPadding + 20;
  },

  /**
   * 日付からx座標を取得（累積extraWidthを考慮）
   * @param {string} date - YYYY-MM-DD
   * @returns {number} x座標（px）
   */
  getXForDate(date) {
    const dateIndex = this.dates.indexOf(date);
    if (dateIndex < 0) return 0;

    let x = 0;
    for (let i = 0; i < dateIndex; i++) {
      x += this.config.cellWidth;
      x += (this._dateExtraWidths[this.dates[i]] || 0);
    }
    return x;
  },

  /**
   * 日付のセル幅を取得（base + extra）
   * @param {string} date - YYYY-MM-DD
   * @returns {number} セル幅（px）
   */
  getCellWidthForDate(date) {
    return this.config.cellWidth + (this._dateExtraWidths[date] || 0);
  },

  /**
   * グリッド全体の幅を取得
   * @returns {number} 全体幅（px）
   */
  getTotalGridWidth() {
    let width = 0;
    this.dates.forEach(date => {
      width += this.config.cellWidth + (this._dateExtraWidths[date] || 0);
    });
    return width;
  },

  /**
   * 全作業者の予定から必要なextraWidthを計算
   * @param {Object[]} trips - 全予定
   */
  calculateExtraWidths(trips) {
    this._dateExtraWidths = {};

    // 現場カード（site）のみ対象
    const siteTrips = trips.filter(t => t.kind === 'site');

    siteTrips.forEach(trip => {
      const startOffset = Utils.getDaysBetween(this.displayStartDate, trip.start);
      const duration = Utils.getDaysBetween(trip.start, trip.end) + 1;

      // 表示範囲外はスキップ
      if (startOffset + duration < 0 || startOffset >= this.dates.length) return;

      // テキスト幅を計測
      const description = trip['用件'] || '';
      const lines = description.split('\n');
      const line1 = lines[0] || '';
      const line2 = lines[1] || '';
      const line3 = lines[2] || trip['行先'] || '';

      const neededWidth = this.calculateSiteCardWidth(line1, line2, line3);
      const baseWidth = duration * this.config.cellWidth;

      // 追加幅が必要な場合
      if (neededWidth > baseWidth) {
        let extraWidth = neededWidth - baseWidth;
        // 上限: maxExpandDays日分
        const maxExtra = this.config.maxExpandDays * this.config.cellWidth;
        extraWidth = Math.min(extraWidth, maxExtra);

        // 開始日に追加幅を設定（既存より大きい場合のみ更新）
        const startDate = trip.start;
        if (!this._dateExtraWidths[startDate] || this._dateExtraWidths[startDate] < extraWidth) {
          this._dateExtraWidths[startDate] = extraWidth;
        }
      }
    });
  },

  /**
   * 作業者の予定をレイアウト計算（押し広げ対応）
   * @param {Object[]} personTrips - 作業者の予定
   * @returns {Object[]} レイアウト情報付き予定
   */
  calculatePersonLayout(personTrips) {
    // 開始日でソート
    const sorted = [...personTrips].sort((a, b) => a.start.localeCompare(b.start));

    return sorted.map(trip => {
      const startOffset = Utils.getDaysBetween(this.displayStartDate, trip.start);
      const duration = Utils.getDaysBetween(trip.start, trip.end) + 1;

      // 表示範囲外
      if (startOffset + duration < 0 || startOffset >= this.dates.length) {
        return { ...trip, _visible: false };
      }

      // x座標は累積extraWidthを考慮
      const xStart = this.getXForDate(trip.start);

      // カード幅の計算
      let cardWidth;
      if (trip.kind === 'site') {
        // 現場カード: 拡張幅を含む
        const description = trip['用件'] || '';
        const lines = description.split('\n');
        const neededWidth = this.calculateSiteCardWidth(lines[0] || '', lines[1] || '', lines[2] || trip['行先'] || '');
        const baseWidth = duration * this.config.cellWidth;
        const extraWidth = this._dateExtraWidths[trip.start] || 0;
        cardWidth = Math.max(neededWidth, baseWidth + extraWidth) - this.config.cardGap;
      } else {
        // 移動カード: 基本幅のみ
        cardWidth = duration * this.config.cellWidth - this.config.cardGap;
      }

      return {
        ...trip,
        _visible: true,
        _xStart: xStart,
        _width: cardWidth,
        _duration: duration
      };
    });
  },

  render() {
    const { people, trips } = Store.state;
    this.dates = Utils.generateDateRange(this.displayStartDate, this.displayDays);

    // Phase B: まず全予定から必要なextraWidthを計算
    this.calculateExtraWidths(trips);

    // 日付ヘッダーとボディをレンダリング
    this.renderDateHeader();
    this.renderBody(people, trips);
  },

  renderDateHeader() {
    const container = document.getElementById('travel-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;

    // 日付セルを動的幅でレンダリング（extraWidth対応）
    this.dates.forEach(date => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;

      const showMonth = month !== currentMonth;
      currentMonth = month;

      // このセルの幅（base + extra）
      const cellWidth = this.getCellWidthForDate(date);

      let classes = 'travel-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';

      html += `
        <div class="${classes}" style="width: ${cellWidth}px; min-width: ${cellWidth}px;">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  renderBody(people, trips) {
    const container = document.getElementById('travel-body');
    if (!container) return;

    const today = Utils.getToday();
    const totalWidth = this.getTotalGridWidth();

    if (people.length === 0) {
      container.innerHTML = '<div class="travel-empty-message">作業者が登録されていません</div>';
      return;
    }

    let html = '';

    people.forEach(person => {
      const personTrips = trips.filter(t => t.personId === person.personId);
      const dept = person['部署/区分'] || '';
      const name = person['氏名'] || '';
      const personColor = Utils.normalizeColor(person['作業者色(colorHex)']) || '#6b7280';

      // レイアウト計算（押し広げ対応）
      const layoutTrips = this.calculatePersonLayout(personTrips);

      html += `
        <div class="travel-person-row">
          <div class="travel-person-info" style="border-left: 4px solid ${personColor}">
            <div class="dept">${Utils.escapeHtml(dept)}</div>
            <div class="name">${Utils.escapeHtml(name)}</div>
            <div class="memo"></div>
          </div>
          <div class="travel-person-grid" style="width: ${totalWidth}px;">
      `;

      // グリッドセル（動的幅、クリック/ドラッグ選択対応）
      this.dates.forEach(date => {
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;
        const cellWidth = this.getCellWidthForDate(date);

        let classes = 'travel-grid-cell';
        if (isWeekend) classes += ' weekend';
        if (isToday) classes += ' today';
        html += `<div class="${classes}"
                      style="width: ${cellWidth}px; min-width: ${cellWidth}px;"
                      data-person-id="${person.personId}"
                      data-date="${date}"></div>`;
      });

      // 予定バー（レイアウト計算済み）
      layoutTrips.forEach(trip => {
        if (trip._visible) {
          html += this.renderTripBarWithLayout(trip);
        }
      });

      html += `
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

    // トリップバーにクリックイベントを追加
    this.setupTripClickHandlers(trips);
  },

  setupTripClickHandlers(trips) {
    // 既存の予定バークリック
    const tripBars = document.querySelectorAll('[data-trip-id]');
    tripBars.forEach(bar => {
      bar.style.cursor = 'pointer';
      bar.addEventListener('click', (e) => {
        e.stopPropagation();  // グリッドセルへの伝播を止める
        const tripId = e.currentTarget.dataset.tripId;
        const trip = trips.find(t => t.tripId === tripId);
        if (trip) {
          TripModal.open(trip);
        }
      });
    });

    // グリッドセルのクリック/ドラッグ選択
    this.setupCellSelectionHandlers();
  },

  /**
   * セル選択ハンドラーをセットアップ
   */
  setupCellSelectionHandlers() {
    const cells = document.querySelectorAll('.travel-grid-cell[data-person-id][data-date]');

    cells.forEach(cell => {
      // mousedown: 選択開始
      cell.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;  // 左クリックのみ
        e.preventDefault();

        const personId = cell.dataset.personId;
        const date = cell.dataset.date;

        this._selecting = true;
        this._selectPersonId = personId;
        this._selectStartDate = date;
        this._selectEndDate = date;

        this.updateSelectionHighlight();
      });

      // mousemove: 選択範囲拡張
      cell.addEventListener('mousemove', (e) => {
        if (!this._selecting) return;

        const personId = cell.dataset.personId;
        const date = cell.dataset.date;

        // 同一personIdの行内のみ選択可能
        if (personId === this._selectPersonId) {
          this._selectEndDate = date;
          this.updateSelectionHighlight();
        }
      });

      // mouseup: 選択確定 → モーダル表示
      cell.addEventListener('mouseup', (e) => {
        if (!this._selecting) return;

        const personId = this._selectPersonId;
        let startDate = this._selectStartDate;
        let endDate = this._selectEndDate;

        // 日付の順序を正規化
        if (startDate > endDate) {
          [startDate, endDate] = [endDate, startDate];
        }

        this._selecting = false;
        this.clearSelectionHighlight();

        // モーダルを開く（新規作成モード）
        TripModal.openNew(personId, startDate, endDate);
      });
    });

    // mouseup outside: 選択キャンセル
    document.addEventListener('mouseup', () => {
      if (this._selecting) {
        this._selecting = false;
        this.clearSelectionHighlight();
      }
    });
  },

  /**
   * 選択範囲のハイライト更新
   */
  updateSelectionHighlight() {
    this.clearSelectionHighlight();

    if (!this._selectPersonId || !this._selectStartDate || !this._selectEndDate) return;

    let startDate = this._selectStartDate;
    let endDate = this._selectEndDate;
    if (startDate > endDate) {
      [startDate, endDate] = [endDate, startDate];
    }

    const cells = document.querySelectorAll(
      `.travel-grid-cell[data-person-id="${this._selectPersonId}"]`
    );

    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= startDate && date <= endDate) {
        cell.classList.add('selecting');
      }
    });
  },

  /**
   * 選択ハイライトをクリア
   */
  clearSelectionHighlight() {
    document.querySelectorAll('.travel-grid-cell.selecting').forEach(cell => {
      cell.classList.remove('selecting');
    });
  },

  /**
   * レイアウト計算済みの予定をレンダリング
   * @param {Object} trip - レイアウト情報付き予定（_xStart, _width）
   * @returns {string} HTML
   */
  renderTripBarWithLayout(trip) {
    const isLocked = trip.isLocked === true;
    const lockIcon = isLocked ? '<span class="travel-lock-icon">🔒</span>' : '';

    // Phase C: 開始日バッジ（月/日）
    const startDate = new Date(trip.start);
    const startBadge = `${startDate.getMonth() + 1}/${startDate.getDate()}`;

    if (trip.kind === 'move') {
      // 移動バー
      const destination = trip['行先'] || '';
      return `
        <div class="travel-move-bar ${isLocked ? 'locked' : ''}"
             style="left: ${trip._xStart}px; width: ${trip._width}px;"
             data-trip-id="${trip.tripId}"
             title="移動: ${destination}">
          ${lockIcon}
          <span class="bar-icon">🚗</span>
          <span>移動</span>
        </div>
      `;
    } else if (trip.kind === 'site') {
      // 現場バー（3行表示 + 開始日バッジ）
      const description = trip['用件'] || '';
      const lines = description.split('\n');
      const line1 = lines[0] || '';
      const line2 = lines[1] || '';
      const line3 = lines[2] || trip['行先'] || '';

      return `
        <div class="travel-site-bar ${isLocked ? 'locked' : ''}"
             style="left: ${trip._xStart}px; width: ${trip._width}px;"
             data-trip-id="${trip.tripId}"
             title="${Utils.escapeHtml(description)}">
          ${lockIcon}
          <span class="travel-date-badge">${startBadge}</span>
          <div class="bar-line1">${Utils.escapeHtml(line1)}</div>
          <div class="bar-line2">${Utils.escapeHtml(line2)}</div>
          <div class="bar-line3">${Utils.escapeHtml(line3)}</div>
        </div>
      `;
    } else {
      // その他（既存trip形式）
      const destination = trip['行先'] || '';
      const purpose = trip['用件'] || '';
      return `
        <div class="travel-move-bar"
             style="left: ${trip._xStart}px; width: ${trip._width}px; background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: white; border-color: #7c3aed;"
             data-trip-id="${trip.tripId}"
             title="${destination} - ${purpose}">
          <span>${Utils.escapeHtml(destination || purpose)}</span>
        </div>
      `;
    }
  },

  async lockTrip(tripId) {
    try {
      await API.call('api_updateTrip', tripId, { isLocked: true });
      Utils.showToast('予定を確定しました', 'success');
      await Store.loadBootstrapData();
    } catch (error) {
      Utils.showToast('確定に失敗しました: ' + error.message, 'error');
    }
  }
};

console.log('[DEBUG] TravelPlan defined');

// ========================================
// App - アプリケーションメインエントリーポイント
// ========================================

const App = {
  async init() {
    console.log('Manufacturing Schedule App initializing...');

    Store.init();

    Gantt.init();
    Modal.init();
    JobModal.init();
    PeopleModal.setupEventListeners();
    JobDetail.init();
    ResourceView.init();
    WeeklyPlan.init();
    TravelPlan.init();

    this.setupEventListeners();

    document.getElementById('display-start-date').value = Store.state.displayStartDate;

    await Store.loadBootstrapData();

    console.log('App initialized successfully');
  },

  setupEventListeners() {
    document.getElementById('display-start-date')?.addEventListener('change', (e) => {
      this.onDisplayRangeChange();
    });

    document.getElementById('display-days')?.addEventListener('change', (e) => {
      this.onDisplayRangeChange();
    });

    document.getElementById('btn-refresh')?.addEventListener('click', () => {
      Store.loadBootstrapData();
    });

    document.getElementById('btn-people-manage')?.addEventListener('click', () => {
      PeopleModal.open();
    });

    document.getElementById('color-mode-process')?.addEventListener('click', () => {
      this.setColorMode('process');
    });

    document.getElementById('color-mode-person')?.addEventListener('click', () => {
      this.setColorMode('person');
    });

    const navTabs = document.querySelectorAll('.nav-tab');
    console.log('[DEBUG] Found nav-tabs:', navTabs.length);
    navTabs.forEach(tab => {
      console.log('[DEBUG] Nav tab:', tab.id, 'data-view:', tab.dataset.view);
      tab.addEventListener('click', (e) => {
        // e.currentTarget を使用（e.target だと子要素が取れる可能性がある）
        const view = e.currentTarget.dataset.view;
        console.log('[DEBUG] Nav tab clicked:', view);
        this.switchView(view);
      });
    });

    window.addEventListener('resize', Utils.debounce(() => {
      Gantt.updateTodayLinePosition();
    }, 200));
  },

  onDisplayRangeChange() {
    const startDate = document.getElementById('display-start-date').value;
    const days = parseInt(document.getElementById('display-days').value, 10);

    if (startDate && days) {
      Store.changeDisplayRange(startDate, days);
    }
  },

  setColorMode(mode) {
    Store.setState({ colorMode: mode });

    document.getElementById('color-mode-process').classList.toggle('active', mode === 'process');
    document.getElementById('color-mode-person').classList.toggle('active', mode === 'person');
  },

  switchView(view) {
    Store.setState({ currentView: view });

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.view === view);
    });

    document.querySelectorAll('.view-container').forEach(container => {
      container.classList.add('hidden');
    });

    const viewContainer = document.getElementById(`view-${view}`);
    if (viewContainer) {
      viewContainer.classList.remove('hidden');
    }

    switch (view) {
      case 'master':
        Gantt.render();
        break;
      case 'resource':
        WorkerJobAssignView.render();
        break;
      case 'weekly':
        WeeklyPlan.render();
        break;
      case 'travel':
        TravelPlan.render();
        break;
    }
  }
};

document.addEventListener('DOMContentLoaded', () => {
  console.log('[DEBUG] DOMContentLoaded - starting App.init()');
  App.init();
