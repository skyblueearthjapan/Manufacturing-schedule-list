  },

  async open(jobId) {
    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.currentJobId = jobId;
    this.currentJob = job;

    const schedules = Store.getSchedulesByJobId(jobId);
    if (schedules.length > 0) {
      const earliestStart = schedules.reduce((min, s) => s.start < min ? s.start : min, schedules[0].start);
      this.config.displayStartDate = Utils.addDays(earliestStart, -7);
    } else {
      this.config.displayStartDate = Utils.getToday();
    }

    document.getElementById('job-detail-start').value = this.config.displayStartDate;
    document.getElementById('job-detail-days').value = this.config.displayDays;
    // 未使用工程を隠すトグルの状態を同期
    const hideUnusedCheckbox = document.getElementById('job-detail-hide-unused');
    if (hideUnusedCheckbox) {
      hideUnusedCheckbox.checked = this.config.hideUnusedProcesses;
    }

    // 工程並び順を読み込み（キャッシュがあればスキップ）
    if (!this.jobProcessLayouts[jobId]) {
      await this.loadLayout(jobId);
    }

    this.renderHeader();
    this.render();

    // 行ドラッグイベントを設定
    this.attachRowDragListeners();

    document.getElementById('view-job-detail').classList.remove('hidden');
  },

  close() {
    document.getElementById('view-job-detail').classList.add('hidden');
    this.currentJobId = null;
    this.currentJob = null;
  },

  renderHeader() {
    const job = this.currentJob;
    if (!job) return;

    document.getElementById('job-detail-customer').textContent = job['顧客名'] || '-';
    document.getElementById('job-detail-product').textContent = job['設備/製品名'] || '-';
    document.getElementById('job-detail-jobno').textContent = job['工番'] || '-';
    document.getElementById('job-detail-ship-date').textContent = job['出荷予定日'] || '-';
    document.getElementById('job-detail-draw-date').textContent = job['出図予定日'] || '-';
    document.getElementById('job-detail-created').textContent = Utils.formatDate(new Date());
  },

  render() {
    const dates = Utils.generateDateRange(this.config.displayStartDate, this.config.displayDays);
    const schedules = Store.getSchedulesByJobId(this.currentJobId);
    let processes = [...Store.state.processes]; // コピーを作成

    // 未使用工程を隠す（デフォルトON）
    if (this.config.hideUnusedProcesses) {
      const usedProcessIds = new Set(schedules.map(s => s.processId));
      processes = processes.filter(p => usedProcessIds.has(p.processId));
    }

    // 工番別の並び順を適用
    processes = this.sortProcessesByLayout(processes);

    // 週次モードでは週単位でグループ化
    const weeks = this.config.viewMode === 'weekly' ? this.groupByWeekMondayStart(dates) : null;

    this.renderDateHeader(dates, weeks);
    this.renderProcessRows(processes, schedules, dates, weeks);

    // 印刷境界線を更新
    requestAnimationFrame(() => this.updatePrintBoundaries());
  },

  /**
   * 工程を工番別レイアウトに従ってソート
   */
  sortProcessesByLayout(processes) {
    const layout = this.jobProcessLayouts[this.currentJobId];
    if (!layout || layout.length === 0) {
      // レイアウトがなければProcessMasterのsortOrder順（デフォルト）
      return processes;
    }

    // レイアウトのprocessId -> orderIndexマップを作成
    const orderMap = new Map();
    layout.forEach(l => orderMap.set(l.processId, l.orderIndex));

    // ソート: レイアウトにあるものはorderIndex順、ないものは末尾
    return processes.sort((a, b) => {
      const orderA = orderMap.has(a.processId) ? orderMap.get(a.processId) : 99999;
      const orderB = orderMap.has(b.processId) ? orderMap.get(b.processId) : 99999;
      return orderA - orderB;
    });
  },

  renderDateHeader(dates, weeks) {
    const container = document.getElementById('job-detail-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let totalWidth = 0;

    if (this.config.viewMode === 'weekly' && weeks) {
      // 週次モード: 1セル = 1週間（圧縮表示）
      let currentMonth = 0;
      weeks.forEach(week => {
        const isCurrentWeek = week.dates.includes(today);
        const month = Utils.getMonth(week.start);
        const showMonth = month !== currentMonth;
        currentMonth = month;

        html += `
          <div class="job-date-cell weekly ${isCurrentWeek ? 'current' : ''}" style="width: ${this.config.weeklyCellWidth}px">
            ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
            <div class="week">${Utils.getDay(week.start)}〜</div>
          </div>
        `;
        totalWidth += this.config.weeklyCellWidth;
      });
    } else {
      // 日次モード
      let currentMonth = 0;
      dates.forEach(date => {
        const month = Utils.getMonth(date);
        const day = Utils.getDay(date);
        const dow = Utils.getDayOfWeek(date);
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;
        const daySetting = Store.getDaySetting(date);

        const showMonth = month !== currentMonth;
        currentMonth = month;

        let classes = 'job-date-cell';
        if (isWeekend) classes += ' weekend';
        if (isToday) classes += ' today';
        // 日付設定による上書き
        if (daySetting === 'WORKDAY') classes += ' is-workday';
        if (daySetting === 'HOLIDAY') classes += ' is-holiday';

        html += `
          <div class="${classes}" style="width: ${this.config.cellWidth}px">
            ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
            <div class="day">${day}</div>
            <div class="dow">${dow}</div>
          </div>
        `;
        totalWidth += this.config.cellWidth;
      });
    }

    container.innerHTML = html;
    container.style.width = `${totalWidth}px`;
  },

  renderProcessRows(processes, schedules, dates, weeks) {
    const container = document.getElementById('job-detail-body');
    if (!container) return;

    const today = Utils.getToday();
    const isWeeklyMode = this.config.viewMode === 'weekly' && weeks;
    const cellWidth = isWeeklyMode ? this.config.weeklyCellWidth : this.config.cellWidth;
    const cellCount = isWeeklyMode ? weeks.length : dates.length;
    const gridWidth = cellCount * cellWidth;
    const totalWidth = 140 + gridWidth; // 工程名幅 + グリッド幅
    let html = '';

    processes.forEach(process => {
      const processSchedules = schedules.filter(s => s.processId === process.processId);
      const isMilestone = process['種別(type)'] === 'milestone';
      const processColor = Utils.normalizeColor(process['工程色(colorHex)']) || '#6B7280';
      const processDisplayName = Store.getProcessDisplayName(process.processId);

      html += `
        <div class="job-process-row" data-process-id="${process.processId}" draggable="true">
          <div class="job-process-name" style="background-color: ${Utils.withAlpha(processColor, '20')}; border-left: 4px solid ${processColor}">
            <span class="drag-handle" title="ドラッグで並べ替え">⋮⋮</span>
            <span class="process-label">${Utils.escapeHtml(processDisplayName)}</span>
          </div>
          <div class="job-process-grid" data-process-id="${process.processId}" style="width: ${gridWidth}px">
      `;

      if (isWeeklyMode) {
        // 週次モード: 各週に対してセルを生成
        weeks.forEach(week => {
          const isCurrentWeek = week.dates.includes(today);
          let classes = 'job-grid-cell weekly';
          if (isCurrentWeek) classes += ' current';

          html += `<div class="${classes}" data-week-start="${week.start}" data-week-end="${week.end}" style="width: ${cellWidth}px"></div>`;
        });
      } else {
        // 日次モード
        dates.forEach(date => {
          const isWeekend = Utils.isWeekend(date);
          const isToday = date === today;
          const daySetting = Store.getDaySetting(date);
          let classes = 'job-grid-cell';
          if (isWeekend) classes += ' weekend';
          if (isToday) classes += ' today';
          // 日付設定による上書き
          if (daySetting === 'WORKDAY') classes += ' is-workday';
          if (daySetting === 'HOLIDAY') classes += ' is-holiday';

          html += `<div class="${classes}" data-date="${date}" style="width: ${cellWidth}px"></div>`;
        });
      }

      processSchedules.forEach(schedule => {
        if (isMilestone) {
          html += this.renderMilestone(schedule, dates, weeks);
        } else {
          html += this.renderBar(schedule, dates, process, weeks);
        }
      });

      html += `
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

    // ボディとその親コンテナの幅を設定（横スクロール用）
    container.style.minWidth = `${totalWidth}px`;
    const ganttContainer = container.closest('.job-detail-gantt');
    if (ganttContainer) {
      ganttContainer.style.minWidth = `${totalWidth}px`;
    }
  },

  renderBar(schedule, dates, process, weeks) {
    const isWeeklyMode = this.config.viewMode === 'weekly' && weeks;
    const color = process['工程色(colorHex)'] || '#6b7280';
    const mainPerson = Store.getPersonById(schedule.mainPersonId);
    const personName = mainPerson?.['氏名'] || '';

    if (isWeeklyMode) {
      // 週次モード: 週単位でバーを表示
      const startWeekIdx = this.findWeekIndex(weeks, schedule.start);
      const endWeekIdx = this.findWeekIndex(weeks, schedule.end);

      if (startWeekIdx === -1 && endWeekIdx === -1) return '';

      const effectiveStart = Math.max(0, startWeekIdx === -1 ? 0 : startWeekIdx);
      const effectiveEnd = Math.min(weeks.length - 1, endWeekIdx === -1 ? weeks.length - 1 : endWeekIdx);

      const left = effectiveStart * this.config.weeklyCellWidth;
      const width = (effectiveEnd - effectiveStart + 1) * this.config.weeklyCellWidth - 2;

      // scheduleId を data属性に保持（クリック編集用）
      return `
        <div class="job-bar" data-schedule-id="${schedule.scheduleId}" style="left: ${left}px; width: ${width}px; background-color: ${color};"
             title="${personName}${schedule.label ? ' - ' + schedule.label : ''}">
          ${schedule.label ? `<span class="job-bar-label">${Utils.escapeHtml(schedule.label)}</span>` : ''}
        </div>
      `;
    } else {
      // 日次モード
      const startOffset = Utils.getDaysBetween(this.config.displayStartDate, schedule.start);
      const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

      if (startOffset + duration < 0 || startOffset >= dates.length) {
        return '';
      }

      const left = Math.max(0, startOffset) * this.config.cellWidth;
      const width = Math.min(duration, dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 2;

      // scheduleId を data属性に保持（クリック編集用）
      return `
        <div class="job-bar" data-schedule-id="${schedule.scheduleId}" style="left: ${left}px; width: ${width}px; background-color: ${color};"
             title="${personName}${schedule.label ? ' - ' + schedule.label : ''}">
          ${schedule.label ? `<span class="job-bar-label">${Utils.escapeHtml(schedule.label)}</span>` : ''}
        </div>
      `;
    }
  },

  renderMilestone(schedule, dates, weeks) {
    const process = Store.getProcessById(schedule.processId);
    const rawName = process?.['工程名'] || schedule.label || '';
    const processName = rawName.replace(/^★+/, '');

    if (this.config.viewMode === 'weekly' && weeks) {
      // 週次モード
      const weekIdx = this.findWeekIndex(weeks, schedule.start);
      if (weekIdx === -1) return '';

      const left = weekIdx * this.config.weeklyCellWidth + (this.config.weeklyCellWidth / 2) - 8;

      // scheduleId を data属性に保持（クリック編集用）
      return `
        <div class="job-milestone" data-schedule-id="${schedule.scheduleId}" style="left: ${left}px;" title="${processName}">
          ★${Utils.escapeHtml(processName)}
        </div>
      `;
    } else {
      // 日次モード
      const startOffset = Utils.getDaysBetween(this.config.displayStartDate, schedule.start);

      if (startOffset < 0 || startOffset >= dates.length) {
        return '';
      }

      const left = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 8;

      // scheduleId を data属性に保持（クリック編集用）
      return `
        <div class="job-milestone" data-schedule-id="${schedule.scheduleId}" style="left: ${left}px;" title="${processName}">
          ★${Utils.escapeHtml(processName)}
        </div>
      `;
    }
  },

  /**
   * 指定日付が属する週のインデックスを取得
   * @param {Array} weeks - 週配列
   * @param {string} date - YYYY-MM-DD形式の日付
   * @returns {number} 週インデックス（-1: 範囲外）
   */
  findWeekIndex(weeks, date) {
    for (let i = 0; i < weeks.length; i++) {
      if (weeks[i].dates.includes(date)) {
        return i;
      }
      // 日付が週の開始日より前で、最初の週の場合
      if (i === 0 && date < weeks[i].start) {
        return -1;
      }
      // 日付が週の終了日より後で、最後の週の場合
      if (i === weeks.length - 1 && date > weeks[i].end) {
        return -1;
      }
    }
    // 範囲外の日付も、最も近い週に含める
    if (date < weeks[0].start) return 0;
    if (date > weeks[weeks.length - 1].end) return weeks.length - 1;
    return -1;
  },

  /**
   * 週次グループ化（月曜始まり）- 圧縮表示用
   * @param {string[]} dates - YYYY-MM-DD形式の日付配列
   * @returns {Array<{start: string, end: string, dates: string[], weekIndex: number}>}
   */
  groupByWeekMondayStart(dates) {
    if (!dates || dates.length === 0) return [];

    const weeks = [];
    let currentWeek = null;
    let weekIndex = 0;

    dates.forEach(date => {
      const d = new Date(date);
      const dayOfWeek = d.getDay(); // 0=日, 1=月, ..., 6=土
      // 月曜日で新しい週を開始
      if (dayOfWeek === 1 || currentWeek === null) {
        if (currentWeek !== null) {
          currentWeek.end = currentWeek.dates[currentWeek.dates.length - 1];
          weeks.push(currentWeek);
          weekIndex++;
        }
        currentWeek = { start: date, end: date, dates: [], weekIndex };
      }
      currentWeek.dates.push(date);
      currentWeek.end = date;
    });

    if (currentWeek !== null && currentWeek.dates.length > 0) {
      weeks.push(currentWeek);
    }

    return weeks;
  },

  // 旧版: 後方互換性のため残す
  groupByWeek(dates) {
    return this.groupByWeekMondayStart(dates);
  },

  setViewMode(mode) {
    this.config.viewMode = mode;
    document.getElementById('job-detail-mode-daily')?.classList.toggle('active', mode === 'daily');
    document.getElementById('job-detail-mode-weekly')?.classList.toggle('active', mode === 'weekly');
    this.render();
    this.updateDaysPerPageIndicator();
  },

  onDisplayRangeChange() {
    this.config.displayStartDate = document.getElementById('job-detail-start').value;
    this.config.displayDays = parseInt(document.getElementById('job-detail-days').value, 10);
    this.render();
  },

  // イベント委譲：#job-detail-bodyに1回だけリスナーを設定
  attachGridEventListeners() {
    const body = document.getElementById('job-detail-body');
    if (!body) return;

    // バー・マイルストーンのクリック（編集モーダルを開く）
    // scheduleId をキーとして Scheduleシートの該当行を特定・編集する
    body.addEventListener('click', (e) => {
      const bar = e.target.closest('.job-bar, .job-milestone');
      if (bar) {
        e.stopPropagation();
        const scheduleId = bar.dataset.scheduleId;
        if (scheduleId) {
          this.onBarClick(scheduleId);
        }
        return;
      }
    });

    // ドラッグ範囲選択：mousedown
    body.addEventListener('mousedown', (e) => {
      // 左クリック以外は無視
      if (e.button !== 0) return;
      // バー上でのドラッグは無視
      if (e.target.closest('.job-bar, .job-milestone')) return;

      const cell = e.target.closest('.job-grid-cell');
      if (!cell) return;

      // 親の .job-process-grid から processId を取得
      const grid = cell.closest('.job-process-grid');
      if (!grid) return;

      e.preventDefault();
      this.dragState.isDragging = true;
      this.dragState.startProcessId = grid.dataset.processId;
      this.dragState.startDate = cell.dataset.date;
      this.dragState.endDate = cell.dataset.date;

      this.highlightRange();
    });

    // ドラッグ範囲選択：mousemove
    body.addEventListener('mousemove', (e) => {
      if (!this.dragState.isDragging) return;

      const cell = e.target.closest('.job-grid-cell');
      if (!cell) return;

      // 同じ工程行のみ範囲選択可能
      const grid = cell.closest('.job-process-grid');
      if (!grid || grid.dataset.processId !== this.dragState.startProcessId) return;

      this.dragState.endDate = cell.dataset.date;
      this.highlightRange();
    });

    // ドラッグ範囲選択：mouseup
    body.addEventListener('mouseup', (e) => {
      if (!this.dragState.isDragging) return;

      const { startProcessId, startDate, endDate } = this.dragState;
      const jobId = this.currentJobId;

      // 範囲確定
      const rangeStart = startDate <= endDate ? startDate : endDate;
      const rangeEnd = startDate <= endDate ? endDate : startDate;

      // リセット
      this.clearHighlight();
      this.dragState.isDragging = false;
      this.dragState.startProcessId = null;
      this.dragState.startDate = null;
      this.dragState.endDate = null;

      // モーダルを開く（工程を事前選択）
      Modal.openNewWithProcess(jobId, startProcessId, rangeStart, rangeEnd);
    });

    // ドラッグキャンセル：マウスがグリッド外に出た場合
    body.addEventListener('mouseleave', (e) => {
      if (this.dragState.isDragging) {
        this.clearHighlight();
        this.dragState.isDragging = false;
        this.dragState.startProcessId = null;
        this.dragState.startDate = null;
        this.dragState.endDate = null;
      }
    });
  },

  // 選択範囲をハイライト
  highlightRange() {
    this.clearHighlight();

    const { startProcessId, startDate, endDate } = this.dragState;
    if (!startProcessId || !startDate || !endDate) return;

    const rangeStart = startDate <= endDate ? startDate : endDate;
    const rangeEnd = startDate <= endDate ? endDate : startDate;

    const grid = document.querySelector(`#job-detail-body .job-process-grid[data-process-id="${startProcessId}"]`);
    if (!grid) return;

    const cells = grid.querySelectorAll('.job-grid-cell');
    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= rangeStart && date <= rangeEnd) {
        cell.classList.add('selected-range');
      }
    });
  },

  // ハイライトをクリア
  clearHighlight() {
    document.querySelectorAll('#job-detail-body .selected-range').forEach(cell => {
      cell.classList.remove('selected-range');
    });
  },

  /**
   * バー・マイルストーンのクリック時に編集モーダルを開く
   * @param {string} scheduleId - スケジュールの一意ID（Scheduleシートの主キー）
   */
  onBarClick(scheduleId) {
    console.log('[JobDetail] Bar clicked, scheduleId:', scheduleId);
    // scheduleId をキーとして Scheduleシートの該当行を取得
    const schedule = Store.state.schedules.find(s => s.scheduleId === scheduleId);
    if (schedule) {
      // 大工程表と同じ Modal.openEdit を使用（モーダル実装の二重化を防ぐ）
      Modal.openEdit(schedule);
    } else {
      console.warn('[JobDetail] Schedule not found for scheduleId:', scheduleId);
      Utils.showToast('スケジュールが見つかりません', 'error');
    }
  },

  /**
   * 行の並べ替えDnDイベントを設定
   */
  attachRowDragListeners() {
    const body = document.getElementById('job-detail-body');
    if (!body) return;

    // 既にリスナーが設定されていれば何もしない（フラグで管理）
    if (body._rowDragListenersAttached) return;
    body._rowDragListenersAttached = true;

    // dragstart
    body.addEventListener('dragstart', (e) => {
      const row = e.target.closest('.job-process-row');
      if (!row) return;

      this.rowDragState.isDragging = true;
      this.rowDragState.draggedProcessId = row.dataset.processId;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.processId);
    });

    // dragend
    body.addEventListener('dragend', (e) => {
      const row = e.target.closest('.job-process-row');
      if (row) row.classList.remove('dragging');
      this.rowDragState.isDragging = false;
      this.rowDragState.draggedProcessId = null;

      // すべてのdrag-overクラスを削除
      body.querySelectorAll('.drag-over, .drag-over-bottom').forEach(el => {
        el.classList.remove('drag-over', 'drag-over-bottom');
      });
    });

    // dragover
    body.addEventListener('dragover', (e) => {
      if (!this.rowDragState.isDragging) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      const row = e.target.closest('.job-process-row');
      if (!row || row.dataset.processId === this.rowDragState.draggedProcessId) return;

      // 既存のdrag-overクラスを削除
      body.querySelectorAll('.drag-over, .drag-over-bottom').forEach(el => {
        el.classList.remove('drag-over', 'drag-over-bottom');
      });

      // マウス位置に応じて上/下のインジケータを表示
      const rect = row.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      if (e.clientY < midY) {
        row.classList.add('drag-over');
      } else {
        row.classList.add('drag-over-bottom');
      }
    });

    // dragleave
    body.addEventListener('dragleave', (e) => {
      const row = e.target.closest('.job-process-row');
      if (row) {
        row.classList.remove('drag-over', 'drag-over-bottom');
      }
    });

    // drop
    body.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!this.rowDragState.isDragging) return;

      const targetRow = e.target.closest('.job-process-row');
      if (!targetRow) return;

      const draggedId = this.rowDragState.draggedProcessId;
      const targetId = targetRow.dataset.processId;
      if (draggedId === targetId) return;

      // ドロップ位置（上/下）を判定
      const rect = targetRow.getBoundingClientRect();
      const midY = rect.top + rect.height / 2;
      const insertAfter = e.clientY >= midY;

      // 並び替えを実行
      this.reorderProcessRow(draggedId, targetId, insertAfter);

      // クラスをクリア
      body.querySelectorAll('.drag-over, .drag-over-bottom').forEach(el => {
        el.classList.remove('drag-over', 'drag-over-bottom');
      });
    });
  },

  /**
   * 工程行の並び替えを実行
   */
  reorderProcessRow(draggedProcessId, targetProcessId, insertAfter) {
    // 現在表示中の工程順を取得
    const rows = document.querySelectorAll('#job-detail-body .job-process-row');
    const currentOrder = Array.from(rows).map(r => r.dataset.processId);

    // 新しい順序を計算
    const draggedIndex = currentOrder.indexOf(draggedProcessId);
    let targetIndex = currentOrder.indexOf(targetProcessId);

    if (draggedIndex === -1 || targetIndex === -1) return;

    // 配列から削除
    currentOrder.splice(draggedIndex, 1);

    // 新しい位置を計算（削除後のインデックス調整）
    if (draggedIndex < targetIndex) {
      targetIndex--;
    }
    if (insertAfter) {
      targetIndex++;
    }

    // 挿入
    currentOrder.splice(targetIndex, 0, draggedProcessId);

    // ローカルレイアウトを更新
    this.updateLocalLayout(currentOrder);

    // ChangeBufferに追加（A+C+B）
    ChangeBuffer.add('jobProcessLayout', 'reorder', this.currentJobId, {
      orderedProcessIds: currentOrder
    }, 'jobDetail');

    // 即座にUIを再描画（楽観的更新）
    this.render();

    Utils.showToast('並び替えました（保存待ち）', 'info');
  },

  /**
   * ローカルのレイアウト情報を更新
   */
  updateLocalLayout(orderedProcessIds) {
    const layouts = orderedProcessIds.map((processId, idx) => ({
      processId: processId,
      orderIndex: (idx + 1) * 10
    }));
    this.jobProcessLayouts[this.currentJobId] = layouts;
  },

  /**
   * サーバーからレイアウトを取得
   */
  async loadLayout(jobId) {
    try {
      const layouts = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .getJobProcessLayout(jobId);
      });
      this.jobProcessLayouts[jobId] = layouts || [];
    } catch (e) {
      console.warn('[JobDetail] Failed to load layout:', e);
      this.jobProcessLayouts[jobId] = [];
    }
  },

  /**
   * スプレッドシートへ出力
   * - Googleドライブに保存してURLを表示
   */
  async exportToSpreadsheet() {
    const job = this.currentJob;
    if (!job) {
      Utils.showToast('工番情報がありません', 'error');
      return;
    }

    // 未保存変更があれば先に保存
    if (ChangeBuffer.hasPendingChanges()) {
      Utils.showToast('変更を保存中...', 'info');
      try {
        await ChangeBuffer.flushNow();
      } catch (e) {
        Utils.showToast('保存に失敗したため出力できません', 'error');
        return;
      }
    }

    Utils.showToast('スプレッドシート作成中...', 'info');

    const dates = Utils.generateDateRange(this.config.displayStartDate, this.config.displayDays);
    const schedules = Store.getSchedulesByJobId(this.currentJobId);
    let processes = Store.state.processes;

    // 未使用工程を隠す設定に従う
    if (this.config.hideUnusedProcesses) {
      const usedProcessIds = new Set(schedules.map(s => s.processId));
      processes = processes.filter(p => usedProcessIds.has(p.processId));
    }

    // 並び順をJobProcessLayoutに従う
    processes = this.sortProcessesByLayout(processes);

    // エクスポートデータを構築
    const exportData = {
      jobId: this.currentJobId,
      job: {
        jobNo: job['工番'] || '',
        customer: job['顧客名'] || '',
        product: job['設備/製品名'] || ''
      },
      theme: this.config.exportTheme,  // 'color' or 'mono_navy'
      paperSize: this.config.paperSize, // 'a4' or 'a3'（自動分割用）
      hideUnused: this.config.hideUnusedProcesses,
      displayStartDate: this.config.displayStartDate,
      displayDays: this.config.displayDays,
      dates: dates,
      processes: processes.map(p => ({
        processId: p.processId,
        name: p['工程名'],
        color: Utils.normalizeColor(p['工程色(colorHex)']) || '#6B7280',
        isMilestone: p['種別(type)'] === 'milestone'
      })),
      schedules: schedules.map(s => ({
        processId: s.processId,
        start: s.start,
        end: s.end,
        label: s.label || '',
        mainPersonId: s.mainPersonId
      }))
    };

    try {
      const result = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .exportJobDetailToSpreadsheet(exportData);
      });

      if (result.success && result.url) {
        // 成功時：リンク付きToastを表示
        const themeLabel = this.config.exportTheme === 'mono_navy' ? '（青一色）' : '';
        const blockInfo = result.blockCount > 1 ? `（${result.blockCount}段）` : '';
        Utils.showToast(`スプレッドシートを作成しました${themeLabel}${blockInfo}`, 'success');

        // 「開く」リンクを表示（5秒後に自動消去）
        this.showSpreadsheetLink(result.url, result.fileName);
      } else {
        Utils.showToast('スプレッドシート作成に失敗しました', 'error');
      }
    } catch (error) {
      console.error('[JobDetail] exportToSpreadsheet error:', error);
      Utils.showToast('出力エラー: ' + error.message, 'error');
    }
  },

  /**
   * スプレッドシートへのリンクを表示
   */
  showSpreadsheetLink(url, fileName) {
    // 既存のリンク表示を削除
    const existingLink = document.getElementById('spreadsheet-link-popup');
    if (existingLink) existingLink.remove();

    // リンクポップアップを作成
    const popup = document.createElement('div');
    popup.id = 'spreadsheet-link-popup';
    popup.className = 'fixed bottom-20 right-4 bg-white border border-gray-300 rounded-lg shadow-lg p-4';
    popup.style.zIndex = '10001';  // モーダル(10000)より前面に表示
    popup.innerHTML = `
      <div class="flex items-center space-x-3">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <div>
          <div class="text-sm text-gray-600">${Utils.escapeHtml(fileName)}</div>
          <a href="${url}" target="_blank" class="text-blue-600 hover:underline font-medium">
            作成したシートを開く →
          </a>
        </div>
        <button id="spreadsheet-link-close" class="ml-2 text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    `;
    document.body.appendChild(popup);

    // 閉じるボタン
    document.getElementById('spreadsheet-link-close')?.addEventListener('click', () => popup.remove());

    // 10秒後に自動消去
    setTimeout(() => popup.remove(), 10000);
  },

  /**
   * 印刷境界線の更新
   */
  updatePrintBoundaries() {
    const container = document.getElementById('job-detail-body');
    if (!container) return;

    // 既存の境界線を削除
    container.querySelectorAll('.print-boundary').forEach(el => el.remove());

    if (!this.config.showPrintBoundaries) return;

    const paper = this.paperSizes[this.config.paperSize];
    if (!paper) return;

    const ganttContainer = container.closest('.job-detail-gantt');
    if (!ganttContainer) return;

    const totalWidth = ganttContainer.scrollWidth;
    const totalHeight = ganttContainer.scrollHeight;

    // 横方向の境界線（ページ幅ごと）
    // 工程名カラム幅を考慮（140px）
    const contentWidth = paper.width - 140;
    let x = 140 + contentWidth;
    while (x < totalWidth) {
      const line = document.createElement('div');
      line.className = 'print-boundary print-boundary-vertical';
      line.style.cssText = `
        position: absolute;
        left: ${x}px;
        top: 0;
        width: 2px;
        height: 100%;
        background: repeating-linear-gradient(
          to bottom,
          #ef4444 0,
          #ef4444 4px,
          transparent 4px,
          transparent 8px
        );
        pointer-events: none;
        z-index: 100;
      `;
      line.title = `ページ境界 (${this.config.paperSize.toUpperCase()})`;
      container.appendChild(line);
      x += contentWidth;
    }

    // 横方向の境界線（ページ高さごと）
    // ヘッダー高さを考慮（約80px）
    const contentHeight = paper.height - 80;
    let y = contentHeight;
    while (y < totalHeight) {
      const line = document.createElement('div');
      line.className = 'print-boundary print-boundary-horizontal';
      line.style.cssText = `
        position: absolute;
        left: 0;
        top: ${y}px;
        width: 100%;
        height: 2px;
        background: repeating-linear-gradient(
          to right,
          #ef4444 0,
          #ef4444 4px,
          transparent 4px,
          transparent 8px
        );
        pointer-events: none;
        z-index: 100;
      `;
      line.title = `ページ境界 (${this.config.paperSize.toUpperCase()})`;
      container.appendChild(line);
      y += contentHeight;
    }
  },

  /**
   * 印刷範囲ガイド（何日まで1枚に収まるか）を更新
   */
  updateDaysPerPageIndicator() {
    const indicator = document.getElementById('job-detail-days-per-page');
    if (!indicator) return;

    if (!this.config.showPrintBoundaries) {
      indicator.classList.add('hidden');
      return;
    }

    const paper = this.paperSizes[this.config.paperSize];
    if (!paper) {
      indicator.classList.add('hidden');
      return;
    }

    // 工程名カラム幅（140px）を引いた残りが日付セル領域
    const processColumnWidth = 140;
    const contentWidth = paper.width - processColumnWidth;

    // 表示モードによってセル幅が異なる
    const cellWidth = this.config.viewMode === 'weekly' ? this.config.weeklyCellWidth : this.config.cellWidth;

    // 1ページに収まる日数/週数を計算
    const unitsPerPage = Math.floor(contentWidth / cellWidth);

    // 表示テキストを設定
    const unitLabel = this.config.viewMode === 'weekly' ? '週' : '日';
    indicator.textContent = `(約${unitsPerPage}${unitLabel}/枚)`;
    indicator.classList.remove('hidden');
  },

  /**
   * 印刷実行
   * - タイトルを工番情報に設定
   * - 印刷後にタイトルを復元
   */
  print() {
    const job = this.currentJob;
    const originalTitle = document.title;

    // 印刷用タイトル設定
    if (job) {
      const jobNo = job['工番'] || '';
      const product = job['設備/製品名'] || '';
      document.title = `工程表_${jobNo}_${product}`;
    }

    // 印刷実行
    window.print();

    // タイトル復元
    setTimeout(() => {
      document.title = originalTitle;
    }, 100);
  }
};

// ========================================
// ExcelGantt - Excel風 大工程表
// ========================================

const ExcelGantt = {
  config: {
    colWidth: 28,             // 1日あたりの列幅
    rowHeight: 44,            // 1案件の高さ
    headerHeight: 50,         // 日付ヘッダ高さ
    leftPaneWidth: 520,       // 左ペイン幅
  },

  // バー種類別スタイル定義（両矢印スタイルに統一）
  // shape: "arrow" | "rect" | "dash"
  // lane: 同一行内で上下に並べる段（0,1,2...）
  BAR_STYLE: {
    '出荷':     { shape: 'arrow', lane: 0 },
    '電気設計': { shape: 'rect',  lane: 1 },
    '機械設計': { shape: 'rect',  lane: 1 },
    '治具':     { shape: 'rect',  lane: 1 },
    '準備':     { shape: 'dash',  lane: 0 },
    '_default': { shape: 'rect',  lane: 0 },
  },

  dates: [],
  viewStart: null,

  // ドラッグ状態管理
  dragState: null,

  // 初期化
  init() {
    this.setupEventListeners();
    this.setupScrollSync();
    this.setupDragEvents();
    Store.subscribe((state) => {
      if (state.currentView === 'master') {
        this.render();
      }
    });
    console.log('[ExcelGantt] Initialized');
  },

  // イベントリスナー設定
  setupEventListeners() {
    // 検索機能は既存のものを流用
  },

  // ドラッグイベント委譲設定
  setupDragEvents() {
    const grid = document.getElementById('excelGrid');
    if (!grid) return;

    // イベント委譲でバーのドラッグを処理
    grid.addEventListener('pointerdown', (e) => this.onPointerDown(e));
    grid.addEventListener('pointermove', (e) => this.onPointerMove(e));
    grid.addEventListener('pointerup', (e) => this.onPointerUp(e));
    grid.addEventListener('pointercancel', (e) => this.onPointerUp(e));

    // クリックイベント（ドラッグしなかった場合のみ発火）
    grid.addEventListener('click', (e) => this.onBarClick(e));

    // ドラッグキャンセル：マウスがグリッド外に出た場合（セル選択時のみ）
    grid.addEventListener('pointerleave', (e) => {
      if (this.dragState && this.dragState.type === 'selection') {
        this.clearHighlight();
        this.dragState = null;
      }
    });

    console.log('[ExcelGantt] Drag events set up');
  },

  // ポインターダウン：ドラッグ開始
  onPointerDown(e) {
    // 左クリック以外は無視
    if (e.button !== 0) return;

    const bar = e.target.closest('.excel-bar');
    if (bar) {
      // === 既存バーのドラッグ（移動・リサイズ）===
      const scheduleId = bar.dataset.scheduleId;
      const jobId = bar.dataset.jobId;
      if (!scheduleId) return;

      // スケジュール情報を取得
      const schedule = Store.state.schedules.find(s => s.scheduleId === scheduleId);
      if (!schedule) return;

      // ハンドルクリックか判定
      const handle = e.target.closest('.bar-handle');
      let mode = 'move';
      if (handle) {
        mode = handle.dataset.handle === 'left' ? 'resize-left' : 'resize-right';
      }

      // ドラッグ状態を設定
      this.dragState = {
        type: 'bar',
        scheduleId,
        jobId,
        mode,
        startX: e.clientX,
        origStartDate: schedule.start,
        origEndDate: schedule.end,
        dayW: this.config.colWidth,
        barEl: bar,
        origLeft: parseFloat(bar.style.left) || 0,
        origWidth: parseFloat(bar.style.width) || 0,
        hasMoved: false
      };

      bar.classList.add('dragging');
      bar.setPointerCapture(e.pointerId);
      e.preventDefault();
    } else {
      // === 空セルの範囲選択（新規スケジュール作成）===
      const cell = e.target.closest('.excel-grid-cell');
      if (!cell) return;

      const row = cell.closest('.excel-grid-row');
      if (!row) return;

      const jobId = row.dataset.jobId;
      const date = cell.dataset.date;
      if (!jobId || !date) return;

      this.dragState = {
        type: 'selection',
        jobId,
        startDate: date,
        endDate: date,
        hasMoved: false
      };

      this.highlightRange();
      e.preventDefault();
    }
  },

  // ポインタームーブ：ドラッグ中のプレビュー更新
  onPointerMove(e) {
    if (!this.dragState) return;

    if (this.dragState.type === 'selection') {
      // === 空セルの範囲選択 ===
      const cell = e.target.closest('.excel-grid-cell');
      if (!cell) return;

      const row = cell.closest('.excel-grid-row');
      if (!row) return;

      // 同じjobId（同じ行）のみ範囲選択可能
      if (row.dataset.jobId !== this.dragState.jobId) return;

      const newDate = cell.dataset.date;
      if (newDate && newDate !== this.dragState.endDate) {
        this.dragState.endDate = newDate;
        this.dragState.hasMoved = true;
        this.highlightRange();
      }
    } else if (this.dragState.type === 'bar') {
      // === 既存バーのドラッグ ===
      const { startX, dayW, mode, barEl, origLeft, origWidth, origStartDate, origEndDate } = this.dragState;
      const dx = e.clientX - startX;

      // 移動があったことを記録
      if (Math.abs(dx) > 3) {
        this.dragState.hasMoved = true;
      }

      const deltaDays = Math.round(dx / dayW);
      if (deltaDays === this.dragState.lastDeltaDays) return;
      this.dragState.lastDeltaDays = deltaDays;

      // 日付計算
      let newStart = origStartDate;
      let newEnd = origEndDate;

      if (mode === 'move') {
        // 平行移動
        newStart = Utils.addDays(origStartDate, deltaDays);
        newEnd = Utils.addDays(origEndDate, deltaDays);
      } else if (mode === 'resize-left') {
        // 左伸縮（開始日のみ変更）
        newStart = Utils.addDays(origStartDate, deltaDays);
        // start > end を防止
        if (newStart > origEndDate) newStart = origEndDate;
      } else if (mode === 'resize-right') {
        // 右伸縮（終了日のみ変更）
        newEnd = Utils.addDays(origEndDate, deltaDays);
        // end < start を防止
        if (newEnd < origStartDate) newEnd = origStartDate;
      }

      // プレビュー日付を保存
      this.dragState.newStart = newStart;
      this.dragState.newEnd = newEnd;

      // UIプレビュー更新（DOM直接操作）
      this.applyBarPreview(barEl, newStart, newEnd, origLeft, origWidth, mode, deltaDays, dayW);
    }
  },

  // バープレビュー更新（DOM直接操作）
  applyBarPreview(barEl, newStart, newEnd, origLeft, origWidth, mode, deltaDays, dayW) {
    const deltaLeft = deltaDays * dayW;

    if (mode === 'move') {
      barEl.style.left = `${origLeft + deltaLeft}px`;
    } else if (mode === 'resize-left') {
      // 左を動かす：leftを変更、widthも調整
      const clampedDelta = Math.min(deltaLeft, origWidth - dayW);
      barEl.style.left = `${origLeft + clampedDelta}px`;
      barEl.style.width = `${origWidth - clampedDelta}px`;
    } else if (mode === 'resize-right') {
      // 右を動かす：widthのみ変更
      const newWidth = Math.max(dayW, origWidth + deltaLeft);
      barEl.style.width = `${newWidth}px`;
    }
  },

  // ポインターアップ：ドラッグ終了、変更を確定
  onPointerUp(e) {
    if (!this.dragState) return;

    if (this.dragState.type === 'selection') {
      // === 空セルの範囲選択終了 → モーダルを開く ===
      const { jobId, startDate, endDate } = this.dragState;

      // ハイライトをクリア
      this.clearHighlight();

      // 範囲確定（開始 <= 終了 になるよう調整）
      const rangeStart = startDate <= endDate ? startDate : endDate;
      const rangeEnd = startDate <= endDate ? endDate : startDate;

      // モーダルを開く
      Modal.openNew(jobId, rangeStart, rangeEnd);

      console.log(`[ExcelGantt] Selection complete: jobId=${jobId}, ${rangeStart}〜${rangeEnd}`);
    } else if (this.dragState.type === 'bar') {
      // === 既存バーのドラッグ終了 ===
      const { scheduleId, barEl, hasMoved, newStart, newEnd, origStartDate, origEndDate, mode } = this.dragState;

      barEl.classList.remove('dragging');
      barEl.releasePointerCapture(e.pointerId);

      // 移動があり、日付が変わった場合のみ保存
      if (hasMoved && (newStart !== origStartDate || newEnd !== origEndDate)) {
        // pendingChangesに追加
        ChangeBuffer.add('schedule', 'upsert', scheduleId, {
          start: newStart,
          end: newEnd
        }, 'master');

        // ローカルStoreも更新（即時反映）
        const schedule = Store.state.schedules.find(s => s.scheduleId === scheduleId);
        if (schedule) {
          schedule.start = newStart;
          schedule.end = newEnd;
        }

        console.log(`[ExcelGantt] Schedule ${scheduleId} updated: ${origStartDate}~${origEndDate} → ${newStart}~${newEnd}`);
      } else if (!hasMoved && mode === 'move') {
        // ドラッグしなかった場合（クリック扱い）→ 編集モーダルを開く
        // ハンドル（リサイズ）の場合はモーダルを開かない
        const schedule = Store.getScheduleById(scheduleId);
        if (schedule) {
          console.log(`[ExcelGantt] Bar clicked (no drag), opening edit modal: ${scheduleId}`);
          Modal.openEdit(schedule);
        }
      }
    }

    this.dragState = null;
  },

  // バークリック処理（ドラッグしなかった場合のみ）
  onBarClick(e) {
    // ドラッグ中はクリックを無視
    if (this.dragState) return;

    const bar = e.target.closest('.excel-bar');
    if (!bar) return;

    // ハンドルクリックは無視
    if (e.target.closest('.bar-handle')) return;

    const scheduleId = bar.dataset.scheduleId;
    if (scheduleId) {
      // スケジュール編集モーダルを開く（旧UIと同じ）
      const schedule = Store.getScheduleById(scheduleId);
      if (schedule) {
        Modal.openEdit(schedule);
      }
    }
  },

  // 選択範囲をハイライト
  highlightRange() {
    this.clearHighlight();

    if (!this.dragState || this.dragState.type !== 'selection') return;

    const { jobId, startDate, endDate } = this.dragState;
    if (!jobId || !startDate || !endDate) return;

    const rangeStart = startDate <= endDate ? startDate : endDate;
    const rangeEnd = startDate <= endDate ? endDate : startDate;

    // 該当行のセルをハイライト
    const row = document.querySelector(`.excel-grid-row[data-job-id="${jobId}"]`);
    if (!row) return;

    const cells = row.querySelectorAll('.excel-grid-cell');
    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= rangeStart && date <= rangeEnd) {
        cell.classList.add('selected-range');
      }
    });
  },

  // ハイライトをクリア
  clearHighlight() {
    document.querySelectorAll('#excelGrid .selected-range').forEach(cell => {
      cell.classList.remove('selected-range');
    });
  },

  // スクロール同期設定
  setupScrollSync() {
    const leftRows = document.getElementById('excelLeftRows');
    const timeBody = document.getElementById('excelTimeBody');
    const timeHeader = document.getElementById('excelTimeHeader');
    const bottomScrollbar = document.getElementById('excelBottomScrollbar');

    // 埋め込み出張計画のスクロール要素を取得（動的生成のため関数化）
    // 2ペイン構造：右側のみスクロール
    const getTripScroll = () => document.getElementById('gantt-trip-container-scroll');

    // 出張計画表（下部ビュー）のスクロール要素を取得
    const getTravelScrollArea = () => document.getElementById('travel-scroll-area');
    const getTravelScrollHeader = () => document.getElementById('travel-scroll-header');

    if (timeBody && leftRows) {
      // 右ボディスクロール → 左追従 + ヘッダ追従 + 埋め込み出張追従 + 出張計画表追従
      timeBody.addEventListener('scroll', () => {
        // ガードフラグで再帰ループ防止
        if (_scrollSyncing) return;
        _scrollSyncing = true;

        leftRows.scrollTop = timeBody.scrollTop;
        if (timeHeader) {
          timeHeader.scrollLeft = timeBody.scrollLeft;
        }
        if (bottomScrollbar) {
          bottomScrollbar.scrollLeft = timeBody.scrollLeft;
        }
        // 埋め込み出張にも横スクロール同期
        const tripScroll = getTripScroll();
        if (tripScroll) tripScroll.scrollLeft = timeBody.scrollLeft;

        // 出張計画表（下部ビュー）にも横スクロール同期
        const travelScrollArea = getTravelScrollArea();
        const travelScrollHeader = getTravelScrollHeader();
        if (travelScrollArea) travelScrollArea.scrollLeft = timeBody.scrollLeft;
        if (travelScrollHeader) travelScrollHeader.scrollLeft = timeBody.scrollLeft;

        this.updateTodayLine();

        // 次フレームでガード解除
        requestAnimationFrame(() => { _scrollSyncing = false; });
      }, { passive: true });
    }

    if (leftRows && timeBody) {
      // 左スクロール → 右追従
      leftRows.addEventListener('scroll', () => {
        if (_scrollSyncing) return;
        _scrollSyncing = true;
        timeBody.scrollTop = leftRows.scrollTop;
        requestAnimationFrame(() => { _scrollSyncing = false; });
      }, { passive: true });
    }

    if (bottomScrollbar && timeBody && timeHeader) {
      // 下部スクロールバー → 本体追従 + 埋め込み出張追従 + 出張計画表追従
      bottomScrollbar.addEventListener('scroll', () => {
        if (_scrollSyncing) return;
        _scrollSyncing = true;

        timeBody.scrollLeft = bottomScrollbar.scrollLeft;
        timeHeader.scrollLeft = bottomScrollbar.scrollLeft;
        // 埋め込み出張にも横スクロール同期
        const tripScroll = getTripScroll();
        if (tripScroll) tripScroll.scrollLeft = bottomScrollbar.scrollLeft;

        // 出張計画表（下部ビュー）にも横スクロール同期
        const travelScrollArea = getTravelScrollArea();
        const travelScrollHeader = getTravelScrollHeader();
        if (travelScrollArea) travelScrollArea.scrollLeft = bottomScrollbar.scrollLeft;
        if (travelScrollHeader) travelScrollHeader.scrollLeft = bottomScrollbar.scrollLeft;

        this.updateTodayLine();

        requestAnimationFrame(() => { _scrollSyncing = false; });
      }, { passive: true });
    }
  },

  // メイン描画
  render() {
    const { displayStartDate, displayDays } = Store.state;
    const jobs = Store.getVisibleJobs();

    this.viewStart = Utils.parseLocalDate(displayStartDate);
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);

    const gridWidth = this.dates.length * this.config.colWidth;

    this.renderHeader();
    this.renderLeft(jobs);
    this.renderGrid(jobs);
    this.renderBars(jobs);
    this.updateTodayLine();
    this.updateScrollbarWidth(gridWidth);
    this.renderTrips();
  },

  // 日付ヘッダ描画
  renderHeader() {
    const cols = document.getElementById('excelTimeHeaderCols');
    if (!cols) return;

    const today = Utils.getToday();
    let html = '';

    this.dates.forEach((date, i) => {
      const d = Utils.parseLocalDate(date);
      const month = d.getMonth() + 1;
      const day = d.getDate();
      const dow = ['日','月','火','水','木','金','土'][d.getDay()];
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = date === today;
      const daySetting = Store.getDaySetting(date);

      let cls = 'excel-time-col';
      if (isWeekend) cls += ' weekend';
      if (isToday) cls += ' today';
      if (daySetting === 'HOLIDAY') cls += ' holiday';
      if (daySetting === 'WORKDAY') cls += ' workday';

      // 月初めの場合に月を表示
      const showMonth = i === 0 || day === 1;

      html += `
        <div class="${cls}" data-date="${date}">
          <div class="md">${showMonth ? month + '/' : ''}${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    cols.innerHTML = html;
    cols.style.width = `${this.dates.length * this.config.colWidth}px`;
  },

  // 左ペイン（工番情報）描画 - Excel風4列レイアウト
  renderLeft(jobs) {
    const container = document.getElementById('excelLeftRows');
    if (!container) return;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="flex items-center justify-center h-32 text-gray-400 text-sm">
          工番データがありません
        </div>
      `;
      return;
    }

    let html = '';
    jobs.forEach((job, idx) => {
      const jobNo = job['工番'] || '';
      const product = job['設備/製品名'] || '';
      const qtyRaw = job['台数'] || '1';
      // 台数を「式」形式で表示（既に「式」が含まれていなければ追加）
      const qty = String(qtyRaw).includes('式') ? qtyRaw : qtyRaw + '式';
      const dest = job['納入先'] || '';
      const destAddressFull = job['納入先住所'] || '';
      // 住所を都道府県+市まで短縮（例：千葉県千葉市花見川区... → 千葉県千葉市）
      const destAddress = this.shortenAddress(destAddressFull);
      const shipDate = this.formatShortDate(job['出荷予定日']);
      const drawDatePlan = this.formatShortDate(job['出図予定日']);

      // 変更後日付を取得
      const changedShipDate = this.formatShortDate(job['出荷予定日変更後']);
      const changedDrawDate = this.formatShortDate(job['出図予定日変更後']);

      // 担当者
      const mainPerson = job.mainPersonId ? Store.getPersonById(job.mainPersonId) : null;
      const mainName = mainPerson?.['氏名'] || '';

      // PDF情報
      const pdfInfo = Store.getJobPdfInfo(jobNo);
      const hasOrderPdf = pdfInfo?.order?.fileId ? true : false;
      const hasInstructionPdf = pdfInfo?.instruction?.fileId ? true : false;

      // No列の表示（連番）
      const rowNum = idx + 1;

      html += `
        <div class="xl-row" data-job-id="${job.jobId}" onclick="ExcelGantt.onJobClick('${job.jobId}')">
          <!-- No列（上段：番号、下段：PDF[受][指]） -->
          <div class="xl-no">
            <div class="no-top">${rowNum}</div>
            <div class="no-bottom xl-pdf-buttons">
              <button type="button"
                class="btn-order${hasOrderPdf ? ' active' : ''}"
                onclick="event.stopPropagation(); Gantt.openJobPdf('${Utils.escapeHtml(jobNo)}', 'order');"
                title="受注表PDF" ${hasOrderPdf ? '' : 'disabled'}>受</button>
              <button type="button"
                class="btn-inst${hasInstructionPdf ? ' active' : ''}"
                onclick="event.stopPropagation(); Gantt.openJobPdf('${Utils.escapeHtml(jobNo)}', 'instruction');"
                title="指示書PDF" ${hasInstructionPdf ? '' : 'disabled'}>指</button>
            </div>
          </div>

          <!-- メイン列（2行） -->
          <div class="xl-main">
            <div class="xl-main-line1">
              <span class="product-name">${Utils.escapeHtml(product)}</span>
              <div class="xl-actions">
                ${mainName ? `<span class="person-name">担当:${Utils.escapeHtml(mainName)}</span>` : ''}
                <button type="button"
                  onclick="event.stopPropagation(); JobModal.openEdit(Store.getJobById('${job.jobId}'));"
                  title="工番を編集">✎</button>
              </div>
            </div>
            <div class="xl-main-line2">
              <span class="job-link" onclick="event.stopPropagation(); JobDetail.open('${job.jobId}');" title="工番別工程表を開く">${Utils.escapeHtml(jobNo)}</span>
              <span class="unit">${Utils.escapeHtml(qty)}</span>
              ${dest ? `<span class="dest">${Utils.escapeHtml(dest)}</span>` : ''}
              ${destAddress ? `<span class="dest-address">${Utils.escapeHtml(destAddress)}</span>` : ''}
            </div>
          </div>

          <!-- 出荷予定日列（上段：日付+変更後、下段：日付入力欄） -->
          <div class="xl-ship">
            <div class="ship-top">
              <span class="${changedShipDate ? 'strikethrough' : ''}">${shipDate || '-'}</span>
              ${changedShipDate ? `<span class="changed-date">→${changedShipDate}</span>` : ''}
            </div>
            <div class="ship-bottom">
              <input type="date"
                class="xl-date-input"
                value="${job['出荷予定日変更後'] || ''}"
                onclick="event.stopPropagation();"
                onchange="ExcelGantt.updateJobChangedDate('${job.jobId}', 'ship', this.value)"
                title="出荷予定日の変更">
            </div>
          </div>

          <!-- 出図日列（上段：日付+変更後、下段：日付入力欄） -->
          <div class="xl-draw">
            <div class="draw-top">
              <span class="${changedDrawDate ? 'strikethrough' : ''}">${drawDatePlan || '-'}</span>
              ${changedDrawDate ? `<span class="changed-date">→${changedDrawDate}</span>` : ''}
            </div>
            <div class="draw-bottom">
              <input type="date"
                class="xl-date-input"
                value="${job['出図予定日変更後'] || ''}"
                onclick="event.stopPropagation();"
                onchange="ExcelGantt.updateJobChangedDate('${job.jobId}', 'draw', this.value)"
                title="出図予定日の変更">
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  // グリッド背景描画
  renderGrid(jobs) {
    const grid = document.getElementById('excelGrid');
    if (!grid) return;

    grid.style.setProperty('--days', this.dates.length);
    grid.style.setProperty('--rows', jobs.length);
    grid.style.width = `${this.dates.length * this.config.colWidth}px`;
    grid.style.height = `${jobs.length * this.config.rowHeight}px`;

    const today = Utils.getToday();

    let html = '';
    for (let r = 0; r < jobs.length; r++) {
      const jobId = jobs[r].jobId;
      html += `<div class="excel-grid-row" data-job-id="${jobId}">`;
      // バー用レイヤーを各行に追加
      html += `<div class="bar-layer"></div>`;
      for (let c = 0; c < this.dates.length; c++) {
        const date = this.dates[c];
        const d = Utils.parseLocalDate(date);
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const isToday = date === today;
        const daySetting = Store.getDaySetting(date);

        let cls = 'excel-grid-cell';
        if (isWeekend) cls += ' weekend';
        if (isToday) cls += ' today';
        if (daySetting === 'HOLIDAY') cls += ' holiday';
        if (daySetting === 'WORKDAY') cls += ' workday';

        html += `<div class="${cls}" data-date="${date}"></div>`;
      }
      html += `</div>`;
    }

    grid.innerHTML = html;
  },

  // バーHTML生成（両矢印スタイルに統一）
  // 構造: .excel-bar > .bar-line(極細線+両端矢尻) + .bar-handle×2 + .bar-label(上)
  buildBarHtml({ left, width, topInRow, color, label, shape, scheduleId, jobId }) {
    const safeLabel = Utils.escapeHtml(label || '');
    // colorを親要素に持たせてcurrentColorで統一管理
    const baseStyle = `left:${left}px; top:${topInRow}px; width:${width}px; color:${color};`;

    // 破線バーの場合は少しスタイルを変える
    const lineClass = shape === 'dash' ? 'bar-line bar-line--dash' : 'bar-line';

    return `
      <div class="excel-bar excel-bar--arrow"
           style="${baseStyle}"
           data-schedule-id="${scheduleId}"
           data-job-id="${jobId}">
        <div class="${lineClass}"></div>
        <div class="bar-handle bar-handle--left" data-handle="left"></div>
        <div class="bar-handle bar-handle--right" data-handle="right"></div>
        <div class="bar-label">${safeLabel}</div>
      </div>`;
  },

  // 工程名からBAR_STYLEを取得
  getBarStyle(processName) {
    // 完全一致を先に試す
    if (this.BAR_STYLE[processName]) {
      return this.BAR_STYLE[processName];
    }
    // 部分一致を試す（「出荷」が含まれるなど）
    for (const key of Object.keys(this.BAR_STYLE)) {
      if (key !== '_default' && processName.includes(key)) {
        return this.BAR_STYLE[key];
      }
    }
    return this.BAR_STYLE['_default'];
  },

  /**
   * 重なり自動段組み（subLane割り当て）
   * 同じlane内で重なるスケジュールを縦にずらす
   * @param {Array} schedules - スケジュール配列（lane情報付き）
   * @returns {Array} - subLane情報を追加したスケジュール配列
   */
  assignSubLanes(schedules) {
    if (!schedules || schedules.length === 0) return [];

    // laneごとに分類
    const byLane = new Map();
    for (const sch of schedules) {
      const lane = sch._lane ?? 0;
      if (!byLane.has(lane)) byLane.set(lane, []);
      byLane.get(lane).push(sch);
    }

    // 各lane内でsubLaneを割り当て
    for (const [lane, list] of byLane) {
      // 開始日順にソート
      list.sort((a, b) => a.start.localeCompare(b.start));

      // subLaneごとの最終終了日を管理
      const ends = []; // ends[subLane] = lastEndDate

      for (const sch of list) {
        const startDate = sch.start;
        const endDate = sch.end;

        let placed = false;
        for (let i = 0; i < ends.length; i++) {
          // このsubLaneが空いている（前のスケジュールの終了日 < 今の開始日）
          if (ends[i] < startDate) {
            sch._subLane = i;
            ends[i] = endDate;
            placed = true;
            break;
          }
        }
        if (!placed) {
          // 新しいsubLaneを作成
          sch._subLane = ends.length;
          ends.push(endDate);
        }
      }
    }

    return schedules;
  },

  // バー描画
  renderBars(jobs) {
    const colW = this.config.colWidth;
    const laneH = 16;   // lane間の高さ
    const subH = 14;    // 同lane内の段高さ
    const topPadding = 14; // 行の上余白（ラベル用スペース）

    jobs.forEach((job) => {
      // 各行の.bar-layerを取得
      const row = document.querySelector(`.excel-grid-row[data-job-id="${job.jobId}"]`);
      if (!row) return;
      const layer = row.querySelector('.bar-layer');
      if (!layer) return;

      const schedules = Store.getSchedulesByJobId(job.jobId);

      // 各スケジュールにlane情報を付与
      schedules.forEach(sch => {
        const process = Store.getProcessById(sch.processId);
        const processName = process?.['工程名'] || '';
        const style = this.getBarStyle(processName);
        sch._lane = style.lane ?? 0;
        sch._shape = style.shape ?? 'rect';
        sch._processName = processName;
        sch._color = process?.['工程色(colorHex)'] || '#4A90E2';
      });

      // 重なり自動段組み（subLane割り当て）
      this.assignSubLanes(schedules);

      let html = '';
      schedules.forEach(sch => {
        const startIdx = this.getDateIndex(sch.start);
        const endIdx = this.getDateIndex(sch.end);

        if (startIdx === -1 && endIdx === -1) return; // 表示範囲外
        if (endIdx < 0) return; // 完全に左側
        if (startIdx >= this.dates.length) return; // 完全に右側

        // クランプ
        const visStart = Math.max(0, startIdx);
        const visEnd = Math.min(this.dates.length - 1, endIdx);

        const left = visStart * colW;
        const width = (visEnd - visStart + 1) * colW;

        const label = sch.label || sch._processName;

        // Y位置（lane + subLane から計算）
        const topInRow = topPadding + (sch._lane * laneH) + ((sch._subLane ?? 0) * subH);

        html += this.buildBarHtml({
          left, width, topInRow,
          color: sch._color,
          label,
          shape: sch._shape,
          scheduleId: sch.scheduleId,
          jobId: job.jobId
        });
      });

      layer.innerHTML = html;
    });
  },

  // 日付インデックス取得
  getDateIndex(dateStr) {
    const idx = this.dates.indexOf(dateStr);
    if (idx !== -1) return idx;

    // 範囲外の場合、相対位置を計算
    const target = Utils.parseLocalDate(dateStr);
    const start = this.viewStart;
    const diffDays = Math.floor((target - start) / (1000 * 60 * 60 * 24));
    return diffDays;
  },

  // レーン割り当て（重なり対応）
  assignLanes(schedules) {
    if (schedules.length === 0) {
      return { items: [], laneCount: 1 };
    }

    const items = [...schedules].sort((a, b) => a.start.localeCompare(b.start));
    const laneEnds = [];

    for (const s of items) {
      let placed = false;
      for (let i = 0; i < laneEnds.length; i++) {
        if (laneEnds[i] < s.start) {
          s._lane = i;
          laneEnds[i] = s.end;
          placed = true;
          break;
        }
      }
      if (!placed) {
        s._lane = laneEnds.length;
        laneEnds.push(s.end);
      }
    }

    return { items, laneCount: Math.max(1, laneEnds.length) };
  },

  // 今日ライン更新
  updateTodayLine() {
    const line = document.getElementById('excelTodayLine');
    const body = document.getElementById('excelTimeBody');
    if (!line || !body) return;

    const today = Utils.getToday();
    const idx = this.dates.indexOf(today);

    if (idx === -1) {
      line.style.display = 'none';
      return;
    }

    const left = idx * this.config.colWidth + (this.config.colWidth / 2);
    line.style.display = 'block';
    line.style.left = `${left}px`;
  },

  // スクロールバー幅更新
  updateScrollbarWidth(gridWidth) {
    const content = document.getElementById('excelScrollbarContent');
    if (content) {
      content.style.width = `${gridWidth}px`;
    }
  },

  // 日付フォーマット
  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const d = Utils.parseLocalDate(dateStr);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  },

  // 住所を都道府県+市まで短縮
  shortenAddress(address) {
    if (!address) return '';
    // 都道府県+市まで抽出（例：千葉県千葉市、東京都渋谷区）
    const match = address.match(/^(.+?[都道府県])(.+?[市区])/);
    if (match) {
      return match[1] + match[2];
    }
    return address;
  },

  // 工番クリック
  onJobClick(jobId) {
    const job = Store.getJobById(jobId);
    if (job) {
      JobDetail.open(jobId);
    }
  },

  /**
   * 工番の変更後日付を更新
   * @param {string} jobId - 対象のjobId
   * @param {string} dateType - 'draw' | 'ship'
   * @param {string} newDate - 新しい日付（YYYY-MM-DD形式）
   */
  async updateJobChangedDate(jobId, dateType, newDate) {
    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    const fieldName = dateType === 'draw' ? '出図予定日変更後' : '出荷予定日変更後';

    try {
      await Store.updateJob(jobId, { [fieldName]: newDate }, job.updatedAt);
      Utils.showToast('日付を更新しました', 'success');
      this.render();
    } catch (error) {
      console.error('Failed to update changed date:', error);
      Utils.showToast('日付の更新に失敗しました', 'error');
    }
  },

  // バークリック
  onBarClick(jobId, scheduleId) {
    const job = Store.getJobById(jobId);
    const schedule = Store.getScheduleById(scheduleId);
    if (job && schedule) {
      EntryModal.open(job, schedule.start, schedule);
    }
  },

  // ====== 出張予定セクション ======
  tripPersonFilter: null,

  renderTrips() {
    const container = document.getElementById('gantt-trip-container');
    const countEl = document.getElementById('gantt-trip-count');
    if (!container) return;

    const trips = Store.state.trips || [];
    let filteredTrips = trips;

    // デバッグログ: 埋め込み出張計画の状態
    console.log('[TripEmbed] timeline', {
      start: Store.state.displayStartDate,
      end: Utils.addDays(Store.state.displayStartDate, Store.state.displayDays - 1),
      days: Store.state.displayDays,
      colWidth: this.config?.colWidth
    });
    console.log('[TripEmbed] raw trips', trips.map(t => ({
      tripId: t.tripId,
      personId: t.personId,
      start: t.start,
      end: t.end
    })));

    // 担当者フィルタ
    if (this.tripPersonFilter) {
      filteredTrips = trips.filter(t => t.personId === this.tripPersonFilter);
    }

    // 期間内フィルタ
    const startDate = Store.state.displayStartDate;
    const endDate = Utils.addDays(startDate, Store.state.displayDays - 1);
    const beforeFilterCount = filteredTrips.length;
    filteredTrips = filteredTrips.filter(t => t.end >= startDate && t.start <= endDate);

    console.log('[TripEmbed] filter', {
      assigneeFilter: this.tripPersonFilter,
      beforePeriodFilter: beforeFilterCount,
      afterAllFiltersCount: filteredTrips.length
    });

    if (countEl) {
      countEl.textContent = `${filteredTrips.length}件`;
    }

    if (filteredTrips.length === 0) {
      container.innerHTML = '<div class="text-center text-gray-400 py-4">出張予定がありません</div>';
      return;
    }

    // 担当者ごとにグループ化
    const byPerson = {};
    filteredTrips.forEach(trip => {
      const person = Store.getPersonById(trip.personId);
      const name = person?.['氏名'] || '未設定';
      if (!byPerson[name]) byPerson[name] = [];
      byPerson[name].push(trip);
    });

    let html = '';
    Object.keys(byPerson).sort().forEach(name => {
      html += `<div class="embedded-trip-person-group">`;
      html += `<div class="embedded-trip-person-name">${Utils.escapeHtml(name)}</div>`;
      html += `<div class="embedded-trip-bars">`;

      byPerson[name].forEach(trip => {
        const startIdx = this.getDateIndex(trip.start);
        const endIdx = this.getDateIndex(trip.end);

        const visStart = Math.max(0, startIdx);
        const visEnd = Math.min(this.dates.length - 1, endIdx);

        if (visEnd < 0 || visStart >= this.dates.length) return;

        const left = visStart * this.config.colWidth;
        const width = (visEnd - visStart + 1) * this.config.colWidth;

        html += `
          <div class="embedded-trip-bar"
               style="left:${left}px; width:${width}px;"
               onclick="TripModal.open('${trip.tripId}')">
            ${Utils.escapeHtml(trip.destination || '')}
          </div>
        `;
      });

      html += `</div></div>`;
    });

    container.innerHTML = html;
  },

  toggleTripSection() {
    const section = document.getElementById('gantt-trip-section');
    if (section) {
      const wasCollapsed = section.classList.contains('collapsed');
      section.classList.toggle('collapsed');
      if (wasCollapsed) {
        // CSSトランジション完了後に再描画
        setTimeout(() => this.renderTrips(), 350);
      }
    }
  },

  handleTripPersonSearch() {
    const input = document.getElementById('gantt-trip-person-input');
    const errorEl = document.getElementById('gantt-trip-filter-error');
    if (!input) return;

    const query = input.value.trim();
    if (!query) {
      this.clearTripPersonFilter();
      return;
    }

    // 担当者検索
    const people = Store.state.people || [];
    const found = people.find(p => p['氏名']?.includes(query));

    if (found) {
      this.tripPersonFilter = found.personId;
      if (errorEl) errorEl.textContent = '';
      this.renderTrips();
    } else {
      if (errorEl) errorEl.textContent = '該当なし';
    }
  },

  clearTripPersonFilter() {
    const input = document.getElementById('gantt-trip-person-input');
    const errorEl = document.getElementById('gantt-trip-filter-error');
    if (input) input.value = '';
    if (errorEl) errorEl.textContent = '';
    this.tripPersonFilter = null;
    this.renderTrips();
  }
};

// GanttUIMode - UI切替管理
// ========================================

const GanttUIMode = {
  currentMode: 'classic', // 'classic' or 'excel'

  init() {
    // ローカルストレージから前回のモードを復元
    const savedMode = localStorage.getItem('ganttUIMode');
    if (savedMode === 'excel') {
      this.setMode('excel', false);
    }
    console.log('[GanttUIMode] Initialized, mode:', this.currentMode);
  },

  setMode(mode, save = true) {
    this.currentMode = mode;

    const classicContainer = document.getElementById('gantt-classic-container');
    const excelContainer = document.getElementById('gantt-excel-container');
    const classicBtn = document.getElementById('ui-mode-classic');
    const excelBtn = document.getElementById('ui-mode-excel');

    if (mode === 'classic') {
      // 旧UI表示
      if (classicContainer) classicContainer.classList.remove('hidden');
      if (excelContainer) excelContainer.classList.add('hidden');
      if (classicBtn) classicBtn.classList.add('ui-mode-btn-active');
      if (excelBtn) excelBtn.classList.remove('ui-mode-btn-active');
      // 旧Ganttで再描画
      Gantt.render();
    } else {
      // Excel風UI表示
      if (classicContainer) classicContainer.classList.add('hidden');
      if (excelContainer) excelContainer.classList.remove('hidden');
      if (classicBtn) classicBtn.classList.remove('ui-mode-btn-active');
      if (excelBtn) excelBtn.classList.add('ui-mode-btn-active');
      // ExcelGanttで再描画
      ExcelGantt.render();
    }

    // ローカルストレージに保存
    if (save) {
      localStorage.setItem('ganttUIMode', mode);
    }

    console.log('[GanttUIMode] Mode changed to:', mode);
  },

  // 現在のモードに応じてrender
  render() {
    if (this.currentMode === 'classic') {
      Gantt.render();
    } else {
      ExcelGantt.render();
    }
  }
};

// ResourceView - 作業者別工程表
// ========================================

const ResourceView = {
  config: {
    cellWidth: 32,
    rowHeight: 40
  },
  dates: [],

  init() {
    Store.subscribe((state) => {
      if (state.currentView === 'resource') {
        this.render();
      }
    });
  },

  render() {
    const { people, schedules, trips, displayStartDate, displayDays } = Store.state;
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);
    const groupedPeople = this.groupByDepartment(people);

    this.renderDateHeader();
    this.renderBody(groupedPeople, schedules, trips);
  },

  groupByDepartment(people) {
    const groups = {};
    people.forEach(person => {
      const dept = person['部署/区分'] || 'その他';
      if (!groups[dept]) {
        groups[dept] = [];
      }
      groups[dept].push(person);
    });
    return groups;
  },

  renderDateHeader() {
    const container = document.getElementById('resource-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;

    this.dates.forEach(date => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;

      const showMonth = month !== currentMonth;
      currentMonth = month;

      let classes = 'resource-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';

      html += `
        <div class="${classes}">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  renderBody(groupedPeople, schedules, trips) {
    const container = document.getElementById('resource-body');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';

    Object.keys(groupedPeople).forEach(dept => {
      html += `
        <div class="resource-dept-header">
          <div class="resource-dept-name">${Utils.escapeHtml(dept)}</div>
          <div class="resource-dept-grid">
            ${this.dates.map(date => {
              const isWeekend = Utils.isWeekend(date);
              return `<div class="resource-grid-cell ${isWeekend ? 'weekend' : ''}"></div>`;
            }).join('')}
          </div>
        </div>
      `;

      groupedPeople[dept].forEach(person => {
        const personSchedules = this.getPersonSchedules(person.personId, schedules);
        const personTrips = trips.filter(t => t.personId === person.personId);
        const personColor = person['作業者色(colorHex)'] || '#6b7280';

        html += `
          <div class="resource-person-row">
            <div class="resource-person-name resource-person-clickable" style="border-left: 4px solid ${personColor}"
                 data-person-id="${person.personId}" onclick="PersonGanttOverlay.open('${person.personId}')" title="クリックして大工程表を表示">
              <span class="person-name-text">${Utils.escapeHtml(person['氏名'])}</span>
              <span class="person-gantt-icon">📋</span>
            </div>
            <div class="resource-person-grid">
        `;

        this.dates.forEach(date => {
          const isWeekend = Utils.isWeekend(date);
          const isToday = date === today;
          let classes = 'resource-grid-cell';
          if (isWeekend) classes += ' weekend';
          if (isToday) classes += ' today';
          html += `<div class="${classes}"></div>`;
        });

        personSchedules.forEach(schedule => {
          html += this.renderScheduleBar(schedule, personColor);
        });

        personTrips.forEach(trip => {
          html += this.renderTripBar(trip);
        });

        html += `
            </div>
          </div>
        `;
      });
    });

    container.innerHTML = html;
  },

  getPersonSchedules(personId, schedules) {
    return schedules.filter(s =>
      s.mainPersonId === personId || s.subPersonId === personId
    );
  },

  renderScheduleBar(schedule, personColor) {
    const { displayStartDate } = Store.state;
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);
    const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 4;

    const job = Store.getJobById(schedule.jobId);
    const process = Store.getProcessById(schedule.processId);
    const jobNo = job?.['工番'] || '';
    const isMilestone = process?.['種別(type)'] === 'milestone';
    // マイルストーンは★を自前で付けるため、生の工程名を使用し、既存の★を除去（二重★防止）
    const rawProcessName = (process?.['工程名'] || '').replace(/^★+/, '');
    const processName = isMilestone ? rawProcessName : Store.getProcessDisplayName(schedule.processId);

    if (isMilestone) {
      const milestoneLeft = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 10;
      return `
        <div class="resource-milestone" style="left: ${milestoneLeft}px;" title="${jobNo} - ${rawProcessName}">
          ★${Utils.escapeHtml(rawProcessName)}
        </div>
      `;
    }

    const isSubPerson = schedule.subPersonId && schedule.mainPersonId !== schedule.subPersonId;
    const opacity = isSubPerson ? '0.7' : '1';

    return `
      <div class="resource-bar" style="left: ${left}px; width: ${width}px; background-color: ${personColor}; opacity: ${opacity};"
           title="${jobNo} - ${processName}${isSubPerson ? ' (副)' : ''}">
        <span class="resource-bar-text">${Utils.escapeHtml(jobNo)}</span>
        <span class="resource-bar-process">${Utils.escapeHtml(processName)}</span>
      </div>
    `;
  },

  renderTripBar(trip) {
    const { displayStartDate } = Store.state;
    const startOffset = Utils.getDaysBetween(displayStartDate, trip.start);
    const duration = Utils.getDaysBetween(trip.start, trip.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 4;

    const destination = trip['行先'] || '';
    const purpose = trip['用件'] || '';

    return `
      <div class="resource-trip-bar" style="left: ${left}px; width: ${width}px;"
           title="${destination} - ${purpose}">
        <span class="trip-icon">🚗</span>
        <span class="trip-text">${Utils.escapeHtml(destination || purpose)}</span>
      </div>
    `;
  }
};

// WorkerJobAssignView - 作業者別担当工番カード表示
