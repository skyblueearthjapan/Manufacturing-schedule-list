// ========================================
// Utils - ユーティリティ関数
// ========================================

const Utils = {
  formatDate(date) {
    if (!date) return '';
    const d = new Date(date);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  },

  getToday() {
    return this.formatDate(new Date());
  },

  addDays(dateStr, days) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + days);
    return this.formatDate(d);
  },

  getDaysBetween(startDate, endDate) {
    const start = new Date(startDate);
    const end = new Date(endDate);
    return Math.ceil((end - start) / (1000 * 60 * 60 * 24));
  },

  getDayOfWeek(dateStr) {
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const d = new Date(dateStr);
    return days[d.getDay()];
  },

  isWeekend(dateStr) {
    const d = new Date(dateStr);
    const day = d.getDay();
    return day === 0 || day === 6;
  },

  isHoliday(dateStr) {
    return false;
  },

  getMonth(dateStr) {
    return new Date(dateStr).getMonth() + 1;
  },

  getDay(dateStr) {
    return new Date(dateStr).getDate();
  },

  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return `${parseInt(match[2])}/${parseInt(match[3])}`;
    }
    const match2 = dateStr.match(/(\d{1,2})\/(\d{1,2})/);
    if (match2) {
      return `${match2[1]}/${match2[2]}`;
    }
    return dateStr;
  },

  generateDateRange(startDate, days) {
    const dates = [];
    for (let i = 0; i < days; i++) {
      dates.push(this.addDays(startDate, i));
    }
    return dates;
  },

  lightenColor(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;
    return '#' + (
      0x1000000 +
      (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
      (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
      (B < 255 ? B < 1 ? 0 : B : 255)
    ).toString(16).slice(1);
  },

  debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  },

  showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  },

  setLoading(show) {
    const loading = document.getElementById('loading');
    if (show) {
      loading.classList.remove('hidden');
    } else {
      loading.classList.add('hidden');
    }
  },

  escapeHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  },

  /**
   * 日本語色名やrgb()をHex形式に正規化
   * @param {string} input - 色の入力値
   * @returns {string|null} - #RRGGBB形式、または無効な場合はnull
   */
  normalizeColor(input) {
    if (!input) return null;

    const str = String(input).trim();

    // 既に#RRGGBB形式
    if (/^#[0-9A-Fa-f]{6}$/.test(str)) {
      return str.toUpperCase();
    }

    // #RGB形式 → #RRGGBB
    if (/^#[0-9A-Fa-f]{3}$/.test(str)) {
      const r = str[1], g = str[2], b = str[3];
      return `#${r}${r}${g}${g}${b}${b}`.toUpperCase();
    }

    // rgb(r, g, b)形式
    const rgbMatch = str.match(/^rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
    if (rgbMatch) {
      const r = Math.min(255, parseInt(rgbMatch[1])).toString(16).padStart(2, '0');
      const g = Math.min(255, parseInt(rgbMatch[2])).toString(16).padStart(2, '0');
      const b = Math.min(255, parseInt(rgbMatch[3])).toString(16).padStart(2, '0');
      return `#${r}${g}${b}`.toUpperCase();
    }

    // 日本語色名マッピング
    const colorMap = {
      '青': '#2563EB',
      '赤': '#EF4444',
      '緑': '#22C55E',
      '黄': '#F59E0B',
      '黄色': '#F59E0B',
      '紫': '#A855F7',
      '橙': '#F97316',
      'オレンジ': '#F97316',
      '黒': '#111827',
      '灰': '#6B7280',
      '灰色': '#6B7280',
      'グレー': '#6B7280',
      '白': '#FFFFFF',
      'ピンク': '#EC4899',
      '水色': '#06B6D4',
      '茶': '#92400E',
      '茶色': '#92400E',
      // 英語色名
      'blue': '#2563EB',
      'red': '#EF4444',
      'green': '#22C55E',
      'yellow': '#F59E0B',
      'purple': '#A855F7',
      'orange': '#F97316',
      'black': '#111827',
      'gray': '#6B7280',
      'grey': '#6B7280',
      'white': '#FFFFFF',
      'pink': '#EC4899',
      'cyan': '#06B6D4'
    };

    const mapped = colorMap[str.toLowerCase()] || colorMap[str];
    if (mapped) return mapped;

    // 不明な値はnull
    return null;
  },

  /**
   * Hex色にアルファ値を追加
   * @param {string} hex - #RRGGBB形式
   * @param {string} alphaHex - 00-FF形式のアルファ値
   * @param {string} fallback - hexが無効な場合のフォールバック色
   * @returns {string} - #RRGGBBAA形式
   */
  withAlpha(hex, alphaHex, fallback = '#6B7280') {
    const normalized = this.normalizeColor(hex);
    const color = normalized || fallback;
    return `${color}${alphaHex}`;
  },

  /**
   * 色が有効かどうかをチェック（normalizeColorで変換可能か）
   * @param {string} input
   * @returns {boolean}
   */
  isValidColor(input) {
    return this.normalizeColor(input) !== null;
  },

  /**
   * 厳密な#RRGGBB形式かどうかをチェック
   * @param {string} input
   * @returns {boolean}
   */
  isValidHexColor(input) {
    if (!input || typeof input !== 'string') return false;
    return /^#[0-9A-Fa-f]{6}$/.test(input.trim());
  }
};

// ========================================
// API - GAS APIクライアント
// ========================================

const API = {
  TIMEOUT: 30000,

  isGasEnvironment() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  },

  call(functionName, ...args) {
    console.log(`[API.call] Calling ${functionName} with args:`, args);
    return new Promise((resolve, reject) => {
      if (!this.isGasEnvironment()) {
        console.error('[API.call] Not in GAS environment');
        reject(new Error('GAS環境で実行されていません。ウェブアプリとしてデプロイしてください。'));
        return;
      }

      const timeoutId = setTimeout(() => {
        console.error(`[API.call] Timeout for ${functionName}`);
        reject(new Error(`API呼び出しがタイムアウトしました (${functionName})`));
      }, this.TIMEOUT);

      try {
        google.script.run
          .withSuccessHandler((result) => {
            clearTimeout(timeoutId);
            console.log(`[API.call] ${functionName} success, result:`, result);
            resolve(result);
          })
          .withFailureHandler((error) => {
            clearTimeout(timeoutId);
            console.error(`[API.call] ${functionName} failure:`, error);
            const errorMessage = error?.message || error?.toString() || '不明なエラーが発生しました';
            reject(new Error(errorMessage));
          })
          [functionName](...args);
      } catch (e) {
        clearTimeout(timeoutId);
        console.error(`[API.call] ${functionName} exception:`, e);
        reject(new Error(`API呼び出しに失敗しました: ${e.message}`));
      }
    });
  },

  async getBootstrapData(rangeStart, days) {
    return await this.call('api_getBootstrapData', rangeStart, days);
  },

  async getSchedules(rangeStart, rangeEnd, filters = {}) {
    return await this.call('api_getSchedules', rangeStart, rangeEnd, filters);
  },

  async createSchedule(payload) {
    return await this.call('api_createSchedule', payload);
  },

  async updateSchedule(scheduleId, patch, expectedUpdatedAt) {
    return await this.call('api_updateSchedule', scheduleId, patch, expectedUpdatedAt);
  },

  async deleteSchedule(scheduleId, expectedUpdatedAt) {
    return await this.call('api_deleteSchedule', scheduleId, expectedUpdatedAt);
  },

  async getAttachments(jobId) {
    return await this.call('api_getAttachments', jobId);
  },

  async getTrips(rangeStart, rangeEnd, filters = {}) {
    return await this.call('api_getTrips', rangeStart, rangeEnd, filters);
  },

  async createJob(payload) {
    return await this.call('api_createJob', payload);
  },

  async updateJob(jobId, patch, expectedUpdatedAt) {
    return await this.call('api_updateJob', jobId, patch, expectedUpdatedAt);
  },

  async syncExternalJobMaster() {
    return await this.call('api_syncExternalJobMaster');
  },

  async searchExternalJobMaster(query, limit = 20) {
    return await this.call('api_searchExternalJobMaster', query, limit);
  },

  async getPeople(includeInactive = false) {
    return await this.call('api_getPeople', includeInactive);
  },

  async createPerson(payload) {
    return await this.call('api_createPerson', payload);
  },

  async updatePerson(personId, patch, expectedUpdatedAt) {
    return await this.call('api_updatePerson', personId, patch, expectedUpdatedAt);
  }
};

console.log('[DEBUG] API defined');

// ========================================
// Store - アプリケーション状態管理
// ========================================

const Store = {
  state: {
    jobs: [],
    processes: [],
    people: [],
    schedules: [],
    attachments: [],
    trips: [],
    jobMaster: [], // 外部工番マスター
    workerJobAssign: [], // 作業者別担当工番
    displayStartDate: null,
    displayDays: 120,
    colorMode: 'process',
    currentView: 'master',
    isLoading: false,
    lastFetchedAt: null
  },

  init() {
    if (!this.state.displayStartDate) {
      this.state.displayStartDate = Utils.getToday();
    }
  },

  listeners: [],

  setState(newState) {
    this.state = { ...this.state, ...newState };
    this.notify();
  },

  subscribe(callback) {
    this.listeners.push(callback);
    return () => {
      this.listeners = this.listeners.filter(l => l !== callback);
    };
  },

  notify() {
    this.listeners.forEach(callback => callback(this.state));
  },

  async loadBootstrapData() {
    try {
      this.init();
      this.setState({ isLoading: true });
      Utils.setLoading(true);
      console.log('Loading bootstrap data...');
      console.log('Calling API.getBootstrapData with:', this.state.displayStartDate, this.state.displayDays);

      const data = await API.getBootstrapData(
        this.state.displayStartDate,
        this.state.displayDays
      );

      console.log('API.getBootstrapData returned:', data);
      console.log('typeof data:', typeof data);

      if (!data) {
        throw new Error('サーバーからデータが返されませんでした');
      }

      this.setState({
        jobs: data.jobs || [],
        processes: data.processes || [],
        people: data.people || [],
        schedules: data.schedules || [],
        trips: data.trips || [],
        jobMaster: data.jobMaster || [],
        workerJobAssign: data.workerJobAssign || [],
        lastFetchedAt: data.meta?.fetchedAt || new Date().toISOString(),
        isLoading: false
      });

      Utils.setLoading(false);
      console.log('Bootstrap data loaded:', {
        jobs: data.jobs?.length || 0,
        processes: data.processes?.length || 0,
        people: data.people?.length || 0,
        schedules: data.schedules?.length || 0
      });
    } catch (error) {
      console.error('Failed to load bootstrap data:', error);
      Utils.setLoading(false);
      this.setState({ isLoading: false });

      let errorMessage = 'データの読み込みに失敗しました';
      if (error.message) {
        if (error.message.includes('タイムアウト')) {
          errorMessage = 'サーバー応答がタイムアウトしました。スプレッドシートの設定を確認してください。';
        } else if (error.message.includes('シート') && error.message.includes('見つかりません')) {
          errorMessage = error.message + ' スプレッドシートにシートを作成してください。';
        } else {
          errorMessage = error.message;
        }
      }
      Utils.showToast(errorMessage, 'error', 8000);
    }
  },

  async changeDisplayRange(startDate, days) {
    this.setState({
      displayStartDate: startDate,
      displayDays: days
    });
    await this.loadBootstrapData();
  },

  addJob(job) {
    const jobs = [...this.state.jobs, job];
    this.setState({ jobs });
  },

  updateJobInStore(jobId, updates) {
    const jobs = this.state.jobs.map(j =>
      j.jobId === jobId ? { ...j, ...updates } : j
    );
    this.setState({ jobs });
  },

  addSchedule(schedule) {
    const schedules = [...this.state.schedules, schedule];
    this.setState({ schedules });
  },

  updateScheduleInStore(scheduleId, updates) {
    const schedules = this.state.schedules.map(s =>
      s.scheduleId === scheduleId ? { ...s, ...updates } : s
    );
    this.setState({ schedules });
  },

  removeSchedule(scheduleId) {
    const schedules = this.state.schedules.filter(s => s.scheduleId !== scheduleId);
    this.setState({ schedules });
  },

  addPerson(person) {
    const people = [...this.state.people, person];
    this.setState({ people });
  },

  updatePersonInStore(personId, updates) {
    const people = this.state.people.map(p =>
      p.personId === personId ? { ...p, ...updates } : p
    );
    this.setState({ people });
  },

  getJobById(jobId) {
    return this.state.jobs.find(j => j.jobId === jobId) || null;
  },

  getProcessById(processId) {
    return this.state.processes.find(p => p.processId === processId) || null;
  },

  getPersonById(personId) {
    return this.state.people.find(p => p.personId === personId) || null;
  },

  getSchedulesByJobId(jobId) {
    return this.state.schedules.filter(s => s.jobId === jobId);
  },

  getProcessColor(processId) {
    const process = this.getProcessById(processId);
    const raw = process?.['工程色(colorHex)'];
    // 有効なHex色のみ使用、それ以外はフォールバック
    return Utils.isValidHexColor(raw) ? raw.toUpperCase() : '#6B7280';
  },

  getPersonColor(personId) {
    const person = this.getPersonById(personId);
    const raw = person?.['作業者色(colorHex)'];
    return Utils.normalizeColor(raw) || '#6B7280';
  },

  getBarColor(schedule) {
    // 常に工程色を使用（担当者色ロジックは撤去）
    return this.getProcessColor(schedule.processId);
  },

  isMilestone(processId) {
    const process = this.getProcessById(processId);
    return process?.['種別(type)'] === 'milestone';
  },

  /**
   * 工程が重要工程（isWeekly）かどうかを判定
   */
  isImportantProcess(processId) {
    const process = this.getProcessById(processId);
    return process?.isWeekly === true;
  },

  /**
   * 工程の表示名を取得（isWeekly=true なら ★ を付ける）
   * ★の二重付与を防止
   */
  getProcessDisplayName(processId) {
    const process = this.getProcessById(processId);
    if (!process) return '';
    const name = process['工程名'] || '';
    // isWeekly=true かつ、まだ★が付いていなければ★を付ける
    if (process.isWeekly && !name.startsWith('★')) {
      return `★${name}`;
    }
    return name;
  },

  hasAttachments(jobId) {
    return this.state.attachments.some(a => a.jobId === jobId);
  }
};

console.log('[DEBUG] Store defined');

// ========================================
// Gantt - ガントチャート描画
// ========================================

const Gantt = {
  config: {
    cellWidth: 32,
    baseRowHeight: 64,      // 1レーンの場合の行高さ
    laneHeight: 28,         // 追加レーンあたりの高さ
    barHeight: 24,          // バーの高さ
    barTopPadding: 6,       // バー上部のパディング
    jobPaneWidth: 360
  },

  dates: [],

  // 工番ごとのレーン数を保持
  jobLaneCounts: {},

  // ドラッグ範囲選択の状態
  dragState: {
    isDragging: false,
    startJobId: null,
    startDate: null,
    endDate: null
  },

  init() {
    this.setupEventListeners();
    this.attachGridEventListeners(); // イベント委譲は一度だけ設定
    Store.subscribe(() => this.render());
  },

  // スケジュールにレーンを割り当てる（重なり対応）
  assignLanes(schedules) {
    if (schedules.length === 0) return { items: [], laneCount: 1 };

    // 開始日でソート
    const items = [...schedules].sort((a, b) => a.start.localeCompare(b.start));
    const laneEnds = []; // 各レーンの終了日を保持

    for (const s of items) {
      let placed = false;
      for (let i = 0; i < laneEnds.length; i++) {
        // そのレーンが空いている（前のスケジュールの終了日 < 今のスケジュールの開始日）
        if (laneEnds[i] < s.start) {
          s._lane = i;
          laneEnds[i] = s.end;
          placed = true;
          break;
        }
      }
      if (!placed) {
        // 新しいレーンを作成
        s._lane = laneEnds.length;
        laneEnds.push(s.end);
      }
    }

    return {
      items,
      laneCount: Math.max(1, laneEnds.length)
    };
  },

  // 工番の行の高さを計算
  getRowHeight(laneCount) {
    if (laneCount <= 1) return this.config.baseRowHeight;
    return this.config.baseRowHeight + (laneCount - 1) * this.config.laneHeight;
  },

  setupEventListeners() {
    const hScrollBody = document.getElementById('gantt-h-scroll-body');
    const hScrollHeader = document.getElementById('gantt-h-scroll-header');

    if (hScrollBody && hScrollHeader) {
      hScrollBody.addEventListener('scroll', () => {
        hScrollHeader.scrollLeft = hScrollBody.scrollLeft;
        this.updateTodayLinePosition();
      });
    }
  },

  render() {
    const { jobs, displayStartDate, displayDays } = Store.state;
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);
    const gridWidth = this.dates.length * this.config.cellWidth;
    document.documentElement.style.setProperty('--grid-width', `${gridWidth}px`);

    this.renderDateHeader();
    this.renderJobPane(jobs);
    this.renderGrid(jobs);
    this.updateTodayLinePosition();
  },

  renderDateHeader() {
    const container = document.getElementById('gantt-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;
    const gridWidth = this.dates.length * this.config.cellWidth;

    this.dates.forEach((date, index) => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;

      let classes = 'gantt-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';

      const showMonth = month !== currentMonth;
      currentMonth = month;

      html += `
        <div class="${classes}" data-date="${date}">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month">&nbsp;</div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
    container.style.minWidth = `${gridWidth}px`;
  },

  renderJobPane(jobs) {
    const container = document.getElementById('gantt-job-pane');
    if (!container) return;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="empty-job-pane flex flex-col items-center justify-center h-48 text-center text-gray-400 text-sm m-2 border-2 border-dashed border-gray-300 rounded-lg">
          <div>工番データがありません</div>
          <div class="text-xs mt-2">上の「＋工番追加」から追加してください</div>
        </div>
      `;
      return;
    }

    let html = '';
    jobs.forEach((job) => {
      const shipDate = this.formatShortDate(job['出荷予定日']);
      const drawDate = this.formatShortDate(job['出図予定日']);
      const laneCount = this.jobLaneCounts[job.jobId] || 1;
      const rowHeight = this.getRowHeight(laneCount);

      // 担当者名を取得
      const mainPerson = job.mainPersonId ? Store.getPersonById(job.mainPersonId) : null;
      const subPerson = job.subPersonId ? Store.getPersonById(job.subPersonId) : null;
      const mainPersonName = mainPerson?.['氏名'] || '';
      const subPersonName = subPerson?.['氏名'] || '';

      // 担当者表示文字列を作成
      let personDisplay = '';
      if (mainPersonName || subPersonName) {
        const parts = [];
        if (mainPersonName) parts.push(`主）${mainPersonName}`);
        if (subPersonName) parts.push(`副）${subPersonName}`);
        personDisplay = `担当：${parts.join(' ')}`;
      }

      html += `
        <div class="job-info-block" data-job-id="${job.jobId}" style="height: ${rowHeight}px; min-height: ${rowHeight}px;" onclick="Gantt.onJobClick('${job.jobId}')">
          <div class="job-info-content">
            <div class="job-info-row1">
              <div class="job-info-jobno">
                <span class="label">[工番]</span>
                <span>${Utils.escapeHtml(job['工番'] || '')}</span>
              </div>
              <div class="job-info-status">
                <span class="label">[${Utils.escapeHtml(job['状態'] || '未着手')}]</span>
                <span>${Utils.escapeHtml(job['重要メモ'] || '')}</span>
              </div>
              <button type="button"
                class="job-edit-btn ml-2 text-xs px-2 py-0.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 hover:border-gray-400"
                onclick="event.stopPropagation(); JobModal.openEdit(Store.getJobById('${job.jobId}'));"
                title="工番を編集">
                ✎
              </button>
            </div>
            <div class="job-info-row2">
              <div class="job-info-customer">顧客：${Utils.escapeHtml(job['顧客名'] || '-')}</div>
              <div class="job-info-draw-date">出図予定：${drawDate || '-'}</div>
            </div>
            <div class="job-info-row3">
              <div class="job-info-product">${Utils.escapeHtml(job['設備/製品名'] || '-')}</div>
              <div class="job-info-qty">台数：${job['台数'] || '-'}</div>
              <div class="job-info-ship-date">出荷予定：${shipDate || '-'}</div>
            </div>
            ${personDisplay ? `<div class="job-info-row4 text-xs text-gray-500 mt-0.5">${Utils.escapeHtml(personDisplay)}</div>` : ''}
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return `${parseInt(match[2])}/${parseInt(match[3])}`;
    }
    const match2 = dateStr.match(/(\d{1,2})\/(\d{1,2})/);
    if (match2) {
      return `${match2[1]}/${match2[2]}`;
    }
    return dateStr;
  },

  renderGrid(jobs) {
    const container = document.getElementById('gantt-grid');
    if (!container) return;

    const today = Utils.getToday();
    const gridWidth = this.dates.length * this.config.cellWidth;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="flex items-center justify-center h-48 text-gray-400 text-sm" style="min-width: ${gridWidth}px;">
          <div class="text-center">
            <div class="mb-2">← 左のボタンから工番を追加してください</div>
            <div class="text-xs">工番を追加すると、ここに日付グリッドが表示されます</div>
          </div>
        </div>
      `;
      container.style.minWidth = `${gridWidth}px`;
      return;
    }

    // まず全工番のレーン数を計算
    this.jobLaneCounts = {};
    const jobSchedulesWithLanes = {};

    jobs.forEach(job => {
      const schedules = Store.getSchedulesByJobId(job.jobId);
      const { items, laneCount } = this.assignLanes(schedules);
      this.jobLaneCounts[job.jobId] = laneCount;
      jobSchedulesWithLanes[job.jobId] = items;
    });

    let html = '';
    jobs.forEach(job => {
      const laneCount = this.jobLaneCounts[job.jobId] || 1;
      const rowHeight = this.getRowHeight(laneCount);

      html += `<div class="gantt-grid-row" data-job-id="${job.jobId}" style="height: ${rowHeight}px; min-height: ${rowHeight}px;">`;
      this.dates.forEach(date => {
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;
        let bgClass = 'bg-white';
        if (isWeekend) bgClass = 'bg-yellow-50';
        if (isToday) bgClass = 'bg-blue-50';

        html += `
          <button
            type="button"
            class="gantt-grid-cell ${bgClass}"
            data-job-id="${job.jobId}"
            data-date="${date}"
            title="${job['工番']} - ${date}"
          ></button>
        `;
      });
      // バーは必ず row の内部に配置（row外に出すと全工番に重複表示される）
      html += this.renderBarsForJob(job.jobId, jobSchedulesWithLanes[job.jobId] || []);
      html += '</div>';
    });

    container.innerHTML = html;
    container.style.minWidth = `${gridWidth}px`;
    // イベント委譲はinit()で一度だけ設定するため、ここでは呼ばない
  },

  renderBarsForJob(jobId, schedulesWithLanes) {
    if (schedulesWithLanes.length === 0) return '';

    const { displayStartDate } = Store.state;
    let html = '';

    schedulesWithLanes.forEach(schedule => {
      const isMilestone = Store.isMilestone(schedule.processId);
      if (isMilestone) {
        html += this.renderMilestone(schedule, displayStartDate);
      } else {
        html += this.renderBar(schedule, displayStartDate);
      }
    });

    return html;
  },

  renderBar(schedule, displayStartDate) {
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);
    const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - startOffset) * this.config.cellWidth - 4;
    const color = Store.getBarColor(schedule);
    const processName = Store.getProcessDisplayName(schedule.processId);
    const label = schedule.label || '';

    // レーンに応じたtop位置を計算
    const lane = schedule._lane || 0;
    const top = this.config.barTopPadding + (lane * this.config.laneHeight);

    return `
      <div class="gantt-bar"
           data-schedule-id="${schedule.scheduleId}"
           style="left: ${left}px; width: ${width}px; top: ${top}px; background-color: ${color};"
           title="${processName}${label ? ' - ' + label : ''}">
        <span class="bar-text">${Utils.escapeHtml(processName)}</span>
        ${label ? `<span class="gantt-bar-label">${Utils.escapeHtml(label)}</span>` : ''}
      </div>
    `;
  },

  renderMilestone(schedule, displayStartDate) {
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);

    if (startOffset < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 12;
    const processName = Store.getProcessDisplayName(schedule.processId);

    // レーンに応じたtop位置を計算
    const lane = schedule._lane || 0;
    const top = this.config.barTopPadding + (lane * this.config.laneHeight);

    return `
      <div class="gantt-milestone"
           data-schedule-id="${schedule.scheduleId}"
           style="left: ${left}px; top: ${top}px;"
           title="${processName}">
        ★
      </div>
    `;
  },

  attachGridEventListeners() {
    const grid = document.getElementById('gantt-grid');
    if (!grid) return;

    // イベント委譲：#gantt-gridに1回だけリスナーを設定

    // バー・マイルストーンのクリック
    grid.addEventListener('click', (e) => {
      const bar = e.target.closest('.gantt-bar, .gantt-milestone');
      if (bar) {
        e.stopPropagation();
        const scheduleId = bar.dataset.scheduleId;
        this.onBarClick(scheduleId);
        return;
      }
    });

    // ドラッグ範囲選択：mousedown
    grid.addEventListener('mousedown', (e) => {
      // 左クリック以外は無視
      if (e.button !== 0) return;
      // バー上でのドラッグは無視
      if (e.target.closest('.gantt-bar, .gantt-milestone')) return;

      const cell = e.target.closest('.gantt-grid-cell');
      if (!cell) return;

      e.preventDefault();
      this.dragState.isDragging = true;
      this.dragState.startJobId = cell.dataset.jobId;
      this.dragState.startDate = cell.dataset.date;
      this.dragState.endDate = cell.dataset.date;

      this.highlightRange();
    });

    // ドラッグ範囲選択：mousemove
    grid.addEventListener('mousemove', (e) => {
      if (!this.dragState.isDragging) return;

      const cell = e.target.closest('.gantt-grid-cell');
      if (!cell) return;

      // 同じjobId（同じ行）のみ範囲選択可能
      if (cell.dataset.jobId !== this.dragState.startJobId) return;

      this.dragState.endDate = cell.dataset.date;
      this.highlightRange();
    });

    // ドラッグ範囲選択：mouseup
    grid.addEventListener('mouseup', (e) => {
      if (!this.dragState.isDragging) return;

      const { startJobId, startDate, endDate } = this.dragState;

      // 範囲確定
      const rangeStart = startDate <= endDate ? startDate : endDate;
      const rangeEnd = startDate <= endDate ? endDate : startDate;

      // リセット
      this.clearHighlight();
      this.dragState.isDragging = false;
      this.dragState.startJobId = null;
      this.dragState.startDate = null;
      this.dragState.endDate = null;

      // モーダルを開く
      Modal.openNew(startJobId, rangeStart, rangeEnd);
    });

    // ドラッグキャンセル：マウスがグリッド外に出た場合
    grid.addEventListener('mouseleave', (e) => {
      if (this.dragState.isDragging) {
        this.clearHighlight();
        this.dragState.isDragging = false;
        this.dragState.startJobId = null;
        this.dragState.startDate = null;
        this.dragState.endDate = null;
      }
    });
  },

  // 選択範囲をハイライト
  highlightRange() {
    this.clearHighlight();

    const { startJobId, startDate, endDate } = this.dragState;
    if (!startJobId || !startDate || !endDate) return;

    const rangeStart = startDate <= endDate ? startDate : endDate;
    const rangeEnd = startDate <= endDate ? endDate : startDate;

    const cells = document.querySelectorAll(`#gantt-grid .gantt-grid-cell[data-job-id="${startJobId}"]`);
    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= rangeStart && date <= rangeEnd) {
        cell.classList.add('selected-range');
      }
    });
  },

  // ハイライトをクリア
  clearHighlight() {
    document.querySelectorAll('#gantt-grid .selected-range').forEach(cell => {
      cell.classList.remove('selected-range');
    });
  },

  updateTodayLinePosition() {
    const todayLine = document.getElementById('today-line');
    const hScrollBody = document.getElementById('gantt-h-scroll-body');
    if (!todayLine || !hScrollBody) return;

    const today = Utils.getToday();
    const { displayStartDate } = Store.state;
    const offset = Utils.getDaysBetween(displayStartDate, today);

    if (offset < 0 || offset >= this.dates.length) {
      todayLine.style.display = 'none';
      return;
    }

    const left = this.config.jobPaneWidth + (offset * this.config.cellWidth) + (this.config.cellWidth / 2) - hScrollBody.scrollLeft;
    todayLine.style.display = 'block';
    todayLine.style.left = `${left}px`;
  },

  onJobClick(jobId) {
    console.log('Job clicked:', jobId);
    JobDetail.open(jobId);
  },

  onAttachClick(jobId) {
    console.log('Attachment clicked:', jobId);
    Utils.showToast('添付一覧（Phase 5で実装）', 'info');
  },

  onBarClick(scheduleId) {
    console.log('Bar clicked:', scheduleId);
    const schedule = Store.state.schedules.find(s => s.scheduleId === scheduleId);
    if (schedule) {
      Modal.openEdit(schedule);
    }
  },

  onCellClick(jobId, date) {
    console.log('Cell clicked:', jobId, date);
    const job = Store.state.jobs.find(j => j.jobId === jobId);
    if (job) {
      console.log('Opening modal for:', job['工番'], date);
    }
    Modal.openNew(jobId, date, date);
  }
};

const Modal = {
  currentSchedule: null,
  isEditMode: false,

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {
    document.getElementById('modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-modal-cancel')?.addEventListener('click', () => this.close());
    document.querySelector('#modal-entry .modal-backdrop')?.addEventListener('click', () => this.close());
    document.getElementById('btn-modal-save')?.addEventListener('click', () => this.save());
    document.getElementById('btn-modal-delete')?.addEventListener('click', () => this.delete());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') this.close();
    });
    document.getElementById('entry-process')?.addEventListener('change', () => this.validateProcess());
  },

  openNew(jobId, startDate, endDate) {
    this.isEditMode = false;
    this.currentSchedule = null;

    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = jobId;
    document.getElementById('entry-start').value = startDate;
    document.getElementById('entry-end').value = endDate;
    document.getElementById('modal-title').textContent = '工程登録';
    document.getElementById('btn-modal-delete').classList.add('hidden');

    this.populateProcessSelect();
    this.open();
  },

  // JobDetailからの呼び出し用：工程を事前選択
  openNewWithProcess(jobId, processId, startDate, endDate) {
    this.isEditMode = false;
    this.currentSchedule = null;

    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = jobId;
    document.getElementById('entry-start').value = startDate;
    document.getElementById('entry-end').value = endDate;
    document.getElementById('modal-title').textContent = '工程登録';
    document.getElementById('btn-modal-delete').classList.add('hidden');

    this.populateProcessSelect(processId); // 工程を事前選択
    this.validateProcess(); // マイルストーンチェック等を実行
    this.open();
  },

  openEdit(schedule) {
    this.isEditMode = true;
    this.currentSchedule = schedule;

    const job = Store.getJobById(schedule.jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = schedule.jobId;
    document.getElementById('entry-start').value = schedule.start;
    document.getElementById('entry-end').value = schedule.end;
    document.getElementById('entry-label').value = schedule.label || '';
    document.getElementById('entry-status').value = schedule.status || '予定';
    document.getElementById('entry-memo').value = schedule.memo || '';
    document.getElementById('entry-schedule-id').value = schedule.scheduleId;
    document.getElementById('entry-updated-at').value = schedule.updatedAt || '';

    this.populateProcessSelect(schedule.processId);

    document.getElementById('modal-title').textContent = '工程編集';
    document.getElementById('btn-modal-delete').classList.remove('hidden');
    this.open();
  },

  open() {
    document.getElementById('modal-entry').classList.remove('hidden');
  },

  close() {
    document.getElementById('modal-entry').classList.add('hidden');
    this.currentSchedule = null;
    this.isEditMode = false;
  },

  resetForm() {
    document.getElementById('entry-form').reset();
    document.getElementById('entry-schedule-id').value = '';
    document.getElementById('entry-updated-at').value = '';
  },

  populateProcessSelect(selectedId = '') {
    const select = document.getElementById('entry-process');
    const processes = Store.state.processes;

    let html = '<option value="">選択してください</option>';
    processes.forEach(process => {
      const selected = process.processId === selectedId ? 'selected' : '';
      const displayName = Store.getProcessDisplayName(process.processId);
      html += `<option value="${process.processId}" ${selected}>${Utils.escapeHtml(displayName)}</option>`;
    });
    html += '<option value="__new__">＋ 新しい工程を追加</option>';
    select.innerHTML = html;
  },

  validateProcess() {
    const processId = document.getElementById('entry-process').value;

    if (processId === '__new__') {
      Utils.showToast('新規工程追加（Phase 3で実装）', 'info');
      document.getElementById('entry-process').value = '';
      return;
    }

    const process = Store.getProcessById(processId);
    if (!process) return;

    // マイルストーンの場合は終了日を開始日に合わせる
    if (process['種別(type)'] === 'milestone') {
      const start = document.getElementById('entry-start').value;
      document.getElementById('entry-end').value = start;
    }
  },

  validate() {
    const jobId = document.getElementById('entry-job-id').value;
    const processId = document.getElementById('entry-process').value;
    const start = document.getElementById('entry-start').value;
    const end = document.getElementById('entry-end').value;
    const label = document.getElementById('entry-label').value;
    const status = document.getElementById('entry-status').value;
    const memo = document.getElementById('entry-memo').value;

    if (!processId || processId === '__new__') {
      Utils.showToast('工程を選択してください', 'error');
      return null;
    }

    if (!start || !end) {
      Utils.showToast('期間を入力してください', 'error');
      return null;
    }

    if (start > end) {
      Utils.showToast('終了日は開始日以降にしてください', 'error');
      return null;
    }

    const process = Store.getProcessById(processId);
    if (process) {
      if (process['種別(type)'] === 'milestone' && start !== end) {
        Utils.showToast('マイルストーン工程は開始日と終了日を同じにしてください', 'error');
        return null;
      }
    }

    return {
      jobId,
      processId,
      start,
      end,
      label,
      status,
      memo
    };
  },

  async save() {
    const payload = this.validate();
    if (!payload) return;

    try {
      Utils.setLoading(true);

      if (this.isEditMode) {
        const scheduleId = document.getElementById('entry-schedule-id').value;
        const expectedUpdatedAt = document.getElementById('entry-updated-at').value;
        const result = await API.updateSchedule(scheduleId, payload, expectedUpdatedAt);
        Store.updateScheduleInStore(scheduleId, result);
        Utils.showToast('更新しました', 'success');
      } else {
        const result = await API.createSchedule(payload);
        Store.addSchedule(result);
        Utils.showToast('登録しました', 'success');
      }

      Utils.setLoading(false);
      this.close();

      // JobDetailが開いている場合は再描画
      if (JobDetail.currentJobId) {
        JobDetail.render();
      }
    } catch (error) {
      Utils.setLoading(false);
      console.error('Save failed:', error);

      if (error.message?.includes('他のユーザー')) {
        Utils.showToast('他のユーザーが更新しました。再読み込みしてください。', 'error');
      } else {
        Utils.showToast('保存に失敗しました', 'error');
      }
    }
  },

  async delete() {
    if (!this.isEditMode || !this.currentSchedule) return;
    if (!confirm('この工程を削除しますか？')) return;

    try {
      Utils.setLoading(true);
      const scheduleId = this.currentSchedule.scheduleId;
      const expectedUpdatedAt = document.getElementById('entry-updated-at').value;

      await API.deleteSchedule(scheduleId, expectedUpdatedAt);
      Store.removeSchedule(scheduleId);

      Utils.setLoading(false);
      Utils.showToast('削除しました', 'success');
      this.close();

      // JobDetailが開いている場合は再描画
      if (JobDetail.currentJobId) {
        JobDetail.render();
      }
    } catch (error) {
      Utils.setLoading(false);
      console.error('Delete failed:', error);
      Utils.showToast('削除に失敗しました', 'error');
    }
  }
};

const JobModal = {
  currentJob: null,
  isEditMode: false,
  searchDebounceTimer: null,

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {
    document.getElementById('job-modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-job-modal-cancel')?.addEventListener('click', () => this.close());
    document.querySelector('#modal-job .modal-backdrop')?.addEventListener('click', () => this.close());
    document.getElementById('btn-job-modal-save')?.addEventListener('click', () => this.save());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('modal-job').classList.contains('hidden')) {
        this.close();
      }
    });

    // 工番マスター検索
    const searchInput = document.getElementById('job-master-search');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => this.onSearchInput(e.target.value));
      searchInput.addEventListener('focus', () => this.showSearchResults());
      // クリック外で閉じる
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#job-master-search-area')) {
          this.hideSearchResults();
        }
      });
    }
  },

  // 担当者セレクトを生成
  populatePersonSelects(mainPersonId = '', subPersonId = '') {
    const people = Store.state.people;
    const mainSelect = document.getElementById('job-main-person');
    const subSelect = document.getElementById('job-sub-person');

    if (!mainSelect || !subSelect) return;

    let optionsHtml = '<option value="">（未設定）</option>';
    people.forEach(person => {
      const color = person['作業者色(colorHex)'] || '#6b7280';
      optionsHtml += `<option value="${person.personId}" style="border-left: 4px solid ${color};">
        ${Utils.escapeHtml(person['氏名'])} (${Utils.escapeHtml(person['部署/区分'] || '')})
      </option>`;
    });

    mainSelect.innerHTML = optionsHtml;
    subSelect.innerHTML = optionsHtml;

    if (mainPersonId) mainSelect.value = mainPersonId;
    if (subPersonId) subSelect.value = subPersonId;
  },

  // 工番マスター検索入力
  onSearchInput(query) {
    clearTimeout(this.searchDebounceTimer);
    this.searchDebounceTimer = setTimeout(() => {
      this.searchJobMaster(query);
    }, 300);
  },

  // 工番マスター検索実行
  searchJobMaster(query) {
    const results = document.getElementById('job-master-results');
    if (!results) return;

    const jobMaster = Store.state.jobMaster;
    if (!jobMaster || jobMaster.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm text-gray-500">工番マスターが未同期です</div>';
      results.classList.remove('hidden');
      return;
    }

    let filtered = jobMaster;
    if (query && query.trim()) {
      const lowerQuery = query.toLowerCase();
      filtered = jobMaster.filter(item => {
        const jobNo = String(item['工番'] || '').toLowerCase();
        const customer = String(item['客先名'] || '').toLowerCase();
        const product = String(item['製品名'] || '').toLowerCase();
        return jobNo.includes(lowerQuery) ||
               customer.includes(lowerQuery) ||
               product.includes(lowerQuery);
      });
    }

    // 上位20件に制限
    filtered = filtered.slice(0, 20);

    if (filtered.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm text-gray-500">該当する工番が見つかりません</div>';
    } else {
      let html = '';
      filtered.forEach(item => {
        html += `
          <div class="job-master-result-item" onclick="JobModal.selectJobMasterItem('${Utils.escapeHtml(item['工番'] || '')}', '${Utils.escapeHtml(item['客先名'] || '')}', '${Utils.escapeHtml(item['製品名'] || '')}')">
            <div class="job-master-result-jobno">${Utils.escapeHtml(item['工番'] || '-')}</div>
            <div class="job-master-result-customer">${Utils.escapeHtml(item['客先名'] || '-')}</div>
            <div class="job-master-result-product">${Utils.escapeHtml(item['製品名'] || '-')}</div>
          </div>
        `;
      });
      results.innerHTML = html;
    }

    results.classList.remove('hidden');
  },

  // 工番マスター選択
  selectJobMasterItem(jobNo, customer, product) {
    document.getElementById('job-jobno').value = jobNo;
    document.getElementById('job-customer').value = customer;
    document.getElementById('job-product').value = product;
    this.hideSearchResults();
    document.getElementById('job-master-search').value = '';
    Utils.showToast('工番マスターから入力しました', 'info');
  },

  showSearchResults() {
    const query = document.getElementById('job-master-search')?.value || '';
    this.searchJobMaster(query);
  },

  hideSearchResults() {
    const results = document.getElementById('job-master-results');
    if (results) results.classList.add('hidden');
  },

  openNew() {
    this.isEditMode = false;
    this.currentJob = null;
    this.resetForm();
    this.populatePersonSelects();
    document.getElementById('job-modal-title').textContent = '工番登録';
    // 新規時はマスター検索エリアを表示
    const searchArea = document.getElementById('job-master-search-area');
    if (searchArea) searchArea.classList.remove('hidden');
    this.open();
  },

  openEdit(job) {
    this.isEditMode = true;
    this.currentJob = job;
    this.resetForm();
    this.populatePersonSelects(job.mainPersonId || '', job.subPersonId || '');

    document.getElementById('job-jobno').value = job['工番'] || '';
    document.getElementById('job-customer').value = job['顧客名'] || '';
    document.getElementById('job-product').value = job['設備/製品名'] || '';
    document.getElementById('job-qty').value = job['台数'] || '';
    document.getElementById('job-destination').value = job['納入先'] || '';
    document.getElementById('job-ship-date').value = job['出荷予定日'] || '';
    document.getElementById('job-draw-date').value = job['出図予定日'] || '';
    document.getElementById('job-status-text').value = job['重要メモ'] || '';
    document.getElementById('job-job-id').value = job.jobId || '';
    document.getElementById('job-updated-at').value = job.updatedAt || '';

    document.getElementById('job-modal-title').textContent = '工番編集';
    // 編集時はマスター検索エリアを非表示
    const searchArea = document.getElementById('job-master-search-area');
    if (searchArea) searchArea.classList.add('hidden');
    this.open();
  },

  open() {
    document.getElementById('modal-job').classList.remove('hidden');
    setTimeout(() => {
      if (!this.isEditMode) {
        document.getElementById('job-master-search')?.focus();
      } else {
        document.getElementById('job-jobno')?.focus();
      }
    }, 100);
  },

  close() {
    document.getElementById('modal-job').classList.add('hidden');
    this.currentJob = null;
    this.isEditMode = false;
    this.hideSearchResults();
  },

  resetForm() {
    document.getElementById('job-form').reset();
    document.getElementById('job-job-id').value = '';
    document.getElementById('job-updated-at').value = '';
    const searchInput = document.getElementById('job-master-search');
    if (searchInput) searchInput.value = '';
    this.hideSearchResults();
  },

  validate() {
    const jobno = document.getElementById('job-jobno').value.trim();
    const customer = document.getElementById('job-customer').value.trim();
    const product = document.getElementById('job-product').value.trim();
    const qty = document.getElementById('job-qty').value.trim();
    const destination = document.getElementById('job-destination').value.trim();
    const shipDate = document.getElementById('job-ship-date').value;
    const drawDate = document.getElementById('job-draw-date').value;
    const statusText = document.getElementById('job-status-text').value.trim();
    const mainPersonId = document.getElementById('job-main-person')?.value || '';
    const subPersonId = document.getElementById('job-sub-person')?.value || '';

    if (!jobno) {
      Utils.showToast('工番を入力してください', 'error');
      document.getElementById('job-jobno').focus();
      return null;
    }

    if (!customer) {
      Utils.showToast('顧客名を入力してください', 'error');
      document.getElementById('job-customer').focus();
      return null;
    }

    if (!product) {
      Utils.showToast('設備/製品名を入力してください', 'error');
      document.getElementById('job-product').focus();
      return null;
    }

    if (!qty) {
      Utils.showToast('台数を入力してください', 'error');
      document.getElementById('job-qty').focus();
      return null;
    }

    return {
      '工番': jobno,
      '顧客名': customer,
      '設備/製品名': product,
      '台数': qty,
      '納入先': destination,
      '出荷予定日': shipDate,
      '出図予定日': drawDate,
      '重要メモ': statusText,
      'mainPersonId': mainPersonId,
      'subPersonId': subPersonId,
      '状態': '未着手'
    };
  },

  async save() {
    const payload = this.validate();
    if (!payload) return;

    try {
      Utils.setLoading(true);

      if (this.isEditMode) {
        const jobId = document.getElementById('job-job-id').value;
        const expectedUpdatedAt = document.getElementById('job-updated-at').value;
        // 編集時は状態を保持
        payload['状態'] = this.currentJob?.['状態'] || '未着手';
        const result = await API.updateJob(jobId, payload, expectedUpdatedAt);
        Store.updateJobInStore(jobId, result);
        Utils.showToast('工番を更新しました', 'success');
      } else {
        const result = await API.createJob(payload);
        Store.addJob(result);
        Utils.showToast('工番を登録しました', 'success');
      }

      Utils.setLoading(false);
      this.close();
    } catch (error) {
      Utils.setLoading(false);
      console.error('Save job failed:', error);
      if (error.message?.includes('他のユーザー')) {
        Utils.showToast('他のユーザーが更新しました。再読み込みしてください。', 'error');
      } else {
        Utils.showToast('保存に失敗しました: ' + error.message, 'error');
      }
    }
  }
};

    this.renderList();
    document.getElementById('modal-people').classList.remove('hidden');
    document.getElementById('people-list-view').classList.remove('hidden');

  },

  renderList() {
    const container = document.getElementById('people-list-container');

    if (people.length === 0) {
      container.innerHTML = '<div class="p-4 text-gray-500 text-center">担当者がいません</div>';

      html += `

              ${isActive ? '有効' : '無効'}
            </span>
          </td>
          <td class="px-3 py-2">
            <button class="text-blue-600 hover:underline edit-person-btn" data-person-id="${person.personId}">編集</button>
          </td>

      `;

    // 編集ボタンにイベント設定

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const personId = btn.dataset.personId;
        this.openEdit(personId);
      });
    });
  },

  openNew() {
    this.currentPerson = null;
    this.isEditMode = false;
    document.getElementById('people-edit-title').textContent = '担当者を追加';
    document.getElementById('people-list-view').classList.add('hidden');
    document.getElementById('people-edit-view').classList.remove('hidden');
    this.clearForm();
  },

  openEdit(personId) {
    const person = Store.getPersonById(personId);
    if (!person) {
      Utils.showToast('担当者が見つかりません', 'error');
      return;
    }
    this.currentPerson = person;
    this.isEditMode = true;
    document.getElementById('people-edit-title').textContent = '担当者を編集';
    document.getElementById('people-list-view').classList.add('hidden');
    document.getElementById('people-edit-view').classList.remove('hidden');
    this.populateForm(person);
  },

  backToList() {
    document.getElementById('people-list-view').classList.remove('hidden');
    document.getElementById('people-edit-view').classList.add('hidden');
    this.renderList();
  },

  clearForm() {
    document.getElementById('person-name').value = '';
    document.getElementById('person-department').value = '';
    document.getElementById('person-color').value = '#2563EB';
    document.getElementById('person-color-text').value = '#2563EB';
    document.getElementById('person-active').checked = true;
    document.getElementById('person-note').value = '';
    document.getElementById('person-id-display').textContent = '（新規）';
  },

  populateForm(person) {
    document.getElementById('person-name').value = person['氏名'] || '';
    document.getElementById('person-department').value = person['部署/区分'] || '';
    const color = Utils.normalizeColor(person['作業者色(colorHex)']) || '#6B7280';
    document.getElementById('person-color').value = color;
    document.getElementById('person-color-text').value = color;
    const isActive = person['有効(isActive)'] === true || person['有効(isActive)'] === 'TRUE';
    document.getElementById('person-active').checked = isActive;
    document.getElementById('person-note').value = person['備考'] || '';
    document.getElementById('person-id-display').textContent = person.personId;
  },

  syncColorInputs(source) {
    if (source === 'picker') {
      const value = document.getElementById('person-color').value;
      document.getElementById('person-color-text').value = value.toUpperCase();
    } else {
      const value = document.getElementById('person-color-text').value;
      const normalized = Utils.normalizeColor(value);
      if (normalized) {
        document.getElementById('person-color').value = normalized;
        document.getElementById('person-color-text').value = normalized;
      }
    }
  },

  async save() {
    const name = document.getElementById('person-name').value.trim();
    if (!name) {
      Utils.showToast('氏名を入力してください', 'error');
      return;
    }

    const colorText = document.getElementById('person-color-text').value;
    const color = Utils.normalizeColor(colorText);
    if (!color) {
      Utils.showToast('有効な色を入力してください（例: #2563EB）', 'error');
      return;
    }

    const payload = {
      '氏名': name,
      '部署/区分': document.getElementById('person-department').value.trim(),
      '作業者色(colorHex)': color,
      '有効(isActive)': document.getElementById('person-active').checked,
      '備考': document.getElementById('person-note').value.trim()
    };

    try {
      Utils.setLoading(true);
      let result;
      if (this.isEditMode && this.currentPerson) {
        result = await API.updatePerson(
          this.currentPerson.personId,
          payload,
          this.currentPerson.updatedAt
        );
        // Store を更新
        Store.updatePersonInStore(result.personId, result);
        Utils.showToast('担当者を更新しました', 'success');
      } else {
        result = await API.createPerson(payload);
        Store.addPerson(result);
        Utils.showToast('担当者を追加しました', 'success');
      }
      this.backToList();
    } catch (error) {
      console.error('Save person error:', error);
      Utils.showToast(error.message || '保存に失敗しました', 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  setupEventListeners() {
    // 色ピッカー同期
    document.getElementById('person-color')?.addEventListener('input', () => {
      this.syncColorInputs('picker');
    });
    document.getElementById('person-color-text')?.addEventListener('change', () => {
      this.syncColorInputs('text');
    });
  }
};

const JobDetail = {
  currentJobId: null,
  currentJob: null,
  config: {
    displayDays: 90,
    displayStartDate: null,
    viewMode: 'daily',
    cellWidth: 24,
    rowHeight: 32
  },

  // ドラッグ範囲選択の状態
  dragState: {
    isDragging: false,
    startProcessId: null,
    startDate: null,
    endDate: null
  },

  init() {
    this.setupEventListeners();
    this.attachGridEventListeners(); // イベント委譲は一度だけ設定
    this.setupScrollSync(); // 横スクロール同期
  },

  // 横スクロール同期：ボディのスクロールにヘッダを追従させる
  setupScrollSync() {
    const bodyScroll = document.getElementById('job-detail-body-scroll');
    const headerScroll = document.getElementById('job-detail-header-scroll');
    if (!bodyScroll || !headerScroll) return;

    bodyScroll.addEventListener('scroll', () => {
      headerScroll.scrollLeft = bodyScroll.scrollLeft;
    });
  },

  setupEventListeners() {
    document.getElementById('job-detail-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-print-job')?.addEventListener('click', () => this.print());
    document.getElementById('job-detail-mode-daily')?.addEventListener('click', () => this.setViewMode('daily'));
    document.getElementById('job-detail-mode-weekly')?.addEventListener('click', () => this.setViewMode('weekly'));
    document.getElementById('job-detail-start')?.addEventListener('change', () => this.onDisplayRangeChange());
    document.getElementById('job-detail-days')?.addEventListener('change', () => this.onDisplayRangeChange());
  },

  open(jobId) {
    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.currentJobId = jobId;
    this.currentJob = job;

    const schedules = Store.getSchedulesByJobId(jobId);
    if (schedules.length > 0) {
      const earliestStart = schedules.reduce((min, s) => s.start < min ? s.start : min, schedules[0].start);
      this.config.displayStartDate = Utils.addDays(earliestStart, -7);
    } else {
      this.config.displayStartDate = Utils.getToday();
    }

    document.getElementById('job-detail-start').value = this.config.displayStartDate;
    document.getElementById('job-detail-days').value = this.config.displayDays;

    this.renderHeader();
    this.render();
    document.getElementById('view-job-detail').classList.remove('hidden');
  },

  close() {
    document.getElementById('view-job-detail').classList.add('hidden');
    this.currentJobId = null;
    this.currentJob = null;
  },

  renderHeader() {
    const job = this.currentJob;
    if (!job) return;

    document.getElementById('job-detail-customer').textContent = job['顧客名'] || '-';
    document.getElementById('job-detail-product').textContent = job['設備/製品名'] || '-';
    document.getElementById('job-detail-jobno').textContent = job['工番'] || '-';
    document.getElementById('job-detail-ship-date').textContent = job['出荷予定日'] || '-';
    document.getElementById('job-detail-draw-date').textContent = job['出図予定日'] || '-';
    document.getElementById('job-detail-created').textContent = Utils.formatDate(new Date());
  },

  render() {
    const dates = Utils.generateDateRange(this.config.displayStartDate, this.config.displayDays);
    const schedules = Store.getSchedulesByJobId(this.currentJobId);
    const processes = Store.state.processes;

    this.renderDateHeader(dates);
    this.renderProcessRows(processes, schedules, dates);
  },

  renderDateHeader(dates) {
    const container = document.getElementById('job-detail-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;

    if (this.config.viewMode === 'weekly') {
      const weeks = this.groupByWeek(dates);
      weeks.forEach(week => {
        const isCurrentWeek = week.dates.includes(today);
        html += `
          <div class="job-date-cell weekly ${isCurrentWeek ? 'current' : ''}" style="width: ${week.dates.length * this.config.cellWidth}px">
            <div class="month">${Utils.getMonth(week.start)}月</div>
            <div class="week">${Utils.getDay(week.start)}〜</div>
          </div>
        `;
      });
    } else {
      dates.forEach(date => {
        const month = Utils.getMonth(date);
        const day = Utils.getDay(date);
        const dow = Utils.getDayOfWeek(date);
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;

        const showMonth = month !== currentMonth;
        currentMonth = month;

        let classes = 'job-date-cell';
        if (isWeekend) classes += ' weekend';
        if (isToday) classes += ' today';

        html += `
          <div class="${classes}" style="width: ${this.config.cellWidth}px">
            ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
            <div class="day">${day}</div>
            <div class="dow">${dow}</div>
          </div>
        `;
      });
    }

    container.innerHTML = html;
    container.style.width = `${dates.length * this.config.cellWidth}px`;
  },

  renderProcessRows(processes, schedules, dates) {
    const container = document.getElementById('job-detail-body');
    if (!container) return;

    const today = Utils.getToday();
    const gridWidth = dates.length * this.config.cellWidth;
    const totalWidth = 140 + gridWidth; // 工程名幅 + グリッド幅
    let html = '';

    processes.forEach(process => {
      const processSchedules = schedules.filter(s => s.processId === process.processId);
      const isMilestone = process['種別(type)'] === 'milestone';
      const processColor = Utils.normalizeColor(process['工程色(colorHex)']) || '#6B7280';
      const processDisplayName = Store.getProcessDisplayName(process.processId);

      html += `
        <div class="job-process-row" data-process-id="${process.processId}">
          <div class="job-process-name" style="background-color: ${Utils.withAlpha(processColor, '20')}; border-left: 4px solid ${processColor}">
            ${Utils.escapeHtml(processDisplayName)}
          </div>
          <div class="job-process-grid" data-process-id="${process.processId}" style="width: ${dates.length * this.config.cellWidth}px">
      `;

      dates.forEach(date => {
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;
        let classes = 'job-grid-cell';
        if (isWeekend) classes += ' weekend';
        if (isToday) classes += ' today';

        html += `<div class="${classes}" data-date="${date}" style="width: ${this.config.cellWidth}px"></div>`;
      });

      processSchedules.forEach(schedule => {
        if (isMilestone) {
          html += this.renderMilestone(schedule, dates);
        } else {
          html += this.renderBar(schedule, dates, process);
        }
      });

      html += `
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

    // ボディとその親コンテナの幅を設定（横スクロール用）
    container.style.minWidth = `${totalWidth}px`;
    const ganttContainer = container.closest('.job-detail-gantt');
    if (ganttContainer) {
      ganttContainer.style.minWidth = `${totalWidth}px`;
    }
  },

  renderBar(schedule, dates, process) {
    const startOffset = Utils.getDaysBetween(this.config.displayStartDate, schedule.start);
    const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

    if (startOffset + duration < 0 || startOffset >= dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 2;
    const color = process['工程色(colorHex)'] || '#6b7280';

    const mainPerson = Store.getPersonById(schedule.mainPersonId);
    const personName = mainPerson?.['氏名'] || '';

    return `
      <div class="job-bar" style="left: ${left}px; width: ${width}px; background-color: ${color};"
           title="${personName}${schedule.label ? ' - ' + schedule.label : ''}">
        ${schedule.label ? `<span class="job-bar-label">${Utils.escapeHtml(schedule.label)}</span>` : ''}
      </div>
    `;
  },

  renderMilestone(schedule, dates) {
    const startOffset = Utils.getDaysBetween(this.config.displayStartDate, schedule.start);

    if (startOffset < 0 || startOffset >= dates.length) {
      return '';
    }

    const left = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 8;

    return `
      <div class="job-milestone" style="left: ${left}px;" title="${schedule.label || ''}">
        ★
      </div>
    `;
  },

  groupByWeek(dates) {
    const weeks = [];
    let currentWeek = { start: dates[0], dates: [] };

    dates.forEach(date => {
      const d = new Date(date);
      if (d.getDay() === 1 && currentWeek.dates.length > 0) {
        weeks.push(currentWeek);
        currentWeek = { start: date, dates: [] };
      }
      currentWeek.dates.push(date);
    });

    if (currentWeek.dates.length > 0) {
      weeks.push(currentWeek);
    }

    return weeks;
  },

  setViewMode(mode) {
    this.config.viewMode = mode;
    document.getElementById('job-detail-mode-daily')?.classList.toggle('active', mode === 'daily');
    document.getElementById('job-detail-mode-weekly')?.classList.toggle('active', mode === 'weekly');
    this.render();
  },

  onDisplayRangeChange() {
    this.config.displayStartDate = document.getElementById('job-detail-start').value;
    this.config.displayDays = parseInt(document.getElementById('job-detail-days').value, 10);
    this.render();
  },

  // イベント委譲：#job-detail-bodyに1回だけリスナーを設定
  attachGridEventListeners() {
    const body = document.getElementById('job-detail-body');
    if (!body) return;

    // ドラッグ範囲選択：mousedown
    body.addEventListener('mousedown', (e) => {
      // 左クリック以外は無視
      if (e.button !== 0) return;
      // バー上でのドラッグは無視
      if (e.target.closest('.job-bar, .job-milestone')) return;

      const cell = e.target.closest('.job-grid-cell');
      if (!cell) return;

      // 親の .job-process-grid から processId を取得
      const grid = cell.closest('.job-process-grid');
      if (!grid) return;

      e.preventDefault();
      this.dragState.isDragging = true;
      this.dragState.startProcessId = grid.dataset.processId;
      this.dragState.startDate = cell.dataset.date;
      this.dragState.endDate = cell.dataset.date;

      this.highlightRange();
    });

    // ドラッグ範囲選択：mousemove
    body.addEventListener('mousemove', (e) => {
      if (!this.dragState.isDragging) return;

      const cell = e.target.closest('.job-grid-cell');
      if (!cell) return;

      // 同じ工程行のみ範囲選択可能
      const grid = cell.closest('.job-process-grid');
      if (!grid || grid.dataset.processId !== this.dragState.startProcessId) return;

      this.dragState.endDate = cell.dataset.date;
      this.highlightRange();
    });

    // ドラッグ範囲選択：mouseup
    body.addEventListener('mouseup', (e) => {
      if (!this.dragState.isDragging) return;

      const { startProcessId, startDate, endDate } = this.dragState;
      const jobId = this.currentJobId;

      // 範囲確定
      const rangeStart = startDate <= endDate ? startDate : endDate;
      const rangeEnd = startDate <= endDate ? endDate : startDate;

      // リセット
      this.clearHighlight();
      this.dragState.isDragging = false;
      this.dragState.startProcessId = null;
      this.dragState.startDate = null;
      this.dragState.endDate = null;

      // モーダルを開く（工程を事前選択）
      Modal.openNewWithProcess(jobId, startProcessId, rangeStart, rangeEnd);
    });

    // ドラッグキャンセル：マウスがグリッド外に出た場合
    body.addEventListener('mouseleave', (e) => {
      if (this.dragState.isDragging) {
        this.clearHighlight();
        this.dragState.isDragging = false;
        this.dragState.startProcessId = null;
        this.dragState.startDate = null;
        this.dragState.endDate = null;
      }
    });
  },

  // 選択範囲をハイライト
  highlightRange() {
    this.clearHighlight();

    const { startProcessId, startDate, endDate } = this.dragState;
    if (!startProcessId || !startDate || !endDate) return;

    const rangeStart = startDate <= endDate ? startDate : endDate;
    const rangeEnd = startDate <= endDate ? endDate : startDate;

    const grid = document.querySelector(`#job-detail-body .job-process-grid[data-process-id="${startProcessId}"]`);
    if (!grid) return;

    const cells = grid.querySelectorAll('.job-grid-cell');
    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= rangeStart && date <= rangeEnd) {
        cell.classList.add('selected-range');
      }
    });
  },

  // ハイライトをクリア
  clearHighlight() {
    document.querySelectorAll('#job-detail-body .selected-range').forEach(cell => {
      cell.classList.remove('selected-range');
    });
  },

  print() {
    window.print();
  }
};

const ResourceView = {
  config: {
    cellWidth: 32,
    rowHeight: 40
  },
  dates: [],

  init() {
    Store.subscribe((state) => {
      if (state.currentView === 'resource') {
        this.render();
      }
    });
  },

  render() {
    const { people, schedules, trips, displayStartDate, displayDays } = Store.state;
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);
    const groupedPeople = this.groupByDepartment(people);

    this.renderDateHeader();
    this.renderBody(groupedPeople, schedules, trips);
  },

  groupByDepartment(people) {
    const groups = {};
    people.forEach(person => {
      const dept = person['部署/区分'] || 'その他';
      if (!groups[dept]) {
        groups[dept] = [];
      }
      groups[dept].push(person);
    });
    return groups;
  },

  renderDateHeader() {
    const container = document.getElementById('resource-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;

    this.dates.forEach(date => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;

      const showMonth = month !== currentMonth;
      currentMonth = month;

      let classes = 'resource-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';

      html += `
        <div class="${classes}">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  renderBody(groupedPeople, schedules, trips) {
    const container = document.getElementById('resource-body');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';

    Object.keys(groupedPeople).forEach(dept => {
      html += `
        <div class="resource-dept-header">
          <div class="resource-dept-name">${Utils.escapeHtml(dept)}</div>
          <div class="resource-dept-grid">
            ${this.dates.map(date => {
              const isWeekend = Utils.isWeekend(date);
              return `<div class="resource-grid-cell ${isWeekend ? 'weekend' : ''}"></div>`;
            }).join('')}
          </div>
        </div>
      `;

      groupedPeople[dept].forEach(person => {
        const personSchedules = this.getPersonSchedules(person.personId, schedules);
        const personTrips = trips.filter(t => t.personId === person.personId);
        const personColor = person['作業者色(colorHex)'] || '#6b7280';

        html += `
          <div class="resource-person-row">
            <div class="resource-person-name" style="border-left: 4px solid ${personColor}">
              <span class="person-name-text">${Utils.escapeHtml(person['氏名'])}</span>
            </div>
            <div class="resource-person-grid">
        `;

        this.dates.forEach(date => {
          const isWeekend = Utils.isWeekend(date);
          const isToday = date === today;
          let classes = 'resource-grid-cell';
          if (isWeekend) classes += ' weekend';
          if (isToday) classes += ' today';
          html += `<div class="${classes}"></div>`;
        });

        personSchedules.forEach(schedule => {
          html += this.renderScheduleBar(schedule, personColor);
        });

        personTrips.forEach(trip => {
          html += this.renderTripBar(trip);
        });

        html += `
            </div>
          </div>
        `;
      });
    });

    container.innerHTML = html;
  },

  getPersonSchedules(personId, schedules) {
    return schedules.filter(s =>
      s.mainPersonId === personId || s.subPersonId === personId
    );
  },

  renderScheduleBar(schedule, personColor) {
    const { displayStartDate } = Store.state;
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);
    const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 4;

    const job = Store.getJobById(schedule.jobId);
    const process = Store.getProcessById(schedule.processId);
    const jobNo = job?.['工番'] || '';
    const processName = Store.getProcessDisplayName(schedule.processId);
    const isMilestone = process?.['種別(type)'] === 'milestone';

    if (isMilestone) {
      const milestoneLeft = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 10;
      return `
        <div class="resource-milestone" style="left: ${milestoneLeft}px;" title="${jobNo} - ${processName}">
          ★
        </div>
      `;
    }

    const isSubPerson = schedule.subPersonId && schedule.mainPersonId !== schedule.subPersonId;
    const opacity = isSubPerson ? '0.7' : '1';

    return `
      <div class="resource-bar" style="left: ${left}px; width: ${width}px; background-color: ${personColor}; opacity: ${opacity};"
           title="${jobNo} - ${processName}${isSubPerson ? ' (副)' : ''}">
        <span class="resource-bar-text">${Utils.escapeHtml(jobNo)}</span>
        <span class="resource-bar-process">${Utils.escapeHtml(processName)}</span>
      </div>
    `;
  },

  renderTripBar(trip) {
    const { displayStartDate } = Store.state;
    const startOffset = Utils.getDaysBetween(displayStartDate, trip.start);
    const duration = Utils.getDaysBetween(trip.start, trip.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - Math.max(0, startOffset)) * this.config.cellWidth - 4;

    const destination = trip['行先'] || '';
    const purpose = trip['用件'] || '';

    return `
      <div class="resource-trip-bar" style="left: ${left}px; width: ${width}px;"
           title="${destination} - ${purpose}">
        <span class="trip-icon">🚗</span>
        <span class="trip-text">${Utils.escapeHtml(destination || purpose)}</span>
      </div>
    `;
  }
};
