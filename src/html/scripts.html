const TravelPlan = {
  config: {
    cellWidth: 28,    // 日付列幅（ExcelGanttと統一）
    rowHeight: 44,    // 行高さ（ExcelGanttと統一）
  },
  dates: [],
  displayStartDate: null,
  displayDays: 90,
  _measureCanvas: null,
  // 日付ごとの追加幅マップ（押し広げ用）
  _dateExtraWidths: {},  // { 'YYYY-MM-DD': extraPx }
  // セル選択状態
  _selecting: false,
  _selectPersonId: null,
  _selectStartDate: null,
  _selectEndDate: null,

  init() {
    this.displayStartDate = Utils.getToday();

    // UI初期化
    document.getElementById('travel-start-date').value = this.displayStartDate;
    document.getElementById('travel-days').value = this.displayDays;

    // イベントリスナー
    document.getElementById('travel-start-date')?.addEventListener('change', () => {
      this.onDisplayRangeChange();
    });
    document.getElementById('travel-days')?.addEventListener('change', () => {
      this.onDisplayRangeChange();
    });

    // スクロール同期
    const scrollArea = document.getElementById('travel-scroll-area');
    const scrollHeader = document.getElementById('travel-scroll-header');
    const bottomScrollbar = document.getElementById('travel-bottom-scrollbar');
    const topScrollbar = document.getElementById('travel-xbar');

    // ボディスクロール → ヘッダー＆上部スクロールバー同期
    if (scrollArea) {
      scrollArea.addEventListener('scroll', () => {
        if (scrollHeader) scrollHeader.scrollLeft = scrollArea.scrollLeft;
        if (topScrollbar) topScrollbar.scrollLeft = scrollArea.scrollLeft;
        if (bottomScrollbar) bottomScrollbar.scrollLeft = scrollArea.scrollLeft;
      });
    }

    // 上部スクロールバー → ボディ＆ヘッダー同期
    if (topScrollbar) {
      topScrollbar.addEventListener('scroll', () => {
        if (scrollArea) scrollArea.scrollLeft = topScrollbar.scrollLeft;
        if (scrollHeader) scrollHeader.scrollLeft = topScrollbar.scrollLeft;
      });
    }

    // 下部スクロールバー → ボディ＆ヘッダー同期（非表示時も念のため）
    if (bottomScrollbar) {
      bottomScrollbar.addEventListener('scroll', () => {
        if (scrollArea) scrollArea.scrollLeft = bottomScrollbar.scrollLeft;
        if (scrollHeader) scrollHeader.scrollLeft = bottomScrollbar.scrollLeft;
      });
    }

    Store.subscribe((state) => {
      if (state.currentView === 'travel') {
        this.render();
      }
    });
  },

  onDisplayRangeChange() {
    this.displayStartDate = document.getElementById('travel-start-date').value;
    this.displayDays = parseInt(document.getElementById('travel-days').value, 10);
    this.render();
  },

  async generateTrips() {
    try {
      Utils.setLoading(true);
      const rangeEnd = Utils.addDays(this.displayStartDate, this.displayDays);
      const result = await API.call('api_generateTravelPlan', this.displayStartDate, rangeEnd);

      Utils.showToast(`自動生成完了: 作成${result.created}件, 更新${result.updated}件, スキップ${result.skipped}件`, 'success');

      // データ再読み込み
      await Store.loadBootstrapData();
    } catch (error) {
      console.error('Travel plan generation failed:', error);
      Utils.showToast('自動生成に失敗しました: ' + error.message, 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  addNewTrip() {
    TripModal.open(null);
  },

  /**
   * TSCカレンダーから出張計画を同期
   */
  async syncTSCCalendar() {
    // 確認ダイアログ
    const rangeEnd = Utils.addDays(this.displayStartDate, this.displayDays);
    const confirmed = confirm(
      `TSCカレンダーを出張計画に同期します。\n\n` +
      `対象期間: ${this.displayStartDate} ～ ${rangeEnd}\n\n` +
      `※ TSC部署メンバー全員に予定が展開されます。\n` +
      `※ 確定済み(ロック)の予定は更新されません。\n\n` +
      `実行しますか？`
    );

    if (!confirmed) return;

    try {
      Utils.setLoading(true);

      const result = await API.call('api_syncTSCCalendarToTrips', this.displayStartDate, rangeEnd);

      if (result.success) {
        const s = result.summary;
        Utils.showToast(
          `TSC同期完了: 作成${s.created}件, 更新${s.updated}件, スキップ${s.skipped}件` +
          (s.errors > 0 ? `, エラー${s.errors}件` : ''),
          s.errors > 0 ? 'warning' : 'success'
        );

        // 詳細をコンソールに出力
        console.log('TSCカレンダー同期結果:', result);

        // データ再読み込み
        await Store.loadBootstrapData();
      } else {
        Utils.showToast(`TSC同期エラー: ${result.error}`, 'error');
      }
    } catch (error) {
      console.error('TSC calendar sync failed:', error);
      Utils.showToast('TSC同期に失敗しました: ' + error.message, 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  /**
   * テキスト幅を計測（Canvas使用）
   * @param {string} text - 計測するテキスト
   * @param {string} font - フォント指定（例: '11px sans-serif'）
   * @returns {number} ピクセル幅
   */
  measureTextWidth(text, font = '11px sans-serif') {
    if (!this._measureCanvas) {
      this._measureCanvas = document.createElement('canvas');
    }
    const ctx = this._measureCanvas.getContext('2d');
    ctx.font = font;
    return ctx.measureText(text).width;
  },

  /**
   * 現場カードの必要幅を計算
   * @param {string} line1 - 1行目（工番+顧客名）
   * @param {string} line2 - 2行目（製品名）
   * @param {string} line3 - 3行目（場所）
   * @returns {number} 必要なピクセル幅
   */
  calculateSiteCardWidth(line1, line2, line3) {
    const width1 = this.measureTextWidth(line1, '600 11px sans-serif');
    const width2 = this.measureTextWidth(line2, '10px sans-serif');
    const width3 = this.measureTextWidth(line3, '10px sans-serif');
    const maxTextWidth = Math.max(width1, width2, width3);
    return maxTextWidth + this.config.cardPadding + 20;
  },

  /**
   * 日付からx座標を取得（累積extraWidthを考慮）
   * @param {string} date - YYYY-MM-DD
   * @returns {number} x座標（px）
   */
  getXForDate(date) {
    const dateIndex = this.dates.indexOf(date);
    if (dateIndex < 0) return 0;

    let x = 0;
    for (let i = 0; i < dateIndex; i++) {
      x += this.config.cellWidth;
      x += (this._dateExtraWidths[this.dates[i]] || 0);
    }
    return x;
  },

  /**
   * 日付のセル幅を取得（base + extra）
   * @param {string} date - YYYY-MM-DD
   * @returns {number} セル幅（px）
   */
  getCellWidthForDate(date) {
    return this.config.cellWidth + (this._dateExtraWidths[date] || 0);
  },

  /**
   * グリッド全体の幅を取得
   * @returns {number} 全体幅（px）
   */
  getTotalGridWidth() {
    let width = 0;
    this.dates.forEach(date => {
      width += this.config.cellWidth + (this._dateExtraWidths[date] || 0);
    });
    return width;
  },

  /**
   * 全作業者の予定から必要なextraWidthを計算
   * ※両矢印スタイルに変更後は押し広げ不要（固定幅）
   */
  calculateExtraWidths(trips) {
    this._dateExtraWidths = {};  // 常に空（固定幅）
  },

  /**
   * 作業者の予定をレイアウト計算（押し広げ対応）
   * @param {Object[]} personTrips - 作業者の予定
   * @returns {Object[]} レイアウト情報付き予定
   */
  calculatePersonLayout(personTrips) {
    // 開始日でソート
    const sorted = [...personTrips].sort((a, b) => a.start.localeCompare(b.start));

    return sorted.map(trip => {
      const startOffset = Utils.getDaysBetween(this.displayStartDate, trip.start);
      const duration = Utils.getDaysBetween(trip.start, trip.end) + 1;

      // 表示範囲外（完全に範囲外の場合は非表示）
      if (startOffset + duration <= 0 || startOffset >= this.dates.length) {
        return { ...trip, _visible: false };
      }

      // 表示範囲にクリップ（左右のはみ出しを防止）
      const visibleStartOffset = Math.max(0, startOffset);
      const visibleEndOffset = Math.min(this.dates.length - 1, startOffset + duration - 1);
      const visibleDuration = visibleEndOffset - visibleStartOffset + 1;

      if (visibleDuration <= 0) {
        return { ...trip, _visible: false };
      }

      // x座標計算（クリップ後）
      const xStart = visibleStartOffset * this.config.cellWidth;

      // バー幅計算（クリップ後）
      const barWidth = visibleDuration * this.config.cellWidth;

      return {
        ...trip,
        _visible: true,
        _xStart: xStart,
        _width: barWidth,
        _duration: visibleDuration
      };
    });
  },

  render() {
    const { people, trips } = Store.state;
    this.dates = Utils.generateDateRange(this.displayStartDate, this.displayDays);

    // Phase B: まず全予定から必要なextraWidthを計算
    this.calculateExtraWidths(trips);

    // 日付ヘッダーとボディをレンダリング
    this.renderDateHeader();
    this.renderBody(people, trips);

    // 横スクロールバーの幅を更新
    this.updateBottomScrollbarWidth();
  },

  /**
   * 横スクロールバーの幅を更新（上部・下部両方）
   */
  updateBottomScrollbarWidth() {
    const totalWidth = this.getTotalGridWidth();

    // 上部スクロールバー
    const topScrollbarContent = document.getElementById('travel-xbar-content');
    if (topScrollbarContent) {
      topScrollbarContent.style.width = `${totalWidth}px`;
    }

    // 下部スクロールバー（非表示だが念のため）
    const scrollbarContent = document.getElementById('travel-scrollbar-content');
    if (scrollbarContent) {
      scrollbarContent.style.width = `${totalWidth}px`;
    }
  },

  renderDateHeader() {
    const container = document.getElementById('travel-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;

    // 日付セルを動的幅でレンダリング（extraWidth対応）
    this.dates.forEach(date => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;
      const daySetting = Store.getDaySetting(date);

      const showMonth = month !== currentMonth;
      currentMonth = month;

      // このセルの幅（base + extra）
      const cellWidth = this.getCellWidthForDate(date);

      let classes = 'travel-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';
      // 日付設定による上書き
      if (daySetting === 'WORKDAY') classes += ' is-workday';
      if (daySetting === 'HOLIDAY') classes += ' is-holiday';

      html += `
        <div class="${classes}" style="width: ${cellWidth}px; min-width: ${cellWidth}px;">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month"></div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  renderBody(people, trips) {
    const container = document.getElementById('travel-body');
    if (!container) return;

    const today = Utils.getToday();
    const totalWidth = this.getTotalGridWidth();

    // アクティブな人のみ
    const activePeople = people.filter(p => p.isActive !== false);

    if (activePeople.length === 0) {
      container.innerHTML = '<div class="travel-empty-message">作業者が登録されていません</div>';
      return;
    }

    // 部署の優先表示順
    const PRIMARY_DEPT_ORDER = ['組立', 'TSC', '電気設計', '機械設計'];

    // 部署ごとにグルーピング
    const groupByDept = (peopleList) => {
      const groups = new Map();
      for (const p of peopleList) {
        const key = (p['部署/区分'] && String(p['部署/区分']).trim()) || '未分類';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      }

      // 部署順：優先順 → その他（五十音順）→ 未分類
      const otherDepts = [...groups.keys()]
        .filter(d => d !== '未分類' && !PRIMARY_DEPT_ORDER.includes(d))
        .sort((a, b) => a.localeCompare(b, 'ja'));

      const deptKeys = [
        ...PRIMARY_DEPT_ORDER.filter(d => groups.has(d)),
        ...otherDepts,
        ...(groups.has('未分類') ? ['未分類'] : [])
      ];

      // 描画用行配列を構築
      const rows = [];
      for (const dept of deptKeys) {
        // 部署ヘッダー
        rows.push({ type: 'deptHeader', dept });
        // 部署内の人を氏名順でソート
        const members = groups.get(dept)
          .slice()
          .sort((a, b) => (a['氏名'] || '').localeCompare(b['氏名'] || '', 'ja'));
        for (const p of members) {
          rows.push({ type: 'person', person: p });
        }
      }
      return rows;
    };

    const workerRows = groupByDept(activePeople);

    let html = '';

    workerRows.forEach(row => {
      if (row.type === 'deptHeader') {
        // 部署ヘッダー行は廃止（左端の縦色帯で部署識別するため）
        return;
      } else {
        // 作業者行
        const person = row.person;
        const personTrips = trips.filter(t => t.personId === person.personId);
        const dept = person['部署/区分'] || '';
        const name = person['氏名'] || '';
        const personColor = Utils.normalizeColor(person['作業者色(colorHex)']) || '#6b7280';

        // レーン割り当て（被り回避）- 埋め込み出張予定と同じロジック
        this.assignLanesForPerson(personTrips);
        // レイアウト計算（押し広げ対応）
        const layoutTrips = this.calculatePersonLayout(personTrips);

        html += `
          <div class="travel-person-row">
            <div class="travel-person-info" style="border-left: 4px solid ${personColor}">
              <div class="dept">${Utils.escapeHtml(dept)}</div>
              <div class="name">${Utils.escapeHtml(name)}</div>
              <div class="memo"></div>
            </div>
            <div class="travel-person-grid" style="width: ${totalWidth}px;">
        `;

        // グリッドセル（動的幅、クリック/ドラッグ選択対応）
        this.dates.forEach(date => {
          const isWeekend = Utils.isWeekend(date);
          const isToday = date === today;
          const daySetting = Store.getDaySetting(date);
          const cellWidth = this.getCellWidthForDate(date);

          let classes = 'travel-grid-cell';
          if (isWeekend) classes += ' weekend';
          if (isToday) classes += ' today';
          // 日付設定による上書き
          if (daySetting === 'WORKDAY') classes += ' is-workday';
          if (daySetting === 'HOLIDAY') classes += ' is-holiday';
          html += `<div class="${classes}"
                        style="width: ${cellWidth}px; min-width: ${cellWidth}px;"
                        data-person-id="${person.personId}"
                        data-date="${date}"></div>`;
        });

        // 予定バー（レイアウト計算済み）
        layoutTrips.forEach(trip => {
          if (trip._visible) {
            html += this.renderTripBarWithLayout(trip);
          }
        });

        html += `
            </div>
          </div>
        `;
      }
    });

    container.innerHTML = html;

    // トリップバーにクリックイベントを追加
    this.setupTripClickHandlers(trips);
  },

  // ドラッグ状態
  _tripDragState: null,

  setupTripClickHandlers(trips) {
    // 既存の予定バーにポインターイベントを追加
    const tripBars = document.querySelectorAll('.travel-trip-bar[data-trip-id]');
    tripBars.forEach(bar => {
      bar.style.cursor = 'grab';

      // ポインターダウン：ドラッグ開始
      bar.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();

        const tripId = bar.dataset.tripId;
        const trip = trips.find(t => t.tripId === tripId);
        if (!trip) return;

        // ハンドルクリックか判定（リサイズ or 移動）
        const handle = e.target.closest('.bar-handle');
        let mode = 'move';
        if (handle) {
          mode = handle.dataset.handle === 'left' ? 'resize-left' : 'resize-right';
        }

        // ドラッグ状態を初期化
        this._tripDragState = {
          tripId,
          mode,
          barEl: bar,
          startX: e.clientX,
          origStartDate: trip.start,
          origEndDate: trip.end,
          dayW: this.config.cellWidth,
          origLeft: parseFloat(bar.style.left) || 0,
          origWidth: parseFloat(bar.style.width) || 0,
          hasMoved: false,
          lastDeltaDays: 0
        };

        bar.classList.add('dragging');
        bar.setPointerCapture(e.pointerId);
      });

      // ポインタームーブ：プレビュー更新
      bar.addEventListener('pointermove', (e) => {
        if (!this._tripDragState || this._tripDragState.barEl !== bar) return;

        const { startX, dayW, mode, origLeft, origWidth, origStartDate, origEndDate } = this._tripDragState;
        const dx = e.clientX - startX;

        if (Math.abs(dx) > 3) {
          this._tripDragState.hasMoved = true;
        }

        const deltaDays = Math.round(dx / dayW);
        if (deltaDays === this._tripDragState.lastDeltaDays) return;
        this._tripDragState.lastDeltaDays = deltaDays;

        // 日付計算（モード別）
        let newStart = origStartDate;
        let newEnd = origEndDate;

        if (mode === 'move') {
          // 平行移動
          newStart = Utils.addDays(origStartDate, deltaDays);
          newEnd = Utils.addDays(origEndDate, deltaDays);
        } else if (mode === 'resize-left') {
          // 左リサイズ（開始日のみ変更）
          newStart = Utils.addDays(origStartDate, deltaDays);
          if (newStart > origEndDate) newStart = origEndDate;  // 最小1日
        } else if (mode === 'resize-right') {
          // 右リサイズ（終了日のみ変更）
          newEnd = Utils.addDays(origEndDate, deltaDays);
          if (newEnd < origStartDate) newEnd = origStartDate;  // 最小1日
        }

        this._tripDragState.newStart = newStart;
        this._tripDragState.newEnd = newEnd;

        // DOMプレビュー更新
        const deltaLeft = deltaDays * dayW;
        if (mode === 'move') {
          bar.style.left = `${origLeft + deltaLeft}px`;
        } else if (mode === 'resize-left') {
          const clampedDelta = Math.min(deltaLeft, origWidth - dayW);
          bar.style.left = `${origLeft + clampedDelta}px`;
          bar.style.width = `${origWidth - clampedDelta}px`;
        } else if (mode === 'resize-right') {
          const newWidth = Math.max(dayW, origWidth + deltaLeft);
          bar.style.width = `${newWidth}px`;
        }
      });

      // ポインターアップ：確定
      bar.addEventListener('pointerup', (e) => {
        if (!this._tripDragState || this._tripDragState.barEl !== bar) return;

        bar.classList.remove('dragging');
        bar.releasePointerCapture(e.pointerId);

        const { tripId, mode, hasMoved, newStart, newEnd, origStartDate, origEndDate } = this._tripDragState;

        if (hasMoved && newStart && (newStart !== origStartDate || newEnd !== origEndDate)) {
          // データ更新
          ChangeBuffer.add('trip', 'update', tripId, {
            start: newStart,
            end: newEnd
          }, 'travel');

          // Store更新
          const trip = Store.state.trips.find(t => t.tripId === tripId);
          if (trip) {
            trip.start = newStart;
            trip.end = newEnd;
          }

          const actionLabel = mode === 'move' ? '移動' : '期間変更';
          Utils.showToast(`予定を${actionLabel}しました（保存待ち）`, 'info');
          this.render();  // 再描画
        } else if (!hasMoved) {
          // クリック（移動なし）→ モーダルを開く（ハンドルクリックは除外）
          if (!e.target.closest('.bar-handle')) {
            const trip = trips.find(t => t.tripId === tripId);
            if (trip) {
              TripModal.open(trip);
            }
          }
        }

        this._tripDragState = null;
      });

      // ポインターキャンセル
      bar.addEventListener('pointercancel', (e) => {
        if (this._tripDragState && this._tripDragState.barEl === bar) {
          bar.classList.remove('dragging');
          // 元の位置・サイズに戻す
          bar.style.left = `${this._tripDragState.origLeft}px`;
          bar.style.width = `${this._tripDragState.origWidth}px`;
          this._tripDragState = null;
        }
      });
    });

    // グリッドセルのクリック/ドラッグ選択
    this.setupCellSelectionHandlers();
  },

  /**
   * セル選択ハンドラーをセットアップ
   */
  setupCellSelectionHandlers() {
    const cells = document.querySelectorAll('.travel-grid-cell[data-person-id][data-date]');

    cells.forEach(cell => {
      // mousedown: 選択開始
      cell.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;  // 左クリックのみ
        e.preventDefault();

        const personId = cell.dataset.personId;
        const date = cell.dataset.date;

        this._selecting = true;
        this._selectPersonId = personId;
        this._selectStartDate = date;
        this._selectEndDate = date;

        this.updateSelectionHighlight();
      });

      // mousemove: 選択範囲拡張
      cell.addEventListener('mousemove', (e) => {
        if (!this._selecting) return;

        const personId = cell.dataset.personId;
        const date = cell.dataset.date;

        // 同一personIdの行内のみ選択可能
        if (personId === this._selectPersonId) {
          this._selectEndDate = date;
          this.updateSelectionHighlight();
        }
      });

      // mouseup: 選択確定 → モーダル表示
      cell.addEventListener('mouseup', (e) => {
        if (!this._selecting) return;

        const personId = this._selectPersonId;
        let startDate = this._selectStartDate;
        let endDate = this._selectEndDate;

        // 日付の順序を正規化
        if (startDate > endDate) {
          [startDate, endDate] = [endDate, startDate];
        }

        this._selecting = false;
        this.clearSelectionHighlight();

        // モーダルを開く（新規作成モード）
        TripModal.openNew(personId, startDate, endDate);
      });
    });

    // mouseup outside: 選択キャンセル
    document.addEventListener('mouseup', () => {
      if (this._selecting) {
        this._selecting = false;
        this.clearSelectionHighlight();
      }
    });
  },

  /**
   * 選択範囲のハイライト更新
   */
  updateSelectionHighlight() {
    this.clearSelectionHighlight();

    if (!this._selectPersonId || !this._selectStartDate || !this._selectEndDate) return;

    let startDate = this._selectStartDate;
    let endDate = this._selectEndDate;
    if (startDate > endDate) {
      [startDate, endDate] = [endDate, startDate];
    }

    const cells = document.querySelectorAll(
      `.travel-grid-cell[data-person-id="${this._selectPersonId}"]`
    );

    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= startDate && date <= endDate) {
        cell.classList.add('selecting');
      }
    });
  },

  /**
   * 選択ハイライトをクリア
   */
  clearSelectionHighlight() {
    document.querySelectorAll('.travel-grid-cell.selecting').forEach(cell => {
      cell.classList.remove('selecting');
    });
  },

  /**
   * レイアウト計算済みの予定をレンダリング（両矢印スタイル）
   * ExcelGantt / 埋め込み出張計画と同じ構造
   * @param {Object} trip - レイアウト情報付き予定（_xStart, _width）
   * @returns {string} HTML
   */
  renderTripBarWithLayout(trip) {
    const isLocked = trip.isLocked === true;

    // ラベル生成
    let label = '';
    let shape = 'arrow';  // デフォルト: 実線矢印
    let color = '#6b7280';  // デフォルト色

    // 部署の色を取得（移動以外で使用）
    const person = Store.getPersonById(trip.personId);
    const dept = person?.['部署/区分'] || '';
    const deptColor = getDeptHeaderColor(dept);

    if (trip.kind === 'move') {
      label = '移動';
      shape = 'dash';  // 移動は破線
      color = '#9ca3af';  // 移動はデフォルトのグレー
    } else if (trip.kind === 'site') {
      const description = trip['用件'] || '';
      const lines = description.split('\n');
      // 1行目を使用（工番+顧客名など）
      label = lines[0] || trip['行先'] || '';
      color = deptColor.background;  // 部署の色を使用
    } else {
      label = trip['行先'] || trip['用件'] || '';
      color = deptColor.background;  // 部署の色を使用
    }

    // ロックアイコン
    const lockPrefix = isLocked ? '🔒 ' : '';
    const safeLabel = Utils.escapeHtml(lockPrefix + label);

    // レーン位置からtopを計算（工程表Excel風と統一）
    const lane = trip.lane || 0;
    const BAR_TOP_BASE = 14;   // 1件目のバー基準位置（行上端から14px）
    const LANE_PITCH = 12;     // lane間隔（被り回避ズラし、工程表Excel風と同じ）
    const EXTRA_LANE_Y_TRAVEL_MASTER = 4; // 大元の出張計画表のみ: lane>=1 の追加Yオフセット

    // 大元の出張計画表: lane >= 1 に追加オフセット（1本目は維持、2本目以降を少し下げる）
    const extraLaneOffset = (lane >= 1) ? EXTRA_LANE_Y_TRAVEL_MASTER : 0;
    const topInRow = BAR_TOP_BASE + (lane * LANE_PITCH) + extraLaneOffset;

    // 両矢印スタイルHTML（ExcelGanttと同じ構造 + リサイズハンドル）
    const lineClass = shape === 'dash' ? 'bar-line bar-line--dash' : 'bar-line';
    // top/transformをinlineで上書きしてCSS（top:50%）を無効化
    const baseStyle = `left:${trip._xStart}px; width:${trip._width}px; top:${topInRow}px; transform:none; color:${color};`;

    return `
      <div class="excel-bar excel-bar--arrow travel-trip-bar"
           style="${baseStyle}"
           data-trip-id="${trip.tripId}"
           title="${safeLabel}">
        <div class="${lineClass}"></div>
        <div class="bar-handle bar-handle--left" data-handle="left"></div>
        <div class="bar-handle bar-handle--right" data-handle="right"></div>
        <div class="bar-label">${safeLabel}</div>
      </div>
    `;
  },

  lockTrip(tripId) {
    Store.updateTripInStore(tripId, { isLocked: true });
    ChangeBuffer.add('trip', 'lock', tripId, {}, 'travel');
    Utils.showToast('予定を確定しました（保存待ち）', 'info');
    this.render();
  },

  /**
   * 2つの予定が重なるかチェック
   */
  tripsOverlap(a, b) {
    return !(a.end < b.start || b.end < a.start);
  },

  /**
   * 作業者ごとの予定にlaneを割り当て（重なり回避）
   * 工程表Excel風と同じロジック：開始日順でレーン割り当て
   * @param {Object[]} personTrips - その人の予定配列
   * @returns {Object[]} lane情報付きの予定配列
   */
  assignLanesForPerson(personTrips) {
    if (!personTrips || personTrips.length === 0) return [];

    // 開始日順でソート（工程表Excel風と同じ）
    const items = personTrips.slice().sort((a, b) => a.start.localeCompare(b.start));

    // laneEnds配列：各レーンの最後のend日を保持
    const laneEnds = [];

    for (const trip of items) {
      let placed = false;
      // 空いているレーンを探す（endが自分のstart未満なら空いている）
      for (let i = 0; i < laneEnds.length; i++) {
        if (laneEnds[i] < trip.start) {
          trip.lane = i;
          laneEnds[i] = trip.end;
          placed = true;
          break;
        }
      }
      // 空いているレーンがなければ新しいレーンを追加
      if (!placed) {
        trip.lane = laneEnds.length;
        laneEnds.push(trip.end);
      }
    }

    return items;
  },

  /**
   * 埋め込み用レンダリング（大工程表・担当者別大工程表の下段用）
   * 2ペイン構造：左固定（作業者名）+ 右スクロール（日付グリッド）
   * @param {Object} options - { containerId, personId?, deptFilter?, dateFrom, days }
   */
  renderEmbedded(options) {
    const { containerId, personId, deptFilter, dateFrom, days } = options;
    const container = document.getElementById(containerId);
    if (!container) return;

    const { people, trips } = Store.state;
    const dates = Utils.generateDateRange(dateFrom, days);

    // ExcelGanttと同じ列幅を使用（タイムライン統一）
    const cellWidth = ExcelGantt.config.colWidth;  // 28px
    const totalWidth = dates.length * cellWidth;
    const rowHeight = 36;  // 作業者行の高さ

    // 部署の優先表示順
    const PRIMARY_DEPT_ORDER = ['組立', 'TSC', '電気設計', '機械設計'];

    // personId指定がある場合はその人のみ、なければアクティブな人全員
    let targetPeople = people.filter(p => p.isActive !== false);
    if (personId) {
      targetPeople = targetPeople.filter(p => p.personId === personId);
    }
    if (deptFilter) {
      targetPeople = targetPeople.filter(p => (p['部署/区分'] || '') === deptFilter);
    }

    if (targetPeople.length === 0) {
      container.innerHTML = `
        <div class="embedded-trip-empty">
          ${personId ? 'この担当者の出張予定はありません' :
            deptFilter ? `${deptFilter}の出張予定はありません` : '担当者が登録されていません'}
        </div>
      `;
      return;
    }

    // 部署ごとにグルーピング
    const groupByDept = (peopleList) => {
      const groups = new Map();
      for (const p of peopleList) {
        const key = (p['部署/区分'] && String(p['部署/区分']).trim()) || '未分類';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      }
      const otherDepts = [...groups.keys()]
        .filter(d => d !== '未分類' && !PRIMARY_DEPT_ORDER.includes(d))
        .sort((a, b) => a.localeCompare(b, 'ja'));
      const deptKeys = [
        ...PRIMARY_DEPT_ORDER.filter(d => groups.has(d)),
        ...otherDepts,
        ...(groups.has('未分類') ? ['未分類'] : [])
      ];
      const rows = [];
      for (const dept of deptKeys) {
        // 部署ヘッダーは廃止（横帯削除）、作業者行のみ
        const members = groups.get(dept)
          .slice()
          .sort((a, b) => (a['氏名'] || '').localeCompare(b['氏名'] || '', 'ja'));
        for (const p of members) {
          rows.push({ type: 'person', person: p });
        }
      }
      return rows;
    };

    const workerRows = groupByDept(targetPeople);

    // 表示期間内のトリップをフィルタ
    const visibleTrips = trips.filter(trip => {
      const rangeStart = dates[0];
      const rangeEnd = dates[dates.length - 1];
      return trip.start <= rangeEnd && trip.end >= rangeStart;
    });

    // X座標計算（固定幅）
    const getXForDate = (date) => {
      const idx = dates.indexOf(date);
      return idx >= 0 ? idx * cellWidth : 0;
    };

    const today = Utils.getToday();

    // lane計算用の定数（設計指示に基づく - 工程表Excel風と統一）
    const ROW_HEIGHT = 36;       // 行高固定（工程表ガントと統一）
    const BAR_HEIGHT = 14;       // バー描画高さ
    const BAR_TOP_BASE = 14;     // 1件目のバー基準位置（行上端から14px）
    const LANE_PITCH = 12;       // lane間隔（被り回避ズラし、工程表Excel風と同じ）

    // 各作業者の行データを事前計算（lane割り当て + 行高さ計算）
    const rowDataList = workerRows.map(row => {
      const person = row.person;
      const personTrips = visibleTrips.filter(t => t.personId === person.personId);
      // lane割り当て（新しい予定を優先的にlane 0へ）
      const layoutTrips = this.assignLanesForPerson(personTrips);
      // 最大lane数を取得（上方向へのはみ出し計算用）
      const maxLane = layoutTrips.reduce((max, t) => Math.max(max, t.lane || 0), 0);
      const laneCount = maxLane + 1;
      // 行高は固定36px（上へのはみ出しはoverflow:visibleで対応）
      const dynamicHeight = ROW_HEIGHT;
      const personColor = Utils.normalizeColor(person['作業者色(colorHex)']) || '#6b7280';
      return { person, layoutTrips, dynamicHeight, laneCount, personColor };
    });

    // ===== 左ペイン（固定：作業者名 + 左端に色帯）=====
    let leftHtml = '';
    // ヘッダー
    leftHtml += '<div class="trip-left-head">出張予定</div>';
    // 行（部署ヘッダー廃止、色帯のみ）- 動的高さ使用
    rowDataList.forEach(({ person, dynamicHeight, personColor }) => {
      leftHtml += `
        <div class="trip-left-row" style="height:${dynamicHeight}px;">
          <div class="trip-color-bar" style="background:${personColor};"></div>
          <div class="trip-name-cell">
            <div class="trip-left-dept">${Utils.escapeHtml(person['部署/区分'] || '')}</div>
            <div class="trip-left-name">${Utils.escapeHtml(person['氏名'] || '')}</div>
          </div>
        </div>
      `;
    });

    // ===== 右ペイン（横スクロール：日付グリッド）=====
    let rightHtml = '';

    // 日付ヘッダー
    rightHtml += `<div class="trip-time-head" style="width:${totalWidth}px;">`;
    let currentMonth = 0;
    dates.forEach(date => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;
      const daySetting = Store.getDaySetting(date);
      const showMonth = month !== currentMonth;
      currentMonth = month;

      let classes = 'trip-day';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';
      if (daySetting === 'WORKDAY') classes += ' is-workday';
      if (daySetting === 'HOLIDAY') classes += ' is-holiday';

      rightHtml += `
        <div class="${classes}" style="width:${cellWidth}px;">
          ${showMonth ? `<span class="trip-day-month">${month}/</span>` : ''}${day}<br><span class="trip-day-dow">${dow}</span>
        </div>
      `;
    });
    rightHtml += '</div>';

    // グリッドボディ（部署ヘッダー廃止、作業者行のみ）
    rightHtml += `<div class="trip-time-body" style="width:${totalWidth}px;">`;
    rowDataList.forEach(({ person, layoutTrips, dynamicHeight }) => {
      rightHtml += `<div class="trip-time-row" style="height:${dynamicHeight}px;">`;

      // グリッドセル（背景線用）
      dates.forEach(date => {
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;
        const daySetting = Store.getDaySetting(date);
        let classes = 'trip-grid-cell';
        if (isWeekend) classes += ' weekend';
        if (isToday) classes += ' today';
        if (daySetting === 'WORKDAY') classes += ' is-workday';
        if (daySetting === 'HOLIDAY') classes += ' is-holiday';
        rightHtml += `<div class="${classes}" style="width:${cellWidth}px; height:${dynamicHeight}px;" data-person-id="${person.personId}" data-date="${date}"></div>`;
      });

      // バーレイヤ
      rightHtml += '<div class="trip-bar-layer">';
      layoutTrips.forEach(trip => {
        const startOffset = Utils.getDaysBetween(dates[0], trip.start);
        const duration = Utils.getDaysBetween(trip.start, trip.end) + 1;
        if (startOffset + duration <= 0 || startOffset >= dates.length) return;

        // 表示範囲にクリップ（左右のはみ出しを防止）
        const visibleStartOffset = Math.max(0, startOffset);
        const visibleEndOffset = Math.min(dates.length - 1, startOffset + duration - 1);
        const visibleDuration = visibleEndOffset - visibleStartOffset + 1;

        if (visibleDuration <= 0) return;

        const xStart = visibleStartOffset * cellWidth;
        const barWidth = visibleDuration * cellWidth;

        // lane位置からtopを計算（工程表Excel風と同じ計算方式）
        // 例：BAR_TOP_BASE=14px, LANE_PITCH=12px の場合
        //   lane 0 → top = 14px（1件目は行上端から14px）
        //   lane 1 → top = 26px（2件目は12pxずらす）
        //   lane 2 → top = 38px（3件目以降も同様、行高36pxを超えたらoverflow:visibleで対応）
        const lane = trip.lane || 0;
        // 2本目以降は少し下げる（1本目との微調整）
        const extraLaneOffset = (lane >= 1) ? 2 : 0;
        const topInRow = BAR_TOP_BASE + (lane * LANE_PITCH) + extraLaneOffset;
        rightHtml += this.renderEmbeddedTripBar(trip, xStart, barWidth, topInRow, BAR_HEIGHT);
      });
      rightHtml += '</div>';

      rightHtml += '</div>';
    });
    rightHtml += '</div>';

    // ===== 全体HTML =====
    const html = `
      <div class="trip-wrap">
        <div class="trip-left">${leftHtml}</div>
        <div class="trip-right">
          <div class="trip-right-scroll" id="${containerId}-scroll">${rightHtml}</div>
        </div>
      </div>
    `;

    container.innerHTML = html;

    // ドラッグ/リサイズイベント設定（cellWidthを渡す）
    this.setupEmbeddedDragHandlers(containerId, visibleTrips, cellWidth);

    // スクロール同期
    this.setupEmbeddedScrollSync(containerId);
  },

  /**
   * 埋め込み用トリップバーをレンダリング（ExcelGanttと同じ両矢印スタイル）
   * @param {Object} trip - トリップデータ
   * @param {number} xStart - X座標開始位置
   * @param {number} width - バーの幅
   * @param {number} topInRow - 行内でのY座標（lane位置）
   * @param {number} laneHeight - 1レーンの高さ
   */
  renderEmbeddedTripBar(trip, xStart, width, topInRow, laneHeight) {
    const isLocked = trip.isLocked === true;
    // ラベル生成
    let label = '';
    let shape = 'arrow';  // デフォルト: 実線矢印
    let color = '#6b7280';  // デフォルト色

    // 部署の色を取得（移動以外で使用）
    const person = Store.getPersonById(trip.personId);
    const dept = person?.['部署/区分'] || '';
    const deptColor = getDeptHeaderColor(dept);

    if (trip.kind === 'move') {
      label = '移動';
      shape = 'dash';  // 移動は破線
      color = '#9ca3af';  // 移動はデフォルトのグレー
    } else if (trip.kind === 'site') {
      const description = trip['用件'] || '';
      const lines = description.split('\n');
      // 1行目を使用（工番+顧客名など）
      label = lines[0] || trip['行先'] || '';
      color = deptColor.background;  // 部署の色を使用
    } else {
      label = trip['行先'] || trip['用件'] || '';
      color = deptColor.background;  // 部署の色を使用
    }

    // ロックアイコン
    const lockPrefix = isLocked ? '🔒 ' : '';
    const safeLabel = Utils.escapeHtml(lockPrefix + label);

    // 両矢印スタイルHTML（ExcelGanttと同じ構造 + リサイズハンドル）
    const lineClass = shape === 'dash' ? 'bar-line bar-line--dash' : 'bar-line';
    const baseStyle = `left:${xStart}px; width:${width}px; top:${topInRow}px; height:${laneHeight}px; color:${color};`;

    return `
      <div class="excel-bar excel-bar--arrow embedded-trip-bar"
           style="${baseStyle}"
           data-trip-id="${trip.tripId}"
           title="${safeLabel}">
        <div class="${lineClass}"></div>
        <div class="bar-handle bar-handle--left" data-handle="left"></div>
        <div class="bar-handle bar-handle--right" data-handle="right"></div>
        <div class="bar-label">${safeLabel}</div>
      </div>
    `;
  },

  /**
   * 埋め込み用ドラッグ/リサイズハンドラー設定（大本の出張計画表と同じ機能）
   * @param {string} containerId - コンテナID
   * @param {Object[]} trips - 表示中の予定配列
   * @param {number} cellWidth - セル幅（日付計算用）
   */
  setupEmbeddedDragHandlers(containerId, trips, cellWidth) {
    const container = document.getElementById(containerId);
    if (!container) return;

    // ===== 予定バーのドラッグ/リサイズ =====
    const tripBars = container.querySelectorAll('[data-trip-id]');
    tripBars.forEach(bar => {
      bar.style.cursor = 'grab';

      // ポインターダウン：ドラッグ開始
      bar.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();

        const tripId = bar.dataset.tripId;
        const trip = trips.find(t => t.tripId === tripId);
        if (!trip) return;

        // ハンドルクリックか判定（リサイズ or 移動）
        const handle = e.target.closest('.bar-handle');
        let mode = 'move';
        if (handle) {
          mode = handle.dataset.handle === 'left' ? 'resize-left' : 'resize-right';
        }

        // ドラッグ状態を初期化
        this._embeddedDragState = {
          containerId,
          tripId,
          mode,
          barEl: bar,
          startX: e.clientX,
          origStartDate: trip.start,
          origEndDate: trip.end,
          dayW: cellWidth,
          origLeft: parseFloat(bar.style.left) || 0,
          origWidth: parseFloat(bar.style.width) || 0,
          hasMoved: false,
          lastDeltaDays: 0
        };

        bar.classList.add('dragging');
        bar.setPointerCapture(e.pointerId);
      });

      // ポインタームーブ：プレビュー更新
      bar.addEventListener('pointermove', (e) => {
        if (!this._embeddedDragState || this._embeddedDragState.barEl !== bar) return;

        const { startX, dayW, mode, origLeft, origWidth, origStartDate, origEndDate } = this._embeddedDragState;
        const dx = e.clientX - startX;

        if (Math.abs(dx) > 3) {
          this._embeddedDragState.hasMoved = true;
        }

        const deltaDays = Math.round(dx / dayW);
        if (deltaDays === this._embeddedDragState.lastDeltaDays) return;
        this._embeddedDragState.lastDeltaDays = deltaDays;

        // 日付計算（モード別）
        let newStart = origStartDate;
        let newEnd = origEndDate;

        if (mode === 'move') {
          // 平行移動
          newStart = Utils.addDays(origStartDate, deltaDays);
          newEnd = Utils.addDays(origEndDate, deltaDays);
        } else if (mode === 'resize-left') {
          // 左リサイズ（開始日のみ変更）
          newStart = Utils.addDays(origStartDate, deltaDays);
          if (newStart > origEndDate) newStart = origEndDate;  // 最小1日
        } else if (mode === 'resize-right') {
          // 右リサイズ（終了日のみ変更）
          newEnd = Utils.addDays(origEndDate, deltaDays);
          if (newEnd < origStartDate) newEnd = origStartDate;  // 最小1日
        }

        this._embeddedDragState.newStart = newStart;
        this._embeddedDragState.newEnd = newEnd;

        // DOMプレビュー更新
        const deltaLeft = deltaDays * dayW;
        if (mode === 'move') {
          bar.style.left = `${origLeft + deltaLeft}px`;
        } else if (mode === 'resize-left') {
          const clampedDelta = Math.min(deltaLeft, origWidth - dayW);
          bar.style.left = `${origLeft + clampedDelta}px`;
          bar.style.width = `${origWidth - clampedDelta}px`;
        } else if (mode === 'resize-right') {
          const newWidth = Math.max(dayW, origWidth + deltaLeft);
          bar.style.width = `${newWidth}px`;
        }
      });

      // ポインターアップ：確定
      bar.addEventListener('pointerup', (e) => {
        if (!this._embeddedDragState || this._embeddedDragState.barEl !== bar) return;

        bar.classList.remove('dragging');
        bar.releasePointerCapture(e.pointerId);

        const { tripId, mode, hasMoved, newStart, newEnd, origStartDate, origEndDate, containerId: cId } = this._embeddedDragState;

        if (hasMoved && newStart && (newStart !== origStartDate || newEnd !== origEndDate)) {
          // データ更新
          ChangeBuffer.add('trip', 'update', tripId, {
            start: newStart,
            end: newEnd
          }, 'travel');

          // Store更新
          const trip = Store.state.trips.find(t => t.tripId === tripId);
          if (trip) {
            trip.start = newStart;
            trip.end = newEnd;
          }

          const actionLabel = mode === 'move' ? '移動' : '期間変更';
          Utils.showToast(`予定を${actionLabel}しました（保存待ち）`, 'info');

          // 該当の埋め込み表示を再描画（親ビューの再描画をトリガー）
          this.refreshEmbeddedView(cId);
        } else if (!hasMoved) {
          // クリック（移動なし）→ モーダルを開く（ハンドルクリックは除外）
          if (!e.target.closest('.bar-handle')) {
            const trip = trips.find(t => t.tripId === tripId);
            if (trip) {
              TripModal.open(trip);
            }
          }
        }

        this._embeddedDragState = null;
      });

      // ポインターキャンセル
      bar.addEventListener('pointercancel', (e) => {
        if (this._embeddedDragState && this._embeddedDragState.barEl === bar) {
          bar.classList.remove('dragging');
          // 元の位置・サイズに戻す
          bar.style.left = `${this._embeddedDragState.origLeft}px`;
          bar.style.width = `${this._embeddedDragState.origWidth}px`;
          this._embeddedDragState = null;
        }
      });
    });

    // ===== グリッドセルのクリック/ドラッグ選択（新規作成） =====
    this.setupEmbeddedCellSelectionHandlers(containerId);
  },

  /**
   * 埋め込み用セル選択ハンドラー（ドラッグで範囲選択 → 新規作成モーダル）
   * @param {string} containerId - コンテナID
   */
  setupEmbeddedCellSelectionHandlers(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const cells = container.querySelectorAll('.trip-grid-cell[data-person-id][data-date]');

    cells.forEach(cell => {
      // mousedown: 選択開始
      cell.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;  // 左クリックのみ
        e.preventDefault();

        const personId = cell.dataset.personId;
        const date = cell.dataset.date;

        this._embeddedSelecting = true;
        this._embeddedSelectContainerId = containerId;
        this._embeddedSelectPersonId = personId;
        this._embeddedSelectStartDate = date;
        this._embeddedSelectEndDate = date;

        this.updateEmbeddedSelectionHighlight(containerId);
      });

      // mousemove: 選択範囲拡張
      cell.addEventListener('mousemove', (e) => {
        if (!this._embeddedSelecting || this._embeddedSelectContainerId !== containerId) return;

        const personId = cell.dataset.personId;
        const date = cell.dataset.date;

        // 同一personIdの行内のみ選択可能
        if (personId === this._embeddedSelectPersonId) {
          this._embeddedSelectEndDate = date;
          this.updateEmbeddedSelectionHighlight(containerId);
        }
      });

      // mouseup: 選択確定 → モーダル表示
      cell.addEventListener('mouseup', (e) => {
        if (!this._embeddedSelecting || this._embeddedSelectContainerId !== containerId) return;

        const personId = this._embeddedSelectPersonId;
        let startDate = this._embeddedSelectStartDate;
        let endDate = this._embeddedSelectEndDate;

        // 日付の順序を正規化
        if (startDate > endDate) {
          [startDate, endDate] = [endDate, startDate];
        }

        this._embeddedSelecting = false;
        this.clearEmbeddedSelectionHighlight(containerId);

        // 新規作成モーダルを開く
        TripModal.openNew(personId, startDate, endDate);
      });
    });

    // mouseleave: コンテナ外に出たら選択解除
    container.addEventListener('mouseleave', () => {
      if (this._embeddedSelecting && this._embeddedSelectContainerId === containerId) {
        this._embeddedSelecting = false;
        this.clearEmbeddedSelectionHighlight(containerId);
      }
    });
  },

  /**
   * 埋め込み用選択範囲ハイライト更新
   * @param {string} containerId - コンテナID
   */
  updateEmbeddedSelectionHighlight(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const startDate = this._embeddedSelectStartDate;
    const endDate = this._embeddedSelectEndDate;
    const personId = this._embeddedSelectPersonId;

    // 正規化
    const minDate = startDate < endDate ? startDate : endDate;
    const maxDate = startDate > endDate ? startDate : endDate;

    // すべてのセルをリセット
    const cells = container.querySelectorAll('.trip-grid-cell[data-person-id][data-date]');
    cells.forEach(cell => {
      const cellPersonId = cell.dataset.personId;
      const cellDate = cell.dataset.date;

      if (cellPersonId === personId && cellDate >= minDate && cellDate <= maxDate) {
        cell.classList.add('selecting');
      } else {
        cell.classList.remove('selecting');
      }
    });
  },

  /**
   * 埋め込み用選択範囲ハイライトをクリア
   * @param {string} containerId - コンテナID
   */
  clearEmbeddedSelectionHighlight(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const cells = container.querySelectorAll('.trip-grid-cell.selecting');
    cells.forEach(cell => cell.classList.remove('selecting'));
  },

  /**
   * 埋め込み出張計画表の再描画をトリガー
   * @param {string} containerId - コンテナID
   */
  refreshEmbeddedView(containerId) {
    // コンテナIDに応じて適切な再描画メソッドを呼ぶ
    if (containerId === 'gantt-trip-container') {
      // 大工程表下
      Gantt.updateTripSection();
    } else if (containerId === 'person-gantt-trip-container') {
      // 担当者別大工程表下
      PersonGanttOverlay.render();
    } else if (containerId === 'calendar-trip-container') {
      // TSC予定下
      CalendarView.renderTrips();
    } else if (containerId === 'electrical-trip-container') {
      // 電気予定下
      ElectricalView.renderTrips();
    } else {
      // フォールバック：全体を再描画
      this.render();
    }
  },

  /**
   * 埋め込み用スクロール同期設定（ExcelGanttの横スクロールと連動）
   * 2ペイン構造：右側のみ横スクロール
   * 注意：ExcelGantt → 出張計画への同期はExcelGantt.setupScrollSync()で行うため、
   *       ここでは出張計画 → ExcelGantt方向のみ設定（重複防止）
   */
  setupEmbeddedScrollSync(containerId) {
    const tripScroll = document.getElementById(`${containerId}-scroll`);
    const excelTimeBody = document.getElementById('excelTimeBody');
    const excelTimeHeader = document.getElementById('excelTimeHeader');
    const excelBottomScrollbar = document.getElementById('excelBottomScrollbar');

    if (!tripScroll) return;

    // 出張計画スクロール → ExcelGanttに同期（ガード付き）
    tripScroll.addEventListener('scroll', () => {
      // ガードフラグで再帰ループ防止
      if (_scrollSyncing) return;
      _scrollSyncing = true;

      if (excelTimeBody) excelTimeBody.scrollLeft = tripScroll.scrollLeft;
      if (excelTimeHeader) excelTimeHeader.scrollLeft = tripScroll.scrollLeft;
      if (excelBottomScrollbar) excelBottomScrollbar.scrollLeft = tripScroll.scrollLeft;

      // 次フレームでガード解除
      requestAnimationFrame(() => { _scrollSyncing = false; });
    }, { passive: true });

    // ExcelGantt → 出張計画への同期は ExcelGantt.setupScrollSync() で実装済み
    // 重複登録すると無限ループの原因になるため、ここでは登録しない
  },

  /**
   * 埋め込み出張計画のResizeObserverを設定
   * コンテナのサイズが変わった時（表示/非表示切替、パネル開閉など）に再描画
   */
  setupEmbeddedResizeObservers() {
    // 監視対象のコンテナIDとそれに対応する再描画関数
    const containers = [
      { id: 'gantt-trip-container', render: () => Gantt.renderTrips() },
      { id: 'calendar-trip-container', render: () => CalendarView.renderTrips() },
      { id: 'electrical-trip-container', render: () => ElectricalView.renderTrips() },
      { id: 'person-gantt-trip-container', render: () => PersonGanttOverlay.renderTrips() }
    ];

    containers.forEach(({ id, render }) => {
      const container = document.getElementById(id);
      if (!container) return;

      let lastWidth = 0;
      const ro = new ResizeObserver((entries) => {
        for (const entry of entries) {
          const width = entry.contentRect.width;
          // 幅が50px未満の場合はまだ表示されていないので無視
          if (width < 50) continue;
          // 幅が変わった場合のみ再描画
          if (Math.abs(width - lastWidth) > 5) {
            lastWidth = width;
            // requestAnimationFrameで描画をバッチ処理
            requestAnimationFrame(() => {
              try {
                render();
              } catch (e) {
                console.warn(`[TravelPlan] ResizeObserver render failed for ${id}:`, e);
              }
            });
          }
        }
      });
      ro.observe(container);
    });
  }
};

// CalendarView - TSC予定ビュー（Googleカレンダー + 出張予定）
// ========================================

const CalendarView = {
  tripPersonFilter: null,
  isCalendarRendered: false,
  _lastStartDate: null,
  _lastDays: null,

  /**
   * 初期化
   */
  init() {
    // Store変更を監視して、表示期間変更時に再描画
    Store.subscribe((state) => {
      if (state.currentView === 'calendar' && this.isCalendarRendered) {
        // 表示期間が変わった場合のみ再描画
        if (this._lastStartDate !== state.displayStartDate ||
            this._lastDays !== state.displayDays) {
          this._lastStartDate = state.displayStartDate;
          this._lastDays = state.displayDays;
          CalendarEventViewer.clearCache();
          this.render();
        }
      }
    });
  },

  /**
   * ビューを初期化（タブ切替時に呼ばれる）
   */
  async render() {
    const { displayStartDate, displayDays } = Store.state;

    // 出張予定を描画
    this.renderTrips();

    // カレンダーイベントを描画（キャッシュがあれば即座に表示される）
    await CalendarEventViewer.render({
      containerId: 'calendar-tsc-events',
      calendarType: 'TSC',
      startDate: displayStartDate,
      days: displayDays
    });

    this.isCalendarRendered = true;
  },

  /**
   * 表示期間変更時の再描画
   */
  async refresh() {
    if (!this.isCalendarRendered) return;

    // キャッシュをクリアして再取得
    CalendarEventViewer.clearCache();
    await this.render();
  },

  /**
   * 出張計画セクションの折りたたみ切替
   */
  toggleTripSection() {
    const section = document.getElementById('calendar-trip-section');
    if (section) {
      const wasCollapsed = section.classList.contains('collapsed');
      section.classList.toggle('collapsed');
      if (wasCollapsed) {
        setTimeout(() => this.renderTrips(), 350);
      }
    }
  },

  /**
   * 出張予定エリアの担当者検索ハンドラー
   */
  handleTripPersonSearch() {
    const input = document.getElementById('calendar-trip-person-input');

// ========================================
// CalendarEventViewer - カレンダーイベント表示コンポーネント（B案）
// ========================================

const CalendarEventViewer = {
  cache: {}, // カレンダーイベントのキャッシュ
  activePopup: null, // 現在表示中のポップアップ

  /**
   * カレンダーイベントを取得
   * @param {string} calendarType - 'TSC' または 'ELECTRICAL'
   * @param {string} startDate - 開始日 (YYYY-MM-DD)
   * @param {string} endDate - 終了日 (YYYY-MM-DD)
   * @returns {Promise<Object>} { success, events, errorType, errorMessage, source }
   */
  async fetchEvents(calendarType, startDate, endDate) {
    const cacheKey = `${calendarType}_${startDate}_${endDate}`;

    // キャッシュがあれば返す
    if (this.cache[cacheKey]) {
      return this.cache[cacheKey];
    }

    try {
      const apiFunc = calendarType === 'TSC'
        ? 'api_getTSCCalendarEvents'
        : 'api_getElectricalCalendarEvents';

      const result = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [apiFunc](startDate, endDate);
      });

      // 新しいレスポンス形式: { success, events, errorType, errorMessage, source }
      this.cache[cacheKey] = result;
      return result;
    } catch (e) {
      console.error(`[CalendarEventViewer] Failed to fetch events for ${calendarType}:`, e);
      // ネットワークエラーなど
      return {
        success: false,
        events: [],
        errorType: 'NETWORK_ERROR',
        errorMessage: e.message || 'サーバーとの通信に失敗しました'
      };
    }
  },

  /**
   * キャッシュをクリア
   */
  clearCache() {
    this.cache = {};
  },

  /**
   * カレンダービューを描画
   * @param {Object} options
   * @param {string} options.containerId - コンテナのID
   * @param {string} options.calendarType - 'TSC' または 'ELECTRICAL'
   * @param {string} options.startDate - 表示開始日
   * @param {number} options.days - 表示日数
   */
  async render(options) {
    const { containerId, calendarType, startDate, days } = options;
    const container = document.getElementById(containerId);

    if (!container) {
      console.error(`[CalendarEventViewer] Container not found: ${containerId}`);
      return;
    }

    // ローディング表示
    container.innerHTML = '<div class="calendar-events-loading">カレンダー読み込み中...</div>';

    // 終了日を計算（Utils.addDaysを使ってUTC問題を回避）
    const endDate = Utils.addDays(startDate, days - 1);

    // イベントを取得
    const result = await this.fetchEvents(calendarType, startDate, endDate);

    // 結果を処理
    if (!result.success) {
      // エラー表示（次のアクションが分かるメッセージ）
      const errorHtml = this.formatErrorMessage(result, calendarType);
      container.innerHTML = errorHtml;
      return;
    }

    // 成功 - 月別にグループ化して描画
    const events = result.events || [];
    const source = result.source || 'unknown';

    // ソース情報を表示（ICSフォールバックの場合）
    let sourceNote = '';
    if (source === 'ICS') {
      sourceNote = '<div class="calendar-source-note">※ 公開カレンダー(ICS)から取得しています</div>';
    }

    this.renderMonthView(container, events, startDate, days, calendarType, sourceNote);
  },

  /**
   * エラーメッセージをフォーマット
   */
  formatErrorMessage(result, calendarType) {
    const calendarName = calendarType === 'TSC' ? 'TSCカレンダー' : '電気カレンダー';
    let message = result.errorMessage || 'カレンダーの読み込みに失敗しました';

    // 改行をHTMLに変換
    message = message.replace(/\n/g, '<br>');

    return `
      <div class="calendar-events-error">
        <div class="calendar-error-title">${calendarName}の読み込みエラー</div>
        <div class="calendar-error-message">${message}</div>
        <div class="calendar-error-actions">
          <button onclick="CalendarEventViewer.clearCache(); ${calendarType === 'TSC' ? 'CalendarView' : 'ElectricalView'}.render();" class="calendar-retry-btn">
            再試行
          </button>
        </div>
      </div>
    `;
  },

  /**
   * 月表示ビューを描画
   */
  renderMonthView(container, events, startDate, days, calendarType, sourceNote = '') {
    const dates = Utils.generateDateRange(startDate, days);
    const today = Utils.getToday();

    // イベントを日付でマップ化
    const eventsByDate = {};
    events.forEach(event => {
      // 終日イベントや複数日イベントの処理
      const eventStart = event.startDate;
      const eventEnd = event.endDate;

      // イベントが含まれる各日にマッピング
      // Utils.parseLocalDate()を使ってUTC解釈を回避
      let current = Utils.parseLocalDate(eventStart);
      const endCheck = Utils.parseLocalDate(eventEnd);

      // 終了日は排他的（終日イベントは翌日00:00が返る）ので < で比較
      while (current < endCheck) {
        const dateStr = Utils.formatDate(current);
        if (!eventsByDate[dateStr]) {
          eventsByDate[dateStr] = [];
        }
        eventsByDate[dateStr].push(event);
        current.setDate(current.getDate() + 1);
      }
    });

    // 月ごとにグループ化
    const monthGroups = {};
    dates.forEach(date => {
      const month = date.slice(0, 7); // YYYY-MM
      if (!monthGroups[month]) {
        monthGroups[month] = [];
      }
      monthGroups[month].push(date);
    });

    // HTMLを生成
    let html = '';

    Object.keys(monthGroups).sort().forEach(month => {
      const [year, monthNum] = month.split('-');
      const monthName = `${year}年${parseInt(monthNum)}月`;

      // 月の最初の日と最後の日
      const monthDates = monthGroups[month];
      const firstDate = Utils.parseLocalDate(monthDates[0]);
      const lastDate = Utils.parseLocalDate(monthDates[monthDates.length - 1]);

      // 月全体のカレンダーグリッドを生成（これはローカル生成なのでOK）
      const firstDayOfMonth = new Date(parseInt(year), parseInt(monthNum) - 1, 1);
      const lastDayOfMonth = new Date(parseInt(year), parseInt(monthNum), 0);
      const startDayOfWeek = firstDayOfMonth.getDay(); // 0=Sun

      html += `
        <div class="calendar-month-section">
          <div class="calendar-month-header">
            <span class="calendar-month-title">${monthName}</span>
          </div>
          <div class="calendar-week-header">
            <div class="calendar-week-header-cell sun">日</div>
            <div class="calendar-week-header-cell">月</div>
            <div class="calendar-week-header-cell">火</div>
            <div class="calendar-week-header-cell">水</div>
            <div class="calendar-week-header-cell">木</div>
            <div class="calendar-week-header-cell">金</div>
            <div class="calendar-week-header-cell sat">土</div>
          </div>
          <div class="calendar-month-grid">
      `;

      // グリッドの開始位置まで空セルを追加
      for (let i = 0; i < startDayOfWeek; i++) {
        html += '<div class="calendar-day-cell other-month"></div>';
      }

      // 月の各日を描画
      for (let day = 1; day <= lastDayOfMonth.getDate(); day++) {
        const date = new Date(parseInt(year), parseInt(monthNum) - 1, day);
        const dateStr = Utils.formatDate(date);  // toISOStringはUTCなので使わない
        const dayOfWeek = date.getDay();
        const isInRange = monthDates.includes(dateStr);

        // セルのクラスを決定
        const cellClasses = ['calendar-day-cell'];
        if (!isInRange) cellClasses.push('other-month');
        if (dateStr === today) cellClasses.push('today');
        if (dayOfWeek === 0) cellClasses.push('sun');
        if (dayOfWeek === 6) cellClasses.push('sat');
        if (dayOfWeek === 0 || dayOfWeek === 6) cellClasses.push('weekend');

        const dayEvents = eventsByDate[dateStr] || [];
        const maxDisplay = 3;

        html += `
          <div class="${cellClasses.join(' ')}">
            <div class="calendar-day-number">${day}</div>
            <div class="calendar-day-events">
        `;

        // イベントを表示（最大3件）
        dayEvents.slice(0, maxDisplay).forEach(event => {
          const timeStr = event.isAllDay
            ? ''
            : `<span class="calendar-event-time">${this.formatTime(event.startTime)}</span>`;

          // タイトル先頭文字を取得（デバッグ用にdata属性で出力）
          const initial = (event.title || '').replace(/^[:：\s　]+/, '').charAt(0);
          const eventClass = `calendar-event-item ${event.isAllDay ? 'all-day' : ''}`.trim();
          const eventData = encodeURIComponent(JSON.stringify(event));

          html += `
            <div class="${eventClass}"
                 data-caltype="${calendarType}"
                 data-initial="${initial}"
                 onclick="CalendarEventViewer.showEventPopup(event, '${eventData}')"
                 title="${this.escapeHtml(event.title)}">
              ${timeStr}${this.escapeHtml(event.title)}
            </div>
          `;
        });

        // 残りのイベント数を表示
        if (dayEvents.length > maxDisplay) {
          html += `
            <div class="calendar-event-more"
                 onclick="CalendarEventViewer.showDayEvents('${dateStr}', '${calendarType}')">
              +${dayEvents.length - maxDisplay}件
            </div>
          `;
        }

        html += `
            </div>
          </div>
        `;
      }

      // グリッドの終了位置まで空セルを追加
      const endDayOfWeek = lastDayOfMonth.getDay();
      for (let i = endDayOfWeek + 1; i < 7; i++) {
        html += '<div class="calendar-day-cell other-month"></div>';
      }

      html += `
          </div>
        </div>
      `;
    });

    if (events.length === 0) {
      html = '<div class="calendar-events-empty">表示期間内にイベントがありません</div>';
    }

    // ソースノートがあれば先頭に追加
    if (sourceNote) {
      html = sourceNote + html;
    }

    container.innerHTML = html;
  },

  /**
   * 時刻をフォーマット
   */
  formatTime(isoTime) {
    if (!isoTime) return '';
    const date = new Date(isoTime);
    const hours = date.getHours().toString().padStart(2, '0');
    const minutes = date.getMinutes().toString().padStart(2, '0');
    return `${hours}:${minutes}`;
  },

  /**
   * HTMLエスケープ
   */
  escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  },

  /**
   * イベント詳細ポップアップを表示
   */
  showEventPopup(clickEvent, encodedEvent) {
    clickEvent.stopPropagation();

    // 既存のポップアップを閉じる
    this.closePopup();

    try {
      const event = JSON.parse(decodeURIComponent(encodedEvent));

      const popup = document.createElement('div');
      popup.className = 'calendar-event-popup';
      popup.innerHTML = `
        <button class="calendar-event-popup-close" onclick="CalendarEventViewer.closePopup()">×</button>
        <div class="calendar-event-popup-header">${this.escapeHtml(event.title)}</div>
        <div class="calendar-event-popup-content">
          <div class="calendar-event-popup-row">
            <span class="calendar-event-popup-label">日時</span>
            <span class="calendar-event-popup-value">
              ${event.isAllDay
                ? `${event.startDate}（終日）`
                : `${event.startDate} ${this.formatTime(event.startTime)} - ${this.formatTime(event.endTime)}`}
            </span>
          </div>
          ${event.location ? `
          <div class="calendar-event-popup-row">
            <span class="calendar-event-popup-label">場所</span>
            <span class="calendar-event-popup-value">${this.escapeHtml(event.location)}</span>
          </div>
          ` : ''}
          ${event.description ? `
          <div class="calendar-event-popup-row">
            <span class="calendar-event-popup-label">詳細</span>
            <span class="calendar-event-popup-value">${this.escapeHtml(event.description)}</span>
          </div>
          ` : ''}
        </div>
      `;

      // ポップアップの位置を設定
      document.body.appendChild(popup);

      const rect = clickEvent.target.getBoundingClientRect();
      const popupRect = popup.getBoundingClientRect();

      let left = rect.left;
      let top = rect.bottom + 4;

      // 画面からはみ出す場合は調整
      if (left + popupRect.width > window.innerWidth) {
        left = window.innerWidth - popupRect.width - 16;
      }
      if (top + popupRect.height > window.innerHeight) {
        top = rect.top - popupRect.height - 4;
      }

      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;

      this.activePopup = popup;

      // クリック外でポップアップを閉じる
      setTimeout(() => {
        document.addEventListener('click', this.handleOutsideClick);
      }, 0);

    } catch (e) {
      console.error('[CalendarEventViewer] Failed to show popup:', e);
    }
  },

  /**
   * ポップアップを閉じる
   */
  closePopup() {
    if (this.activePopup) {
      this.activePopup.remove();
      this.activePopup = null;
      document.removeEventListener('click', this.handleOutsideClick);
    }
  },

  /**
   * ポップアップ外クリックのハンドラー
   */
  handleOutsideClick(e) {
    if (CalendarEventViewer.activePopup &&
        !CalendarEventViewer.activePopup.contains(e.target)) {
      CalendarEventViewer.closePopup();
    }
  },

  /**
   * 特定日の全イベントを表示（モーダル）
   */
  showDayEvents(dateStr, calendarType) {
    // TODO: 日単位のイベント一覧モーダルを実装
    console.log(`Show all events for ${dateStr} from ${calendarType}`);
  }
};

    DaySettingButtons.init();
    ProcessModal.init();
    TopMemoPanel.init();
    JobModal.init();
    PeopleModal.setupEventListeners();
    JobDetail.init();
    ResourceView.init();
    WeeklyPlan.init();
    TravelPlan.init();
    CalendarView.init();
    ElectricalView.init();

    // 埋め込み出張計画のResizeObserverを設定（表示切替時の再描画用）
    TravelPlan.setupEmbeddedResizeObservers();

    this.setupEventListeners();

    document.getElementById('display-start-date').value = Store.state.displayStartDate;

    await Store.loadBootstrapData();

    // PDF情報を非同期で読み込み（UIブロックしない）
    Store.loadAllJobPdfInfo();

    // 初期ビューを正しく設定（navタブのactiveクラスとview-containerの表示状態）
    const initialView = Store.state.currentView || 'master';
    console.log(`[App] Setting initial view: ${initialView}`);
    this.switchView(initialView);

    console.log('App initialized successfully');
  },

  setupEventListeners() {
    document.getElementById('display-start-date')?.addEventListener('change', (e) => {
      this.onDisplayRangeChange();
    });

    document.getElementById('display-days')?.addEventListener('change', (e) => {
      this.onDisplayRangeChange();
    });

    document.getElementById('btn-refresh')?.addEventListener('click', () => {
      Store.loadBootstrapData();
    });

    document.getElementById('btn-people-manage')?.addEventListener('click', () => {
      PeopleModal.open();
    });

    const navTabs = document.querySelectorAll('.nav-tab');
    console.log('[DEBUG] Found nav-tabs:', navTabs.length);
    navTabs.forEach(tab => {
      console.log('[DEBUG] Nav tab:', tab.id, 'data-view:', tab.dataset.view);
      tab.addEventListener('click', (e) => {
        // e.currentTarget を使用（e.target だと子要素が取れる可能性がある）
        const view = e.currentTarget.dataset.view;
        console.log('[DEBUG] Nav tab clicked:', view);
        this.switchView(view);
      });
    });

    window.addEventListener('resize', Utils.debounce(() => {
      Gantt.updateTodayLinePosition();
    }, 200));

    // 非表示工番を表示トグル
    document.getElementById('show-hidden-jobs')?.addEventListener('change', (e) => {
      Store.setShowHiddenJobs(e.target.checked);
    });

    // 工番検索（大工程表用）
    this.setupJobSearch();
    // 担当者検索（大工程表用）
    this.setupPersonSearch();
  },

  // 工番検索のセットアップ
  setupJobSearch() {
    const input = document.getElementById('job-search-input');
    const clearBtn = document.getElementById('job-search-clear');

    if (!input) return;

    let debounceTimer;
    input.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        Store.setJobSearchQuery(e.target.value);
        this.updateSearchUI();
      }, 200);
    });

    // クリアボタン
    clearBtn?.addEventListener('click', () => {
      input.value = '';
      Store.setJobSearchQuery('');
      this.updateSearchUI();
      input.focus();
    });

    // 初期状態更新
    this.updateSearchUI();

    // Store変更時にUI更新
    Store.subscribe(() => this.updateSearchUI());
  },

  // 担当者検索のセットアップ
  setupPersonSearch() {
    const input = document.getElementById('person-search-input');
    const clearBtn = document.getElementById('person-search-clear');

    if (!input) return;

    let debounceTimer;
    input.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        Store.setPersonSearchQuery(e.target.value);
        this.updateSearchUI();
      }, 200);
    });

    // クリアボタン
    clearBtn?.addEventListener('click', () => {
      input.value = '';
      Store.setPersonSearchQuery('');
      this.updateSearchUI();
      input.focus();
    });
  },

  // 検索UIの状態更新（ヒット件数、クリアボタン表示）
  updateSearchUI() {
    const jobInput = document.getElementById('job-search-input');
    const jobClearBtn = document.getElementById('job-search-clear');
    const personInput = document.getElementById('person-search-input');
    const personClearBtn = document.getElementById('person-search-clear');
    const countEl = document.getElementById('job-search-count');

    const jobQuery = Store.state.jobSearchQuery;
    const personQuery = Store.state.personSearchQuery;
    const hasJobQuery = jobQuery && jobQuery.trim().length > 0;
    const hasPersonQuery = personQuery && personQuery.trim().length > 0;
    const hasAnyQuery = hasJobQuery || hasPersonQuery;

    // 工番検索クリアボタン表示/非表示
    if (jobClearBtn) {
      jobClearBtn.classList.toggle('hidden', !hasJobQuery);
    }

    // 担当者検索クリアボタン表示/非表示
    if (personClearBtn) {
      personClearBtn.classList.toggle('hidden', !hasPersonQuery);
    }

    // ヒット件数表示
    if (countEl) {
      if (hasAnyQuery) {
        const visibleCount = Store.getVisibleJobs().length;
        const totalCount = Store.state.showHiddenJobs
          ? Store.state.jobs.filter(j => j.status !== 'deleted').length
          : Store.state.jobs.filter(j => j.status !== 'closed' && j.status !== 'deleted' && j.isHidden !== true && j.isHidden !== 'TRUE').length;
        countEl.textContent = `${visibleCount}/${totalCount}件`;
        countEl.classList.remove('hidden');
      } else {
        countEl.classList.add('hidden');
      }
    }
  },

  // 互換性のためのエイリアス
  updateJobSearchUI() {
    this.updateSearchUI();
  },

  onDisplayRangeChange() {
    const startDate = document.getElementById('display-start-date').value;
    const days = parseInt(document.getElementById('display-days').value, 10);

    if (startDate && days) {
      Store.changeDisplayRange(startDate, days);
    }
  },

  async switchView(view) {
    // タブ切替前に未保存があれば自動保存
    if (ChangeBuffer.isDirty) {
      const result = await ChangeBuffer.flushIfDirty({ reason: 'tab_switch' });
      if (!result.ok && result.shouldBlock) {
        // 保存失敗時は遷移をキャンセル
        console.log('[App] switchView blocked due to save failure');
        return;
      }
    }

    Store.setState({ currentView: view });

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.view === view);
    });

    document.querySelectorAll('.view-container').forEach(container => {
      container.classList.add('hidden');
    });

    const viewContainer = document.getElementById(`view-${view}`);
    if (viewContainer) {
      viewContainer.classList.remove('hidden');
    }

    switch (view) {
      case 'master':
        Gantt.render();
        break;
      case 'resource':
        WorkerJobAssignView.render();
        break;
      case 'weekly':
        WeeklyPlan.render();
        break;
      case 'travel':
        TravelPlan.render();
        break;
      case 'calendar':
        // TSCカレンダー + 出張予定（APIから取得）
        CalendarView.render();
        break;
      case 'electrical':
        // 電気カレンダー + 出張予定（APIから取得）
        ElectricalView.render();
        break;
    }
  }
};

console.log('[DEBUG] App defined');

// DOMContentLoaded で初期化
document.addEventListener('DOMContentLoaded', () => {
  console.log('[DEBUG] DOMContentLoaded - starting App.init()');
  App.init();
});

console.log('[DEBUG] scripts.html fully loaded');
</script>
