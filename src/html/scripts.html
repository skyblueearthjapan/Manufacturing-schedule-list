const Modal = {
  currentSchedule: null,
  isEditMode: false,

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {
    document.getElementById('modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-modal-cancel')?.addEventListener('click', () => this.close());
    document.querySelector('#modal-entry .modal-backdrop')?.addEventListener('click', () => this.close());
    document.getElementById('btn-modal-save')?.addEventListener('click', () => this.save());
    document.getElementById('btn-modal-delete')?.addEventListener('click', () => this.delete());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') this.close();
    });
    document.getElementById('entry-process')?.addEventListener('change', () => this.validateProcess());
  },

  openNew(jobId, startDate, endDate) {
    this.isEditMode = false;
    this.currentSchedule = null;

    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = jobId;
    document.getElementById('entry-start').value = startDate;
    document.getElementById('entry-end').value = endDate;
    document.getElementById('modal-title').textContent = '工程登録';
    document.getElementById('btn-modal-delete').classList.add('hidden');

    this.populateProcessSelect();
    this.open();
  },

  // JobDetailからの呼び出し用：工程を事前選択
  openNewWithProcess(jobId, processId, startDate, endDate) {
    this.isEditMode = false;
    this.currentSchedule = null;

    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = jobId;
    document.getElementById('entry-start').value = startDate;
    document.getElementById('entry-end').value = endDate;
    document.getElementById('modal-title').textContent = '工程登録';
    document.getElementById('btn-modal-delete').classList.add('hidden');

    this.populateProcessSelect(processId); // 工程を事前選択
    this.validateProcess(); // マイルストーンチェック等を実行
    this.open();
  },

  openEdit(schedule) {
    this.isEditMode = true;
    this.currentSchedule = schedule;

    const job = Store.getJobById(schedule.jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = schedule.jobId;
    document.getElementById('entry-start').value = schedule.start;
    document.getElementById('entry-end').value = schedule.end;
    document.getElementById('entry-label').value = schedule.label || '';
    document.getElementById('entry-status').value = schedule.status || '予定';
    document.getElementById('entry-memo').value = schedule.memo || '';
    document.getElementById('entry-schedule-id').value = schedule.scheduleId;
    document.getElementById('entry-updated-at').value = schedule.updatedAt || '';

    this.populateProcessSelect(schedule.processId);

    document.getElementById('modal-title').textContent = '工程編集';
    document.getElementById('btn-modal-delete').classList.remove('hidden');
    this.open();
  },

  open() {
    document.getElementById('modal-entry').classList.remove('hidden');
    // 日付設定の変更フラグをリセット
    DaySettingButtons.reset();
    // 日付設定ボタンを更新
    const startDate = document.getElementById('entry-start').value;
    if (startDate) {
      DaySettingButtons.updateButtons(startDate);
    }
  },

  close() {
    document.getElementById('modal-entry').classList.add('hidden');
    this.currentSchedule = null;
    this.isEditMode = false;
  },

  resetForm() {
    document.getElementById('entry-form').reset();
    document.getElementById('entry-schedule-id').value = '';
    document.getElementById('entry-updated-at').value = '';
  },

  populateProcessSelect(selectedId = '') {
    const select = document.getElementById('entry-process');
    const processes = Store.state.processes;

    let html = '<option value="">選択してください</option>';
    processes.forEach(process => {
      const selected = process.processId === selectedId ? 'selected' : '';
      const displayName = Store.getProcessDisplayName(process.processId);
      html += `<option value="${process.processId}" ${selected}>${Utils.escapeHtml(displayName)}</option>`;
    });
    html += '<option value="__new__">＋ 新しい工程を追加</option>';
    select.innerHTML = html;
  },

  validateProcess() {
    const processId = document.getElementById('entry-process').value;

    if (processId === '__new__') {
      // セレクトをリセットしてからProcessModalを開く
      document.getElementById('entry-process').value = '';
      ProcessModal.open((newProcess) => {
        // 追加成功時：工程Selectを再生成し、新規工程を自動選択
        this.populateProcessSelect(newProcess.processId);
        this.validateProcess(); // マイルストーンチェック等
      });
      return;
    }

    const process = Store.getProcessById(processId);
    if (!process) return;

    // マイルストーンの場合は終了日を開始日に合わせる
    if (process['種別(type)'] === 'milestone') {
      const start = document.getElementById('entry-start').value;
      document.getElementById('entry-end').value = start;
    }
  },

  validate() {
    const jobId = document.getElementById('entry-job-id').value;
    const processId = document.getElementById('entry-process').value;
    const start = document.getElementById('entry-start').value;
    const end = document.getElementById('entry-end').value;
    const label = document.getElementById('entry-label').value;
    const status = document.getElementById('entry-status').value;
    const memo = document.getElementById('entry-memo').value;

    if (!processId || processId === '__new__') {
      Utils.showToast('工程を選択してください', 'error');
      return null;
    }

    if (!start || !end) {
      Utils.showToast('期間を入力してください', 'error');
      return null;
    }

    if (start > end) {
      Utils.showToast('終了日は開始日以降にしてください', 'error');
      return null;
    }

    const process = Store.getProcessById(processId);
    if (process) {
      if (process['種別(type)'] === 'milestone' && start !== end) {
        Utils.showToast('マイルストーン工程は開始日と終了日を同じにしてください', 'error');
        return null;
      }
    }

    return {
      jobId,
      processId,
      start,
      end,
      label,
      status,
      memo
    };
  },

  save() {
    // 日付設定のみ変更された場合（工程未入力）は、バリデーションせずに閉じる
    const processId = document.getElementById('entry-process').value;
    if (DaySettingButtons.hasChanged && (!processId || processId === '__new__')) {
      // 日付設定は既に保存済みなので、モーダルを閉じるだけ
      this.close();
      return;
    }

    const payload = this.validate();
    if (!payload) return;

    if (this.isEditMode) {
      const scheduleId = document.getElementById('entry-schedule-id').value;
      // 楽観的更新
      Store.updateScheduleInStore(scheduleId, { ...payload, updatedAt: new Date().toISOString() });
      ChangeBuffer.add('schedule', 'upsert', scheduleId, payload, 'master');
      Utils.showToast('更新しました（保存待ち）', 'info');
    } else {
      // 新規作成：仮IDで楽観的更新
      const tempId = 'temp_' + Utils.generateId();
      const newSchedule = {
        scheduleId: tempId,
        ...payload,
        updatedAt: new Date().toISOString()
      };
      Store.addSchedule(newSchedule);
      ChangeBuffer.add('schedule', 'upsert', tempId, payload, 'master');
      Utils.showToast('登録しました（保存待ち）', 'info');
    }

    this.close();

    // JobDetailが開いている場合は再描画
    if (JobDetail.currentJobId) {
      JobDetail.render();
    }
  },

  delete() {
    if (!this.isEditMode || !this.currentSchedule) return;
    if (!confirm('この工程を削除しますか？')) return;

    const scheduleId = this.currentSchedule.scheduleId;

    // 楽観的削除
    Store.removeSchedule(scheduleId);
    ChangeBuffer.add('schedule', 'delete', scheduleId, {}, 'master');

    Utils.showToast('削除しました（保存待ち）', 'info');
    this.close();

    // JobDetailが開いている場合は再描画
    if (JobDetail.currentJobId) {
      JobDetail.render();
    }
  }
};

const TopMemoPanel = {
  _panelEl: null,
  _bodyEl: null,
  _listEl: null,
  _emptyEl: null,
  _countEl: null,
  _toggleBtn: null,

  init() {
    this._panelEl = document.getElementById('top-memo-panel');
    this._bodyEl = document.getElementById('top-memo-body');
    this._listEl = document.getElementById('top-memo-list');
    this._emptyEl = document.getElementById('top-memo-empty');
    this._countEl = document.getElementById('top-memo-count');
    this._toggleBtn = document.getElementById('top-memo-toggle');

    if (!this._panelEl) {
      console.warn('[TopMemoPanel] パネル要素が見つかりません');
      return;
    }

    this.setupEventListeners();

    // Storeの変更を監視（展開状態はStore初期値とloadBootstrapDataで管理）
    Store.subscribe(() => this.render());
  },

  setupEventListeners() {
    this._toggleBtn?.addEventListener('click', () => this.toggle());

    // 追加ボタン
    document.getElementById('top-memo-add')?.addEventListener('click', () => this.openEditModal(null));
    document.getElementById('top-memo-add-empty')?.addEventListener('click', () => this.openEditModal(null));

    // モーダル
    document.getElementById('top-memo-modal-close')?.addEventListener('click', () => this.closeEditModal());
    document.getElementById('btn-top-memo-cancel')?.addEventListener('click', () => this.closeEditModal());
    document.getElementById('btn-top-memo-save')?.addEventListener('click', () => this.saveFromModal());
    document.querySelector('#modal-top-memo .modal-backdrop')?.addEventListener('click', () => this.closeEditModal());
  },

  render() {
    const memos = Store.getTopMemos();
    const expanded = Store.state.topMemoExpanded;

    // メモ件数を更新
    if (this._countEl) {
      this._countEl.textContent = memos.length;
    }

    // 展開状態の反映
    this._panelEl?.classList.toggle('expanded', expanded);
    this._bodyEl?.classList.toggle('hidden', !expanded);

    // 箇条書きリストを描画
    if (this._listEl) {
      if (memos.length === 0) {
        this._listEl.innerHTML = '';
        this._listEl.classList.add('hidden');
        this._emptyEl?.classList.remove('hidden');
      } else {
        this._emptyEl?.classList.add('hidden');
        this._listEl.classList.remove('hidden');
        this._listEl.innerHTML = memos.map(memo => this.renderItem(memo)).join('');

        // 各行のイベントリスナーを設定
        this._listEl.querySelectorAll('.top-memo-item-btn.edit').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const memoId = e.currentTarget.dataset.memoId;
            this.openEditModal(memoId);
          });
        });
        this._listEl.querySelectorAll('.top-memo-item-btn.delete').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const memoId = e.currentTarget.dataset.memoId;
            this.deleteMemo(memoId);
          });
        });
      }
    }

    // 全画面対応：各ビューの高さ調整
    this.updateAllViewHeights(expanded);
  },

  /**
   * メモを1行形式でレンダリング
   * 形式: ・【見出し】 本文（改行は／に変換）
   */
  renderItem(memo) {
    const title = memo.title || '無題';
    // 本文の改行を「／」に変換して1行化
    const body = (memo.body || '').replace(/\r?\n/g, '／').trim();

    return `
      <li class="top-memo-item" data-memo-id="${memo.memoId}">
        <span class="top-memo-item-text">
          <span class="top-memo-item-bullet">・</span>
          <span class="top-memo-item-title">【${Utils.escapeHtml(title)}】</span>
          <span class="top-memo-item-body">${Utils.escapeHtml(body)}</span>
        </span>
        <span class="top-memo-item-actions">
          <button class="top-memo-item-btn edit" data-memo-id="${memo.memoId}" title="編集">✏</button>
          <button class="top-memo-item-btn delete" data-memo-id="${memo.memoId}" title="非表示">🗑</button>
        </span>
      </li>
    `;
  },

  toggle() {
    Store.toggleTopMemoExpanded();
  },

  updateAllViewHeights(expanded) {
    // 全てのビューの高さを調整
    const views = ['view-master', 'view-resource', 'view-weekly', 'view-travel', 'view-calendar', 'view-electrical'];

    requestAnimationFrame(() => {
      const panelHeight = expanded ? (this._panelEl?.offsetHeight || 0) : 0;

      views.forEach(viewId => {
        const viewEl = document.getElementById(viewId);
        if (!viewEl) return;

        // ガントスクロールコンテナを探す
        const scrollContainer = viewEl.querySelector('[id$="-v-scroll"], .resource-container, .weekly-view, .travel-plan-container');
        if (scrollContainer) {
          if (expanded && panelHeight > 0) {
            scrollContainer.style.height = `calc(100vh - 64px - ${panelHeight}px)`;
          } else {
            scrollContainer.style.height = '';
          }
        }
      });
    });
  },

  // モーダル関連
  openEditModal(memoId) {
    const modal = document.getElementById('modal-top-memo');
    const titleEl = document.getElementById('top-memo-modal-title');
    const idInput = document.getElementById('top-memo-edit-id');
    const titleInput = document.getElementById('top-memo-edit-title');
    const bodyInput = document.getElementById('top-memo-edit-body');

    if (memoId) {
      // 編集
      const memo = Store.getTopMemoById(memoId);
      if (!memo) return;
      titleEl.textContent = 'メモ編集';
      idInput.value = memoId;
      titleInput.value = memo.title || '';
      bodyInput.value = memo.body || '';
    } else {
      // 新規
      titleEl.textContent = '新規メモ';
      idInput.value = '';
      titleInput.value = '';
      bodyInput.value = '';
    }

    modal?.classList.remove('hidden');
  },

  closeEditModal() {
    document.getElementById('modal-top-memo')?.classList.add('hidden');
  },

  /**
   * モーダルから保存（A+C+B統合：即UI反映→ChangeBuffer経由で保存）
   */
  saveFromModal() {
    const idInput = document.getElementById('top-memo-edit-id');
    const titleInput = document.getElementById('top-memo-edit-title');
    const bodyInput = document.getElementById('top-memo-edit-body');

    const existingId = idInput.value || null;
    const title = titleInput.value.trim();
    const body = bodyInput.value;

    if (!title) {
      Utils.showToast('見出しを入力してください', 'error');
      return;
    }

    // A: 即時UI反映（楽観的更新）
    const isNew = !existingId;
    const memoId = isNew ? `temp_${Utils.generateId()}` : existingId;

    const optimisticMemo = {
      memoId,
      scope: 'global',
      title,
      body,
      isActive: true,
      sortOrder: isNew ? (this._getMaxSortOrder() + 10) : (Store.getTopMemoById(existingId)?.sortOrder || 0),
      updatedAt: new Date().toISOString(),
      updatedBy: 'user'
    };

    // Store に即反映
    Store.addOrReplaceTopMemo(optimisticMemo);

    // ChangeBuffer に追加（B: 自動保存対応）
    ChangeBuffer.add('topMemo', 'upsert', memoId, { title, body }, 'topMemo');

    this.closeEditModal();
    console.log(`[TopMemoPanel] ${isNew ? '新規作成' : '更新'}: ${memoId}`);
  },

  /**
   * メモ削除（A+C+B統合：即UI反映→ChangeBuffer経由で保存）
   */
  deleteMemo(memoId) {
    if (!confirm('このメモを非表示にしますか？')) return;

    // A: 即時UI反映（楽観的削除）
    Store.removeTopMemo(memoId);

    // ChangeBuffer に追加（B: 自動保存対応）
    ChangeBuffer.add('topMemo', 'delete', memoId, { isActive: false }, 'topMemo');

    console.log(`[TopMemoPanel] 削除: ${memoId}`);
  },

  /**
   * 現在の最大sortOrderを取得
   */
  _getMaxSortOrder() {
    const memos = Store.getTopMemos();
    if (memos.length === 0) return 0;
    return Math.max(...memos.map(m => m.sortOrder || 0));
  }
};

// ProcessModal - 新規工程追加モーダル
// ========================================

const ProcessModal = {
  _onSuccess: null, // 追加成功時のコールバック

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {
    document.getElementById('process-modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-process-cancel')?.addEventListener('click', () => this.close());
    document.getElementById('btn-process-save')?.addEventListener('click', () => this.save());
    document.querySelector('#modal-process .modal-backdrop')?.addEventListener('click', () => this.close());
  },

  open(onSuccess = null) {
    this._onSuccess = onSuccess;

    // フォームリセット
    document.getElementById('process-form').reset();

    // 表示順のデフォルト値（既存最大order + 10）
    const maxOrder = Math.max(
      ...Store.state.processes.map(p => parseInt(p['表示順(order)']) || 0),
      0
    );
    document.getElementById('process-order').value = maxOrder + 10;

    // デフォルト色
    document.getElementById('process-color').value = '#4A90E2';

    document.getElementById('modal-process').classList.remove('hidden');
    document.getElementById('process-name').focus();
  },

  close() {
    document.getElementById('modal-process').classList.add('hidden');
    this._onSuccess = null;
  },

  validate() {
    const name = document.getElementById('process-name').value.trim();
    const type = document.getElementById('process-type').value;
    const order = parseInt(document.getElementById('process-order').value, 10);
    const colorHex = document.getElementById('process-color').value;
    const isWeekly = document.getElementById('process-isweekly').checked;
    const memo = document.getElementById('process-memo').value.trim();

    if (!name) {
      Utils.showToast('工程名を入力してください', 'error');
      document.getElementById('process-name').focus();
      return null;
    }

    if (name.length > 60) {
      Utils.showToast('工程名は60文字以内で入力してください', 'error');
      document.getElementById('process-name').focus();
      return null;
    }

    // 重複チェック（クライアント側）
    const duplicate = Store.state.processes.find(p => (p['工程名'] || '').trim() === name);
    if (duplicate) {
      Utils.showToast('同じ工程名が既に存在します', 'error');
      document.getElementById('process-name').focus();
      return null;
    }

    if (!order || order < 1) {
      Utils.showToast('表示順は1以上の数値を入力してください', 'error');
      document.getElementById('process-order').focus();
      return null;
    }

    if (!/^#[0-9A-Fa-f]{6}$/.test(colorHex)) {
      Utils.showToast('工程色が不正です', 'error');
      return null;
    }

    return {
      processName: name,
      type,
      order,
      colorHex,
      isWeekly,
      isActive: true,
      memo
    };
  },

  async save() {
    const payload = this.validate();
    if (!payload) return;

    const saveBtn = document.getElementById('btn-process-save');
    saveBtn.disabled = true;
    saveBtn.textContent = '追加中...';

    try {
      const result = await API.call('api_createProcess', payload);
      console.log('[ProcessModal] Created:', result);

      // Storeに追加（order順でソート）
      Store.addProcess(result);

      Utils.showToast('工程を追加しました', 'success');

      // 成功コールバック（工程Selectに自動選択など）
      if (this._onSuccess && typeof this._onSuccess === 'function') {
        this._onSuccess(result);
      }

      this.close();
    } catch (error) {
      console.error('[ProcessModal] Save failed:', error);
      Utils.showToast('工程追加に失敗しました: ' + error.message, 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '追加';
    }
  }
};

const JobModal = {

  CONFIRM_DELETE_TEXT: '削除OK',

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {

    document.getElementById('btn-job-modal-cancel')?.addEventListener('click', () => this.close());
    document.querySelector('#modal-job .modal-backdrop')?.addEventListener('click', () => this.close());

    document.getElementById('job-delete-confirm-close')?.addEventListener('click', () => this.hideDeleteConfirm());
    document.getElementById('btn-job-delete-cancel')?.addEventListener('click', () => this.hideDeleteConfirm());
    document.querySelector('#modal-job-delete-confirm .modal-backdrop')?.addEventListener('click', () => this.hideDeleteConfirm());
    document.getElementById('btn-job-delete-execute')?.addEventListener('click', () => this.executeDelete());
    document.getElementById('job-delete-confirm-input')?.addEventListener('input', (e) => {
      const btn = document.getElementById('btn-job-delete-execute');
      // trim()で前後空白のみ許可、完全一致で有効化
      if (btn) btn.disabled = e.target.value.trim() !== this.CONFIRM_DELETE_TEXT;
    });

    // 工番マスター検索
    const searchInput = document.getElementById('job-master-search');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => this.onSearchInput(e.target.value));
      searchInput.addEventListener('focus', () => this.showSearchResults());
      // クリック外で閉じる
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#job-master-search-area')) {
          this.hideSearchResults();
        }
      });
    }
  },

  // 担当者セレクトを生成
  populatePersonSelects(mainPersonId = '', subPersonId = '') {
    const people = Store.state.people;
    const mainSelect = document.getElementById('job-main-person');
    const subSelect = document.getElementById('job-sub-person');

    if (!mainSelect || !subSelect) return;

    let optionsHtml = '<option value="">（未設定）</option>';
    people.forEach(person => {
      const color = person['作業者色(colorHex)'] || '#6b7280';
      optionsHtml += `<option value="${person.personId}" style="border-left: 4px solid ${color};">
        ${Utils.escapeHtml(person['氏名'])} (${Utils.escapeHtml(person['部署/区分'] || '')})
      </option>`;
    });

    mainSelect.innerHTML = optionsHtml;
    subSelect.innerHTML = optionsHtml;

    if (mainPersonId) mainSelect.value = mainPersonId;
    if (subPersonId) subSelect.value = subPersonId;
  },

  // 工番マスター検索入力
  onSearchInput(query) {
    clearTimeout(this.searchDebounceTimer);
    this.searchDebounceTimer = setTimeout(() => {
      this.searchJobMaster(query);
    }, 300);
  },

  // 工番マスター検索実行
  // 検索対象: 工番 / 受注先 / 品名
  searchJobMaster(query) {
    const results = document.getElementById('job-master-results');
    if (!results) return;

    const jobMaster = Store.state.jobMaster;
    if (!jobMaster || jobMaster.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm text-gray-500">工番マスターが未同期です</div>';
      results.classList.remove('hidden');
      return;
    }

    let filtered = jobMaster;
    if (query && query.trim()) {
      const normalizedQuery = Utils.normalizeText(query);
      filtered = jobMaster.filter(item => {
        // 工番・受注先・品名を連結して正規化（外部シートの列名に合わせる）
        const searchKey = Utils.normalizeText(
          String(item['工番'] || '') + ' ' +
          String(item['受注先'] || '') + ' ' +
          String(item['品名'] || '')
        );
        return searchKey.includes(normalizedQuery);
      });
    }

    // 上位20件に制限
    filtered = filtered.slice(0, 20);

    if (filtered.length === 0) {
      results.innerHTML = '<div class="p-3 text-sm text-gray-500">該当する工番が見つかりません</div>';
    } else {
      let html = '';
      filtered.forEach(item => {
        // 6項目すべてをdata属性で渡す（onclick属性のエスケープ問題を回避）
        const dataAttrs = `
          data-jobno="${Utils.escapeHtml(item['工番'] || '')}"
          data-customer="${Utils.escapeHtml(item['受注先'] || '')}"
          data-product="${Utils.escapeHtml(item['品名'] || '')}"
          data-destination="${Utils.escapeHtml(item['納入先'] || '')}"
          data-destination-address="${Utils.escapeHtml(item['納入先住所'] || '')}"
          data-quantity="${Utils.escapeHtml(String(item['数量'] || ''))}"
        `;
        html += `
          <div class="job-master-result-item" ${dataAttrs} onclick="JobModal.selectJobMasterItemFromElement(this)">
            <div class="job-master-result-jobno">${Utils.escapeHtml(item['工番'] || '-')}</div>
            <div class="job-master-result-customer">${Utils.escapeHtml(item['受注先'] || '-')}</div>
            <div class="job-master-result-product">${Utils.escapeHtml(item['品名'] || '-')}</div>
            <div class="job-master-result-extra">
              <span class="job-master-result-destination">${Utils.escapeHtml(item['納入先'] || '-')}</span>
              <span class="job-master-result-quantity">${Utils.escapeHtml(String(item['数量'] || '-'))}</span>
            </div>
          </div>
        `;
      });
      results.innerHTML = html;
    }

    results.classList.remove('hidden');
  },

  // 工番マスター選択（要素から値を取得）
  selectJobMasterItemFromElement(element) {
    const jobNo = element.dataset.jobno || '';
    const customer = element.dataset.customer || '';
    const product = element.dataset.product || '';
    const destination = element.dataset.destination || '';
    const destinationAddress = element.dataset.destinationAddress || '';
    const quantity = element.dataset.quantity || '';

    // モーダルの各項目に自動入力
    document.getElementById('job-jobno').value = jobNo;
    document.getElementById('job-customer').value = customer;
    document.getElementById('job-product').value = product;
    document.getElementById('job-destination').value = destination;
    document.getElementById('job-destination-address').value = destinationAddress;
    document.getElementById('job-qty').value = quantity;

    this.hideSearchResults();
    document.getElementById('job-master-search').value = '';
    Utils.showToast('工番マスターから6項目を入力しました', 'info');
  },

  // 工番マスター選択（旧互換: 3項目のみ）
  selectJobMasterItem(jobNo, customer, product) {
    document.getElementById('job-jobno').value = jobNo;
    document.getElementById('job-customer').value = customer;
    document.getElementById('job-product').value = product;
    this.hideSearchResults();
    document.getElementById('job-master-search').value = '';
    Utils.showToast('工番マスターから入力しました', 'info');
  },

  showSearchResults() {
    const query = document.getElementById('job-master-search')?.value || '';
    this.searchJobMaster(query);
  },

  hideSearchResults() {
    const results = document.getElementById('job-master-results');
    if (results) results.classList.add('hidden');
  },

  openNew() {
    this.isEditMode = false;
    this.currentJob = null;
    this.resetForm();
    this.populatePersonSelects();
    // pending PDF をリセット
    this.pendingPdfFiles = { order: null, instruction: null };
    document.getElementById('job-modal-title').textContent = '工番登録';
    // 新規時はマスター検索エリアを表示
    const searchArea = document.getElementById('job-master-search-area');
    if (searchArea) searchArea.classList.remove('hidden');
    // 新規時は完了・再開・削除ボタンを非表示
    document.getElementById('btn-job-modal-close')?.classList.add('hidden');
    document.getElementById('btn-job-modal-reopen')?.classList.add('hidden');
    document.getElementById('btn-job-modal-delete')?.classList.add('hidden');
    // PDF セクションを表示（新規モードでも選択可能・保存後に自動アップロード）
    document.getElementById('job-pdf-section')?.classList.remove('hidden');
    this.setPdfSectionForNewMode();
    this.open();
  },

  openEdit(job) {
    this.isEditMode = true;
    this.currentJob = job;
    this.resetForm();
    this.populatePersonSelects(job.mainPersonId || '', job.subPersonId || '');
    // pending PDF をリセット（編集モードでは即時アップロード）
    this.pendingPdfFiles = { order: null, instruction: null };

    document.getElementById('job-jobno').value = job['工番'] || '';
    document.getElementById('job-customer').value = job['顧客名'] || '';
    document.getElementById('job-product').value = job['設備/製品名'] || '';
    document.getElementById('job-qty').value = job['台数'] || '';
    document.getElementById('job-destination').value = job['納入先'] || '';
    document.getElementById('job-destination-address').value = job['納入先住所'] || '';
    document.getElementById('job-ship-date').value = job['出荷予定日'] || '';
    document.getElementById('job-draw-date').value = job['出図予定日'] || '';
    document.getElementById('job-status-text').value = job['重要メモ'] || '';
    document.getElementById('job-job-id').value = job.jobId || '';
    document.getElementById('job-updated-at').value = job.updatedAt || '';

    // デバッグログ: 編集モード開始
    console.log('[JobModal.openEdit] jobId:', job.jobId, '工番:', job['工番']);

    document.getElementById('job-modal-title').textContent = '工番編集';
    // 編集時はマスター検索エリアを非表示
    const searchArea = document.getElementById('job-master-search-area');
    if (searchArea) searchArea.classList.add('hidden');

    // 完了・再開・削除ボタンの表示制御
    const isClosed = job.status === 'closed' || job.isHidden === true;
    document.getElementById('btn-job-modal-close')?.classList.toggle('hidden', isClosed);
    document.getElementById('btn-job-modal-reopen')?.classList.toggle('hidden', !isClosed);
    document.getElementById('btn-job-modal-delete')?.classList.remove('hidden');

    // PDF セクションを表示（編集モードでは有効化）
    document.getElementById('job-pdf-section')?.classList.remove('hidden');
    this.setPdfSectionDisabled(false);
    this.loadPdfStatus(job['工番']);

    this.open();
  },

  open() {
    document.getElementById('modal-job').classList.remove('hidden');
    setTimeout(() => {
      if (!this.isEditMode) {
        document.getElementById('job-master-search')?.focus();
      } else {
        document.getElementById('job-jobno')?.focus();
      }
    }, 100);
  },

  close() {
    document.getElementById('modal-job').classList.add('hidden');
    this.currentJob = null;
    this.isEditMode = false;
    this.hideSearchResults();
  },

  // 工番を完了（非表示）にする
  closeJob() {
    if (!this.currentJob) return;

    const jobId = this.currentJob.jobId;
    const jobNo = this.currentJob['工番'];

    if (!confirm(`工番「${jobNo}」を完了（非表示）にしますか？\n完了した工番は一覧から非表示になります。`)) {
      return;
    }

    // A: UIを即時更新
    Store.updateJobStatus(jobId, 'closed', true);
    this.close();
    Utils.showToast(`工番「${jobNo}」を完了にしました`, 'success');

    // C: ChangeBufferに追加（B: 自動保存へ）
    ChangeBuffer.add('job', 'close', jobId, {}, 'master');
  },

  // 工番の完了を解除（再開）
  reopenJob() {
    if (!this.currentJob) return;

    const jobId = this.currentJob.jobId;
    const jobNo = this.currentJob['工番'];

    // A: UIを即時更新
    Store.updateJobStatus(jobId, 'active', false);
    this.close();
    Utils.showToast(`工番「${jobNo}」を再開しました`, 'success');

    // C: ChangeBufferに追加（B: 自動保存へ）
    ChangeBuffer.add('job', 'reopen', jobId, {}, 'master');
  },

  // 削除確認モーダルを表示
  showDeleteConfirm() {
    if (!this.currentJob) return;

    const jobNo = this.currentJob['工番'];
    const product = this.currentJob['設備/製品名'] || '';

    document.getElementById('job-delete-target-name').textContent = `${jobNo} ${product}`;
    document.getElementById('job-delete-confirm-input').value = '';
    document.getElementById('btn-job-delete-execute').disabled = true;
    document.getElementById('modal-job-delete-confirm').classList.remove('hidden');
  },

  // 削除確認モーダルを閉じる
  hideDeleteConfirm() {
    document.getElementById('modal-job-delete-confirm').classList.add('hidden');
  },

  // 削除を実行
  executeDelete() {
    if (!this.currentJob) return;

    // 二重防御: 入力値が一致しない場合は削除しない
    const confirmInput = document.getElementById('job-delete-confirm-input');
    if (!confirmInput || confirmInput.value.trim() !== this.CONFIRM_DELETE_TEXT) {
      console.warn('[JobModal.executeDelete] Blocked: confirm text mismatch');
      return;
    }

    const jobId = this.currentJob.jobId;
    const jobNo = this.currentJob['工番'];

    // A: UIを即時更新（削除）
    Store.deleteJob(jobId);
    this.hideDeleteConfirm();
    this.close();
    Utils.showToast(`工番「${jobNo}」と関連データを削除しました`, 'success');

    // C: ChangeBufferに追加（B: 自動保存へ）
    ChangeBuffer.add('job', 'delete', jobId, {}, 'master');
  },

  resetForm() {
    document.getElementById('job-form').reset();
    document.getElementById('job-job-id').value = '';
    document.getElementById('job-updated-at').value = '';
    const searchInput = document.getElementById('job-master-search');
    if (searchInput) searchInput.value = '';
    this.hideSearchResults();
  },

  validate() {
    const jobno = document.getElementById('job-jobno').value.trim();
    const customer = document.getElementById('job-customer').value.trim();
    const product = document.getElementById('job-product').value.trim();
    const qty = document.getElementById('job-qty').value.trim();
    const destination = document.getElementById('job-destination').value.trim();
    const destinationAddress = document.getElementById('job-destination-address').value.trim();
    const shipDate = document.getElementById('job-ship-date').value;
    const drawDate = document.getElementById('job-draw-date').value;
    const statusText = document.getElementById('job-status-text').value.trim();
    const mainPersonId = document.getElementById('job-main-person')?.value || '';
    const subPersonId = document.getElementById('job-sub-person')?.value || '';

    if (!jobno) {
      Utils.showToast('工番を入力してください', 'error');
      document.getElementById('job-jobno').focus();
      return null;
    }

    if (!customer) {
      Utils.showToast('顧客名を入力してください', 'error');
      document.getElementById('job-customer').focus();
      return null;
    }

    if (!product) {
      Utils.showToast('設備/製品名を入力してください', 'error');
      document.getElementById('job-product').focus();
      return null;
    }

    if (!qty) {
      Utils.showToast('台数を入力してください', 'error');
      document.getElementById('job-qty').focus();
      return null;
    }

    return {
      '工番': jobno,
      '顧客名': customer,
      '設備/製品名': product,
      '台数': qty,
      '納入先': destination,
      '納入先住所': destinationAddress,
      '出荷予定日': shipDate,
      '出図予定日': drawDate,
      '重要メモ': statusText,
      'mainPersonId': mainPersonId,
      'subPersonId': subPersonId,
      '状態': '未着手'
    };
  },

  async save() {
    const payload = this.validate();
    if (!payload) return;

    const jobNo = payload['工番'];

    // デバッグログ: 保存開始
    console.log('[JobModal.save] mode:', this.isEditMode ? 'edit' : 'new');

    if (this.isEditMode) {
      const jobId = document.getElementById('job-job-id').value;

      // 二重生成対策: jobIdが空または無効な場合はエラー
      if (!jobId || jobId.trim() === '') {
        console.error('[JobModal.save] ERROR: jobId is empty in edit mode!');
        Utils.showToast('工番IDが不正です。画面を更新してください。', 'error');
        return;
      }

      // デバッグログ
      console.log('[JobModal.save] edit: jobId=', jobId, 'API=updateJob');

      // 編集時は状態を保持
      payload['状態'] = this.currentJob?.['状態'] || '未着手';
      // 楽観的更新
      Store.updateJobInStore(jobId, { ...payload, updatedAt: new Date().toISOString() });
      ChangeBuffer.add('job', 'upsert', jobId, payload, 'master');
      Utils.showToast('工番を更新しました（保存待ち）', 'info');
    } else {
      // 新規作成：仮IDで楽観的更新
      const tempId = 'temp_' + Utils.generateId();

      // デバッグログ
      console.log('[JobModal.save] new: tempId=', tempId, 'API=createJob');

      const newJob = {
        jobId: tempId,
        ...payload,
        updatedAt: new Date().toISOString()
      };
      Store.addJob(newJob);
      ChangeBuffer.add('job', 'upsert', tempId, payload, 'master');

      // 新規モード時のpending PDFがあれば、保存完了後にアップロード
      if (this.pendingPdfFiles.order || this.pendingPdfFiles.instruction) {
        Utils.showToast('工番を登録中...', 'info');
        // ChangeBufferを即時フラッシュしてjobIdを確定
        try {
          const flushResult = await ChangeBuffer.flush('new_job_pdf');
          if (flushResult.ok) {
            // 工番が保存された後、PDFをアップロード
            await this.uploadPendingPdfs(jobNo);
            Utils.showToast('工番とPDFを登録しました', 'success');
          } else {
            Utils.showToast('工番の登録に失敗しました', 'error');
          }
        } catch (error) {
          console.error('[JobModal.save] Failed to save and upload PDF:', error);
          Utils.showToast('保存に失敗しました: ' + error.message, 'error');
        }
      } else {
        Utils.showToast('工番を登録しました（保存待ち）', 'info');
      }
    }

    this.close();
  },

  /**
   * pending PDFをアップロード（新規モード用）
   * @param {string} jobNo - 工番
   */
  async uploadPendingPdfs(jobNo) {
    const pending = this.pendingPdfFiles;

    if (pending.order) {
      console.log('[JobModal] Uploading pending order PDF:', pending.order.fileName);
      try {
        const result = await API.uploadJobPdf(jobNo, 'order', pending.order.fileName, pending.order.base64);
        const currentInfo = Store.getJobPdfInfo(jobNo) || { order: null, instruction: null };
        currentInfo.order = result;
        Store.setJobPdfInfo(jobNo, currentInfo);
      } catch (error) {
        console.error('[JobModal] Failed to upload order PDF:', error);
        Utils.showToast('受注表PDFのアップロードに失敗しました', 'error');
      }
    }

    if (pending.instruction) {
      console.log('[JobModal] Uploading pending instruction PDF:', pending.instruction.fileName);
      try {
        const result = await API.uploadJobPdf(jobNo, 'instruction', pending.instruction.fileName, pending.instruction.base64);
        const currentInfo = Store.getJobPdfInfo(jobNo) || { order: null, instruction: null };
        currentInfo.instruction = result;
        Store.setJobPdfInfo(jobNo, currentInfo);
      } catch (error) {
        console.error('[JobModal] Failed to upload instruction PDF:', error);
        Utils.showToast('工番別指示書PDFのアップロードに失敗しました', 'error');
      }
    }

    // pending をクリア
    this.pendingPdfFiles = { order: null, instruction: null };

    // ガントビューを再描画
    if (typeof Gantt !== 'undefined') {
      Gantt.render();
    }
  },

  // ========== PDF関連 ==========

  /**
   * PDFセクション全体を有効/無効化
   * @param {boolean} disabled
   * @param {string} message - disabled時のステータスメッセージ
   */
  setPdfSectionDisabled(disabled, message = '') {
    const section = document.getElementById('job-pdf-section');
    if (!section) return;

    // アップロードボタンを有効/無効化
    const uploadBtns = section.querySelectorAll('button:not([id*="delete"])');
    uploadBtns.forEach(btn => {
      if (btn.textContent.includes('選択')) {
        btn.disabled = disabled;
        btn.style.opacity = disabled ? '0.5' : '1';
      }
    });

    // ステータス表示
    if (disabled && message) {
      document.getElementById('job-order-pdf-status').textContent = message;
      document.getElementById('job-order-pdf-status').className = 'pdf-status no-file';
      document.getElementById('job-instruction-pdf-status').textContent = message;
      document.getElementById('job-instruction-pdf-status').className = 'pdf-status no-file';
    }

    // 削除ボタンを非表示
    document.getElementById('btn-order-pdf-delete')?.classList.add('hidden');
    document.getElementById('btn-instruction-pdf-delete')?.classList.add('hidden');
  },

  /**
   * 新規モード用のPDFセクション設定
   * ファイル選択は可能、保存後に自動アップロード
   */
  setPdfSectionForNewMode() {
    const section = document.getElementById('job-pdf-section');
    if (!section) return;

    // 選択ボタンを有効化
    const uploadBtns = section.querySelectorAll('button:not([id*="delete"])');
    uploadBtns.forEach(btn => {
      if (btn.textContent.includes('選択')) {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });

    // ステータス表示（未選択状態）
    const orderStatus = document.getElementById('job-order-pdf-status');
    const instructionStatus = document.getElementById('job-instruction-pdf-status');
    if (orderStatus) {
      orderStatus.textContent = '（保存後に自動アップロード）';
      orderStatus.className = 'pdf-status no-file';
    }
    if (instructionStatus) {
      instructionStatus.textContent = '（保存後に自動アップロード）';
      instructionStatus.className = 'pdf-status no-file';
    }

    // 削除ボタンを非表示
    document.getElementById('btn-order-pdf-delete')?.classList.add('hidden');
    document.getElementById('btn-instruction-pdf-delete')?.classList.add('hidden');
  },

  /**
   * PDF情報を読み込んで表示
   * @param {string} jobNo
   */
  async loadPdfStatus(jobNo) {
    if (!jobNo) return;
    try {
      const pdfInfo = await Store.loadJobPdfInfo(jobNo);
      this.updatePdfStatusUI('order', pdfInfo?.order);
      this.updatePdfStatusUI('instruction', pdfInfo?.instruction);
    } catch (error) {
      console.error('Failed to load PDF status:', error);
    }
  },

  /**
   * PDF状態UIを更新
   * @param {string} pdfType - 'order' | 'instruction'
   * @param {Object|null} pdfData - { fileId, fileName, url } or null
   */
  updatePdfStatusUI(pdfType, pdfData) {
    const statusEl = document.getElementById(`job-${pdfType}-pdf-status`);
    const deleteBtn = document.getElementById(`btn-${pdfType}-pdf-delete`);

    if (pdfData && pdfData.fileId) {
      if (statusEl) {
        statusEl.textContent = pdfData.fileName || '登録済み';
        statusEl.className = 'pdf-status has-file';
      }
      if (deleteBtn) deleteBtn.classList.remove('hidden');
    } else {
      if (statusEl) {
        statusEl.textContent = '未登録';
        statusEl.className = 'pdf-status no-file';
      }
      if (deleteBtn) deleteBtn.classList.add('hidden');
    }
  },

  /**
   * PDF状態をリセット
   * @param {string} pdfType
   */
  resetPdfStatus(pdfType) {
    const statusEl = document.getElementById(`job-${pdfType}-pdf-status`);
    const deleteBtn = document.getElementById(`btn-${pdfType}-pdf-delete`);
    const inputEl = document.getElementById(`job-${pdfType}-pdf-input`);

    if (statusEl) {
      statusEl.textContent = '未登録';
      statusEl.className = 'pdf-status no-file';
    }
    if (deleteBtn) {
      deleteBtn.classList.add('hidden');
    }
    if (inputEl) {
      inputEl.value = '';
    }
  },

  /**
   * PDFファイル選択時
   * - 新規モード: pendingとして保存（保存後にアップロード）
   * - 編集モード: 即座にアップロード
   * @param {string} pdfType
   * @param {HTMLInputElement} input
   */
  async onPdfSelected(pdfType, input) {
    const file = input.files?.[0];
    if (!file) return;

    // ファイルサイズチェック (10MB制限)
    const maxSize = 10 * 1024 * 1024;
    if (file.size > maxSize) {
      Utils.showToast('ファイルサイズが大きすぎます（10MB以下）', 'error');
      input.value = '';
      return;
    }

    // PDFかチェック
    if (!file.type.includes('pdf')) {
      Utils.showToast('PDFファイルを選択してください', 'error');
      input.value = '';
      return;
    }

    const jobNo = document.getElementById('job-jobno').value;
    if (!jobNo) {
      Utils.showToast('工番を入力してからPDFを選択してください', 'error');
      input.value = '';
      return;
    }

    // ファイルをBase64に変換
    const base64Data = await this.fileToBase64(file);

    // 新規モードの場合: pendingとして保存（保存後にアップロード）
    if (!this.isEditMode) {
      this.pendingPdfFiles[pdfType] = {
        file: file,
        base64: base64Data,
        fileName: file.name
      };

      // UI更新（pending状態表示）
      const statusEl = document.getElementById(`job-${pdfType}-pdf-status`);
      if (statusEl) {
        statusEl.textContent = `${file.name}（保存時にアップロード）`;
        statusEl.className = 'pdf-status pending';
      }

      const typeName = pdfType === 'order' ? '受注表' : '工番別指示書';
      Utils.showToast(`${typeName}を選択しました。保存時に自動アップロードされます`, 'info');
      input.value = '';
      return;
    }

    // 編集モードの場合: 即座にアップロード
    const statusEl = document.getElementById(`job-${pdfType}-pdf-status`);
    if (statusEl) {
      statusEl.textContent = 'アップロード中...';
      statusEl.className = 'pdf-status uploading';
    }

    try {
      // アップロード実行
      const result = await API.uploadJobPdf(jobNo, pdfType, file.name, base64Data);

      // Store更新
      const currentInfo = Store.getJobPdfInfo(jobNo) || { order: null, instruction: null };
      currentInfo[pdfType] = result;
      Store.setJobPdfInfo(jobNo, currentInfo);

      // UI更新
      this.updatePdfStatusUI(pdfType, result);
      Utils.showToast('PDFをアップロードしました', 'success');

      // ガントビューを再描画（PDFボタン更新のため）
      if (typeof Gantt !== 'undefined') {
        Gantt.render();
      }
    } catch (error) {
      console.error('PDF upload failed:', error);
      Utils.showToast('アップロードに失敗しました: ' + error.message, 'error');
      this.resetPdfStatus(pdfType);
    }

    input.value = '';
  },

  /**
   * PDFを削除
   * @param {string} pdfType
   */
  async deletePdf(pdfType) {
    const jobNo = document.getElementById('job-jobno').value;
    if (!jobNo) return;

    const typeName = pdfType === 'order' ? '受注表' : '工番別指示書';
    if (!confirm(`${typeName}を削除しますか？`)) return;

    try {
      Utils.setLoading(true);
      await API.deleteJobPdf(jobNo, pdfType);

      // Store更新
      const currentInfo = Store.getJobPdfInfo(jobNo) || { order: null, instruction: null };
      currentInfo[pdfType] = null;
      Store.setJobPdfInfo(jobNo, currentInfo);

      // UI更新
      this.resetPdfStatus(pdfType);
      Utils.showToast('PDFを削除しました', 'success');
      Utils.setLoading(false);

      // ガントビューを再描画
      if (typeof Gantt !== 'undefined') {
        Gantt.render();
      }
    } catch (error) {
      Utils.setLoading(false);
      console.error('PDF delete failed:', error);
      Utils.showToast('削除に失敗しました: ' + error.message, 'error');
    }
  },

  /**
   * ファイルをBase64に変換
   * @param {File} file
   * @returns {Promise<string>}
   */
  fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // data:application/pdf;base64,XXXX から XXXX 部分を抽出
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
};

    document.getElementById('people-edit-view').classList.remove('hidden');
    this.clearForm();
  },

  openEdit(personId) {
    const person = Store.getPersonById(personId);
    if (!person) {
      Utils.showToast('担当者が見つかりません', 'error');
      return;
    }
    this.currentPerson = person;
    this.isEditMode = true;
    document.getElementById('people-edit-title').textContent = '担当者を編集';
    document.getElementById('people-list-view').classList.add('hidden');
    document.getElementById('people-edit-view').classList.remove('hidden');
    this.populateForm(person);
  },

  backToList() {
    document.getElementById('people-list-view').classList.remove('hidden');
    document.getElementById('people-edit-view').classList.add('hidden');
    this.renderList();
  },

  clearForm() {
    document.getElementById('person-name').value = '';
    document.getElementById('person-department').value = '';
    document.getElementById('person-color').value = '#2563EB';
    document.getElementById('person-color-text').value = '#2563EB';
    document.getElementById('person-active').checked = true;
    document.getElementById('person-note').value = '';
    document.getElementById('person-id-display').textContent = '（新規）';
  },

  populateForm(person) {
    document.getElementById('person-name').value = person['氏名'] || '';
    document.getElementById('person-department').value = person['部署/区分'] || '';
    const color = Utils.normalizeColor(person['作業者色(colorHex)']) || '#6B7280';
    document.getElementById('person-color').value = color;
    document.getElementById('person-color-text').value = color;
    const isActive = person['有効(isActive)'] === true || person['有効(isActive)'] === 'TRUE';
    document.getElementById('person-active').checked = isActive;
    document.getElementById('person-note').value = person['備考'] || '';
    document.getElementById('person-id-display').textContent = person.personId;
  },

  syncColorInputs(source) {
    if (source === 'picker') {
      const value = document.getElementById('person-color').value;
      document.getElementById('person-color-text').value = value.toUpperCase();
    } else {
      const value = document.getElementById('person-color-text').value;
      const normalized = Utils.normalizeColor(value);
      if (normalized) {
        document.getElementById('person-color').value = normalized;
        document.getElementById('person-color-text').value = normalized;
      }
    }
  },

  async save() {
    const name = document.getElementById('person-name').value.trim();
    if (!name) {
      Utils.showToast('氏名を入力してください', 'error');
      return;
    }

    const colorText = document.getElementById('person-color-text').value;
    const color = Utils.normalizeColor(colorText);
    if (!color) {
      Utils.showToast('有効な色を入力してください（例: #2563EB）', 'error');
      return;
    }

    const payload = {
      '氏名': name,
      '部署/区分': document.getElementById('person-department').value.trim(),
      '作業者色(colorHex)': color,
      '有効(isActive)': document.getElementById('person-active').checked,
      '備考': document.getElementById('person-note').value.trim()
    };

    try {
      Utils.setLoading(true);
      let result;
      if (this.isEditMode && this.currentPerson) {
        result = await API.updatePerson(
          this.currentPerson.personId,
          payload,
          this.currentPerson.updatedAt
        );
        // Store を更新
        Store.updatePersonInStore(result.personId, result);
        Utils.showToast('担当者を更新しました', 'success');
      } else {
        result = await API.createPerson(payload);
        Store.addPerson(result);
        Utils.showToast('担当者を追加しました', 'success');
      }
      this.backToList();
    } catch (error) {
      console.error('Save person error:', error);
      Utils.showToast(error.message || '保存に失敗しました', 'error');
    } finally {
      Utils.setLoading(false);
    }
  },

  setupEventListeners() {
    // 色ピッカー同期
    document.getElementById('person-color')?.addEventListener('input', () => {
      this.syncColorInputs('picker');
    });
    document.getElementById('person-color-text')?.addEventListener('change', () => {
      this.syncColorInputs('text');
    });
  }
};

const JobDetail = {

    viewMode: 'daily',
    cellWidth: 24,         // 日次セル幅
    weeklyCellWidth: 40,   // 週次セル幅（1週間 = 1セル）
    rowHeight: 32,
    hideUnusedProcesses: true,  // デフォルトで未使用工程を隠す
    showPrintBoundaries: false, // 印刷境界線表示
    paperSize: 'a4',           // 用紙サイズ: 'a4' or 'a3'
    exportTheme: 'color'       // 出力テーマ: 'color' or 'mono_navy'(黒一色)
  },

  // 黒一色テーマ用色定義（GAS側で使用、フロント参照用）
  monoBlackTheme: { black: '#333333' },

  // 工番別の工程表示順（jobId -> [{processId, orderIndex}]）
  jobProcessLayouts: {},

  rowDragState: {

  },

  // 用紙サイズ定義（横向き、マージン考慮）
  // A4横: 297mm x 210mm → 実効幅約250mm, 高さ約180mm
  // A3横: 420mm x 297mm → 実効幅約370mm, 高さ約260mm
  paperSizes: {
    a4: { width: 945, height: 680, label: 'A4横' },   // 96dpi換算、マージン考慮
    a3: { width: 1400, height: 980, label: 'A3横' }
  },

  // ドラッグ範囲選択の状態
  dragState: {
    isDragging: false,
    startProcessId: null,
    startDate: null,
    endDate: null
  },

  init() {
    this.setupEventListeners();
    this.attachGridEventListeners(); // イベント委譲は一度だけ設定
    this.setupScrollSync(); // 横スクロール同期
  },

  // 横スクロール同期：ボディのスクロールにヘッダを追従させる
  setupScrollSync() {
    const bodyScroll = document.getElementById('job-detail-body-scroll');

    bodyScroll.addEventListener('scroll', () => {

    });

  setupEventListeners() {
    document.getElementById('job-detail-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-print-job')?.addEventListener('click', () => this.print());
    document.getElementById('btn-export-sheet')?.addEventListener('click', () => this.exportToSpreadsheet());
    document.getElementById('job-detail-mode-daily')?.addEventListener('click', () => this.setViewMode('daily'));
    document.getElementById('job-detail-mode-weekly')?.addEventListener('click', () => this.setViewMode('weekly'));
    document.getElementById('job-detail-start')?.addEventListener('change', () => this.onDisplayRangeChange());
    document.getElementById('job-detail-days')?.addEventListener('change', () => this.onDisplayRangeChange());
    // 未使用工程を隠すトグル
    document.getElementById('job-detail-hide-unused')?.addEventListener('change', (e) => {
      this.config.hideUnusedProcesses = e.target.checked;
      this.render();
    });
    // 印刷境界線表示トグル
    document.getElementById('job-detail-show-boundaries')?.addEventListener('change', (e) => {
      this.config.showPrintBoundaries = e.target.checked;
      const paperSelect = document.getElementById('job-detail-paper-size');
      if (paperSelect) paperSelect.disabled = !e.target.checked;
      this.updatePrintBoundaries();
      this.updateDaysPerPageIndicator();
    });
    // 用紙サイズ選択
    document.getElementById('job-detail-paper-size')?.addEventListener('change', (e) => {
      this.config.paperSize = e.target.value;
      this.updatePrintBoundaries();
      this.updateDaysPerPageIndicator();
    });

    document.querySelectorAll('input[name="export-theme"]').forEach(radio => {

    document.querySelectorAll('input[name="export-paper"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        this.config.paperSize = e.target.value;
      });
