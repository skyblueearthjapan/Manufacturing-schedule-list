const WorkerJobAssignView = {
  // フィルター状態
  filters: {
    activeOnly: true,
    mainOnly: false,
    searchQuery: ''
  },

  init() {
    Store.subscribe((state) => {
      if (state.currentView === 'resource') {
        this.render();
      }
    });
  },

  /**
   * Jobs から割り振りデータを生成（Source of Truth = Jobs）
   * @param {Object[]} jobs - Jobs配列
   * @param {Object[]} people - People配列
   * @returns {Object[]} assignment配列
   */
  buildWorkerAssignmentsFromJobs(jobs, people) {
    const assignments = [];
    const peopleMap = {};
    people.forEach(p => {
      // personId を正規化（trim）してマップに格納
      const normalizedId = String(p.personId || '').trim();
      peopleMap[normalizedId] = p;
    });

    console.log('[WorkerJobAssignView] Building assignments from Jobs');
    console.log('[WorkerJobAssignView] People IDs:', Object.keys(peopleMap));
    console.log('[WorkerJobAssignView] Jobs count:', jobs.length);

    jobs.forEach(job => {
      const jobId = job.jobId || '';
      const jobCode = job['工番'] || '';
      const customerName = job['顧客名'] || '';
      const productName = job['設備/製品名'] || '';

      // mainPersonId を正規化
      const mainPersonId = String(job.mainPersonId || '').trim();
      // subPersonId を正規化
      const subPersonId = String(job.subPersonId || '').trim();

      // 主担当者の割り振り
      if (mainPersonId) {
        const person = peopleMap[mainPersonId];
        if (person) {
          assignments.push({
            assignId: `${jobId}:main:${mainPersonId}`,
            personId: mainPersonId,
            personName: person['氏名'] || '',
            jobId,
            jobCode,
            customerName,
            productName,
            mainProcess: '',
            mainProcessName: '',
            role: 'main',
            priority: 10,
            isActive: true,
            memo: ''
          });
        } else {
          console.warn(`[WorkerJobAssignView] mainPersonId "${mainPersonId}" not found in People (Job: ${jobCode})`);
        }
      }

      // 副担当者の割り振り（主担当と異なる場合のみ）
      if (subPersonId && subPersonId !== mainPersonId) {
        const person = peopleMap[subPersonId];
        if (person) {
          assignments.push({
            assignId: `${jobId}:sub:${subPersonId}`,
            personId: subPersonId,
            personName: person['氏名'] || '',
            jobId,
            jobCode,
            customerName,
            productName,
            mainProcess: '',
            mainProcessName: '',
            role: 'sub',
            priority: 20,
            isActive: true,
            memo: ''
          });
        } else {
          console.warn(`[WorkerJobAssignView] subPersonId "${subPersonId}" not found in People (Job: ${jobCode})`);
        }
      }
    });

    console.log('[WorkerJobAssignView] Generated assignments:', assignments.length);

    // priority → jobCode 順でソート
    assignments.sort((a, b) => {
      if (a.priority !== b.priority) return a.priority - b.priority;
      return String(a.jobCode || '').localeCompare(String(b.jobCode || ''));
    });

    return assignments;
  },

  /**
   * メインレンダリング
   */
  render() {
    const container = document.getElementById('view-resource');
    if (!container) return;

    const { jobs, people } = Store.state;

    console.log('[WorkerJobAssignView] render() called');
    console.log('[WorkerJobAssignView] Store.state.jobs count:', jobs?.length || 0);
    console.log('[WorkerJobAssignView] Store.state.people count:', people?.length || 0);

    // Jobs から割り振りを生成（Source of Truth = Jobs）
    const assignments = this.buildWorkerAssignmentsFromJobs(jobs || [], people || []);

    // 作業者情報をマップ化（部署など取得用）
    const peopleMap = {};
    (people || []).forEach(p => {
      const normalizedId = String(p.personId || '').trim();
      peopleMap[normalizedId] = p;
    });

    // フィルタリング
    let filtered = this.applyFilters(assignments);

    // personIdでグルーピング
    const grouped = this.groupByPerson(filtered, peopleMap);

    // 担当者未設定の工番を取得
    const unassignedJobs = this.getUnassignedJobs(jobs || []);

    // HTML生成
    container.innerHTML = this.renderContainer(grouped, peopleMap, unassignedJobs);

    // イベントハンドラーを設定
    this.setupEventHandlers();
  },

  /**
   * 担当者未設定の工番を取得
   * mainPersonId と subPersonId が両方空の工番
   */
  getUnassignedJobs(jobs) {
    return jobs.filter(job => {
      if (job.isHidden) return false;
      const mainId = String(job.mainPersonId || '').trim();
      const subId = String(job.subPersonId || '').trim();
      return !mainId && !subId;
    });
  },

  /**
   * フィルター適用
   */
  applyFilters(assigns) {
    let result = [...assigns];

    // 有効のみフィルタ（isActive=false を除外）
    if (this.filters.activeOnly) {
      result = result.filter(a => a.isActive !== false);
    }

    // 主担当のみフィルタ
    if (this.filters.mainOnly) {
      result = result.filter(a => a.role === 'main');
    }

    // 検索フィルタ
    if (this.filters.searchQuery.trim()) {
      const q = this.filters.searchQuery.toLowerCase();
      result = result.filter(a => {
        const jobCode = String(a.jobCode || '').toLowerCase();
        const customerName = String(a.customerName || '').toLowerCase();
        const productName = String(a.productName || '').toLowerCase();
        return jobCode.includes(q) || customerName.includes(q) || productName.includes(q);
      });
    }

    return result;
  },

  /**
   * personIdでグルーピング
   */
  groupByPerson(assigns, peopleMap) {
    const groups = {};
    assigns.forEach(a => {
      const personId = String(a.personId || '').trim();
      if (!groups[personId]) {
        groups[personId] = {
          personId,
          personName: a.personName || peopleMap[personId]?.['氏名'] || '不明',
          dept: peopleMap[personId]?.['部署/区分'] || '',
          color: peopleMap[personId]?.['作業者色(colorHex)'] || '#6b7280',
          assigns: []
        };
      }
      groups[personId].assigns.push(a);
    });
    return groups;
  },

  /**
   * コンテナHTML生成
   */
  renderContainer(grouped, peopleMap, unassignedJobs = []) {
    const personIds = Object.keys(grouped);

    // 部署→氏名順でソート
    personIds.sort((a, b) => {
      const deptA = grouped[a].dept || '';
      const deptB = grouped[b].dept || '';
      if (deptA !== deptB) return deptA.localeCompare(deptB);
      return grouped[a].personName.localeCompare(grouped[b].personName);
    });

    return `
      <div class="wja-container">
        <!-- フィルターバー -->
        <div class="wja-filter-bar">
          <div class="wja-filter-left">
            <label class="wja-toggle">
              <input type="checkbox" id="wja-filter-active" ${this.filters.activeOnly ? 'checked' : ''}>
              <span>有効のみ</span>
            </label>
            <label class="wja-toggle">
              <input type="checkbox" id="wja-filter-main" ${this.filters.mainOnly ? 'checked' : ''}>
              <span>主担当のみ</span>
            </label>
          </div>
          <div class="wja-filter-right">
            <input type="text" id="wja-search" class="wja-search-input"
                   placeholder="工番・顧客・製品で検索..."
                   value="${Utils.escapeHtml(this.filters.searchQuery)}">
          </div>
        </div>

        <!-- 2カラムレイアウト -->
        <div class="wja-two-column">
          <!-- 左：担当者別カード一覧 -->
          <div class="wja-body wja-assigned-panel">
            ${personIds.length === 0 ? this.renderEmpty() : personIds.map(pid => this.renderPersonSection(grouped[pid])).join('')}
          </div>

          <!-- 右：担当者未設定パネル -->
          <div class="wja-unassigned-panel">
            ${this.renderUnassignedPanel(unassignedJobs)}
          </div>
        </div>
      </div>
    `;
  },

  /**
   * 担当者未設定パネルを描画
   */
  renderUnassignedPanel(unassignedJobs) {
    return `
      <div class="wja-unassigned-header">
        <span class="wja-unassigned-title">担当者未設定</span>
        <span class="wja-unassigned-count">${unassignedJobs.length}件</span>
      </div>
      <div class="wja-unassigned-body">
        ${unassignedJobs.length === 0
          ? '<div class="wja-unassigned-empty">未設定の工番はありません</div>'
          : unassignedJobs.map(job => this.renderUnassignedCard(job)).join('')}
      </div>
    `;
  },

  /**
   * 未設定工番カードを描画（ドラッグ可能）
   */
  renderUnassignedCard(job) {
    const jobCode = job['工番'] || '';
    const customerName = job['顧客名'] || '';
    const productName = job['設備/製品名'] || '';
    const jobId = job.jobId || '';

    // 担当者設定ボタン（クリックでモーダルを開く、ドラッグ開始を阻止）
    const assignBtn = `<button type="button"
                              class="wja-assign-btn"
                              data-job-id="${Utils.escapeHtml(jobId)}"
                              onmousedown="event.stopPropagation();"
                              onclick="event.stopPropagation(); WorkerJobAssignView.openRoleModal('${Utils.escapeHtml(jobId)}')"
                              title="担当者を設定">担当設定</button>`;

    return `
      <div class="wja-card wja-card-draggable wja-unassigned-card"
           data-job-id="${Utils.escapeHtml(jobId)}"
           data-job-code="${Utils.escapeHtml(jobCode)}"
           draggable="true">
        <div class="wja-card-row1">
          <span class="wja-card-jobcode">${Utils.escapeHtml(jobCode)}</span>
          ${assignBtn}
          <span class="wja-drag-handle" title="ドラッグして担当者へ割り当て">⋮⋮</span>
        </div>
        <div class="wja-card-row2">${Utils.escapeHtml(customerName) || '—'}</div>
        <div class="wja-card-row3">${Utils.escapeHtml(productName) || '—'}</div>
      </div>
    `;
  },

  /**
   * 空の場合の表示
   */
  renderEmpty() {
    return `
      <div class="wja-empty">
        <div class="wja-empty-icon">📋</div>
        <div class="wja-empty-text">該当する担当工番がありません</div>
      </div>
    `;
  },

  /**
   * 作業者セクション生成（ドロップゾーン対応）
   */
  renderPersonSection(group) {
    const { personId, personName, dept, color, assigns } = group;

    // 主担当と副担当を分離
    const mainAssigns = assigns.filter(a => a.role === 'main');
    const subAssigns = assigns.filter(a => a.role === 'sub');

    // 主担当のみフィルタ時は副担当を非表示
    const showSub = !this.filters.mainOnly && subAssigns.length > 0;

    return `
      <div class="wja-person-section wja-drop-zone" data-person-id="${Utils.escapeHtml(personId)}">
        <div class="wja-person-header wja-person-header-clickable" style="border-left: 4px solid ${color}"
             data-person-id="${Utils.escapeHtml(personId)}" onclick="PersonGanttOverlay.open('${Utils.escapeHtml(personId)}')" title="クリックして大工程表を表示">
          <span class="wja-person-dept">${Utils.escapeHtml(dept)}</span>
          <span class="wja-person-name">${Utils.escapeHtml(personName)}</span>
          <span class="wja-person-count">${assigns.length}件</span>
          <span class="wja-gantt-icon" title="大工程表を開く">📊</span>
        </div>
        <!-- 主担当レーン -->
        <div class="wja-lane wja-lane-main">
          <div class="wja-lane-label">主担当</div>
          <div class="wja-card-grid">
            ${mainAssigns.length === 0
              ? '<div class="wja-lane-empty">（なし）</div>'
              : mainAssigns.map(a => this.renderCard(a)).join('')}
          </div>
        </div>
        ${showSub ? `
        <!-- 副担当レーン -->
        <div class="wja-lane wja-lane-sub">
          <div class="wja-lane-label">副担当</div>
          <div class="wja-card-grid">
            ${subAssigns.map(a => this.renderCard(a)).join('')}
          </div>
        </div>
        ` : ''}
      </div>
    `;
  },

  /**
   * 工番カード生成
   */
  renderCard(assign) {
    const jobCode = assign.jobCode || '';
    const customerName = assign.customerName || '';
    const productName = assign.productName || '';
    const mainProcessName = assign.mainProcessName || '';
    const role = assign.role || 'main';
    const memo = assign.memo || '';
    const jobId = assign.jobId || '';

    // roleバッジ（クリックで主副変更モーダル）
    const roleBadgeClass = role === 'main' ? 'wja-role-main' : 'wja-role-sub';
    const roleBadgeText = role === 'main' ? '主' : '副';
    const roleBadge = `<span class="wja-role-badge ${roleBadgeClass} wja-role-badge-clickable"
                            data-job-id="${Utils.escapeHtml(jobId)}"
                            onclick="event.stopPropagation(); WorkerJobAssignView.openRoleModal('${Utils.escapeHtml(jobId)}')"
                            title="クリックして主/副担当を変更">${roleBadgeText}</span>`;

    return `
      <div class="wja-card" data-job-id="${Utils.escapeHtml(jobId)}" data-job-code="${Utils.escapeHtml(jobCode)}">
        <div class="wja-card-row1">
          <span class="wja-card-jobcode">${Utils.escapeHtml(jobCode)}</span>
          ${roleBadge}
        </div>
        <div class="wja-card-row2">${Utils.escapeHtml(customerName) || '—'}</div>
        <div class="wja-card-row3">${Utils.escapeHtml(productName) || '—'}</div>
        ${mainProcessName || memo ? `<div class="wja-card-row4">${Utils.escapeHtml(mainProcessName)}${memo ? ' / ' + Utils.escapeHtml(memo) : ''}</div>` : ''}
      </div>
    `;
  },

  /**
   * イベントハンドラー設定
   */
  setupEventHandlers() {
    // 有効のみトグル
    const activeCheckbox = document.getElementById('wja-filter-active');
    if (activeCheckbox) {
      activeCheckbox.addEventListener('change', (e) => {
        this.filters.activeOnly = e.target.checked;
        this.render();
      });
    }

    // 主担当のみトグル
    const mainCheckbox = document.getElementById('wja-filter-main');
    if (mainCheckbox) {
      mainCheckbox.addEventListener('change', (e) => {
        this.filters.mainOnly = e.target.checked;
        this.render();
      });
    }

    // 検索入力
    const searchInput = document.getElementById('wja-search');
    if (searchInput) {
      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          this.filters.searchQuery = e.target.value;
          this.render();
          // 再レンダリング後にフォーカスを維持
          const newInput = document.getElementById('wja-search');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        }, 300);
      });
    }

    // カードクリック → 工番別工程表へ遷移（未設定カード除く）
    document.querySelectorAll('.wja-card:not(.wja-unassigned-card)').forEach(card => {
      card.addEventListener('click', (e) => {
        // バッジクリックは別処理なのでスキップ
        if (e.target.closest('.wja-role-badge-clickable')) return;
        const jobId = card.dataset.jobId;
        const jobCode = card.dataset.jobCode;
        if (jobId) {
          this.openJobDetail(jobId, jobCode);
        }
      });
    });

    // ドラッグ＆ドロップ設定
    this.setupDragAndDrop();
  },

  /**
   * ドラッグ＆ドロップ設定
   */
  setupDragAndDrop() {
    // ドラッグ可能カード
    document.querySelectorAll('.wja-card-draggable').forEach(card => {
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', card.dataset.jobId);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('wja-dragging');
      });

      card.addEventListener('dragend', (e) => {
        card.classList.remove('wja-dragging');
        document.querySelectorAll('.wja-drop-zone').forEach(zone => {
          zone.classList.remove('wja-drop-hover');
        });
      });
    });

    // ドロップゾーン（担当者セクション）
    document.querySelectorAll('.wja-drop-zone').forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('wja-drop-hover');
      });

      zone.addEventListener('dragleave', (e) => {
        zone.classList.remove('wja-drop-hover');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('wja-drop-hover');

        const jobId = e.dataTransfer.getData('text/plain');
        const personId = zone.dataset.personId;

        if (jobId && personId) {
          this.assignMainPerson(jobId, personId);
        }
      });
    });
  },

  /**
   * 主担当を設定
   */
  async assignMainPerson(jobId, personId) {
    console.log('[WorkerJobAssignView] Assigning main person:', jobId, personId);

    try {
      // Store経由で更新
      const job = Store.getJobById(jobId);
      if (!job) {
        Utils.showToast('工番が見つかりません', 'error');
        return;
      }

      // Jobsの mainPersonId を更新（subPersonIdは維持）
      await Store.updateJob(jobId, { mainPersonId: personId }, job.updatedAt);
      Utils.showToast('主担当を設定しました', 'success');

      // 再描画
      this.render();
    } catch (error) {
      console.error('[WorkerJobAssignView] Failed to assign:', error);
      Utils.showToast('担当者の設定に失敗しました', 'error');
    }
  },

  /**
   * 主副変更モーダルを開く
   */
  openRoleModal(jobId) {
    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    const people = Store.state.people.filter(p => p['有効(isActive)'] !== false);
    const jobCode = job['工番'] || '';
    const currentMain = job.mainPersonId || '';
    const currentSub = job.subPersonId || '';

    // モーダルHTML
    const modalHtml = `
      <div id="wja-role-modal" class="modal">
        <div class="modal-backdrop" onclick="WorkerJobAssignView.closeRoleModal()"></div>
        <div class="modal-content" style="max-width: 400px;">
          <div class="modal-header">
            <h3 class="text-lg font-semibold">担当者設定 - ${Utils.escapeHtml(jobCode)}</h3>
            <button class="modal-close-btn" onclick="WorkerJobAssignView.closeRoleModal()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label">主担当者</label>
              <select id="wja-role-main" class="form-select">
                <option value="">（未設定）</option>
                ${people.map(p => `<option value="${Utils.escapeHtml(p.personId)}" ${p.personId === currentMain ? 'selected' : ''}>${Utils.escapeHtml(p['氏名'])} (${Utils.escapeHtml(p['部署/区分'] || '')})</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">副担当者</label>
              <select id="wja-role-sub" class="form-select">
                <option value="">（未設定）</option>
                ${people.map(p => `<option value="${Utils.escapeHtml(p.personId)}" ${p.personId === currentSub ? 'selected' : ''}>${Utils.escapeHtml(p['氏名'])} (${Utils.escapeHtml(p['部署/区分'] || '')})</option>`).join('')}
              </select>
            </div>
            <div class="text-center mt-2">
              <button type="button" class="btn btn-secondary text-sm" onclick="WorkerJobAssignView.swapRoles()">
                ↕ 主/副を入れ替え
              </button>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="WorkerJobAssignView.closeRoleModal()">キャンセル</button>
            <button type="button" class="btn btn-primary" onclick="WorkerJobAssignView.saveRoleModal('${Utils.escapeHtml(jobId)}')">保存</button>
          </div>
        </div>
      </div>
    `;

    // 既存モーダルがあれば削除
    const existing = document.getElementById('wja-role-modal');
    if (existing) existing.remove();

    // モーダルを追加
    document.body.insertAdjacentHTML('beforeend', modalHtml);
  },

  /**
   * 主副を入れ替え
   */
  swapRoles() {
    const mainSelect = document.getElementById('wja-role-main');
    const subSelect = document.getElementById('wja-role-sub');
    if (mainSelect && subSelect) {
      const temp = mainSelect.value;
      mainSelect.value = subSelect.value;
      subSelect.value = temp;
    }
  },

  /**
   * モーダルを閉じる
   */
  closeRoleModal() {
    const modal = document.getElementById('wja-role-modal');
    if (modal) modal.remove();
  },

  /**
   * モーダル保存
   */
  async saveRoleModal(jobId) {
    const mainSelect = document.getElementById('wja-role-main');
    const subSelect = document.getElementById('wja-role-sub');

    if (!mainSelect || !subSelect) return;

    const mainPersonId = mainSelect.value || '';
    const subPersonId = subSelect.value || '';

    try {
      const job = Store.getJobById(jobId);
      if (!job) {
        Utils.showToast('工番が見つかりません', 'error');
        return;
      }

      await Store.updateJob(jobId, { mainPersonId, subPersonId }, job.updatedAt);
      Utils.showToast('担当者を更新しました', 'success');

      this.closeRoleModal();
      this.render();
    } catch (error) {
      console.error('[WorkerJobAssignView] Failed to save role:', error);
      Utils.showToast('保存に失敗しました', 'error');
    }
  },

  /**
   * 工番別工程表を開く
   */
  openJobDetail(jobId, jobCode) {
    console.log('[WorkerJobAssignView] Opening job detail:', jobId, jobCode);
    // 既存のJobDetailを開く処理を呼び出す
    if (typeof JobDetail !== 'undefined' && JobDetail.open) {
      JobDetail.open(jobId);
    } else {
      console.warn('JobDetail.open is not available');
      Utils.showToast(`工番 ${jobCode} の詳細を開く機能は準備中です`, 'info');
    }
  }
};

// PersonGanttOverlay - 担当者別工番別工程表（Excel風）

const PersonGanttOverlay = {
  config: {
    colWidth: 28,       // 1日あたりの列幅（ExcelGanttと統一）
    rowHeight: 44,      // 1案件の高さ（ExcelGanttと統一）
    headerHeight: 50,   // 日付ヘッダ高さ
    leftPaneWidth: 520, // 左ペイン幅
  },

  // バー種類別スタイル定義（ExcelGanttと同じ）
  BAR_STYLE: {
    '出荷':     { shape: 'arrow', lane: 0 },
    '電気設計': { shape: 'rect',  lane: 1 },
    '機械設計': { shape: 'rect',  lane: 1 },
    '治具':     { shape: 'rect',  lane: 1 },
    '準備':     { shape: 'dash',  lane: 0 },
    '_default': { shape: 'rect',  lane: 0 },
  },

  dates: [],
  viewStart: null,
  currentPersonId: null,
  _jobRoleMap: null,

  /**
   * オーバーレイを開く
   * @param {string} personId - 担当者ID
   */
  open(personId) {
    if (!personId) return;

    this.currentPersonId = personId;
    const person = Store.getPersonById(personId);
    const personName = person?.['氏名'] || '不明';

    // タイトル更新
    const titleEl = document.getElementById('person-gantt-title');
    if (titleEl) {
      titleEl.textContent = `工番別工程表（${personName}）`;
    }

    // オーバーレイ表示
    const overlay = document.getElementById('person-gantt-overlay');
    if (overlay) {
      overlay.classList.remove('hidden');
    }

    // 描画
    this.render();

    // スクロール同期設定
    this.setupScrollSync();
  },

  /**
   * オーバーレイを閉じる
   */
  close() {
    const overlay = document.getElementById('person-gantt-overlay');
    if (overlay) {
      overlay.classList.add('hidden');
    }
    this.currentPersonId = null;
  },

  /**
   * 描画
   */
  render() {
    if (!this.currentPersonId) return;

    const { displayStartDate, displayDays } = Store.state;
    this.viewStart = Utils.parseLocalDate(displayStartDate);
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);

    // 担当者でフィルタした工番を取得（主担当→副担当の順）
    const filteredJobs = this.getFilteredJobs();

    const gridWidth = this.dates.length * this.config.colWidth;

    // 描画
    this.renderHeader();
    this.renderLeft(filteredJobs);
    this.renderGrid(filteredJobs);
    this.renderBars(filteredJobs);
    this.updateTodayLine();
    this.updateScrollbarWidth(gridWidth);

    // 埋め込み出張計画を描画
    this.renderTrips();
  },

  /**
   * 担当者でフィルタした工番を取得（主担当優先）
   */
  getFilteredJobs() {
    const personId = this.currentPersonId;
    const jobs = Store.state.jobs.filter(j => !j.isHidden);

    const mainJobs = [];
    const subJobs = [];
    this._jobRoleMap = new Map();

    jobs.forEach(job => {
      const isMain = job.mainPersonId === personId;
      const isSub = job.subPersonId === personId;

      if (isMain) {
        mainJobs.push(job);
        this._jobRoleMap.set(job.jobId, 'main');
      } else if (isSub) {
        subJobs.push(job);
        this._jobRoleMap.set(job.jobId, 'sub');
      }
    });

    // 主担当を上、副担当を下にして返す
    return [...mainJobs, ...subJobs];
  },

  /**
   * 日付ヘッダ描画
   */
  renderHeader() {
    const cols = document.getElementById('pgTimeHeaderCols');
    if (!cols) return;

    const today = Utils.getToday();
    let html = '';

    this.dates.forEach((date, i) => {
      const d = Utils.parseLocalDate(date);
      const month = d.getMonth() + 1;
      const day = d.getDate();
      const dow = ['日','月','火','水','木','金','土'][d.getDay()];
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = date === today;

      let cls = 'pg-time-col';
      if (isWeekend) cls += ' weekend';
      if (isToday) cls += ' today';

      // 月初めの場合に月を表示
      const showMonth = i === 0 || day === 1;

      html += `
        <div class="${cls}" data-date="${date}">
          <div class="md">${showMonth ? month + '/' : ''}${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    cols.innerHTML = html;
    cols.style.width = `${this.dates.length * this.config.colWidth}px`;
  },

  /**
   * 左ペイン（工番情報）描画 - Excel風4列レイアウト
   * 納入先情報と納入先住所（県市まで）を協調表示
   */
  renderLeft(jobs) {
    const container = document.getElementById('pgLeftRows');
    if (!container) return;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="flex items-center justify-center h-32 text-gray-400 text-sm">
          この担当者に紐づく工番がありません
        </div>
      `;
      return;
    }

    let html = '';
    jobs.forEach((job, idx) => {
      const jobNo = job['工番'] || '';
      const product = job['設備/製品名'] || '';
      const qtyRaw = job['台数'] || '1';
      const qty = String(qtyRaw).includes('式') ? qtyRaw : qtyRaw + '式';
      const dest = job['納入先'] || '';
      const destAddressFull = job['納入先住所'] || '';
      // 住所を都道府県+市まで短縮
      const destAddress = this.shortenAddress(destAddressFull);
      const shipDate = this.formatShortDate(job['出荷予定日']);
      const drawDatePlan = this.formatShortDate(job['出図予定日']);

      // 変更後日付を取得
      const changedShipDate = this.formatShortDate(job['出荷予定日変更後']);
      const changedDrawDate = this.formatShortDate(job['出図予定日変更後']);

      // 役割（主担当/副担当）
      const role = this._jobRoleMap.get(job.jobId);
      const roleClass = role === 'main' ? 'role-main' : 'role-sub';
      const roleBadge = role === 'main'
        ? '<span class="pg-role-badge main">主</span>'
        : '<span class="pg-role-badge sub">副</span>';

      // No列の表示（連番）
      const rowNum = idx + 1;

      html += `
        <div class="pg-row ${roleClass}" data-job-id="${job.jobId}" onclick="JobDetail.open('${job.jobId}')">
          <!-- No列（上段：番号、下段：役割バッジ） -->
          <div class="pg-no">
            <div class="no-top">${rowNum}</div>
            <div class="no-bottom">${roleBadge}</div>
          </div>

          <!-- メイン列（2行） -->
          <div class="pg-main">
            <div class="pg-main-line1">
              <span class="product-name">${Utils.escapeHtml(product)}</span>
            </div>
            <div class="pg-main-line2">
              <span class="job-no">${Utils.escapeHtml(jobNo)}</span>
              <span class="unit">${Utils.escapeHtml(qty)}</span>
              ${dest ? `<span class="dest">${Utils.escapeHtml(dest)}</span>` : ''}
              ${destAddress ? `<span class="dest-address">${Utils.escapeHtml(destAddress)}</span>` : ''}
            </div>
          </div>

          <!-- 出荷予定日列 -->
          <div class="pg-ship">
            <div class="ship-top">
              <span class="${changedShipDate ? 'strikethrough' : ''}">${shipDate || '-'}</span>
            </div>
            <div class="ship-bottom">
              ${changedShipDate ? `<span class="changed-date">→${changedShipDate}</span>` : '-'}
            </div>
          </div>

          <!-- 出図日列 -->
          <div class="pg-draw">
            <div class="draw-top">
              <span class="${changedDrawDate ? 'strikethrough' : ''}">${drawDatePlan || '-'}</span>
            </div>
            <div class="draw-bottom">
              ${changedDrawDate ? `<span class="changed-date">→${changedDrawDate}</span>` : '-'}
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  /**
   * グリッド背景描画
   */
  renderGrid(jobs) {
    const grid = document.getElementById('pgGrid');
    if (!grid) return;

    grid.style.setProperty('--days', this.dates.length);
    grid.style.setProperty('--rows', jobs.length);
    grid.style.width = `${this.dates.length * this.config.colWidth}px`;
    grid.style.height = `${jobs.length * this.config.rowHeight}px`;

    const today = Utils.getToday();

    let html = '';
    for (let r = 0; r < jobs.length; r++) {
      const jobId = jobs[r].jobId;
      html += `<div class="pg-grid-row" data-job-id="${jobId}">`;
      // バー用レイヤー
      html += `<div class="bar-layer"></div>`;
      for (let c = 0; c < this.dates.length; c++) {
        const date = this.dates[c];
        const d = Utils.parseLocalDate(date);
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const isToday = date === today;

        let cls = 'pg-grid-cell';
        if (isWeekend) cls += ' weekend';
        if (isToday) cls += ' today';

        html += `<div class="${cls}" data-date="${date}"></div>`;
      }
      html += `</div>`;
    }

    grid.innerHTML = html;
  },

  /**
   * 工程名からBAR_STYLEを取得
   */
  getBarStyle(processName) {
    if (this.BAR_STYLE[processName]) {
      return this.BAR_STYLE[processName];
    }
    for (const key of Object.keys(this.BAR_STYLE)) {
      if (key !== '_default' && processName.includes(key)) {
        return this.BAR_STYLE[key];
      }
    }
    return this.BAR_STYLE['_default'];
  },

  /**
   * 重なり自動段組み（subLane割り当て）
   */
  assignSubLanes(schedules) {
    if (!schedules || schedules.length === 0) return [];

    const byLane = new Map();
    for (const sch of schedules) {
      const lane = sch._lane ?? 0;
      if (!byLane.has(lane)) byLane.set(lane, []);
      byLane.get(lane).push(sch);
    }

    for (const [lane, list] of byLane) {
      list.sort((a, b) => a.start.localeCompare(b.start));
      const ends = [];

      for (const sch of list) {
        const startDate = sch.start;
        const endDate = sch.end;

        let placed = false;
        for (let i = 0; i < ends.length; i++) {
          if (ends[i] < startDate) {
            sch._subLane = i;
            ends[i] = endDate;
            placed = true;
            break;
          }
        }
        if (!placed) {
          sch._subLane = ends.length;
          ends.push(endDate);
        }
      }
    }

    return schedules;
  },

  /**
   * バーHTML生成（両矢印スタイル）
   */
  buildBarHtml({ left, width, topInRow, color, label, shape, scheduleId, jobId }) {
    const safeLabel = Utils.escapeHtml(label || '');
    const baseStyle = `left:${left}px; top:${topInRow}px; width:${width}px; color:${color};`;
    const lineClass = shape === 'dash' ? 'bar-line bar-line--dash' : 'bar-line';

    return `
      <div class="pg-bar"
           style="${baseStyle}"
           data-schedule-id="${scheduleId}"
           data-job-id="${jobId}">
        <div class="${lineClass}"></div>
        <div class="bar-label">${safeLabel}</div>
      </div>`;
  },

  /**
   * バー描画
   */
  renderBars(jobs) {
    const colW = this.config.colWidth;
    const laneH = 16;
    const subH = 14;
    const topPadding = 14;

    jobs.forEach((job) => {
      const row = document.querySelector(`.pg-grid-row[data-job-id="${job.jobId}"]`);
      if (!row) return;
      const layer = row.querySelector('.bar-layer');
      if (!layer) return;

      const schedules = Store.getSchedulesByJobId(job.jobId);

      // 各スケジュールにlane情報を付与
      schedules.forEach(sch => {
        const process = Store.getProcessById(sch.processId);
        const processName = process?.['工程名'] || '';
        const style = this.getBarStyle(processName);
        sch._lane = style.lane ?? 0;
        sch._shape = style.shape ?? 'rect';
        sch._processName = processName;
        sch._color = process?.['工程色(colorHex)'] || '#4A90E2';
      });

      // 重なり自動段組み
      this.assignSubLanes(schedules);

      let html = '';
      schedules.forEach(sch => {
        const startIdx = this.getDateIndex(sch.start);
        const endIdx = this.getDateIndex(sch.end);

        if (startIdx === -1 && endIdx === -1) return;
        if (endIdx < 0) return;
        if (startIdx >= this.dates.length) return;

        const visStart = Math.max(0, startIdx);
        const visEnd = Math.min(this.dates.length - 1, endIdx);

        const left = visStart * colW;
        const width = (visEnd - visStart + 1) * colW;

        const label = sch.label || sch._processName;
        const topInRow = topPadding + (sch._lane * laneH) + ((sch._subLane ?? 0) * subH);

        html += this.buildBarHtml({
          left, width, topInRow,
          color: sch._color,
          label,
          shape: sch._shape,
          scheduleId: sch.scheduleId,
          jobId: job.jobId
        });
      });

      layer.innerHTML = html;
    });
  },

  /**
   * 日付インデックス取得
   */
  getDateIndex(dateStr) {
    const idx = this.dates.indexOf(dateStr);
    if (idx !== -1) return idx;

    const target = Utils.parseLocalDate(dateStr);
    const start = this.viewStart;
    const diffDays = Math.floor((target - start) / (1000 * 60 * 60 * 24));
    return diffDays;
  },

  /**
   * 今日ライン更新
   */
  updateTodayLine() {
    const line = document.getElementById('pgTodayLine');
    const body = document.getElementById('pgTimeBody');
    if (!line || !body) return;

    const today = Utils.getToday();
    const idx = this.dates.indexOf(today);

    if (idx === -1) {
      line.style.display = 'none';
      return;
    }

    const left = idx * this.config.colWidth + (this.config.colWidth / 2);
    line.style.display = 'block';
    line.style.left = `${left}px`;
  },

  /**
   * スクロールバー幅更新
   */
  updateScrollbarWidth(gridWidth) {
    const content = document.getElementById('pgScrollbarContent');
    if (content) {
      content.style.width = `${gridWidth}px`;
    }
  },

  /**
   * 日付フォーマット
   */
  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const d = Utils.parseLocalDate(dateStr);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  },

  /**
   * 住所を都道府県+市まで短縮
   */
  shortenAddress(address) {
    if (!address) return '';
    const match = address.match(/^(.+?[都道府県])(.+?[市区])/);
    if (match) {
      return match[1] + match[2];
    }
    return address;
  },

  /**
   * スクロール同期を設定
   */
  setupScrollSync() {
    const leftRows = document.getElementById('pgLeftRows');
    const timeBody = document.getElementById('pgTimeBody');
    const timeHeader = document.getElementById('pgTimeHeader');
    const bottomScrollbar = document.getElementById('pgBottomScrollbar');

    if (timeBody && leftRows) {
      // 右ボディスクロール → 左追従 + ヘッダ追従
      timeBody.addEventListener('scroll', () => {
        leftRows.scrollTop = timeBody.scrollTop;
        if (timeHeader) {
          timeHeader.scrollLeft = timeBody.scrollLeft;
        }
        if (bottomScrollbar) {
          bottomScrollbar.scrollLeft = timeBody.scrollLeft;
        }
      }, { passive: true });
    }

    if (leftRows && timeBody) {
      // 左スクロール → 右追従
      leftRows.addEventListener('scroll', () => {
        timeBody.scrollTop = leftRows.scrollTop;
      }, { passive: true });
    }

    if (bottomScrollbar && timeBody && timeHeader) {
      // 下部スクロールバー → 本体追従
      bottomScrollbar.addEventListener('scroll', () => {
        timeBody.scrollLeft = bottomScrollbar.scrollLeft;
        timeHeader.scrollLeft = bottomScrollbar.scrollLeft;
      }, { passive: true });
    }
  },

  /**
   * 出張計画セクションの折りたたみ切替
   */
  toggleTripSection() {
    const section = document.getElementById('person-gantt-trip-section');
    if (section) {
      const wasCollapsed = section.classList.contains('collapsed');
      section.classList.toggle('collapsed');
      if (wasCollapsed) {
        setTimeout(() => this.renderTrips(), 350);
      }
    }
  },

  /**
   * 埋め込み出張計画を描画
   */
  renderTrips() {
    if (!this.currentPersonId) return;

    const { displayStartDate, displayDays, trips } = Store.state;

    // 対象者のトリップ数をカウント
    const personTrips = trips.filter(t => t.personId === this.currentPersonId);
    const countEl = document.getElementById('person-gantt-trip-count');
    if (countEl) {
      countEl.textContent = `${personTrips.length}件`;
    }

    // 埋め込み出張計画を描画
    TravelPlan.renderEmbedded({
      containerId: 'person-gantt-trip-container',
      personId: this.currentPersonId,
      dateFrom: displayStartDate,
      days: displayDays
    });
  }
};

// ========================================
// WeeklyPlan - 今週の予定（週刊重要工程形式）
// ========================================

const WeeklyPlan = {
  weekStart: null,

  init() {
    this.weekStart = this.getWeekStart(new Date());

    Store.subscribe((state) => {
      if (state.currentView === 'weekly') {
        this.render();
      }
    });
  },

  getWeekStart(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    d.setDate(diff);
    return Utils.formatDate(d);
  },

  getWeekEnd(weekStart) {
    return Utils.addDays(weekStart, 6);
  },

  prevWeek() {
    this.weekStart = Utils.addDays(this.weekStart, -7);
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  nextWeek() {
    this.weekStart = Utils.addDays(this.weekStart, 7);
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  goToThisWeek() {
    this.weekStart = this.getWeekStart(new Date());
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  onDateChange() {
    const inputDate = document.getElementById('weekly-start-date').value;
    this.weekStart = this.getWeekStart(new Date(inputDate));
    document.getElementById('weekly-start-date').value = this.weekStart;
    this.render();
  },

  /**
   * 重要工程かどうかを判定
   * ProcessMaster の isWeekly フラグで判定
   */
  isImportantProcess(process) {
    if (!process) return false;
    // isWeekly が true の工程のみを重要工程として扱う
    return process.isWeekly === true;
  },

  /**
   * 週間データを構築（重要工程のみ抽出）
   */
  buildImportantWeekRows() {
    const { schedules, jobs, processes } = Store.state;
    const weekEnd = this.getWeekEnd(this.weekStart);
    const dates = Utils.generateDateRange(this.weekStart, 7);

    // 重要工程の processId を収集
    const importantProcessIds = new Set(
      processes.filter(p => this.isImportantProcess(p)).map(p => p.processId)
    );

    // この週にかかるスケジュールを抽出（重要工程のみ）
    const weekSchedules = schedules.filter(s =>
      s.end >= this.weekStart &&
      s.start <= weekEnd &&
      importantProcessIds.has(s.processId)
    );

    // jobId ごとにグループ化
    const jobScheduleMap = new Map();
    weekSchedules.forEach(schedule => {
      if (!jobScheduleMap.has(schedule.jobId)) {
        jobScheduleMap.set(schedule.jobId, []);
      }
      jobScheduleMap.get(schedule.jobId).push(schedule);
    });

    // 重要工程がある工番だけを rows として構築
    const rows = [];
    jobScheduleMap.forEach((jobSchedules, jobId) => {
      const job = Store.getJobById(jobId);
      if (!job) return;

      // 曜日ごとの工程名を収集
      const dayCells = dates.map(date => {
        const dayProcesses = [];
        jobSchedules.forEach(schedule => {
          if (date >= schedule.start && date <= schedule.end) {
            const process = Store.getProcessById(schedule.processId);
            if (process) {
              dayProcesses.push({
                name: Store.getProcessDisplayName(schedule.processId),
                color: Utils.normalizeColor(process['工程色(colorHex)']) || '#6B7280',
                label: schedule.label || ''
              });
            }
          }
        });
        return dayProcesses;
      });

      rows.push({
        jobId,
        job,
        dayCells
      });
    });

    // 工番順でソート（出荷予定日が近い順）
    rows.sort((a, b) => {
      const dateA = a.job['出荷予定日'] || '9999-12-31';
      const dateB = b.job['出荷予定日'] || '9999-12-31';
      return dateA.localeCompare(dateB);
    });

    return { rows, dates };
  },

  /**
   * 工番情報セル（3行固定）を生成
   */
  buildJobInfoCell(job) {
    const jobNo = job['工番'] || '';
    const product = job['設備/製品名'] || '';
    const qty = job['台数'] || '';
    const customer = job['顧客名'] || '';
    const drawDate = job['出図予定日'] ? Utils.formatShortDate(job['出図予定日']) : '';
    const shipDate = job['出荷予定日'] ? Utils.formatShortDate(job['出荷予定日']) : '';

    // 1行目: 工番 製品名（台数）
    const line1 = `${jobNo}　${product}${qty ? '（' + qty + '）' : ''}`;

    // 2行目: 顧客名
    const line2 = customer ? `顧客：${customer}` : '';

    // 3行目: 出図/出荷予定日
    let line3Parts = [];
    if (drawDate) line3Parts.push(`出図：${drawDate}`);
    if (shipDate) line3Parts.push(`出荷：${shipDate}`);
    const line3 = line3Parts.join('　');

    return `
      <div class="job-line1">${Utils.escapeHtml(line1)}</div>
      ${line2 ? `<div class="job-line2">${Utils.escapeHtml(line2)}</div>` : ''}
      ${line3 ? `<div class="job-line3">${Utils.escapeHtml(line3)}</div>` : ''}
    `;
  },

  render() {
    this.updateHeader();
    this.renderDateRow();
    this.renderTable();
  },

  updateHeader() {
    const weekEnd = this.getWeekEnd(this.weekStart);
    const startMonth = Utils.getMonth(this.weekStart);
    const startDay = Utils.getDay(this.weekStart);
    const endMonth = Utils.getMonth(weekEnd);
    const endDay = Utils.getDay(weekEnd);

    const rangeText = `${startMonth}/${startDay}（${Utils.getDayOfWeek(this.weekStart)}）〜 ${endMonth}/${endDay}（${Utils.getDayOfWeek(weekEnd)}）`;

    document.getElementById('weekly-range-display').textContent = rangeText;
    document.getElementById('weekly-start-date').value = this.weekStart;
  },

  renderDateRow() {
    const dates = Utils.generateDateRange(this.weekStart, 7);
    const today = Utils.getToday();
    const dateRow = document.getElementById('weekly-date-row');
    if (!dateRow) return;

    let html = '<th></th>'; // 工番情報列の空セル
    dates.forEach((date, index) => {
      const isWeekend = index >= 5; // 土日
      const isToday = date === today;
      const daySetting = Store.getDaySetting(date);

      let classes = [];
      if (isWeekend) classes.push('weekend');
      if (isToday) classes.push('today');
      // 日付設定による上書き
      if (daySetting === 'WORKDAY') classes.push('is-workday');
      if (daySetting === 'HOLIDAY') classes.push('is-holiday');

      html += `<th class="${classes.join(' ')}">${Utils.getMonth(date)}/${Utils.getDay(date)}</th>`;
    });

    dateRow.innerHTML = html;
  },

  renderTable() {
    const tbody = document.getElementById('weekly-tbody');
    if (!tbody) return;

    const { rows, dates } = this.buildImportantWeekRows();
    const today = Utils.getToday();

    if (rows.length === 0) {
      tbody.innerHTML = `
        <tr class="weekly-empty-row">
          <td colspan="8">この週に重要工程（★）がある工番はありません</td>
        </tr>
      `;
      return;
    }

    let html = '';
    rows.forEach(row => {
      html += '<tr>';

      // 工番情報セル（3行固定）
      html += `<td class="weekly-job-cell">${this.buildJobInfoCell(row.job)}</td>`;

      // 曜日セル（月〜日）
      row.dayCells.forEach((dayProcesses, index) => {
        const date = dates[index];
        const isWeekend = index >= 5;
        const isToday = date === today;
        const daySetting = Store.getDaySetting(date);
        let cellClass = 'weekly-day-cell';
        if (isWeekend) cellClass += ' weekend';
        if (isToday) cellClass += ' today';
        // 日付設定による上書き
        if (daySetting === 'WORKDAY') cellClass += ' is-workday';
        if (daySetting === 'HOLIDAY') cellClass += ' is-holiday';

        let cellContent = '';
        if (dayProcesses.length > 0) {
          // 同日に複数の重要工程がある場合は "/" で区切る
          if (dayProcesses.length === 1) {
            const p = dayProcesses[0];
            cellContent = `<span class="weekly-process-tag" style="background-color: ${p.color};" title="${p.name}${p.label ? ' - ' + p.label : ''}">${Utils.escapeHtml(p.name)}</span>`;
          } else {
            // 複数の場合：名前を "/" で結合、色は最初の工程の色を使用
            const names = dayProcesses.map(p => p.name).join(' / ');
            const firstColor = dayProcesses[0].color;
            cellContent = `<span class="weekly-process-tag" style="background-color: ${firstColor};" title="${names}">${Utils.escapeHtml(names)}</span>`;
          }
        }

        html += `<td class="${cellClass}">${cellContent}</td>`;
      });

      html += '</tr>';
    });

    tbody.innerHTML = html;
  },

  /**
   * 今週の予定を新規ウィンドウで印刷
   * 画面のDOMを複製し、CSSを注入して印刷する
   */
  print() {
    // 週の開始日・終了日を取得
    const weekEnd = this.getWeekEnd(this.weekStart);
    const startMonth = Utils.getMonth(this.weekStart);
    const startDay = Utils.getDay(this.weekStart);
    const endMonth = Utils.getMonth(weekEnd);
    const endDay = Utils.getDay(weekEnd);

    // 印刷タイトル：今週の予定_MM/DD-MM/DD
    const printTitle = `今週の予定_${startMonth}/${startDay}-${endMonth}/${endDay}`;

    // 印刷対象DOMを取得（テーブル部分）
    const printArea = document.getElementById('weekly-print-area');
    if (!printArea) {
      Utils.showToast('印刷対象が見つかりません', 'error');
      return;
    }

    // 新規ウィンドウを開く
    const win = window.open('', '_blank');
    if (!win) {
      Utils.showToast('ポップアップがブロックされました', 'error');
      return;
    }

    // 元画面のスタイルを収集
    const styles = [];

    // link要素（外部CSS）を収集
    document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
      styles.push(`<link rel="stylesheet" href="${link.href}">`);
    });

    // style要素（インラインCSS）を収集
    document.querySelectorAll('style').forEach(style => {
      styles.push(`<style>${style.innerHTML}</style>`);
    });

    // 印刷用の追加CSS
    const printCSS = `
      <style>
        @page {
          size: A4 landscape;
          margin: 10mm;
        }
        @media print {
          * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
          }
          body {
            margin: 0;
            padding: 16px;
          }
          /* overflow/transform問題対策 */
          .weekly-important-table,
          .weekly-important-table * {
            overflow: visible !important;
            transform: none !important;
          }
          /* 行の途中で分割しない */
          .weekly-important-table tr {
            break-inside: avoid;
            page-break-inside: avoid;
          }
        }
        /* 印刷ヘッダー */
        .print-header {
          margin-bottom: 16px;
          padding-bottom: 8px;
          border-bottom: 2px solid #333;
        }
        .print-header h1 {
          font-size: 18px;
          font-weight: bold;
          margin: 0 0 4px 0;
        }
        .print-header .date-range {
          font-size: 12px;
          color: #666;
        }
        /* テーブル調整 */
        .weekly-important-table {
          width: 100%;
          border-collapse: collapse;
        }
        .weekly-important-table th,
        .weekly-important-table td {
          border: 1px solid #d1d5db;
        }
      </style>
    `;

    // 印刷対象をクローン
    const clone = printArea.cloneNode(true);

    // 印刷用HTML生成
    const rangeText = `${startMonth}/${startDay}（${Utils.getDayOfWeek(this.weekStart)}）〜 ${endMonth}/${endDay}（${Utils.getDayOfWeek(weekEnd)}）`;

    win.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <title>${printTitle}</title>
        ${styles.join('\n')}
        ${printCSS}
      </head>
      <body>
        <div class="print-header">
          <h1>今週の予定</h1>
          <div class="date-range">${rangeText}</div>
        </div>
        ${clone.outerHTML}
      </body>
      </html>
    `);
    win.document.close();

    // レンダリング待ちして印刷実行
    win.onload = () => {
      setTimeout(() => {
        win.focus();
        win.print();
        // 印刷ダイアログが閉じたらウィンドウを閉じる（ブラウザによっては閉じられない場合あり）
        setTimeout(() => {
          win.close();
        }, 500);
      }, 300);
    };
  }
};

const TripModal = {
  currentTrip: null,
  isNew: false,
  _presetPersonId: null,  // セル選択からの事前設定

  /**
   * セル選択から新規作成モードで開く
   * @param {string} personId - 作業者ID
   * @param {string} startDate - 開始日
   * @param {string} endDate - 終了日
   */
  openNew(personId, startDate, endDate) {
    this._presetPersonId = personId;
    this.open(null);

    // 事前設定を適用
    document.getElementById('trip-person').value = personId;
    document.getElementById('trip-start').value = startDate;
    document.getElementById('trip-end').value = endDate;

    // 移動ボタンを表示
    document.getElementById('trip-add-move-btn').classList.remove('hidden');
  },

  open(trip) {
    this.currentTrip = trip;
    this.isNew = !trip;

    const modal = document.getElementById('modal-trip');
    const title = document.getElementById('trip-modal-title');
    const personSelect = document.getElementById('trip-person');

    // タイトル設定
    title.textContent = this.isNew ? '出張予定を追加' : '出張予定を編集';

    // 担当者プルダウン生成
    const { people } = Store.state;
    personSelect.innerHTML = '<option value="">選択してください</option>' +
      people.map(p => `<option value="${p.personId}">${Utils.escapeHtml(p['氏名'])} (${Utils.escapeHtml(p['部署/区分'] || '')})</option>`).join('');

    if (trip) {
      // 編集モード
      document.getElementById('trip-id').value = trip.tripId || '';
      document.getElementById('trip-expected-updated-at').value = trip.updatedAt || '';
      document.getElementById('trip-person').value = trip.personId || '';
      document.getElementById('trip-start').value = trip.start || '';
      document.getElementById('trip-end').value = trip.end || '';
      document.getElementById('trip-destination').value = trip['行先'] || '';
      document.getElementById('trip-purpose').value = trip['用件'] || '';
      document.getElementById('trip-note').value = trip['備考'] || '';

      // ステータスバッジ
      const sourceBadge = document.getElementById('trip-source-badge');
      const lockedBadge = document.getElementById('trip-locked-badge');

      if (trip.source === 'auto') {
        sourceBadge.textContent = '自動生成';
        sourceBadge.className = 'px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-700';
      } else {
        sourceBadge.textContent = '手動登録';
        sourceBadge.className = 'px-2 py-0.5 rounded text-xs bg-green-100 text-green-700';
      }

      if (trip.isLocked) {
        lockedBadge.textContent = '🔒 確定済み';
        lockedBadge.className = 'px-2 py-0.5 rounded text-xs bg-amber-100 text-amber-700';
        lockedBadge.classList.remove('hidden');
      } else {
        lockedBadge.classList.add('hidden');
      }

      // ロック済みの場合は編集不可
      this.setReadonly(trip.isLocked === true);

      document.getElementById('trip-delete-btn').classList.remove('hidden');
      document.getElementById('trip-lock-btn').classList.toggle('hidden', trip.isLocked === true);
    } else {
      // 新規モード
      document.getElementById('trip-id').value = '';
      document.getElementById('trip-expected-updated-at').value = '';
      document.getElementById('trip-person').value = '';
      document.getElementById('trip-start').value = Utils.getToday();
      document.getElementById('trip-end').value = Utils.getToday();
      document.getElementById('trip-destination').value = '';
      document.getElementById('trip-purpose').value = '';
      document.getElementById('trip-note').value = '';

      document.getElementById('trip-source-badge').textContent = '';
      document.getElementById('trip-locked-badge').classList.add('hidden');
      document.getElementById('trip-delete-btn').classList.add('hidden');
      document.getElementById('trip-lock-btn').classList.add('hidden');
      document.getElementById('trip-add-move-btn').classList.add('hidden');

      this.setReadonly(false);
    }

    modal.classList.remove('hidden');
  },

  setReadonly(isReadonly) {
    const form = document.getElementById('trip-form');
    const inputs = form.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
      if (input.type !== 'hidden') {
        input.disabled = isReadonly;
      }
    });

    document.getElementById('trip-save-btn').disabled = isReadonly;
    if (isReadonly) {
      document.getElementById('trip-save-btn').classList.add('opacity-50', 'cursor-not-allowed');
    } else {
      document.getElementById('trip-save-btn').classList.remove('opacity-50', 'cursor-not-allowed');
    }
  },

  close() {
    document.getElementById('modal-trip').classList.add('hidden');
    this.currentTrip = null;
    this.isNew = false;
  },

  async save() {
    const personId = document.getElementById('trip-person').value;
    const start = document.getElementById('trip-start').value;
    const end = document.getElementById('trip-end').value;
    const destination = document.getElementById('trip-destination').value;
    const purpose = document.getElementById('trip-purpose').value;
    const note = document.getElementById('trip-note').value;

    if (!personId || !start || !end || !destination) {
      Utils.showToast('必須項目を入力してください', 'error');
      return;
    }

    if (start > end) {
      Utils.showToast('終了日は開始日以降にしてください', 'error');
      return;
    }

    const payload = {
      personId,
      start,
      end,
      '行先': destination,
      '用件': purpose,
      '備考': note,
      source: 'manual'
    };

    if (this.isNew) {
      // 新規作成：仮IDで楽観的更新
      const tempId = 'temp_' + Utils.generateId();
      const newTrip = {
        tripId: tempId,
        ...payload,
        isLocked: false,
        updatedAt: new Date().toISOString()
      };
      Store.addTrip(newTrip);
      ChangeBuffer.add('trip', 'upsert', tempId, payload, 'travel');
      Utils.showToast('出張予定を登録しました（保存待ち）', 'info');
    } else {
      // 更新：楽観的更新
      const tripId = document.getElementById('trip-id').value;
      Store.updateTripInStore(tripId, payload);
      ChangeBuffer.add('trip', 'upsert', tripId, payload, 'travel');
      Utils.showToast('出張予定を更新しました（保存待ち）', 'info');
    }

    this.close();
    TravelPlan.render();
  },

  delete() {
    if (!this.currentTrip) return;

    if (!confirm('この出張予定を削除しますか？')) return;

    const tripId = this.currentTrip.tripId;
    Store.removeTrip(tripId);
    ChangeBuffer.add('trip', 'delete', tripId, {}, 'travel');
    Utils.showToast('出張予定を削除しました（保存待ち）', 'info');

    this.close();
    TravelPlan.render();
  },

  lock() {
    if (!this.currentTrip) return;

    if (!confirm('この予定を確定しますか？確定後は編集できなくなります。')) return;

    const tripId = this.currentTrip.tripId;
    Store.updateTripInStore(tripId, { isLocked: true });
    ChangeBuffer.add('trip', 'lock', tripId, {}, 'travel');
    Utils.showToast('出張予定を確定しました（保存待ち）', 'info');

    this.close();
    TravelPlan.render();
  },

  /**
   * 移動予定をワンクリックで追加
   */
  addMove() {
    const personId = document.getElementById('trip-person').value;
    const start = document.getElementById('trip-start').value;
    const end = document.getElementById('trip-end').value;

    if (!personId || !start || !end) {
      Utils.showToast('担当者と日付を選択してください', 'error');
      return;
    }

    const payload = {
      personId,
      start,
      end,
      '行先': '',
      '用件': '移動',
      '備考': '',
      kind: 'move',
      source: 'manual'
    };

    const tempId = 'temp_' + Utils.generateId();
    const newTrip = {
      tripId: tempId,
      ...payload,
      isLocked: false,
      updatedAt: new Date().toISOString()
    };
    Store.addTrip(newTrip);
    ChangeBuffer.add('trip', 'upsert', tempId, payload, 'travel');
    Utils.showToast('移動予定を追加しました（保存待ち）', 'info');

    this.close();
    TravelPlan.render();
  }
};
