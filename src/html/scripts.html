// ========================================
// Utils - ユーティリティ関数
// ========================================

const Utils = {
  formatDate(date) {
    if (!date) return '';
    const d = new Date(date);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  },

  getToday() {
    return this.formatDate(new Date());
  },

  addDays(dateStr, days) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + days);
    return this.formatDate(d);
  },

  getDaysBetween(startDate, endDate) {
    const start = new Date(startDate);
    const end = new Date(endDate);
    return Math.ceil((end - start) / (1000 * 60 * 60 * 24));
  },

  getDayOfWeek(dateStr) {
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const d = new Date(dateStr);
    return days[d.getDay()];
  },

  isWeekend(dateStr) {
    const d = new Date(dateStr);
    const day = d.getDay();
    return day === 0 || day === 6;
  },

  isHoliday(dateStr) {
    return false;
  },

  getMonth(dateStr) {
    return new Date(dateStr).getMonth() + 1;
  },

  getDay(dateStr) {
    return new Date(dateStr).getDate();
  },

  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return `${parseInt(match[2])}/${parseInt(match[3])}`;
    }
    const match2 = dateStr.match(/(\d{1,2})\/(\d{1,2})/);
    if (match2) {
      return `${match2[1]}/${match2[2]}`;
    }
    return dateStr;
  },

  generateDateRange(startDate, days) {
    const dates = [];
    for (let i = 0; i < days; i++) {
      dates.push(this.addDays(startDate, i));
    }
    return dates;
  },

  lightenColor(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;
    return '#' + (
      0x1000000 +
      (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
      (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
      (B < 255 ? B < 1 ? 0 : B : 255)
    ).toString(16).slice(1);
  },

  debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  },

  showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  },

  setLoading(show) {
    const loading = document.getElementById('loading');
    if (show) {
      loading.classList.remove('hidden');
    } else {
      loading.classList.add('hidden');
    }
  },

  escapeHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  },

  /**
   * ユニークIDを生成
   * @returns {string} - ランダムな文字列ID
   */
  generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
  },

  /**
   * 日本語色名やrgb()をHex形式に正規化
   * @param {string} input - 色の入力値
   * @returns {string|null} - #RRGGBB形式、または無効な場合はnull
   */
  normalizeColor(input) {
    if (!input) return null;

    const str = String(input).trim();

    // 既に#RRGGBB形式
    if (/^#[0-9A-Fa-f]{6}$/.test(str)) {
      return str.toUpperCase();
    }

    // #RGB形式 → #RRGGBB
    if (/^#[0-9A-Fa-f]{3}$/.test(str)) {
      const r = str[1], g = str[2], b = str[3];
      return `#${r}${r}${g}${g}${b}${b}`.toUpperCase();
    }

    // rgb(r, g, b)形式
    const rgbMatch = str.match(/^rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
    if (rgbMatch) {
      const r = Math.min(255, parseInt(rgbMatch[1])).toString(16).padStart(2, '0');
      const g = Math.min(255, parseInt(rgbMatch[2])).toString(16).padStart(2, '0');
      const b = Math.min(255, parseInt(rgbMatch[3])).toString(16).padStart(2, '0');
      return `#${r}${g}${b}`.toUpperCase();
    }

    // 日本語色名マッピング
    const colorMap = {
      '青': '#2563EB',
      '赤': '#EF4444',
      '緑': '#22C55E',
      '黄': '#F59E0B',
      '黄色': '#F59E0B',
      '紫': '#A855F7',
      '橙': '#F97316',
      'オレンジ': '#F97316',
      '黒': '#111827',
      '灰': '#6B7280',
      '灰色': '#6B7280',
      'グレー': '#6B7280',
      '白': '#FFFFFF',
      'ピンク': '#EC4899',
      '水色': '#06B6D4',
      '茶': '#92400E',
      '茶色': '#92400E',
      // 英語色名
      'blue': '#2563EB',
      'red': '#EF4444',
      'green': '#22C55E',
      'yellow': '#F59E0B',
      'purple': '#A855F7',
      'orange': '#F97316',
      'black': '#111827',
      'gray': '#6B7280',
      'grey': '#6B7280',
      'white': '#FFFFFF',
      'pink': '#EC4899',
      'cyan': '#06B6D4'
    };

    const mapped = colorMap[str.toLowerCase()] || colorMap[str];
    if (mapped) return mapped;

    // 不明な値はnull
    return null;
  },

  /**
   * Hex色にアルファ値を追加
   * @param {string} hex - #RRGGBB形式
   * @param {string} alphaHex - 00-FF形式のアルファ値
   * @param {string} fallback - hexが無効な場合のフォールバック色
   * @returns {string} - #RRGGBBAA形式
   */
  withAlpha(hex, alphaHex, fallback = '#6B7280') {
    const normalized = this.normalizeColor(hex);
    const color = normalized || fallback;
    return `${color}${alphaHex}`;
  },

  /**
   * 色が有効かどうかをチェック（normalizeColorで変換可能か）
   * @param {string} input
   * @returns {boolean}
   */
  isValidColor(input) {
    return this.normalizeColor(input) !== null;
  },

  /**
   * 厳密な#RRGGBB形式かどうかをチェック
   * @param {string} input
   * @returns {boolean}
   */
  isValidHexColor(input) {
    if (!input || typeof input !== 'string') return false;
    return /^#[0-9A-Fa-f]{6}$/.test(input.trim());
  }
};

console.log('[DEBUG] Utils defined');

// ========================================
// API - GAS APIクライアント
// ========================================

const API = {
  TIMEOUT: 30000,

  isGasEnvironment() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  },

  call(functionName, ...args) {
    console.log(`[API.call] Calling ${functionName} with args:`, args);
    return new Promise((resolve, reject) => {
      if (!this.isGasEnvironment()) {
        console.error('[API.call] Not in GAS environment');
        reject(new Error('GAS環境で実行されていません。ウェブアプリとしてデプロイしてください。'));
        return;
      }

      const timeoutId = setTimeout(() => {
        console.error(`[API.call] Timeout for ${functionName}`);
        reject(new Error(`API呼び出しがタイムアウトしました (${functionName})`));
      }, this.TIMEOUT);

      try {
        google.script.run
          .withSuccessHandler((result) => {
            clearTimeout(timeoutId);
            console.log(`[API.call] ${functionName} success, result:`, result);
            resolve(result);
          })
          .withFailureHandler((error) => {
            clearTimeout(timeoutId);
            console.error(`[API.call] ${functionName} failure:`, error);
            const errorMessage = error?.message || error?.toString() || '不明なエラーが発生しました';
            reject(new Error(errorMessage));
          })
          [functionName](...args);
      } catch (e) {
        clearTimeout(timeoutId);
        console.error(`[API.call] ${functionName} exception:`, e);
        reject(new Error(`API呼び出しに失敗しました: ${e.message}`));
      }
    });
  },

  async getBootstrapData(rangeStart, days) {
    return await this.call('api_getBootstrapData', rangeStart, days);
  },

  async getSchedules(rangeStart, rangeEnd, filters = {}) {
    return await this.call('api_getSchedules', rangeStart, rangeEnd, filters);
  },

  async createSchedule(payload) {
    return await this.call('api_createSchedule', payload);
  },

  async updateSchedule(scheduleId, patch, expectedUpdatedAt) {
    return await this.call('api_updateSchedule', scheduleId, patch, expectedUpdatedAt);
  },

  async deleteSchedule(scheduleId, expectedUpdatedAt) {
    return await this.call('api_deleteSchedule', scheduleId, expectedUpdatedAt);
  },

  async getAttachments(jobId) {
    return await this.call('api_getAttachments', jobId);
  },

  async getTrips(rangeStart, rangeEnd, filters = {}) {
    return await this.call('api_getTrips', rangeStart, rangeEnd, filters);
  },

  async createJob(payload) {
    return await this.call('api_createJob', payload);
  },

  async updateJob(jobId, patch, expectedUpdatedAt) {
    return await this.call('api_updateJob', jobId, patch, expectedUpdatedAt);
  },

  async syncExternalJobMaster() {
    return await this.call('api_syncExternalJobMaster');
  },

  async searchExternalJobMaster(query, limit = 20) {
    return await this.call('api_searchExternalJobMaster', query, limit);
  },

  async getPeople(includeInactive = false) {
    return await this.call('api_getPeople', includeInactive);
  },

  async createPerson(payload) {
    return await this.call('api_createPerson', payload);
  },

  async updatePerson(personId, patch, expectedUpdatedAt) {
    return await this.call('api_updatePerson', personId, patch, expectedUpdatedAt);
  },

  // TopMemo API
  async upsertTopMemo(payload) {
    return await this.call('api_upsertTopMemo', payload);

  async reorderTopMemos(orderPayload) {

};

// ========================================
// ChangeBuffer - 変更バッファ（A+C+Bプラン共通基盤）
// ========================================

const ChangeBuffer = {
  // 保留中の変更
  pendingChanges: [],

  // 状態
  isSaving: false,
  lastSaveError: null,

  // 設定
  config: {
    idleAutoSaveMs: 5000,  // アイドル自動保存（5秒）
    enableIdleAutoSave: true,
    storageKey: 'pendingChanges_v1'  // localStorage キー
  },

  // アイドルタイマー
  _idleTimer: null,

  // リスナー（UI更新用）
  _listeners: [],

  // ========================================
  // localStorage 永続化
  // ========================================

  /**
   * pendingChanges を localStorage に保存
   */
  _saveToStorage() {
    try {
      if (this.pendingChanges.length > 0) {
        const data = {
          version: 1,
          savedAt: new Date().toISOString(),
          changes: this.pendingChanges
        };
        localStorage.setItem(this.config.storageKey, JSON.stringify(data));
        console.log(`[ChangeBuffer] Saved ${this.pendingChanges.length} changes to localStorage`);
      } else {
        this._clearStorage();
      }
    } catch (e) {
      console.warn('[ChangeBuffer] Failed to save to localStorage:', e);
    }
  },

  /**
   * localStorage からロード
   * @returns {Array|null} 復元した変更配列、なければnull
   */
  _loadFromStorage() {
    try {
      const raw = localStorage.getItem(this.config.storageKey);
      if (!raw) return null;

      const data = JSON.parse(raw);
      if (data && data.version === 1 && Array.isArray(data.changes) && data.changes.length > 0) {
        console.log(`[ChangeBuffer] Found ${data.changes.length} saved changes from ${data.savedAt}`);
        return data;
      }
    } catch (e) {
      console.warn('[ChangeBuffer] Failed to load from localStorage:', e);
    }
    return null;
  },

  /**
   * localStorage をクリア
   */
  _clearStorage() {
    try {
      localStorage.removeItem(this.config.storageKey);
      console.log('[ChangeBuffer] Cleared localStorage');
    } catch (e) {
      console.warn('[ChangeBuffer] Failed to clear localStorage:', e);
    }
  },

  /**
   * 保存済み変更を復元
   * @param {Array} changes - 復元する変更配列
   */
  restoreFromStorage(changes) {
    if (!Array.isArray(changes)) return;
    this.pendingChanges = changes;
    this._notify();
    console.log(`[ChangeBuffer] Restored ${changes.length} changes from storage`);
  },

  /**
   * 変更を追加
   * @param {string} entityType - 'schedule' | 'trip' | 'job'
   * @param {string} op - 'upsert' | 'delete' | 'lock' | 'unlock'
   * @param {string} id - エンティティID
   * @param {Object} payload - 変更内容
   * @param {string} sourceView - 'master' | 'jobDetail' | 'travel' | 'weekly'
   */
  add(entityType, op, id, payload, sourceView) {
    // 同一IDの既存変更を検索
    const existingIndex = this.pendingChanges.findIndex(
      c => c.entityType === entityType && c.id === id
    );

    const change = {
      entityType,
      op,
      id,
      payload,
      updatedAtClient: new Date().toISOString(),
      sourceView
    };

    if (existingIndex >= 0) {
      // 既存を上書き（最新の変更で置換）
      this.pendingChanges[existingIndex] = change;
      console.log(`[ChangeBuffer] Updated existing change: ${entityType}/${id}`);
    } else {
      // 新規追加
      this.pendingChanges.push(change);
      console.log(`[ChangeBuffer] Added new change: ${entityType}/${id} (${op})`);
    }

    this._notify();
    this._saveToStorage();  // localStorage に保存
    this._resetIdleTimer();
  },

  /**
   * 変更を削除（保存成功後に呼ぶ）
   */
  remove(entityType, id) {
    this.pendingChanges = this.pendingChanges.filter(
      c => !(c.entityType === entityType && c.id === id)
    );
    this._notify();
    this._saveToStorage();  // localStorage を更新
  },

  /**
   * 全変更をクリア
   */
  clear() {
    this.pendingChanges = [];
    this.lastSaveError = null;
    this._notify();
    this._clearStorage();  // localStorage をクリア
  },

  /**
   * 未保存件数
   */
  get count() {
    return this.pendingChanges.length;
  },

  /**
   * 未保存があるか
   */
  get isDirty() {
    return this.pendingChanges.length > 0;
  },

  /**
   * 保存実行（バッチ）
   */
  async flush(reason = 'manual') {
    if (!this.isDirty) {
      console.log('[ChangeBuffer] Nothing to save');
      return { ok: true, saved: 0 };
    }

    if (this.isSaving) {
      console.log('[ChangeBuffer] Already saving, skipping');
      return { ok: false, reason: 'already_saving' };
    }

    console.log(`[ChangeBuffer] Flushing ${this.count} changes (reason: ${reason})`);
    this.isSaving = true;
    this.lastSaveError = null;
    this._notify();

    try {
      // 変更をコピー（保存中に新しい変更が来る可能性）
      const changesToSave = [...this.pendingChanges];

      // バッチ保存API呼び出し
      const result = await API.call('api_saveBatch', {
        changes: changesToSave,
        clientRevision: Utils.generateId(),
        user: 'user'
      });

      if (result && result.ok) {
        // 保存成功：差分反映
        Store.applySavedResults(result.results);

        // 保存した変更をバッファから削除
        changesToSave.forEach(c => {
          this.remove(c.entityType, c.id);
        });

        this.isSaving = false;
        this._notify();

        Utils.showToast(`保存しました（${changesToSave.length}件）`, 'success');
        console.log('[ChangeBuffer] Flush successful');
        return { ok: true, saved: changesToSave.length };
      } else {
        throw new Error(result?.error || '保存に失敗しました');
      }
    } catch (error) {
      console.error('[ChangeBuffer] Flush failed:', error);
      this.isSaving = false;
      this.lastSaveError = error.message;
      this._notify();

      Utils.showToast(`保存に失敗しました: ${error.message}`, 'error');
      return { ok: false, error: error.message };
    }
  },

  /**
   * 未保存があれば保存（タブ切替・離脱時用）
   */
  async flushIfDirty(options = {}) {
    const { reason = 'auto', showConfirmOnFail = true } = options;

    if (!this.isDirty) {
      return { ok: true };
    }

    const result = await this.flush(reason);

    if (!result.ok && showConfirmOnFail) {
      // 失敗時：遷移を止めるかどうかを返す
      return { ok: false, shouldBlock: true, error: result.error };
    }

    return result;
  },

  /**
   * アイドルタイマーをリセット
   */
  _resetIdleTimer() {
    if (this._idleTimer) {
      clearTimeout(this._idleTimer);
    }

    if (this.config.enableIdleAutoSave && this.isDirty) {
      this._idleTimer = setTimeout(() => {
        console.log('[ChangeBuffer] Idle timeout, auto-saving');
        this.flush('idle');
      }, this.config.idleAutoSaveMs);
    }
  },

  /**
   * リスナー登録
   */
  subscribe(callback) {
    this._listeners.push(callback);
    return () => {
      this._listeners = this._listeners.filter(l => l !== callback);
    };
  },

  /**
   * リスナーに通知
   */
  _notify() {
    const state = {
      count: this.count,
      isDirty: this.isDirty,
      isSaving: this.isSaving,
      lastSaveError: this.lastSaveError
    };
    this._listeners.forEach(cb => cb(state));
  },

  /**
   * 初期化（イベントリスナー設定）
   */
  init() {
    // beforeunload: ページ離脱時の警告
    window.addEventListener('beforeunload', (e) => {
      if (this.isDirty) {
        e.preventDefault();
        e.returnValue = '未保存の変更があります。ページを離れますか？';
        return e.returnValue;
      }
    });

    // ユーザー操作でアイドルタイマーリセット
    ['click', 'keydown', 'mousemove'].forEach(event => {
      document.addEventListener(event, () => {
        if (this.isDirty) {
          this._resetIdleTimer();
        }
      }, { passive: true });
    });

    // localStorage から未保存変更をチェック
    this._checkStoredChanges();

    console.log('[ChangeBuffer] Initialized');
  },

  /**
   * 保存済み変更の確認と復元
   */
  _checkStoredChanges() {
    const stored = this._loadFromStorage();
    if (!stored) return;

    const { changes, savedAt } = stored;
    const savedDate = new Date(savedAt);
    const timeAgo = this._formatTimeAgo(savedDate);

    // 復元確認ダイアログを表示
    setTimeout(() => {
      this._showRestoreDialog(changes, timeAgo);
    }, 500);  // 初期化完了後に表示
  },

  /**
   * 復元確認ダイアログを表示
   */
  _showRestoreDialog(changes, timeAgo) {
    // ダイアログ作成
    const overlay = document.createElement('div');
    overlay.className = 'restore-dialog-overlay';
    overlay.innerHTML = `
      <div class="restore-dialog">
        <div class="restore-dialog-header">
          <h3>未保存の変更があります</h3>
        </div>
        <div class="restore-dialog-body">
          <p>${timeAgo}に編集された <strong>${changes.length}件</strong> の未保存変更が見つかりました。</p>
          <p>復元しますか？</p>
        </div>
        <div class="restore-dialog-footer">
          <button class="restore-dialog-btn restore-dialog-btn-discard">破棄する</button>
          <button class="restore-dialog-btn restore-dialog-btn-restore">復元する</button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    // ボタンイベント
    overlay.querySelector('.restore-dialog-btn-restore').addEventListener('click', () => {
      this.restoreFromStorage(changes);
      overlay.remove();
      Utils.showToast(`${changes.length}件の変更を復元しました`, 'success');
    });

    overlay.querySelector('.restore-dialog-btn-discard').addEventListener('click', () => {
      this._clearStorage();
      overlay.remove();
      Utils.showToast('未保存の変更を破棄しました', 'info');
    });
  },

  /**
   * 時間差を日本語表現
   */
  _formatTimeAgo(date) {
    const now = new Date();
    const diff = now - date;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);

    if (days > 0) return `${days}日前`;
    if (hours > 0) return `${hours}時間前`;
    if (minutes > 0) return `${minutes}分前`;
    return '数秒前';
  }
};

console.log('[DEBUG] ChangeBuffer defined');

// ========================================
// SaveBar - 保存ステータスバー（共通UI）
// ========================================

const SaveBar = {
  _container: null,

  /**
   * 初期化（DOMに保存バーを追加）
   */
  init() {
    // 既存のバーがあれば削除
    const existing = document.getElementById('save-bar');
    if (existing) existing.remove();

    // 保存バーを作成
    this._container = document.createElement('div');
    this._container.id = 'save-bar';
    this._container.className = 'save-bar save-bar-idle';  // 初期状態はidle
    this._container.innerHTML = `
      <span class="save-bar-icon">✓</span>
      <span class="save-bar-status">
        <span class="save-bar-count">保存済み</span>
      </span>
      <button class="save-bar-btn hidden" onclick="SaveBar.save()">
        <span class="save-bar-btn-text">保存</span>
        <span class="save-bar-spinner hidden">⏳</span>
      </button>
      <button class="save-bar-retry hidden" onclick="SaveBar.save()">
        再試行
      </button>
    `;

    // 専用コンテナに追加
    const container = document.getElementById('save-bar-container');
    if (container) {
      container.appendChild(this._container);
    } else {
      // フォールバック: ヘッダーに追加
      const header = document.querySelector('header .flex.items-center.space-x-3');
      if (header) {
        header.insertBefore(this._container, header.firstChild);
      } else {
        document.body.appendChild(this._container);
      }
    }

    // ChangeBufferの状態変更を購読
    ChangeBuffer.subscribe((state) => this.update(state));

    console.log('[SaveBar] Initialized');
  },

  /**
   * 状態更新
   */
  update(state) {
    if (!this._container) return;

    const { count, isDirty, isSaving, lastSaveError } = state;

    // 状態クラスをリセット
    this._container.classList.remove('save-bar-idle', 'save-bar-dirty', 'save-bar-saving', 'save-bar-error');

    // 要素取得
    const iconEl = this._container.querySelector('.save-bar-icon');
    const countEl = this._container.querySelector('.save-bar-count');
    const btn = this._container.querySelector('.save-bar-btn');
    const btnText = this._container.querySelector('.save-bar-btn-text');
    const spinner = this._container.querySelector('.save-bar-spinner');
    const retryBtn = this._container.querySelector('.save-bar-retry');

    // 状態別の表示更新
    if (lastSaveError) {
      // エラー状態
      this._container.classList.add('save-bar-error');
      if (iconEl) iconEl.textContent = '⚠';
      if (countEl) countEl.textContent = `保存失敗`;
      btn?.classList.add('hidden');
      retryBtn?.classList.remove('hidden');
    } else if (isSaving) {
      // 保存中
      this._container.classList.add('save-bar-saving');
      if (iconEl) iconEl.textContent = '⏳';
      if (countEl) countEl.textContent = '保存中...';
      btn?.classList.add('hidden');
      btnText?.classList.add('hidden');
      spinner?.classList.remove('hidden');
      retryBtn?.classList.add('hidden');
    } else if (isDirty) {
      // 未保存あり
      this._container.classList.add('save-bar-dirty');
      if (iconEl) iconEl.textContent = '●';
      if (countEl) countEl.textContent = `未保存: ${count}件`;
      btn?.classList.remove('hidden');
      btnText?.classList.remove('hidden');
      spinner?.classList.add('hidden');
      btn?.removeAttribute('disabled');
      retryBtn?.classList.add('hidden');
    } else {
      // アイドル状態（保存済み）
      this._container.classList.add('save-bar-idle');
      if (iconEl) iconEl.textContent = '✓';
      if (countEl) countEl.textContent = '保存済み';
      btn?.classList.add('hidden');
      retryBtn?.classList.add('hidden');
    }
  },

  /**
   * 保存実行
   */
  async save() {
    await ChangeBuffer.flush('manual');
  }
};

const Store = {
  state: {
    jobs: [],
    processes: [],
    people: [],
    schedules: [],
    attachments: [],
    trips: [],
    jobMaster: [], // 外部工番マスター
    workerJobAssign: [], // 作業者別担当工番
    topMemos: [], // 上部メモ
    topMemoExpanded: true, // 上部メモ展開状態（デフォルトON）
    displayStartDate: null,
    displayDays: 120,
    currentView: 'master',
    isLoading: false,
    lastFetchedAt: null
  },

  init() {
    if (!this.state.displayStartDate) {
      this.state.displayStartDate = Utils.getToday();
    }
  },

  listeners: [],

  setState(newState) {
    this.state = { ...this.state, ...newState };
    this.notify();
  },

  subscribe(callback) {
    this.listeners.push(callback);
    return () => {
      this.listeners = this.listeners.filter(l => l !== callback);
    };
  },

  notify() {
    this.listeners.forEach(callback => callback(this.state));
  },

  async loadBootstrapData() {
    try {
      this.init();
      this.setState({ isLoading: true });
      Utils.setLoading(true);
      console.log('Loading bootstrap data...');
      console.log('Calling API.getBootstrapData with:', this.state.displayStartDate, this.state.displayDays);

      const data = await API.getBootstrapData(
        this.state.displayStartDate,
        this.state.displayDays
      );

      console.log('API.getBootstrapData returned:', data);
      console.log('typeof data:', typeof data);

      if (!data) {
        throw new Error('サーバーからデータが返されませんでした');
      }

      // TopMemoの初期展開状態を判定（最初のメモのisOpenDefaultを使用）
      const topMemos = data.topMemos || [];
      const topMemoExpanded = topMemos.length > 0 && topMemos[0].isOpenDefault === true;

      this.setState({
        jobs: data.jobs || [],
        processes: data.processes || [],
        people: data.people || [],
        schedules: data.schedules || [],
        trips: data.trips || [],
        jobMaster: data.jobMaster || [],
        workerJobAssign: data.workerJobAssign || [],
        topMemos: topMemos,
        topMemoExpanded: topMemoExpanded,
        lastFetchedAt: data.meta?.fetchedAt || new Date().toISOString(),
        isLoading: false
      });

      Utils.setLoading(false);
      console.log('Bootstrap data loaded:', {
        jobs: data.jobs?.length || 0,
        processes: data.processes?.length || 0,
        people: data.people?.length || 0,
        schedules: data.schedules?.length || 0
      });
    } catch (error) {
      console.error('Failed to load bootstrap data:', error);
      Utils.setLoading(false);
      this.setState({ isLoading: false });

      let errorMessage = 'データの読み込みに失敗しました';
      if (error.message) {
        if (error.message.includes('タイムアウト')) {
          errorMessage = 'サーバー応答がタイムアウトしました。スプレッドシートの設定を確認してください。';
        } else if (error.message.includes('シート') && error.message.includes('見つかりません')) {
          errorMessage = error.message + ' スプレッドシートにシートを作成してください。';
        } else {
          errorMessage = error.message;
        }
      }
      Utils.showToast(errorMessage, 'error', 8000);
    }
  },

  async changeDisplayRange(startDate, days) {
    this.setState({
      displayStartDate: startDate,
      displayDays: days
    });
    await this.loadBootstrapData();
  },

  addJob(job) {
    const jobs = [...this.state.jobs, job];
    this.setState({ jobs });
  },

  addProcess(process) {
    const processes = [...this.state.processes, process];
    // order順でソート
    processes.sort((a, b) => (a['表示順(order)'] || 0) - (b['表示順(order)'] || 0));
    this.setState({ processes });
  },

  updateJobInStore(jobId, updates) {
    const jobs = this.state.jobs.map(j =>
      j.jobId === jobId ? { ...j, ...updates } : j
    );
    this.setState({ jobs });
  },

  addSchedule(schedule) {
    const schedules = [...this.state.schedules, schedule];
    this.setState({ schedules });
  },

  updateScheduleInStore(scheduleId, updates) {
    const schedules = this.state.schedules.map(s =>
      s.scheduleId === scheduleId ? { ...s, ...updates } : s
    );
    this.setState({ schedules });
  },

  removeSchedule(scheduleId) {
    const schedules = this.state.schedules.filter(s => s.scheduleId !== scheduleId);
    this.setState({ schedules });
  },

  // Trip関連のStore操作
  addTrip(trip) {
    const trips = [...this.state.trips, trip];
    this.setState({ trips });
  },

  updateTripInStore(tripId, updates) {
    const trips = this.state.trips.map(t =>
      t.tripId === tripId ? { ...t, ...updates } : t
    );
    this.setState({ trips });
  },

  removeTrip(tripId) {
    const trips = this.state.trips.filter(t => t.tripId !== tripId);
    this.setState({ trips });
  },

  // TopMemo関連のStore操作（複数メモ対応・scope=global固定）
  getTopMemos() {
    // 全メモを返す（sortOrder順）
    return [...this.state.topMemos].sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
  },

  getTopMemoById(memoId) {
    return this.state.topMemos.find(m => m.memoId === memoId) || null;
  },

  toggleTopMemoExpanded() {
    this.setState({ topMemoExpanded: !this.state.topMemoExpanded });
  },

  setTopMemoExpanded(expanded) {
    this.setState({ topMemoExpanded: expanded });
  },

  setTopMemos(topMemos) {
    this.setState({ topMemos });
  },

  addOrReplaceTopMemo(memo) {
    // memoIdで既存を探し、あれば置換、なければ追加
    const idx = this.state.topMemos.findIndex(m => m.memoId === memo.memoId);
    let topMemos;
    if (idx >= 0) {
      topMemos = [...this.state.topMemos];
      topMemos[idx] = { ...topMemos[idx], ...memo };
    } else {
      topMemos = [...this.state.topMemos, memo];
    }
    // sortOrder順でソート
    topMemos.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
    this.setState({ topMemos });
  },

  removeTopMemo(memoId) {
    const topMemos = this.state.topMemos.filter(m => m.memoId !== memoId);
    this.setState({ topMemos });
  },

  /**
   * 保存結果を差分反映（Cプラン：loadBootstrapData()を呼ばない）
   * @param {Object} results - { schedule: { upserted, deleted }, trip: { upserted, deleted, locked } }
   */
  applySavedResults(results) {
    if (!results) return;

    console.log('[Store] Applying saved results:', results);

    // Schedule の差分反映
    if (results.schedule) {
      let schedules = [...this.state.schedules];

      // upserted: 更新または追加（tempId → realId マッピング対応）
      if (results.schedule.upserted) {
        results.schedule.upserted.forEach(saved => {
          // _tempIdがある場合は仮IDを本IDに置換
          if (saved._tempId) {
            const tempIdx = schedules.findIndex(s => s.scheduleId === saved._tempId);
            if (tempIdx >= 0) {
              schedules[tempIdx] = { ...saved };
              delete schedules[tempIdx]._tempId;
              console.log(`[Store] Schedule tempId ${saved._tempId} → ${saved.scheduleId}`);
              return;
            }
          }
          const idx = schedules.findIndex(s => s.scheduleId === saved.scheduleId);
          if (idx >= 0) {
            schedules[idx] = { ...schedules[idx], ...saved };
          } else {
            schedules.push(saved);
          }
        });
      }

      // deleted: 削除
      if (results.schedule.deleted) {
        const deletedIds = results.schedule.deleted.map(d => d.scheduleId || d);
        schedules = schedules.filter(s => !deletedIds.includes(s.scheduleId));
      }

      this.setState({ schedules });
    }

    // Trip の差分反映
    if (results.trip) {
      let trips = [...this.state.trips];

      // upserted: 更新または追加（tempId → realId マッピング対応）
      if (results.trip.upserted) {
        results.trip.upserted.forEach(saved => {
          if (saved._tempId) {
            const tempIdx = trips.findIndex(t => t.tripId === saved._tempId);
            if (tempIdx >= 0) {
              trips[tempIdx] = { ...saved };
              delete trips[tempIdx]._tempId;
              console.log(`[Store] Trip tempId ${saved._tempId} → ${saved.tripId}`);
              return;
            }
          }
          const idx = trips.findIndex(t => t.tripId === saved.tripId);
          if (idx >= 0) {
            trips[idx] = { ...trips[idx], ...saved };
          } else {
            trips.push(saved);
          }
        });
      }

      // locked: ロック反映
      if (results.trip.locked) {
        results.trip.locked.forEach(locked => {
          const idx = trips.findIndex(t => t.tripId === locked.tripId);
          if (idx >= 0) {
            trips[idx] = { ...trips[idx], ...locked, isLocked: true };
          }
        });
      }

      // unlocked: アンロック反映
      if (results.trip.unlocked) {
        results.trip.unlocked.forEach(unlocked => {
          const idx = trips.findIndex(t => t.tripId === unlocked.tripId);
          if (idx >= 0) {
            trips[idx] = { ...trips[idx], ...unlocked, isLocked: false };
          }
        });
      }

      // deleted: 削除
      if (results.trip.deleted) {
        const deletedIds = results.trip.deleted.map(d => d.tripId || d);
        trips = trips.filter(t => !deletedIds.includes(t.tripId));
      }

      this.setState({ trips });
    }

    // Job の差分反映
    if (results.job) {
      let jobs = [...this.state.jobs];

      if (results.job.upserted) {
        results.job.upserted.forEach(saved => {
          if (saved._tempId) {
            const tempIdx = jobs.findIndex(j => j.jobId === saved._tempId);
            if (tempIdx >= 0) {
              jobs[tempIdx] = { ...saved };
              delete jobs[tempIdx]._tempId;
              console.log(`[Store] Job tempId ${saved._tempId} → ${saved.jobId}`);
              return;
            }
          }
          const idx = jobs.findIndex(j => j.jobId === saved.jobId);
          if (idx >= 0) {
            jobs[idx] = { ...jobs[idx], ...saved };
          } else {
            jobs.push(saved);
          }
        });
      }

      if (results.job.deleted) {
        const deletedIds = results.job.deleted.map(d => d.jobId || d);
        jobs = jobs.filter(j => !deletedIds.includes(j.jobId));
      }

      this.setState({ jobs });
    }

    // TopMemo の差分反映
    if (results.topMemo) {
      let topMemos = [...this.state.topMemos];

      // upserted: 更新または追加（tempId → realId マッピング対応）
      if (results.topMemo.upserted) {
        results.topMemo.upserted.forEach(saved => {
          if (saved._tempId) {
            const tempIdx = topMemos.findIndex(m => m.memoId === saved._tempId);
            if (tempIdx >= 0) {
              topMemos[tempIdx] = { ...saved };
              delete topMemos[tempIdx]._tempId;
              console.log(`[Store] TopMemo tempId ${saved._tempId} → ${saved.memoId}`);
              return;
            }
          }
          const idx = topMemos.findIndex(m => m.memoId === saved.memoId);
          if (idx >= 0) {
            topMemos[idx] = { ...topMemos[idx], ...saved };
          } else {
            topMemos.push(saved);
          }
        });
      }

      // deleted: 削除
      if (results.topMemo.deleted) {
        const deletedIds = results.topMemo.deleted.map(d => d.memoId || d);
        topMemos = topMemos.filter(m => !deletedIds.includes(m.memoId));
      }

      // sortOrder順でソート
      topMemos.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
      this.setState({ topMemos });
    }

    console.log('[Store] Diff update complete');
  },

  addPerson(person) {
    const people = [...this.state.people, person];
    this.setState({ people });
  },

  updatePersonInStore(personId, updates) {
    const people = this.state.people.map(p =>
      p.personId === personId ? { ...p, ...updates } : p
    );
    this.setState({ people });
  },

  getJobById(jobId) {
    return this.state.jobs.find(j => j.jobId === jobId) || null;
  },

  getProcessById(processId) {
    return this.state.processes.find(p => p.processId === processId) || null;
  },

  getPersonById(personId) {
    return this.state.people.find(p => p.personId === personId) || null;
  },

  getSchedulesByJobId(jobId) {
    return this.state.schedules.filter(s => s.jobId === jobId);
  },

  getProcessColor(processId) {
    const process = this.getProcessById(processId);
    const raw = process?.['工程色(colorHex)'];
    // 有効なHex色のみ使用、それ以外はフォールバック
    return Utils.isValidHexColor(raw) ? raw.toUpperCase() : '#6B7280';
  },

  getBarColor(schedule) {
    return this.getProcessColor(schedule.processId);
  },

  isMilestone(processId) {
    const process = this.getProcessById(processId);
    return process?.['種別(type)'] === 'milestone';
  },

  /**
   * 工程が重要工程（isWeekly）かどうかを判定
   */
  isImportantProcess(processId) {
    const process = this.getProcessById(processId);
    return process?.isWeekly === true;
  },

  /**
   * 工程の表示名を取得（isWeekly=true なら ★ を付ける）
   * ★の二重付与を防止
   */
  getProcessDisplayName(processId) {
    const process = this.getProcessById(processId);
    if (!process) return '';
    const name = process['工程名'] || '';
    // isWeekly=true かつ、まだ★が付いていなければ★を付ける
    if (process.isWeekly && !name.startsWith('★')) {
      return `★${name}`;
    }
    return name;
  },

  hasAttachments(jobId) {
    return this.state.attachments.some(a => a.jobId === jobId);
  }
};

const Gantt = {
  config: {
    cellWidth: 32,
    baseRowHeight: 64,      // 1レーンの場合の行高さ
    laneHeight: 28,         // 追加レーンあたりの高さ
    barHeight: 24,          // バーの高さ
    barTopPadding: 6,       // バー上部のパディング
    jobPaneWidth: 360
  },

  dates: [],

  // 工番ごとのレーン数を保持
  jobLaneCounts: {},

  // 工番ごとのスケジュール（レーン情報付き）を保持
  _jobSchedulesWithLanes: {},

  // ドラッグ範囲選択の状態
  dragState: {
    isDragging: false,
    startJobId: null,
    startDate: null,
    endDate: null
  },

  init() {
    this.setupEventListeners();
    this.attachGridEventListeners(); // イベント委譲は一度だけ設定
    Store.subscribe(() => this.render());
  },

  // スケジュールにレーンを割り当てる（重なり対応）
  assignLanes(schedules) {
    if (schedules.length === 0) return { items: [], laneCount: 1 };

    // 開始日でソート
    const items = [...schedules].sort((a, b) => a.start.localeCompare(b.start));
    const laneEnds = []; // 各レーンの終了日を保持

    for (const s of items) {
      let placed = false;
      for (let i = 0; i < laneEnds.length; i++) {
        // そのレーンが空いている（前のスケジュールの終了日 < 今のスケジュールの開始日）
        if (laneEnds[i] < s.start) {
          s._lane = i;
          laneEnds[i] = s.end;
          placed = true;
          break;
        }
      }
      if (!placed) {
        // 新しいレーンを作成
        s._lane = laneEnds.length;
        laneEnds.push(s.end);
      }
    }

    return {
      items,
      laneCount: Math.max(1, laneEnds.length)
    };
  },

  // 工番の行の高さを計算
  getRowHeight(laneCount) {
    if (laneCount <= 1) return this.config.baseRowHeight;
    return this.config.baseRowHeight + (laneCount - 1) * this.config.laneHeight;
  },

  setupEventListeners() {
    const hScrollBody = document.getElementById('gantt-h-scroll-body');
    const hScrollHeader = document.getElementById('gantt-h-scroll-header');

    if (hScrollBody && hScrollHeader) {
      hScrollBody.addEventListener('scroll', () => {
        hScrollHeader.scrollLeft = hScrollBody.scrollLeft;
        this.updateTodayLinePosition();
      });
    }
  },

  render() {
    const { jobs, displayStartDate, displayDays } = Store.state;
    this.dates = Utils.generateDateRange(displayStartDate, displayDays);
    const gridWidth = this.dates.length * this.config.cellWidth;
    document.documentElement.style.setProperty('--grid-width', `${gridWidth}px`);

    // 先にレーン数を計算（renderJobPane/renderGrid両方で使用）
    this.calculateLaneCounts(jobs);

    this.renderDateHeader();
    this.renderJobPane(jobs);
    this.renderGrid(jobs);
    this.updateTodayLinePosition();
  },

  // 全工番のレーン数を事前計算（行の高さ同期のため）
  calculateLaneCounts(jobs) {
    this.jobLaneCounts = {};
    this._jobSchedulesWithLanes = {};

    jobs.forEach(job => {
      const schedules = Store.getSchedulesByJobId(job.jobId);
      const { items, laneCount } = this.assignLanes(schedules);
      this.jobLaneCounts[job.jobId] = laneCount;
      this._jobSchedulesWithLanes[job.jobId] = items;
    });
  },

  renderDateHeader() {
    const container = document.getElementById('gantt-date-header');
    if (!container) return;

    const today = Utils.getToday();
    let html = '';
    let currentMonth = 0;
    const gridWidth = this.dates.length * this.config.cellWidth;

    this.dates.forEach((date, index) => {
      const month = Utils.getMonth(date);
      const day = Utils.getDay(date);
      const dow = Utils.getDayOfWeek(date);
      const isWeekend = Utils.isWeekend(date);
      const isToday = date === today;

      let classes = 'gantt-date-cell';
      if (isWeekend) classes += ' weekend';
      if (isToday) classes += ' today';

      const showMonth = month !== currentMonth;
      currentMonth = month;

      html += `
        <div class="${classes}" data-date="${date}">
          ${showMonth ? `<div class="month">${month}月</div>` : '<div class="month">&nbsp;</div>'}
          <div class="day">${day}</div>
          <div class="dow">${dow}</div>
        </div>
      `;
    });

    container.innerHTML = html;
    container.style.minWidth = `${gridWidth}px`;
  },

  renderJobPane(jobs) {
    const container = document.getElementById('gantt-job-pane');
    if (!container) return;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="empty-job-pane flex flex-col items-center justify-center h-48 text-center text-gray-400 text-sm m-2 border-2 border-dashed border-gray-300 rounded-lg">
          <div>工番データがありません</div>
          <div class="text-xs mt-2">上の「＋工番追加」から追加してください</div>
        </div>
      `;
      return;
    }

    let html = '';
    jobs.forEach((job) => {
      const shipDate = this.formatShortDate(job['出荷予定日']);
      const drawDate = this.formatShortDate(job['出図予定日']);
      const laneCount = this.jobLaneCounts[job.jobId] || 1;
      const rowHeight = this.getRowHeight(laneCount);

      // 担当者名を取得
      const mainPerson = job.mainPersonId ? Store.getPersonById(job.mainPersonId) : null;
      const subPerson = job.subPersonId ? Store.getPersonById(job.subPersonId) : null;
      const mainPersonName = mainPerson?.['氏名'] || '';
      const subPersonName = subPerson?.['氏名'] || '';

      // 担当者表示文字列を作成
      let personDisplay = '';
      if (mainPersonName || subPersonName) {
        const parts = [];
        if (mainPersonName) parts.push(`主）${mainPersonName}`);
        if (subPersonName) parts.push(`副）${subPersonName}`);
        personDisplay = `担当：${parts.join(' ')}`;
      }

      html += `
        <div class="job-info-block" data-job-id="${job.jobId}" style="height: ${rowHeight}px; min-height: ${rowHeight}px;" onclick="Gantt.onJobClick('${job.jobId}')">
          <div class="job-info-content">
            <div class="job-info-row1">
              <div class="job-info-jobno">
                <span class="label">[工番]</span>
                <span>${Utils.escapeHtml(job['工番'] || '')}</span>
              </div>
              <div class="job-info-status">
                <span class="label">[${Utils.escapeHtml(job['状態'] || '未着手')}]</span>
                <span>${Utils.escapeHtml(job['重要メモ'] || '')}</span>
              </div>
              <button type="button"
                class="job-edit-btn ml-2 text-xs px-2 py-0.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-100 hover:border-gray-400"
                onclick="event.stopPropagation(); JobModal.openEdit(Store.getJobById('${job.jobId}'));"
                title="工番を編集">
                ✎
              </button>
            </div>
            <div class="job-info-row2">
              <div class="job-info-customer">顧客：${Utils.escapeHtml(job['顧客名'] || '-')}</div>
              <div class="job-info-draw-date">出図予定：${drawDate || '-'}</div>
            </div>
            <div class="job-info-row3">
              <div class="job-info-product">${Utils.escapeHtml(job['設備/製品名'] || '-')}</div>
              <div class="job-info-qty">台数：${job['台数'] || '-'}</div>
              <div class="job-info-ship-date">出荷予定：${shipDate || '-'}</div>
            </div>
            ${personDisplay ? `<div class="job-info-row4 text-xs text-gray-500 mt-0.5">${Utils.escapeHtml(personDisplay)}</div>` : ''}
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  },

  formatShortDate(dateStr) {
    if (!dateStr) return '';
    const match = dateStr.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      return `${parseInt(match[2])}/${parseInt(match[3])}`;
    }
    const match2 = dateStr.match(/(\d{1,2})\/(\d{1,2})/);
    if (match2) {
      return `${match2[1]}/${match2[2]}`;
    }
    return dateStr;
  },

  renderGrid(jobs) {
    const container = document.getElementById('gantt-grid');
    if (!container) return;

    const today = Utils.getToday();
    const gridWidth = this.dates.length * this.config.cellWidth;

    if (jobs.length === 0) {
      container.innerHTML = `
        <div class="flex items-center justify-center h-48 text-gray-400 text-sm" style="min-width: ${gridWidth}px;">
          <div class="text-center">
            <div class="mb-2">← 左のボタンから工番を追加してください</div>
            <div class="text-xs">工番を追加すると、ここに日付グリッドが表示されます</div>
          </div>
        </div>
      `;
      container.style.minWidth = `${gridWidth}px`;
      return;
    }

    // レーン数は calculateLaneCounts() で事前計算済み（this.jobLaneCounts, this._jobSchedulesWithLanes）

    let html = '';
    jobs.forEach(job => {
      const laneCount = this.jobLaneCounts[job.jobId] || 1;
      const rowHeight = this.getRowHeight(laneCount);

      html += `<div class="gantt-grid-row" data-job-id="${job.jobId}" style="height: ${rowHeight}px; min-height: ${rowHeight}px;">`;
      this.dates.forEach(date => {
        const isWeekend = Utils.isWeekend(date);
        const isToday = date === today;
        let bgClass = 'bg-white';
        if (isWeekend) bgClass = 'bg-yellow-50';
        if (isToday) bgClass = 'bg-blue-50';

        html += `
          <button
            type="button"
            class="gantt-grid-cell ${bgClass}"
            data-job-id="${job.jobId}"
            data-date="${date}"
            title="${job['工番']} - ${date}"
          ></button>
        `;
      });
      // バーは必ず row の内部に配置（row外に出すと全工番に重複表示される）
      html += this.renderBarsForJob(job.jobId, this._jobSchedulesWithLanes[job.jobId] || []);
      html += '</div>';
    });

    container.innerHTML = html;
    container.style.minWidth = `${gridWidth}px`;
    // イベント委譲はinit()で一度だけ設定するため、ここでは呼ばない
  },

  renderBarsForJob(jobId, schedulesWithLanes) {
    if (schedulesWithLanes.length === 0) return '';

    const { displayStartDate } = Store.state;
    let html = '';

    schedulesWithLanes.forEach(schedule => {
      const isMilestone = Store.isMilestone(schedule.processId);
      if (isMilestone) {
        html += this.renderMilestone(schedule, displayStartDate);
      } else {
        html += this.renderBar(schedule, displayStartDate);
      }
    });

    return html;
  },

  renderBar(schedule, displayStartDate) {
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);
    const duration = Utils.getDaysBetween(schedule.start, schedule.end) + 1;

    if (startOffset + duration < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = Math.max(0, startOffset) * this.config.cellWidth;
    const width = Math.min(duration, this.dates.length - startOffset) * this.config.cellWidth - 4;
    const color = Store.getBarColor(schedule);
    const processName = Store.getProcessDisplayName(schedule.processId);
    const label = schedule.label || '';

    // レーンに応じたtop位置を計算
    const lane = schedule._lane || 0;
    const top = this.config.barTopPadding + (lane * this.config.laneHeight);

    return `
      <div class="gantt-bar"
           data-schedule-id="${schedule.scheduleId}"
           style="left: ${left}px; width: ${width}px; top: ${top}px; background-color: ${color};"
           title="${processName}${label ? ' - ' + label : ''}">
        <span class="bar-text">${Utils.escapeHtml(processName)}</span>
        ${label ? `<span class="gantt-bar-label">${Utils.escapeHtml(label)}</span>` : ''}
      </div>
    `;
  },

  renderMilestone(schedule, displayStartDate) {
    const startOffset = Utils.getDaysBetween(displayStartDate, schedule.start);

    if (startOffset < 0 || startOffset >= this.dates.length) {
      return '';
    }

    const left = startOffset * this.config.cellWidth + (this.config.cellWidth / 2) - 12;
    // マイルストーンは★を自前で付けるため、生の工程名を使用し、既存の★を除去（二重★防止）
    const process = Store.getProcessById(schedule.processId);
    const rawName = process?.['工程名'] || '';
    const processName = rawName.replace(/^★+/, ''); // 先頭の★を除去

    // レーンに応じたtop位置を計算
    const lane = schedule._lane || 0;
    const top = this.config.barTopPadding + (lane * this.config.laneHeight);

    return `
      <div class="gantt-milestone"
           data-schedule-id="${schedule.scheduleId}"
           style="left: ${left}px; top: ${top}px;"
           title="${processName}">
        ★${Utils.escapeHtml(processName)}
      </div>
    `;
  },

  attachGridEventListeners() {
    const grid = document.getElementById('gantt-grid');
    if (!grid) return;

    // イベント委譲：#gantt-gridに1回だけリスナーを設定

    // バー・マイルストーンのクリック
    grid.addEventListener('click', (e) => {
      const bar = e.target.closest('.gantt-bar, .gantt-milestone');
      if (bar) {
        e.stopPropagation();
        const scheduleId = bar.dataset.scheduleId;
        this.onBarClick(scheduleId);
        return;
      }
    });

    // ドラッグ範囲選択：mousedown
    grid.addEventListener('mousedown', (e) => {
      // 左クリック以外は無視
      if (e.button !== 0) return;
      // バー上でのドラッグは無視
      if (e.target.closest('.gantt-bar, .gantt-milestone')) return;

      const cell = e.target.closest('.gantt-grid-cell');
      if (!cell) return;

      e.preventDefault();
      this.dragState.isDragging = true;
      this.dragState.startJobId = cell.dataset.jobId;
      this.dragState.startDate = cell.dataset.date;
      this.dragState.endDate = cell.dataset.date;

      this.highlightRange();
    });

    // ドラッグ範囲選択：mousemove
    grid.addEventListener('mousemove', (e) => {
      if (!this.dragState.isDragging) return;

      const cell = e.target.closest('.gantt-grid-cell');
      if (!cell) return;

      // 同じjobId（同じ行）のみ範囲選択可能
      if (cell.dataset.jobId !== this.dragState.startJobId) return;

      this.dragState.endDate = cell.dataset.date;
      this.highlightRange();
    });

    // ドラッグ範囲選択：mouseup
    grid.addEventListener('mouseup', (e) => {
      if (!this.dragState.isDragging) return;

      const { startJobId, startDate, endDate } = this.dragState;

      // 範囲確定
      const rangeStart = startDate <= endDate ? startDate : endDate;
      const rangeEnd = startDate <= endDate ? endDate : startDate;

      // リセット
      this.clearHighlight();
      this.dragState.isDragging = false;
      this.dragState.startJobId = null;
      this.dragState.startDate = null;
      this.dragState.endDate = null;

      // モーダルを開く
      Modal.openNew(startJobId, rangeStart, rangeEnd);
    });

    // ドラッグキャンセル：マウスがグリッド外に出た場合
    grid.addEventListener('mouseleave', (e) => {
      if (this.dragState.isDragging) {
        this.clearHighlight();
        this.dragState.isDragging = false;
        this.dragState.startJobId = null;
        this.dragState.startDate = null;
        this.dragState.endDate = null;
      }
    });
  },

  // 選択範囲をハイライト
  highlightRange() {
    this.clearHighlight();

    const { startJobId, startDate, endDate } = this.dragState;
    if (!startJobId || !startDate || !endDate) return;

    const rangeStart = startDate <= endDate ? startDate : endDate;
    const rangeEnd = startDate <= endDate ? endDate : startDate;

    const cells = document.querySelectorAll(`#gantt-grid .gantt-grid-cell[data-job-id="${startJobId}"]`);
    cells.forEach(cell => {
      const date = cell.dataset.date;
      if (date >= rangeStart && date <= rangeEnd) {
        cell.classList.add('selected-range');
      }
    });
  },

  // ハイライトをクリア
  clearHighlight() {
    document.querySelectorAll('#gantt-grid .selected-range').forEach(cell => {
      cell.classList.remove('selected-range');
    });
  },

  updateTodayLinePosition() {
    const todayLine = document.getElementById('today-line');
    const hScrollBody = document.getElementById('gantt-h-scroll-body');
    if (!todayLine || !hScrollBody) return;

    const today = Utils.getToday();
    const { displayStartDate } = Store.state;
    const offset = Utils.getDaysBetween(displayStartDate, today);

    if (offset < 0 || offset >= this.dates.length) {
      todayLine.style.display = 'none';
      return;
    }

    const left = this.config.jobPaneWidth + (offset * this.config.cellWidth) + (this.config.cellWidth / 2) - hScrollBody.scrollLeft;
    todayLine.style.display = 'block';
    todayLine.style.left = `${left}px`;
  },

  onJobClick(jobId) {
    console.log('Job clicked:', jobId);
    JobDetail.open(jobId);
  },

  onAttachClick(jobId) {
    console.log('Attachment clicked:', jobId);
    Utils.showToast('添付一覧（Phase 5で実装）', 'info');
  },

  onBarClick(scheduleId) {
    console.log('Bar clicked:', scheduleId);
    const schedule = Store.state.schedules.find(s => s.scheduleId === scheduleId);
    if (schedule) {
      Modal.openEdit(schedule);
    }
  },

  onCellClick(jobId, date) {
    console.log('Cell clicked:', jobId, date);
    const job = Store.state.jobs.find(j => j.jobId === jobId);
    if (job) {
      console.log('Opening modal for:', job['工番'], date);
    }
    Modal.openNew(jobId, date, date);
  }
};

// Modal - モーダル制御
// ========================================

const Modal = {
  currentSchedule: null,
  isEditMode: false,

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {
    document.getElementById('modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-modal-cancel')?.addEventListener('click', () => this.close());
    document.querySelector('#modal-entry .modal-backdrop')?.addEventListener('click', () => this.close());
    document.getElementById('btn-modal-save')?.addEventListener('click', () => this.save());
    document.getElementById('btn-modal-delete')?.addEventListener('click', () => this.delete());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') this.close();
    });
    document.getElementById('entry-process')?.addEventListener('change', () => this.validateProcess());
  },

  openNew(jobId, startDate, endDate) {
    this.isEditMode = false;
    this.currentSchedule = null;

    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = jobId;
    document.getElementById('entry-start').value = startDate;
    document.getElementById('entry-end').value = endDate;
    document.getElementById('modal-title').textContent = '工程登録';
    document.getElementById('btn-modal-delete').classList.add('hidden');

    this.populateProcessSelect();
    this.open();
  },

  // JobDetailからの呼び出し用：工程を事前選択
  openNewWithProcess(jobId, processId, startDate, endDate) {
    this.isEditMode = false;
    this.currentSchedule = null;

    const job = Store.getJobById(jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = jobId;
    document.getElementById('entry-start').value = startDate;
    document.getElementById('entry-end').value = endDate;
    document.getElementById('modal-title').textContent = '工程登録';
    document.getElementById('btn-modal-delete').classList.add('hidden');

    this.populateProcessSelect(processId); // 工程を事前選択
    this.validateProcess(); // マイルストーンチェック等を実行
    this.open();
  },

  openEdit(schedule) {
    this.isEditMode = true;
    this.currentSchedule = schedule;

    const job = Store.getJobById(schedule.jobId);
    if (!job) {
      Utils.showToast('工番が見つかりません', 'error');
      return;
    }

    this.resetForm();
    document.getElementById('entry-job').value = job['工番'] || '';
    document.getElementById('entry-job-id').value = schedule.jobId;
    document.getElementById('entry-start').value = schedule.start;
    document.getElementById('entry-end').value = schedule.end;
    document.getElementById('entry-label').value = schedule.label || '';
    document.getElementById('entry-status').value = schedule.status || '予定';
    document.getElementById('entry-memo').value = schedule.memo || '';
    document.getElementById('entry-schedule-id').value = schedule.scheduleId;
    document.getElementById('entry-updated-at').value = schedule.updatedAt || '';

    this.populateProcessSelect(schedule.processId);

    document.getElementById('modal-title').textContent = '工程編集';
    document.getElementById('btn-modal-delete').classList.remove('hidden');
    this.open();
  },

  open() {
    document.getElementById('modal-entry').classList.remove('hidden');
  },

  close() {
    document.getElementById('modal-entry').classList.add('hidden');
    this.currentSchedule = null;
    this.isEditMode = false;
  },

  resetForm() {
    document.getElementById('entry-form').reset();
    document.getElementById('entry-schedule-id').value = '';
    document.getElementById('entry-updated-at').value = '';
  },

  populateProcessSelect(selectedId = '') {
    const select = document.getElementById('entry-process');
    const processes = Store.state.processes;

    let html = '<option value="">選択してください</option>';
    processes.forEach(process => {
      const selected = process.processId === selectedId ? 'selected' : '';
      const displayName = Store.getProcessDisplayName(process.processId);
      html += `<option value="${process.processId}" ${selected}>${Utils.escapeHtml(displayName)}</option>`;
    });
    html += '<option value="__new__">＋ 新しい工程を追加</option>';
    select.innerHTML = html;
  },

  validateProcess() {
    const processId = document.getElementById('entry-process').value;

    if (processId === '__new__') {
      // セレクトをリセットしてからProcessModalを開く
      document.getElementById('entry-process').value = '';
      ProcessModal.open((newProcess) => {
        // 追加成功時：工程Selectを再生成し、新規工程を自動選択
        this.populateProcessSelect(newProcess.processId);
        this.validateProcess(); // マイルストーンチェック等
      });
      return;
    }

    const process = Store.getProcessById(processId);
    if (!process) return;

    // マイルストーンの場合は終了日を開始日に合わせる
    if (process['種別(type)'] === 'milestone') {
      const start = document.getElementById('entry-start').value;
      document.getElementById('entry-end').value = start;
    }
  },

  validate() {
    const jobId = document.getElementById('entry-job-id').value;
    const processId = document.getElementById('entry-process').value;
    const start = document.getElementById('entry-start').value;
    const end = document.getElementById('entry-end').value;
    const label = document.getElementById('entry-label').value;
    const status = document.getElementById('entry-status').value;
    const memo = document.getElementById('entry-memo').value;

    if (!processId || processId === '__new__') {
      Utils.showToast('工程を選択してください', 'error');
      return null;
    }

    if (!start || !end) {
      Utils.showToast('期間を入力してください', 'error');
      return null;
    }

    if (start > end) {
      Utils.showToast('終了日は開始日以降にしてください', 'error');
      return null;
    }

    const process = Store.getProcessById(processId);
    if (process) {
      if (process['種別(type)'] === 'milestone' && start !== end) {
        Utils.showToast('マイルストーン工程は開始日と終了日を同じにしてください', 'error');
        return null;
      }
    }

    return {
      jobId,
      processId,
      start,
      end,
      label,
      status,
      memo
    };
  },

  save() {
    const payload = this.validate();
    if (!payload) return;

    if (this.isEditMode) {
      const scheduleId = document.getElementById('entry-schedule-id').value;
      // 楽観的更新
      Store.updateScheduleInStore(scheduleId, { ...payload, updatedAt: new Date().toISOString() });
      ChangeBuffer.add('schedule', 'upsert', scheduleId, payload, 'master');
      Utils.showToast('更新しました（保存待ち）', 'info');
    } else {
      // 新規作成：仮IDで楽観的更新
      const tempId = 'temp_' + Utils.generateId();
      const newSchedule = {
        scheduleId: tempId,
        ...payload,
        updatedAt: new Date().toISOString()
      };
      Store.addSchedule(newSchedule);
      ChangeBuffer.add('schedule', 'upsert', tempId, payload, 'master');
      Utils.showToast('登録しました（保存待ち）', 'info');
    }

    this.close();

    // JobDetailが開いている場合は再描画
    if (JobDetail.currentJobId) {
      JobDetail.render();
    }
  },

  delete() {
    if (!this.isEditMode || !this.currentSchedule) return;
    if (!confirm('この工程を削除しますか？')) return;

    const scheduleId = this.currentSchedule.scheduleId;

    // 楽観的削除
    Store.removeSchedule(scheduleId);
    ChangeBuffer.add('schedule', 'delete', scheduleId, {}, 'master');

    Utils.showToast('削除しました（保存待ち）', 'info');
    this.close();

    // JobDetailが開いている場合は再描画
    if (JobDetail.currentJobId) {
      JobDetail.render();
    }
  }
};

const TopMemoPanel = {
  _panelEl: null,
  _bodyEl: null,
  _listEl: null,
  _emptyEl: null,
  _countEl: null,
  _toggleBtn: null,

  init() {
    this._panelEl = document.getElementById('top-memo-panel');
    this._bodyEl = document.getElementById('top-memo-body');
    this._listEl = document.getElementById('top-memo-list');
    this._emptyEl = document.getElementById('top-memo-empty');
    this._countEl = document.getElementById('top-memo-count');
    this._toggleBtn = document.getElementById('top-memo-toggle');

    if (!this._panelEl) {
      console.warn('[TopMemoPanel] パネル要素が見つかりません');
      return;
    }

    this.setupEventListeners();

    // デフォルトで展開状態
    Store.setTopMemoExpanded(true);

    // Storeの変更を監視
    Store.subscribe(() => this.render());
  },

  setupEventListeners() {
    this._toggleBtn?.addEventListener('click', () => this.toggle());

    // 追加ボタン
    document.getElementById('top-memo-add')?.addEventListener('click', () => this.openEditModal(null));
    document.getElementById('top-memo-add-empty')?.addEventListener('click', () => this.openEditModal(null));

    // モーダル
    document.getElementById('top-memo-modal-close')?.addEventListener('click', () => this.closeEditModal());
    document.getElementById('btn-top-memo-cancel')?.addEventListener('click', () => this.closeEditModal());
    document.getElementById('btn-top-memo-save')?.addEventListener('click', () => this.saveFromModal());
    document.querySelector('#modal-top-memo .modal-backdrop')?.addEventListener('click', () => this.closeEditModal());
  },

  render() {
    const memos = Store.getTopMemos();
    const expanded = Store.state.topMemoExpanded;

    // メモ件数を更新
    if (this._countEl) {
      this._countEl.textContent = memos.length;
    }

    // 展開状態の反映
    this._panelEl?.classList.toggle('expanded', expanded);
    this._bodyEl?.classList.toggle('hidden', !expanded);

    // 箇条書きリストを描画
    if (this._listEl) {
      if (memos.length === 0) {
        this._listEl.innerHTML = '';
        this._listEl.classList.add('hidden');
        this._emptyEl?.classList.remove('hidden');
      } else {
        this._emptyEl?.classList.add('hidden');
        this._listEl.classList.remove('hidden');
        this._listEl.innerHTML = memos.map(memo => this.renderItem(memo)).join('');

        // 各行のイベントリスナーを設定
        this._listEl.querySelectorAll('.top-memo-item-btn.edit').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const memoId = e.currentTarget.dataset.memoId;
            this.openEditModal(memoId);
          });
        });
        this._listEl.querySelectorAll('.top-memo-item-btn.delete').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const memoId = e.currentTarget.dataset.memoId;
            this.deleteMemo(memoId);
          });
        });
      }
    }

    // 全画面対応：各ビューの高さ調整
    this.updateAllViewHeights(expanded);
  },

  /**
   * メモを1行形式でレンダリング
   * 形式: ・【見出し】 本文（改行は／に変換）
   */
  renderItem(memo) {
    const title = memo.title || '無題';
    // 本文の改行を「／」に変換して1行化
    const body = (memo.body || '').replace(/\r?\n/g, '／').trim();

    return `
      <li class="top-memo-item" data-memo-id="${memo.memoId}">
        <span class="top-memo-item-text">
          <span class="top-memo-item-bullet">・</span>
          <span class="top-memo-item-title">【${Utils.escapeHtml(title)}】</span>
          <span class="top-memo-item-body">${Utils.escapeHtml(body)}</span>
        </span>
        <span class="top-memo-item-actions">
          <button class="top-memo-item-btn edit" data-memo-id="${memo.memoId}" title="編集">✏</button>
          <button class="top-memo-item-btn delete" data-memo-id="${memo.memoId}" title="非表示">🗑</button>
        </span>
      </li>
    `;
  },

  toggle() {
    Store.toggleTopMemoExpanded();
  },

  updateAllViewHeights(expanded) {
    // 全てのビューの高さを調整
    const views = ['view-master', 'view-resource', 'view-weekly', 'view-travel'];

    requestAnimationFrame(() => {
      const panelHeight = expanded ? (this._panelEl?.offsetHeight || 0) : 0;

      views.forEach(viewId => {
        const viewEl = document.getElementById(viewId);
        if (!viewEl) return;

        // ガントスクロールコンテナを探す
        const scrollContainer = viewEl.querySelector('[id$="-v-scroll"], .resource-container, .weekly-view, .travel-plan-container');
        if (scrollContainer) {
          if (expanded && panelHeight > 0) {
            scrollContainer.style.height = `calc(100vh - 64px - ${panelHeight}px)`;
          } else {
            scrollContainer.style.height = '';
          }
        }
      });
    });
  },

  // モーダル関連
  openEditModal(memoId) {
    const modal = document.getElementById('modal-top-memo');
    const titleEl = document.getElementById('top-memo-modal-title');
    const idInput = document.getElementById('top-memo-edit-id');
    const titleInput = document.getElementById('top-memo-edit-title');
    const bodyInput = document.getElementById('top-memo-edit-body');

    if (memoId) {
      // 編集
      const memo = Store.getTopMemoById(memoId);
      if (!memo) return;
      titleEl.textContent = 'メモ編集';
      idInput.value = memoId;
      titleInput.value = memo.title || '';
      bodyInput.value = memo.body || '';
    } else {
      // 新規
      titleEl.textContent = '新規メモ';
      idInput.value = '';
      titleInput.value = '';
      bodyInput.value = '';
    }

    modal?.classList.remove('hidden');
  },

  closeEditModal() {
    document.getElementById('modal-top-memo')?.classList.add('hidden');
  },

  /**
   * モーダルから保存（A+C+B統合：即UI反映→ChangeBuffer経由で保存）
   */
  saveFromModal() {
    const idInput = document.getElementById('top-memo-edit-id');
    const titleInput = document.getElementById('top-memo-edit-title');
    const bodyInput = document.getElementById('top-memo-edit-body');

    const existingId = idInput.value || null;
    const title = titleInput.value.trim();
    const body = bodyInput.value;

    if (!title) {
      Utils.showToast('見出しを入力してください', 'error');
      return;
    }

    // A: 即時UI反映（楽観的更新）
    const isNew = !existingId;
    const memoId = isNew ? `temp_${Utils.generateId()}` : existingId;

    const optimisticMemo = {
      memoId,
      scope: 'global',
      title,
      body,
      isActive: true,
      sortOrder: isNew ? (this._getMaxSortOrder() + 10) : (Store.getTopMemoById(existingId)?.sortOrder || 0),
      updatedAt: new Date().toISOString(),
      updatedBy: 'user'
    };

    // Store に即反映
    Store.addOrReplaceTopMemo(optimisticMemo);

    // ChangeBuffer に追加（B: 自動保存対応）
    ChangeBuffer.add('topMemo', 'upsert', memoId, { title, body }, 'topMemo');

    this.closeEditModal();
    console.log(`[TopMemoPanel] ${isNew ? '新規作成' : '更新'}: ${memoId}`);
  },

  /**
   * メモ削除（A+C+B統合：即UI反映→ChangeBuffer経由で保存）
   */
  deleteMemo(memoId) {
    if (!confirm('このメモを非表示にしますか？')) return;

    // A: 即時UI反映（楽観的削除）
    Store.removeTopMemo(memoId);

    // ChangeBuffer に追加（B: 自動保存対応）
    ChangeBuffer.add('topMemo', 'delete', memoId, { isActive: false }, 'topMemo');

    console.log(`[TopMemoPanel] 削除: ${memoId}`);
  },

  /**
   * 現在の最大sortOrderを取得
   */
  _getMaxSortOrder() {
    const memos = Store.getTopMemos();
    if (memos.length === 0) return 0;
    return Math.max(...memos.map(m => m.sortOrder || 0));
  }
};

// ProcessModal - 新規工程追加モーダル
// ========================================

const ProcessModal = {
  _onSuccess: null, // 追加成功時のコールバック

  init() {
    this.setupEventListeners();
  },

  setupEventListeners() {
    document.getElementById('process-modal-close')?.addEventListener('click', () => this.close());
    document.getElementById('btn-process-cancel')?.addEventListener('click', () => this.close());
    document.getElementById('btn-process-save')?.addEventListener('click', () => this.save());
    document.querySelector('#modal-process .modal-backdrop')?.addEventListener('click', () => this.close());
  },

  open(onSuccess = null) {
    this._onSuccess = onSuccess;

    // フォームリセット
    document.getElementById('process-form').reset();

    // 表示順のデフォルト値（既存最大order + 10）
    const maxOrder = Math.max(
      ...Store.state.processes.map(p => parseInt(p['表示順(order)']) || 0),
      0
    );
    document.getElementById('process-order').value = maxOrder + 10;

    // デフォルト色
    document.getElementById('process-color').value = '#4A90E2';

    document.getElementById('modal-process').classList.remove('hidden');
    document.getElementById('process-name').focus();
  },

  close() {
    document.getElementById('modal-process').classList.add('hidden');
    this._onSuccess = null;
  },

  validate() {
    const name = document.getElementById('process-name').value.trim();
    const type = document.getElementById('process-type').value;
    const order = parseInt(document.getElementById('process-order').value, 10);
    const colorHex = document.getElementById('process-color').value;
    const isWeekly = document.getElementById('process-isweekly').checked;
    const memo = document.getElementById('process-memo').value.trim();

    if (!name) {
      Utils.showToast('工程名を入力してください', 'error');
      document.getElementById('process-name').focus();
      return null;
    }

    if (name.length > 60) {
      Utils.showToast('工程名は60文字以内で入力してください', 'error');
      document.getElementById('process-name').focus();
      return null;
    }

    // 重複チェック（クライアント側）
    const duplicate = Store.state.processes.find(p => (p['工程名'] || '').trim() === name);
    if (duplicate) {
      Utils.showToast('同じ工程名が既に存在します', 'error');
      document.getElementById('process-name').focus();
      return null;
    }

    if (!order || order < 1) {
      Utils.showToast('表示順は1以上の数値を入力してください', 'error');
      document.getElementById('process-order').focus();
      return null;
    }

    if (!/^#[0-9A-Fa-f]{6}$/.test(colorHex)) {
      Utils.showToast('工程色が不正です', 'error');
      return null;
    }

    return {
      processName: name,
      type,
      order,
      colorHex,
      isWeekly,
      isActive: true,
      memo
    };
  },

  async save() {
    const payload = this.validate();
    if (!payload) return;

    const saveBtn = document.getElementById('btn-process-save');
    saveBtn.disabled = true;
    saveBtn.textContent = '追加中...';

    try {
      const result = await API.call('api_createProcess', payload);
      console.log('[ProcessModal] Created:', result);

      // Storeに追加（order順でソート）
      Store.addProcess(result);

      Utils.showToast('工程を追加しました', 'success');

      // 成功コールバック（工程Selectに自動選択など）
      if (this._onSuccess && typeof this._onSuccess === 'function') {
        this._onSuccess(result);
      }

      this.close();
    } catch (error) {
      console.error('[ProcessModal] Save failed:', error);
      Utils.showToast('工程追加に失敗しました: ' + error.message, 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '追加';
    }
  }
};
